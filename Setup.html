<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>初始设置 · Steam 成就追踪器</title>
<style>
  :root {
    --bg: #171a21;
    --panel: #1b2838;
    --panel-alt: #2a3f5a;
    --text: #c7d5e0;
    --text-dim: #8f98a0;
    --accent: #66c0f4;
    --good: #a4d007;
    --low: #c15b5b;
    --border: #2a3f5a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px 32px;
  }
  h1 { font-size: 18px; font-weight: 600; color: #fff; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }
  .hint { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-bottom: 20px; }
  .hint a { color: var(--accent); }
  label { display: block; font-size: 13px; margin: 14px 0 6px; }
  input {
    width: 100%;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    padding: 8px 10px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%;
    margin-top: 22px;
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #0e141b;
    font-size: 14px;
    font-weight: 600;
    padding: 10px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { font-size: 12px; margin-top: 14px; min-height: 16px; line-height: 1.5; }
  .msg.error { color: var(--low); }
  .msg.ok { color: var(--good); }
</style>
</head>
<body>
  <form class="card" id="setup-form">
    <h1>初始设置</h1>
    <div class="subtitle">只需要填一次,凭据存在本机的 config.json 里</div>
    <div class="hint">
      ① Steam Web API Key → <a href="https://steamcommunity.com/dev/apikey" target="_blank" rel="noopener">steamcommunity.com/dev/apikey</a><br>
      ② SteamID64 → <a href="https://steamid.io" target="_blank" rel="noopener">steamid.io</a>(把你的个人资料链接粘进去查)
    </div>
    <label for="key">① Steam Web API Key</label>
    <input id="key" name="key" type="text" autocomplete="off" required>
    <label for="id">② SteamID64</label>
    <input id="id" name="id" type="text" autocomplete="off" required placeholder="17 位数字">

    <label for="csv">③ 从 CSV 导入(可选)</label>
    <input id="csv" name="csv" type="text" autocomplete="off" placeholder="CSV 所在文件夹路径">

    <button type="submit" id="submit-btn">保存并验证</button>
    <div class="msg" id="msg" role="status"></div>
  </form>
  <script>
    const form = document.getElementById('setup-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = document.getElementById('key').value.trim();
      const id = document.getElementById('id').value.trim();
      const csv = document.getElementById('csv').value.trim();
      if (!key || !id) return;

      btn.disabled = true;
      msg.className = 'msg';
      msg.textContent = csv ? '正在验证凭据、导入表格数据…' : '正在验证凭据…';

      try {
        const res = await fetch('/api/completeSetup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ args: [key, id, csv] }),
        });
        const body = await res.json();
        const result = body.ok ? body.result : { error: body.error || '请求失败' };

        if (result.error) {
          msg.className = 'msg error';
          msg.textContent = result.error;
          btn.disabled = false;
          return;
        }

        const importedNote = result.imported
          ? `,导入了 ${result.imported.games?.imported ?? 0} 款游戏的表格数据`
          : '';
        msg.className = 'msg ok';
        msg.textContent = `✅ 凭据可用(Steam 返回了 ${result.gameCount} 款游戏${importedNote}),正在打开 Dashboard…`;
        // 正常情况下 Electron 主进程轮询 getSetupStatus 发现配置好了,直接把窗口跳回 Dashboard——
        // completeSetup 已经把 config/steam 就地改过了,不需要重启子进程。
        // 这条延时跳转只是没有 Electron 在旁边看着时(比如直接跑 `node tracker.js serve`)的兜底。
        setTimeout(() => { window.location.href = '/'; }, 4000);
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = '请求失败:' + err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
