<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #171a21;
      --panel: #1b2838;
      --panel-alt: #2a3f5a;
      --text: #c7d5e0;
      --text-dim: #8f98a0;
      --accent: #66c0f4;
      --good: #a4d007;
      --mid: #d4a017;
      --low: #c15b5b;
      --border: #2a3f5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 4px 0;
      color: #fff;
    }
    .subtitle {
      color: var(--text-dim);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .subtitle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .subtitle-row .subtitle { margin-bottom: 0; }
    /* 「设置」是个 <a>,和「立即同步」这个 <button> 共用这套样式,
       所以要把链接的默认下划线和 inline 布局压掉 */
    .sync-btn {
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      flex-shrink: 0;
      display: inline-block;
      text-decoration: none;
      line-height: normal;
      font-family: inherit;
    }
    .sync-btn:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
      color: #0e141b;
    }
    .sync-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sync-btn:disabled { opacity: 0.5; cursor: default; }
    .sync-msg { font-size: 12px; color: var(--text-dim); }
    .sync-msg.error { color: var(--low); }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
    }
    .card .label {
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .card .value {
      font-size: 26px;
      font-weight: 700;
      color: var(--accent);
    }
    .card .sub {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      padding: 8px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent);
    }
    .tab-btn .count {
      color: var(--text-dim);
      font-size: 11px;
      margin-left: 4px;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .add-game-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .add-game-btn {
      background: var(--accent);
      color: #0e141b;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .add-game-btn:hover { opacity: 0.9; }
    .add-game-btn:disabled { opacity: 0.5; cursor: default; }
    .add-game-msg { font-size: 12px; }
    .add-game-msg.error { color: var(--low); }
    .add-game-msg.success { color: var(--good); }
    #gameSearchBox { width: 260px; }
    .game-search-results {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: -6px 0 14px 0;
      max-width: 480px;
    }
    .game-search-result {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
    }
    .game-search-result:hover { border-color: var(--accent); }
    .game-search-result img {
      width: 46px;
      height: 22px;
      object-fit: cover;
      border-radius: 2px;
      background: #0e141b;
      flex-shrink: 0;
    }
    .game-search-result span { font-size: 13px; }
    .game-search-result .appid-hint { color: var(--text-dim); font-size: 12px; }
    input[type="text"] {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      width: 220px;
    }
    label.checkbox {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border-radius: 6px;
      overflow: hidden;
      font-size: 13px;
    }
    th, td {
      padding: 9px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    th {
      background: var(--panel-alt);
      color: var(--text-dim);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { color: #fff; }
    tr.game-row.expandable { cursor: pointer; }
    tr.game-row:hover td { background: rgba(255,255,255,0.03); }
    .game-cell { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0 4px;
      color: var(--text-dim);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }
    .icon-btn svg { width: 16px; height: 16px; display: block; }
    .icon-btn.active-heart { color: var(--low); }
    .icon-btn.active-star { color: var(--mid); }
    .icon-btn:hover { opacity: 0.8; }
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-dim);
      opacity: 0.35;
      flex-shrink: 0;
      padding: 0 4px;
      margin-left: auto;
    }
    .delete-btn:hover { opacity: 1; color: var(--low); }
    .game-thumb {
      width: 64px;
      height: 30px;
      object-fit: cover;
      border-radius: 3px;
      flex-shrink: 0;
      background: #0e141b;
    }
    .game-name-main { font-weight: 500; }
    .bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 140px;
    }
    .bar-track {
      flex: 1;
      height: 6px;
      background: #0e141b;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 3px; }
    .rate-text { width: 44px; text-align: right; color: var(--text-dim); font-size: 12px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 3px;
      background: rgba(212,160,23,0.15);
      color: var(--mid);
      margin-left: 6px;
    }
    .badge-new {
      background: rgba(164,208,7,0.15);
      color: var(--good);
    }
    .badge-played {
      background: rgba(102,192,244,0.15);
      color: var(--accent);
    }
    .badge-btn {
      display: inline-block;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 3px;
      margin-left: 6px;
      cursor: pointer;
      font-family: inherit;
      background: none;
    }
    .badge-btn:hover { opacity: 0.85; }
    .badge-btn-on {
      border: 1px solid transparent;
      background: rgba(212,160,23,0.15);
      color: var(--mid);
    }
    .badge-btn-off {
      border: 1px dashed var(--border);
      color: var(--text-dim);
      opacity: 0.55;
    }
    .badge-btn-family-on {
      border: 1px solid transparent;
      background: rgba(102,192,244,0.15);
      color: var(--accent);
    }
    .manual-input {
      width: 56px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 6px;
      border-radius: 3px;
      font-size: 13px;
    }
    .manual-input:focus { outline: none; border-color: var(--accent); }
    .na { color: var(--text-dim); font-size: 12px; }
    .loading, .empty {
      color: var(--text-dim);
      padding: 40px;
      text-align: center;
    }
    .missing-row td {
      background: rgba(0,0,0,0.15);
      padding: 14px 20px;
    }
    .fav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .fav-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .fav-card-img {
      width: 100%;
      aspect-ratio: 460 / 215;
      object-fit: cover;
      display: block;
      background: #0e141b;
    }
    .fav-card-body { padding: 14px 16px; }
    .fav-card-name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fav-card-name .icon-btn { font-size: 15px; }
    .fav-card-name .icon-btn svg { width: 14px; height: 14px; }
    .fav-card-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .missing-header { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
    .ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }
    .ach-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px;
    }
    .ach-icon { width: 32px; height: 32px; border-radius: 4px; flex-shrink: 0; background: #0e141b; }
    .ach-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .ach-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .guide-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      color: var(--text-dim);
      flex-shrink: 0;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
    }
    .guide-btn.has-guide {
      color: var(--accent);
      border-color: var(--accent);
      cursor: pointer;
    }
    .guide-btn.no-guide {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }
    /* 配了 AI 之后,没攻略的行变成"可以生成一份" */
    .guide-btn.to-notion {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      margin-left: 4px;
    }
    .guide-btn.to-notion:hover:not(:disabled) { color: var(--text); border-color: var(--text-dim); }
    .guide-btn.to-notion:disabled { opacity: 0.4; cursor: default; }
    /* 重写会覆盖已有攻略,是这一行上唯一不可逆的动作 —— 平时低调,
       悬停时才显出警示色,免得一排 ♻ 把表格弄得像满屏警告 */
    .guide-btn.rewrite {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      cursor: pointer;
      margin-left: 4px;
    }
    .guide-btn.rewrite:hover:not(:disabled) { color: #e0a030; border-color: #e0a030; }
    .guide-btn.rewrite:disabled { opacity: 0.4; cursor: default; }
    .guide-btn.can-gen {
      opacity: 1;
      cursor: pointer;
      pointer-events: auto;
      color: var(--good);
      border-color: var(--good);
    }
    .guide-btn.can-gen:disabled { opacity: 0.4; cursor: default; }
    /*
      悬浮,不跟着页面滚走。一次生成要两到四分钟,而这段时间里人多半在往下翻表格 ——
      进度条钉在文档流最上面等于"想看就得先滚回去"。

      **靠左下角,因为右下角被 lib/rpc.js 的同步状态条占了**(那边写死
      right:16px / bottom:16px / z-index:9999)。两个浮层各占一角,谁也不压谁;
      z-index 比它低一档,万一真挤到一起也是同步状态条在上面。
    */
    #gen-bar {
      display: none;
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 9990;
      max-width: min(420px, calc(100vw - 32px));
      max-height: 60vh;
      overflow-y: auto;
      /* 右边留出关闭按钮的位置 */
      padding: 10px 30px 10px 12px;
      border: 1px solid var(--good);
      border-radius: 6px;
      /* 浮起来就必须有不透明背景,否则和下面的表格文字叠在一起没法读 */
      background: var(--panel);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
    }
    #gen-bar .warn { color: var(--text-dim); }
    #gen-bar .gen-close {
      position: absolute;
      top: 3px;
      right: 6px;
      background: none;
      border: none;
      padding: 2px 4px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1;
    }
    #gen-bar .gen-close:hover { color: var(--text); }
    /* 窄屏上两个角会挤到一起,改成横跨一行并让开下面的同步状态条 */
    @media (max-width: 720px) {
      #gen-bar { left: 12px; right: 12px; bottom: 76px; max-width: none; }
    }
    .ach-guide-link {
      font-size: 11px;
      color: var(--accent);
      text-decoration: none;
      margin-top: 4px;
      display: inline-block;
    }
    .ach-guide-link:hover { text-decoration: underline; }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px 28px;
      text-align: center;
      max-width: 400px;
    }
    .modal-box .game-name { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .modal-box .appid-hint { margin-bottom: 20px; }
    .modal-box .modal-btns { display: flex; gap: 10px; justify-content: center; }
  </style>
</head>
<body>
  <h1>Steam Achievement Tracker</h1>
  <div class="subtitle-row">
    <div class="subtitle" id="lastUpdated">加载中...</div>
    <button class="sync-btn" id="syncNowBtn"
            title="立刻向 Steam 拉一次最新数据。刷新页面只会重读本地数据库,不会联网。">立即同步</button>
    <!-- 打包版没有地址栏,不给入口的话设置页在首次设置之后就再也打不开了 -->
    <a class="sync-btn" href="/setup" id="settingsLink"
       title="改 Steam 凭据、配置 Notion 攻略同步、从表格导入">设置</a>
    <span class="sync-msg" id="syncMsg"></span>
  </div>

  <div id="gen-bar" role="status">
    <button type="button" class="gen-close" id="genClose" title="收起">×</button>
    <span id="gen-msg"></span>
  </div>

  <div class="cards">
    <div class="card">
      <div class="label">游戏总数</div>
      <div class="value" id="cardTotal">-</div>
    </div>
    <div class="card">
      <div class="label">平均完成率 (AGCR)</div>
      <div class="value" id="cardAvg">-</div>
      <div class="sub" id="cardAvgPrecise"></div>
    </div>
    <div class="card">
      <div class="label">完美游戏数</div>
      <div class="value" id="cardPerfect">-</div>
    </div>
  </div>

  <div id="newAchSection" style="display:none; margin-bottom: 24px;">
    <h1 style="font-size:15px; margin-bottom:10px;">🆕 最近新增成就的游戏(30天内)</h1>
    <table>
      <thead>
        <tr>
          <th>游戏</th>
          <th>新增时间</th>
          <th>完成数</th>
          <th>成就总数</th>
        </tr>
      </thead>
      <tbody id="newAchTableBody"></tbody>
    </table>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabIncomplete" data-tab="incomplete">进行中 <span class="count" id="countIncomplete"></span></button>
    <button class="tab-btn" id="tabComplete" data-tab="complete">已完成 <span class="count" id="countComplete"></span></button>
    <button class="tab-btn" id="tabFavorites" data-tab="favorites">喜爱 <span class="count" id="countFavorites"></span></button>
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="搜索游戏名...">
    <label class="checkbox">
      <input type="checkbox" id="favOnly"> 只看喜爱
    </label>
    <label class="checkbox">
      <input type="checkbox" id="priorityOnly"> 只看重点关注
    </label>
    <label class="checkbox">
      <input type="checkbox" id="hideUnvetted"> 隐藏 Unvetted 游戏
    </label>
    <label class="checkbox">
      <input type="checkbox" id="hideNoAch"> 隐藏无成就系统的游戏
    </label>
  </div>

  <div class="add-game-row">
    <input type="text" id="gameSearchBox" placeholder="添加新游戏...">
    <span class="add-game-msg" id="addGameMsg"></span>
  </div>
  <div id="gameSearchResults" class="game-search-results" style="display:none;"></div>

  <div class="modal-overlay" id="addConfirmModal">
    <div class="modal-box">
      <div style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">确认将这款游戏添加到列表？</div>
      <div class="game-name" id="confirmGameName"></div>
      <div class="modal-btns">
        <button class="add-game-btn" id="confirmAddBtn">确认</button>
        <button class="add-game-btn" id="cancelAddBtn" style="background:var(--panel-alt); color:var(--text-dim);">取消</button>
      </div>
    </div>
  </div>

  <!--
    通用确认框。**替代 window.confirm()**,不是为了好看 —— 打包版(Electron)里原生
    confirm 弹出来会立刻消失,人根本来不及点确定,而浏览器里一切正常。原生对话框归
    Electron 主进程管,渲染进程说了不算;页面内的框谁都夺不走。
    顺带还解决了原生 confirm 的两个老问题:排版只能靠 \n,以及没法把危险动作标红。
  -->
  <div class="modal-overlay" id="askModal">
    <div class="modal-box" style="max-width:520px;">
      <div class="game-name" id="askTitle"></div>
      <div id="askBody" style="font-size:13px; color:var(--text-dim); text-align:left; white-space:pre-wrap; margin:12px 0 20px;"></div>
      <div class="modal-btns">
        <button class="add-game-btn" id="askOkBtn">确认</button>
        <button class="add-game-btn" id="askCancelBtn" style="background:var(--panel-alt); color:var(--text-dim);">取消</button>
      </div>
    </div>
  </div>

  <table id="gameTable">
    <thead>
      <tr>
        <th data-key="name">游戏</th>
        <th data-key="achieved">完成数</th>
        <th data-key="total">成就总数</th>
        <th data-key="rate">完成率</th>
      </tr>
    </thead>
    <tbody id="gameTableBody">
      <tr><td colspan="4" class="loading">正在读取数据...</td></tr>
    </tbody>
  </table>

  <div id="favGrid" class="fav-grid" style="display:none;"></div>

  <!-- rpc:把 rpc.xxx(args) 转成 POST /api/xxx,见 lib/rpc.js -->
  <script src="/_rpc.js"></script>

  <script>
    // 多久之内算"最近在玩"。徽章和置顶共用这一个窗口,不能各写各的,
    // 否则会出现"排在最上面但没有徽章说明为什么"的怪状态
    const RECENT_PLAY_DAYS = 14;
    const isRecentlyPlayed = function(g) {
      return g.playedDaysAgo !== null && g.playedDaysAgo <= RECENT_PLAY_DAYS;
    };

    // 置顶还要再加一个条件:这游戏得**确实有成就可追**。置顶的意思是"你最近在玩,
    // 来看看还差哪些成就",对没有成就的游戏根本不成立,顶上去只会把真正要盯的挤下去。
    //
    // 条件写成"total 是个大于 0 的数字",而不是"total !== 'N/A'",因为"没有成就可追"
    // 有三种长相,只挡掉一种等于没挡:
    //   'N/A'  —— 确实没有成就系统(has_achievements = 0)
    //   null   —— 还没同步到成就数。**新加进库的游戏就是这个状态**,而它恰恰又是
    //             "最近在玩"的高发人群,不挡的话每次玩新游戏都会顶一个空行上去
    //   0      —— 有成就系统但一个成就都没有
    // 三种都是"现在没有进度可看",一视同仁。
    //
    // **只去掉置顶,不去掉徽章**:🎮 照常显示,它只陈述事实,不占位置。等成就数
    // 同步进来(或者开发者补了成就),total 变成正数,它自己就会重新参与置顶。
    const pinsToTop = function(g) {
      return isRecentlyPlayed(g) && typeof g.total === 'number' && g.total > 0;
    };

    let allGames = [];
    let sortKey = 'rate';
    let sortDir = -1;
    let activeTab = 'incomplete';
    let expandedAppid = null;
    const missingAchCache = {};

    function fmtPct(rate) {
      if (rate === null || rate === undefined) return '';
      return (rate * 100).toFixed(1) + '%';
    }

    function barColor(rate) {
      if (rate === null) return '#555';
      if (rate >= 1) return 'var(--good)';
      if (rate >= 0.5) return 'var(--mid)';
      return 'var(--low)';
    }

    function thumbUrl(appid) {
      return 'https://cdn.akamai.steamstatic.com/steam/apps/' + appid + '/header.jpg';
    }

    function heartSvg(filled) {
      const path = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
      if (filled) {
        return '<svg viewBox="0 0 24 24"><path fill="currentColor" d="' + path + '"/></svg>';
      }
      return '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="' + path + '"/></svg>';
    }

    function renderNewAchTable() {
      const section = document.getElementById('newAchSection');
      section.style.display = 'block';

      const recent = allGames
        .filter(function(g){ return g.newAchDaysAgo !== null && g.newAchDaysAgo <= 30; })
        .sort(function(a, b){ return a.newAchDaysAgo - b.newAchDaysAgo; });

      if (recent.length === 0) {
        document.getElementById('newAchTableBody').innerHTML =
          '<tr><td colspan="4" class="empty">最近30天没有游戏新增成就</td></tr>';
        return;
      }

      document.getElementById('newAchTableBody').innerHTML = recent.map(function(g) {
        const achievedText = (g.achieved !== null) ? g.achieved : '-';
        const totalText = (g.total !== null && g.total !== 'N/A') ? g.total : '-';
        return '<tr class="game-row">'
          + '<td><div class="game-cell">'
          + '<img class="game-thumb" src="' + thumbUrl(g.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
          + '<div class="game-name-main">' + escapeHtml(g.name) + '</div>'
          + '</div></td>'
          + '<td>' + g.newAchDaysAgo + ' 天前</td>'
          + '<td>' + achievedText + '</td>'
          + '<td>' + totalText + '</td>'
          + '</tr>';
      }).join('');
    }

    function renderFavGrid(games) {
      const grid = document.getElementById('favGrid');
      if (games.length === 0) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">还没有标记喜爱的游戏</div>';
        return;
      }

      grid.innerHTML = games.map(function(g) {
        const rate = g.rate !== null ? g.rate : 0;
        const rateText = (g.total === 'N/A') ? '无成就系统' : (g.total === null ? '数据同步中...' : fmtPct(g.rate));
        const barHtml = (g.total !== 'N/A' && g.total !== null)
          ? '<div class="fav-card-bar"><div class="bar-track"><div class="bar-fill" style="width:' + (rate*100).toFixed(1) + '%; background:' + barColor(rate) + '"></div></div><span class="rate-text">' + rateText + '</span></div>'
          : '<div class="na">' + rateText + '</div>';

        return '<div class="fav-card">'
          + '<img class="fav-card-img" src="' + thumbUrl(g.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
          + '<div class="fav-card-body">'
          + '<div class="fav-card-name"><button class="icon-btn active-heart" data-fav-appid="' + g.appid + '">' + heartSvg(true) + '</button>' + escapeHtml(g.name) + '</div>'
          + barHtml
          + '</div></div>';
      }).join('');

      grid.querySelectorAll('[data-fav-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.favAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          game.favorite = !game.favorite;
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.favorite === 'boolean') game.favorite = result.favorite;
          }).withFailureHandler(function() {
            game.favorite = !game.favorite;
            render();
          }).toggleFavorite(appid);
        });
      });
    }

    function render() {
      const search = document.getElementById('searchBox').value.trim().toLowerCase();
      const hideUnvetted = document.getElementById('hideUnvetted').checked;
      const hideNoAch = document.getElementById('hideNoAch').checked;
      const favOnly = document.getElementById('favOnly').checked;
      const priorityOnly = document.getElementById('priorityOnly').checked;

      let filtered = allGames.filter(function(g) {
        if (search && g.name.toLowerCase().indexOf(search) === -1) return false;
        if (hideUnvetted && g.unvetted) return false;
        if (hideNoAch && g.total === 'N/A') return false;
        if (favOnly && !g.favorite) return false;
        if (priorityOnly && !g.priority) return false;
        return true;
      });

      const completeGames = filtered.filter(function(g){ return g.rate === 1; });
      const incompleteGames = filtered.filter(function(g){ return g.rate !== 1; });
      const favoriteGames = filtered.filter(function(g){ return g.favorite; });

      document.getElementById('countIncomplete').textContent = '(' + incompleteGames.length + ')';
      document.getElementById('countComplete').textContent = '(' + completeGames.length + ')';
      document.getElementById('countFavorites').textContent = '(' + favoriteGames.length + ')';

      const table = document.getElementById('gameTable');
      const grid = document.getElementById('favGrid');

      if (activeTab === 'favorites') {
        table.style.display = 'none';
        grid.style.display = 'grid';
        renderFavGrid(favoriteGames);
        return;
      }
      table.style.display = 'table';
      grid.style.display = 'none';

      let rows = activeTab === 'complete' ? completeGames : incompleteGames;

      rows = rows.slice().sort(function(a, b) {
        let av = a[sortKey], bv = b[sortKey];
        if (av === null || av === 'N/A') av = -1;
        if (bv === null || bv === 'N/A') bv = -1;
        if (typeof av === 'string') return sortDir * av.localeCompare(bv);
        return sortDir * ((av > bv) - (av < bv));
      });

      // 置顶分两层,组内都保持上面排好的顺序:
      //   1. 重点关注(★)—— 手动选的,永远压过自动判断
      //   2. 最近在玩且有成就系统 —— 自动的,只在★之下抢位置(见 pinsToTop)
      // 最近在玩的内部按"多久之前玩的"再排一次,今天玩的排最前面
      const recent = rows.filter(pinsToTop)
        .sort(function(a, b){ return a.playedDaysAgo - b.playedDaysAgo; });
      const rest = rows.filter(function(g){ return !pinsToTop(g); });
      rows = recent.concat(rest);
      rows = rows.filter(function(g){ return g.priority; }).concat(rows.filter(function(g){ return !g.priority; }));

      const body = document.getElementById('gameTableBody');
      if (rows.length === 0) {
        body.innerHTML = '<tr><td colspan="4" class="empty">没有符合条件的游戏</td></tr>';
        return;
      }

      let html = '';
      rows.forEach(function(g) {
        const unvettedBadge = g.unvetted ? '<span class="badge">Unvetted</span>' : '';
        const manualBadgeClass = 'badge-btn ' + (g.manual ? 'badge-btn-on' : 'badge-btn-off');
        const manualBadge = '<button class="' + manualBadgeClass + '" data-manual-appid="' + g.appid + '" title="'
          + (g.manual ? '取消Manual(恢复自动同步)' : '设为Manual(停止自动同步)') + '">Manual</button>';
        const familyBadgeClass = 'badge-btn ' + (g.family ? 'badge-btn-family-on' : 'badge-btn-off');
        const familyBadge = '<button class="' + familyBadgeClass + '" data-family-appid="' + g.appid + '" title="'
          + (g.family ? '取消家庭共享标记' : '标记为家庭共享(非自购,纯信息用途)') + '">家庭</button>';
        const newAchBadge = (g.newAchDaysAgo !== null && g.newAchDaysAgo <= 30)
          ? '<span class="badge badge-new">🆕 ' + g.newAchDaysAgo + '天前新增成就</span>'
          : '';
        const playedBadge = isRecentlyPlayed(g)
          ? '<span class="badge badge-played">🎮 ' + (g.playedDaysAgo === 0 ? '今天在玩' : g.playedDaysAgo + '天前玩过') + '</span>'
          : '';
        const heartClass = 'icon-btn' + (g.favorite ? ' active-heart' : '');
        const starChar = g.priority ? '★' : '☆';
        const starClass = 'icon-btn' + (g.priority ? ' active-star' : '');
        const guideBtnClass = 'guide-btn ' + (g.guideUrl ? 'has-guide' : 'no-guide');
        const canGen = !g.guideUrl && aiReady && typeof g.total === 'number' && g.total > 0;
        const guideBtn = g.guideUrl
          ? '<a class="' + guideBtnClass + '" href="' + g.guideUrl + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">📖 攻略</a>'
          : canGen
            ? '<button class="' + guideBtnClass + ' can-gen" data-gen="' + g.appid + '" data-name="'
              + escapeHtml(g.name) + '" onclick="event.stopPropagation();window.genGuide(this)">✨ 生成</button>'
            : '<span class="' + guideBtnClass + '">📖 攻略</span>';
        const gameCell = '<div class="game-cell">'
          + '<button class="' + starClass + '" data-priority-appid="' + g.appid + '">' + starChar + '</button>'
          + '<button class="' + heartClass + '" data-fav-appid="' + g.appid + '">' + heartSvg(g.favorite) + '</button>'
          + '<img class="game-thumb" src="' + thumbUrl(g.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
          + '<div class="game-name-main">' + escapeHtml(g.name) + unvettedBadge + manualBadge + familyBadge + playedBadge + newAchBadge + '</div>'
          + guideBtn
          // 已经有攻略的行原来只有「📖 攻略」,没有任何入口能重写它 —— 覆盖只能敲命令行。
          // 闸门不在这个按钮上,在它弹出的确认框里(会先算清楚要失去什么),所以露出来是安全的
          + (g.guideUrl && aiReady && typeof g.total === 'number' && g.total > 0
              ? '<button class="guide-btn rewrite" data-rewrite="' + g.appid + '" data-name="'
                + escapeHtml(g.name) + '" title="让 AI 重新写一份,覆盖现在这份(会先备份原文)"'
                + ' onclick="event.stopPropagation();window.rewriteGuide(this)">♻ 重写</button>'
              : '')
          + (g.guideKind === 'local' && notionReady
              ? '<button class="guide-btn to-notion" data-migrate="' + g.appid + '" data-name="'
                + escapeHtml(g.name) + '" title="把这份本地攻略搬到 Notion"'
                + ' onclick="event.stopPropagation();window.migrateGuide(this)">⬆ Notion</button>'
              : '')
          + '<button class="delete-btn" data-delete-appid="' + g.appid + '" title="删除这一行">🗑</button>'
          + '</div>';

        const canExpand = activeTab === 'incomplete' && g.total !== 'N/A' && g.total !== null && g.appid;
        const rowClass = 'game-row' + (canExpand ? ' expandable' : '');

        if (g.manual) {
          const achievedVal = (typeof g.achieved === 'number') ? g.achieved : 0;
          const totalVal = (typeof g.total === 'number') ? g.total : 0;
          const manualRate = totalVal > 0 ? achievedVal / totalVal : 0;
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '">'
            + '<td>' + gameCell + '</td>'
            + '<td><input type="number" min="0" class="manual-input" data-manual-field="achieved" data-manual-row-appid="' + g.appid + '" value="' + achievedVal + '" onclick="event.stopPropagation()"></td>'
            + '<td><input type="number" min="0" class="manual-input" data-manual-field="total" data-manual-row-appid="' + g.appid + '" value="' + totalVal + '" onclick="event.stopPropagation()"></td>'
            + '<td><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:' + (manualRate*100).toFixed(1) + '%; background:' + barColor(manualRate) + '"></div></div><span class="rate-text">' + fmtPct(manualRate) + '</span></div></td>'
            + '</tr>';
        } else if (g.total === 'N/A') {
          html += '<tr class="' + rowClass + '"><td>' + gameCell + '</td><td class="na" colspan="3">无成就系统</td></tr>';
        } else if (g.total === null) {
          html += '<tr class="' + rowClass + '"><td>' + gameCell + '</td><td class="na" colspan="3">数据同步中...</td></tr>';
        } else {
          const rate = g.rate !== null ? g.rate : 0;
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '">'
            + '<td>' + gameCell + '</td>'
            + '<td>' + g.achieved + '</td>'
            + '<td>' + g.total + '</td>'
            + '<td><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:' + (rate*100).toFixed(1) + '%; background:' + barColor(rate) + '"></div></div><span class="rate-text">' + fmtPct(g.rate) + '</span></div></td>'
            + '</tr>';
        }

        if (canExpand && expandedAppid === String(g.appid)) {
          html += renderMissingRow(g.appid);
        }
      });

      body.innerHTML = html;

      body.querySelectorAll('[data-fav-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.favAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          game.favorite = !game.favorite; // 先本地乐观更新,界面立刻响应
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.favorite === 'boolean') game.favorite = result.favorite;
          }).withFailureHandler(function() {
            game.favorite = !game.favorite; // 失败了就改回去
            render();
          }).toggleFavorite(appid);
        });
      });

      body.querySelectorAll('[data-priority-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.priorityAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          game.priority = !game.priority; // 先本地乐观更新,界面立刻响应
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.priority === 'boolean') game.priority = result.priority;
          }).withFailureHandler(function() {
            game.priority = !game.priority; // 失败了就改回去
            render();
          }).togglePriority(appid);
        });
      });

      body.querySelectorAll('[data-manual-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.manualAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const newManual = !game.manual;
          game.manual = newManual;
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.manual === 'boolean') game.manual = result.manual;
          }).withFailureHandler(function() {
            game.manual = !game.manual;
            render();
          }).setManualStatus(appid, newManual);
        });
      });

      body.querySelectorAll('[data-family-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.familyAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const newFamily = !game.family;
          game.family = newFamily;
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.family === 'boolean') game.family = result.family;
          }).withFailureHandler(function() {
            game.family = !game.family;
            render();
          }).toggleFamily(appid);
        });
      });

      body.querySelectorAll('[data-delete-appid]').forEach(function(btn) {
        btn.addEventListener('click', async function(e) {
          e.stopPropagation();
          const appid = btn.dataset.deleteAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const ok = await askConfirm({
            title: '删除《' + game.name + '》?',
            body: '从本地数据库删掉这一行,无法撤销。',
            okText: '删除',
            danger: true,
          });
          if (!ok) return;

          btn.disabled = true;
          rpc.withSuccessHandler(function(result) {
            if (result && result.error) {
              btn.disabled = false;
              askConfirm({ title: '删除失败', body: result.error, okText: '知道了', notifyOnly: true });
              return;
            }
            allGames = allGames.filter(function(g){ return String(g.appid) !== String(appid); });
            if (expandedAppid === String(appid)) expandedAppid = null;
            document.getElementById('cardTotal').textContent = allGames.length;
            render();
          }).withFailureHandler(function(err) {
            btn.disabled = false;
            askConfirm({ title: '删除失败', body: String(err && err.message || err), okText: '知道了', notifyOnly: true });
          }).deleteGame(appid);
        });
      });

      body.querySelectorAll('.manual-input').forEach(function(input) {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') input.blur();
        });
        input.addEventListener('change', function() {
          const appid = input.dataset.manualRowAppid;
          const row = input.closest('tr');
          const achievedInput = row.querySelector('[data-manual-field="achieved"]');
          const totalInput = row.querySelector('[data-manual-field="total"]');
          const achieved = Math.max(0, parseInt(achievedInput.value, 10) || 0);
          const total = Math.max(0, parseInt(totalInput.value, 10) || 0);
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const prevAchieved = game.achieved;
          const prevTotal = game.total;
          const prevRate = game.rate;
          game.achieved = achieved; // 先本地乐观更新,界面立刻响应
          game.total = total;
          game.rate = total > 0 ? achieved / total : 0;
          render();
          function revert() {
            game.achieved = prevAchieved;
            game.total = prevTotal;
            game.rate = prevRate;
            render();
          }
          rpc.withSuccessHandler(function(result) {
            if (!result || result.error) revert(); // 服务器端校验没过(比如完成数>总数),改回去
          }).withFailureHandler(revert).setManualAchievements(appid, achieved, total);
        });
      });

      body.querySelectorAll('tr.expandable').forEach(function(tr) {
        tr.addEventListener('click', function() {
          const appid = tr.dataset.appid;
          expandedAppid = (expandedAppid === appid) ? null : appid;
          if (expandedAppid && !missingAchCache[expandedAppid]) {
            missingAchCache[expandedAppid] = { loading: true };
            rpc.withSuccessHandler(function(data) {
              missingAchCache[appid] = data;
              if (expandedAppid === appid) render();
            }).withFailureHandler(function(err) {
              missingAchCache[appid] = { error: err.message };
              if (expandedAppid === appid) render();
            }).getMissingAchievements(appid);
          }
          render();
        });
      });
    }

    function renderMissingRow(appid) {
      const data = missingAchCache[appid];
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      const gameName = game ? game.name : '';
      let inner;
      if (!data || data.loading) {
        inner = '<div class="missing-header">正在查询缺失成就...</div>';
      } else if (data.error) {
        inner = '<div class="missing-header">' + escapeHtml(data.error) + '</div>';
      } else if (data.missingCount === 0) {
        inner = '<div class="missing-header">所有成就都已解锁</div>';
      } else {
        inner = '<div class="missing-header">还差 ' + data.missingCount + ' / ' + data.total + ' 个成就</div>'
          + '<div class="ach-grid">' + data.missing.map(function(a) {
            const query = encodeURIComponent(gameName + ' ' + a.name + ' achievement guide');
            const guideUrl = 'https://www.google.com/search?q=' + query;
            return '<div class="ach-item">'
              + '<img class="ach-icon" src="' + a.icon + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
              + '<div><div class="ach-name">' + escapeHtml(a.name) + '</div><div class="ach-desc">' + escapeHtml(a.description) + '</div>'
              + '<a class="ach-guide-link" href="' + guideUrl + '" target="_blank" rel="noopener">🔍 搜攻略</a></div>'
              + '</div>';
          }).join('') + '</div>';
      }
      return '<tr class="missing-row"><td colspan="4">' + inner + '</td></tr>';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    document.querySelectorAll('th[data-key]').forEach(function(th) {
      th.addEventListener('click', function() {
        const key = th.dataset.key;
        if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = -1; }
        render();
      });
    });

    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        activeTab = btn.dataset.tab;
        expandedAppid = null;
        document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        render();
      });
    });

    document.getElementById('searchBox').addEventListener('input', render);
    document.getElementById('favOnly').addEventListener('change', render);
    document.getElementById('priorityOnly').addEventListener('change', render);
    document.getElementById('hideUnvetted').addEventListener('change', render);
    document.getElementById('hideNoAch').addEventListener('change', render);

    function addSelectedGame(appid, name) {
      const msg = document.getElementById('addGameMsg');
      msg.textContent = '添加中...';
      msg.className = 'add-game-msg';

      rpc.withSuccessHandler(function(result) {
        if (result && result.error) {
          msg.textContent = result.error;
          msg.className = 'add-game-msg error';
          return;
        }
        allGames.push(result);
        msg.textContent = '已添加: ' + result.name;
        msg.className = 'add-game-msg success';
        document.getElementById('cardTotal').textContent = allGames.length;
        render();
      }).withFailureHandler(function(err) {
        msg.textContent = '添加失败: ' + err.message;
        msg.className = 'add-game-msg error';
      }).addGame(appid, name);
    }

    function renderSearchResults(items) {
      const box = document.getElementById('gameSearchResults');
      if (!items || items.length === 0) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }
      box.style.display = 'flex';
      box.innerHTML = items.map(function(g) {
        return '<div class="game-search-result" data-appid="' + g.appid + '" data-name="' + escapeHtml(g.name) + '">'
          + '<img src="' + thumbUrl(g.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
          + '<span>' + escapeHtml(g.name) + ' <span class="appid-hint">(' + g.appid + ')</span></span>'
          + '</div>';
      }).join('');

      box.querySelectorAll('.game-search-result').forEach(function(el) {
        el.addEventListener('click', function() {
          // 选中后弹窗确认,不直接添加
          const appid = el.dataset.appid;
          const name = el.dataset.name;
          document.getElementById('confirmGameName').textContent = name;
          document.getElementById('addConfirmModal').dataset.appid = appid;
          document.getElementById('addConfirmModal').dataset.name = name;
          document.getElementById('addConfirmModal').classList.add('show');
        });
      });
    }

    function runGameSearch() {
      const query = document.getElementById('gameSearchBox').value.trim();
      const msg = document.getElementById('addGameMsg');
      if (!query) { renderSearchResults([]); msg.textContent = ''; return; }

      msg.textContent = '搜索中...';
      msg.className = 'add-game-msg';
      rpc.withSuccessHandler(function(items) {
        msg.textContent = (items && items.length === 0) ? '没有找到匹配的游戏' : '';
        msg.className = 'add-game-msg';
        renderSearchResults(items);
      }).withFailureHandler(function(err) {
        msg.textContent = '搜索失败: ' + err.message;
        msg.className = 'add-game-msg error';
      }).searchSteamGames(query);
    }

    let searchTimeout = null;
    document.getElementById('gameSearchBox').addEventListener('input', function() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(runGameSearch, 300);
    });
    document.getElementById('gameSearchBox').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { clearTimeout(searchTimeout); runGameSearch(); }
    });

    document.getElementById('confirmAddBtn').addEventListener('click', function() {
      const modal = document.getElementById('addConfirmModal');
      const appid = modal.dataset.appid;
      const name = modal.dataset.name;
      if (!appid) return;
      modal.classList.remove('show');
      renderSearchResults([]);
      document.getElementById('gameSearchBox').value = '';
      addSelectedGame(appid, name);
    });

    document.getElementById('cancelAddBtn').addEventListener('click', function() {
      document.getElementById('addConfirmModal').classList.remove('show');
    });

    /**
     * 页面内的确认框,回一个 Promise<boolean>。**所有确认都走这里,不要再用 window.confirm。**
     *
     * 原因是打包版:Electron 里原生 confirm 弹出后会立刻消失,用户点不到确定,
     * 而同一份页面在浏览器里完全正常 —— 于是"从 Dashboard 生成攻略"这条路在打包版上
     * 是断的,还断得毫无提示。原生对话框的生命周期归主进程管,页面夺不回来;
     * 页面内的框没有这个问题,而且浏览器和打包版行为完全一致。
     *
     * `notifyOnly` 时只有一个按钮,用来替掉 `alert()` —— 原生 alert 在打包版里
     * 和原生 confirm 是同一个毛病,只是后果轻些(错误提示看不见,而不是动作做不了)
     *
     * @param {{title: string, body: string, okText?: string, danger?: boolean, notifyOnly?: boolean}} o
     */
    function askConfirm(o) {
      return new Promise(function (resolve) {
        const modal = document.getElementById('askModal');
        const okBtn = document.getElementById('askOkBtn');
        const cancelBtn = document.getElementById('askCancelBtn');
        document.getElementById('askTitle').textContent = o.title;
        document.getElementById('askBody').textContent = o.body || '';
        okBtn.textContent = o.okText || '确认';
        okBtn.style.background = o.danger ? '#a33' : '';
        cancelBtn.style.display = o.notifyOnly ? 'none' : '';

        function close(answer) {
          modal.classList.remove('show');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          modal.removeEventListener('click', onOutside);
          document.removeEventListener('keydown', onKey);
          resolve(answer);
        }
        function onOk() { close(true); }
        function onCancel() { close(false); }
        // 点框外和按 Esc 都算取消 —— 和原生 confirm 的习惯一致,别让人找不到出口
        function onOutside(e) { if (e.target === modal) close(false); }
        function onKey(e) {
          if (e.key === 'Escape') close(false);
          else if (e.key === 'Enter') close(true);
        }

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        modal.addEventListener('click', onOutside);
        document.addEventListener('keydown', onKey);
        modal.classList.add('show');
        okBtn.focus();
      });
    }

    // Click outside modal to dismiss
    document.getElementById('addConfirmModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('show');
    });

    function loadDashboard() {
      rpc.withSuccessHandler(function(data) {
        allGames = data.games;
        document.getElementById('cardTotal').textContent = data.totalGames;
        document.getElementById('cardAvg').textContent = data.avgRounded || '-';
        document.getElementById('cardAvgPrecise').textContent = data.avgPrecise ? ('精确值: ' + data.avgPrecise) : '';
        document.getElementById('cardPerfect').textContent = data.perfectCount;
        document.getElementById('lastUpdated').textContent = '上次同步: ' + data.lastUpdated;
        renderNewAchTable();
        render();
      }).withFailureHandler(function(err) {
        document.getElementById('gameTableBody').innerHTML =
          '<tr><td colspan="4" class="empty">读取数据失败: ' + err.message + '</td></tr>';
      }).getDashboardData();
    }

    loadDashboard();

    // ---- 「立即同步」按钮 ----------------------------------------------------
    // 这个按钮只负责"发起"。进度提示条、跑完后的就地刷新、新增成就提示,全都已经在
    // lib/rpc.js 里为启动时的自动同步实现过了,手动同步复用同一套,这里不重复造。
    const syncBtn = document.getElementById('syncNowBtn');
    const syncMsg = document.getElementById('syncMsg');
    // 点下去到第一次轮询确认 running 之间有最多 3 秒空窗,期间轮询可能还带着旧的
    // running:false 回来,会把按钮闪回可点。这个标记就是盖住那段空窗的。
    let syncStarting = false;

    syncBtn.addEventListener('click', function() {
      syncStarting = true;
      syncBtn.disabled = true;
      syncMsg.className = 'sync-msg';
      syncMsg.textContent = '正在启动...';

      rpc.withSuccessHandler(function(res) {
        if (res && res.error) {
          syncStarting = false;
          syncBtn.disabled = false;
          syncMsg.className = 'sync-msg error';
          syncMsg.textContent = res.error;
          return;
        }
        syncMsg.textContent = '';
      }).withFailureHandler(function(err) {
        syncStarting = false;
        syncBtn.disabled = false;
        syncMsg.className = 'sync-msg error';
        syncMsg.textContent = '启动同步失败: ' + err.message;
      }).startSync();
    });

    // lib/rpc.js 每 3 秒回调一次后台同步状态。按钮跟着后端的真实状态走,而不是自己记——
    // 这样 CLI 或另一个标签页发起的同步同样会把按钮按下去,同步失败时也能解禁
    // (失败那条路径故意不触发 reloadDashboard,只靠 loadDashboard 的话按钮就卡死了)。
    let wasSyncRunning = false;
    window.onSyncState = function(s) {
      if (s.running) syncStarting = false;
      syncBtn.disabled = s.running || syncStarting;
      syncBtn.textContent = s.running ? '同步中...' : '立即同步';

      // 只清掉"正在启动..."这类过程提示。错误必须留着:轮询每 3 秒来一次,
      // 无条件清空会把刚显示出来的报错冲掉,而那是点击唯一的反馈。
      // (真会撞上的场景:CLI 或另一个标签页刚发起同步,按钮这边还没轮询到就被点了)
      if (s.running && !syncMsg.classList.contains('error')) syncMsg.textContent = '';

      // 反过来,同步一跑完,"同步已经在跑了"这条就过期了——留着就是在报假警。
      if (wasSyncRunning && !s.running) {
        syncMsg.className = 'sync-msg';
        syncMsg.textContent = '';
      }
      wasSyncRunning = s.running;
    };

    // ---------------------------------------------------------------
    // AI 生成攻略
    // ---------------------------------------------------------------
    // 这是页面上**唯一一个会花钱的按钮**,所以点下去之前必须先问一次,而且要把
    // "会发生什么、机器验不了什么"说清楚 —— 用户看不到 CLI 那些提示。
    const genBar = document.getElementById('gen-bar');
    const genMsg = document.getElementById('gen-msg');
    // 关掉 = "这一轮不想看了"。轮询每 3 秒还会再调一次 showGen,不把这个意图记下来的话,
    // 关掉三秒之后它自己又回来了。下一次**主动**发起生成/搬运时才重新打开 ——
    // 那时候是用户自己要看进度的
    let genDismissed = false;
    document.getElementById('genClose').addEventListener('click', function () {
      genDismissed = true;
      genBar.style.display = 'none';
    });

    let aiReady = false;
    let notionReady = false;

    (async function loadAiState() {
      const s = await new Promise((resolve) => {
        rpc.withSuccessHandler(resolve).withFailureHandler(() => resolve({})).getSettings();
      });
      aiReady = Boolean(s && s.hasAiKey);
      // 搬去 Notion 要两样都有:token(能写)和数据库 ID(知道写去哪)
      notionReady = Boolean(s && s.hasNotionToken && s.notionDbId);
      if (aiReady || notionReady) loadDashboard();  // 重画一次,把那两个按钮放出来
    })();

    /**
     * 本地攻略 → Notion。**先预览再问**:转换可能把表格、折叠块降级成普通段落,
     * 不把这件事摆在确认框里,用户就是在不知道会损失什么的情况下点的"确定"。
     */
    /**
     * 重写已有攻略。**先预检再问**,和 `guide-to-notion` 的流程一样,理由也一样:
     * 不知道会失去什么的"确认"不算确认。
     *
     * 覆盖唯一真正丢掉的东西是**手动勾上的子步骤框** —— 成就框会被机械打勾按数据库
     * 勾回原样,子步骤框匹配不到任何成就。这句话由服务端的 formatPreflight 生成,
     * 和 CLI 那边是同一份措辞。
     */
    window.rewriteGuide = async function (btn) {
      const appid = btn.getAttribute('data-rewrite');
      const name = btn.getAttribute('data-name') || appid;
      genDismissed = false;
      btn.disabled = true;
      showGen('⏳ 检查《' + name + '》…');

      const p = await new Promise((resolve) => {
        rpc.withSuccessHandler(resolve)
          .withFailureHandler((err) => resolve({ error: String(err && err.message || err) }))
          .previewGuideRewrite(appid);
      });
      if (!p || p.error) {
        btn.disabled = false;
        return showGen('⚠️ ' + ((p && p.error) || '预检失败'), true);
      }

      // 只说三件事:换掉什么、丢什么、多久。备份路径、失败时怎么办、写完还给对照,
      // 都是他点下去之后自然会看到的,不必在这里先讲一遍
      const ok = await askConfirm({
        title: '重写《' + name + '》的攻略?',
        body: [
          '现有 ' + p.boxes + ' 个 checkbox 会被整份替换,原文先备份。',
          p.atRisk ? p.atRisk + ' 个手动勾的子步骤会变回未勾选。' : null,
          '约 2–4 分钟。',
        ].filter(Boolean).join('\n'),
        okText: '重写',
        danger: true,
      });
      if (!ok) {
        btn.disabled = false;
        genBar.style.display = 'none';
        return;
      }

      rpc
        .withSuccessHandler(function (r) {
          if (r && r.error) {
            btn.disabled = false;
            return showGen('⚠️ ' + r.error, true);
          }
          showGen('⏳ 重写《' + name + '》…');
          pollGen();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showGen('⚠️ ' + err, true);
        })
        .startGuideGen(appid, true);
    };

    window.migrateGuide = function (btn) {
      const appid = btn.getAttribute('data-migrate');
      const name = btn.getAttribute('data-name') || appid;
      genDismissed = false; // 自己点的搬运,进度条要露出来
      btn.disabled = true;
      showGen('⏳ 检查《' + name + '》…');
      rpc
        .withSuccessHandler(async function (p) {
          if (!p || p.error) {
            btn.disabled = false;
            return showGen('⚠️ ' + ((p && p.error) || '预览失败'), true);
          }
          // 逐条核对、对不上就不动本地文件、页面带图标 —— 都是"我们怎么保证不出事",
          // 不是他要决定的事。真正要他知道的只有两件:搬什么、原文去哪
          const lines = [
            p.todos + ' 个 checkbox 原样搬过去(含勾选状态)。',
            '本地文件挪进 guides/.migrated/,不会删。',
          ];
          if (p.unconverted && p.unconverted.length) {
            lines.push('⚠️ ' + p.unconverted.length + ' 行排版会降级成普通段落,文字不丢。');
          }
          const goMigrate = await askConfirm({
            title: '把《' + p.game + '》的攻略搬到 Notion?',
            body: lines.join('\n'),
            okText: '搬过去',
          });
          if (!goMigrate) {
            btn.disabled = false;
            genBar.style.display = 'none';
            return;
          }
          showGen('⏳ 搬运《' + p.game + '》…');
          rpc
            .withSuccessHandler(function (r) {
              if (!r || r.error) {
                btn.disabled = false;
                return showGen('⚠️ ' + ((r && r.error) || '搬运失败'), true);
              }
              showGen(
                '✅ 《' + r.game + '》 ' + r.count + ' 个 checkbox 已搬到 Notion' +
                  '<br><a href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">打开 Notion 页面</a>' +
                  (r.archivedTo ? '<br><span class="warn">本地文件在 guides/.migrated/</span>' : '')
              );
              loadDashboard();
            })
            .withFailureHandler(function (err) {
              btn.disabled = false;
              showGen('⚠️ ' + err, true);
            })
            .migrateGuideToNotion(appid);
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showGen('⚠️ ' + err, true);
        })
        .previewGuideToNotion(appid);
    };

    // **按钮直接调这个,不走事件委托。** 按钮上带着 event.stopPropagation()
    // (行本身也可点,不拦住就会同时展开成就详情),而 stopPropagation 会让挂在
    // document 上的委托永远收不到这次点击 —— 表现就是"点了什么都没发生",
    // 而且控制台里一个错都没有。踩过一次
    window.genGuide = async function (btn) {
      const appid = btn.getAttribute('data-gen');
      const name = btn.getAttribute('data-name') || appid;
      // 确认框只回答一个问题:会发生什么、要多久。**机器验了什么、没验什么属于说明,
      // 不属于这一刻的决策依据** —— 那几句搬到这里当注释,用户一个字都不用读:
      // 程序保证的是格式和数据(一个成就一行、名字对得上、勾选等于真实解锁状态),
      // 内容本身谁都验不了,所以下面那句"内容要自己过一遍"必须留着
      const ok = await askConfirm({
        title: '为《' + name + '》生成攻略?',
        body: '联网查资料并撰写,约 2–4 分钟,期间可以继续用这个页面。\n生成的内容需要你自己过一遍。',
        okText: '生成',
      });
      if (!ok) return;
      genDismissed = false; // 自己点的生成,进度条要露出来
      btn.disabled = true;
      rpc
        .withSuccessHandler(function (r) {
          if (r && r.error) {
            btn.disabled = false;
            showGen('⚠️ ' + r.error, true);
            return;
          }
          showGen('⏳ 生成《' + name + '》…');
          pollGen();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showGen('⚠️ ' + err, true);
        })
        .startGuideGen(appid);
    };

    function showGen(html, dim) {
      if (genDismissed) return;
      genBar.style.display = 'block';
      // 写进内层 span,不要覆盖 genBar 本身 —— 关闭按钮是它的兄弟节点,
      // 覆盖 innerHTML 会把按钮一起冲掉
      genMsg.innerHTML = dim ? '<span class="warn">' + html + '</span>' : html;
    }

    // 只在有任务在跑的时候轮询 —— 平时不给这个本地服务加一份常驻请求。
    // 页面加载时也查一次:另一个标签页(或上一次刷新前)发起的生成还在跑的话,这里要接上
    let genTimer = null;
    function pollGen() {
      if (genTimer) return;
      genTimer = setInterval(fetchGen, 3000);
      fetchGen();
    }

    function fetchGen() {
      rpc
        .withSuccessHandler(function (s) {
          if (!s) return;
          if (s.running) {
            // 只有真在重写(第 2 轮起)才显示轮数 —— 一次过的时候写"第 1/3 轮"
            // 反而像出了什么事要重来三次
            const round = s.rounds && s.round > 1 ? ' 第 ' + s.round + '/' + s.rounds + ' 轮' : '';
            showGen('⏳ 《' + s.game + '》' + round + (s.note ? ' · ' + s.note : ''));
            return;
          }
          clearInterval(genTimer);
          genTimer = null;
          if (s.error) return showGen('⚠️ 生成失败:' + s.error, true);
          const r = s.result;
          if (!r) return (genBar.style.display = 'none');

          if (!r.ok) {
            showGen(
              '⚠️ 《' + s.game + '》校验没过,已存草稿,没写进攻略。' +
                (r.blocking && r.blocking.length ? '<br>' + r.blocking.join('<br>') : ''),
              true
            );
            return;
          }
          // 「能搜」和「搜了」是两回事,而用户在页面上看不出来 —— 搜过就并进事实那一行,
          // 没搜才单独警告(那是真会影响内容质量的一件事)
          const searches = r.searchQueries ? r.searchQueries.length : 0;
          const noResearch = !r.researched
            ? '<br><span class="warn">⚠️ 没联网,内容是模型凭已有知识写的。</span>'
            : searches === 0
              ? '<br><span class="warn">⚠️ 一次都没搜,内容等同于凭记忆写的。</span>'
              : '';
          // 只报 token,不报钱 —— 单价我们核实不过来,一个不知道错多少的金额
          // 比不给金额更糟。token 是 API 回的硬数字
          const facts = [
            r.covered + '/' + r.total + ' 个成就',
            searches ? searches + ' 次搜索' : null,
            Math.round((r.tokens || 0) / 100) / 10 + 'k token',
          ].filter(Boolean).join(' · ');
          // 写去哪了要说清楚 —— 这是用户自己的笔记,不能让他到处找
          const where = r.target === 'notion'
            ? '<a href="' + escapeHtml(r.path || '') + '" target="_blank" rel="noopener">打开 Notion 页面</a>'
            : escapeHtml(r.path || '');
          showGen(
            '✅ 《' + s.game + '》 ' + facts +
              '<br>' + where +
              noResearch +
              '<br><span class="warn">内容需要你自己过一遍。</span>'
          );
          loadDashboard();  // 攻略已登记,刷新一下让「📖 攻略」链接出来
        })
        .withFailureHandler(function () {})
        .guideGenStatus();
    }

    fetchGen();  // 接上可能还在跑的任务

    // 后台同步结束后 lib/rpc.js 会调这个就地刷新数据。暴露成全局是故意的:
    // 用 location.reload() 会把搜索词、筛选勾选、排序状态全清掉,那些是用户自己设的。
    window.reloadDashboard = loadDashboard;
  </script>
</body>
</html>
