<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --bg: #171a21;
      --panel: #1b2838;
      --panel-alt: #2a3f5a;
      --text: #c7d5e0;
      --text-dim: #8f98a0;
      --accent: #66c0f4;
      --good: #a4d007;
      --mid: #d4a017;
      --low: #c15b5b;
      --border: #2a3f5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 4px 0;
      color: #fff;
    }
    .subtitle {
      color: var(--text-dim);
      font-size: 13px;
      margin-bottom: 24px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
    }
    .card .label {
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .card .value {
      font-size: 26px;
      font-weight: 700;
      color: var(--accent);
    }
    .card .sub {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      padding: 8px 16px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent);
    }
    .tab-btn .count {
      color: var(--text-dim);
      font-size: 11px;
      margin-left: 4px;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .add-game-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }
    .add-game-btn {
      background: var(--accent);
      color: #0e141b;
      border: none;
      border-radius: 4px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .add-game-btn:hover { opacity: 0.9; }
    .add-game-btn:disabled { opacity: 0.5; cursor: default; }
    .add-game-msg { font-size: 12px; }
    .add-game-msg.error { color: var(--low); }
    .add-game-msg.success { color: var(--good); }
    #gameSearchBox { width: 260px; }
    .game-search-results {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: -6px 0 14px 0;
      max-width: 480px;
    }
    .game-search-result {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
    }
    .game-search-result:hover { border-color: var(--accent); }
    .game-search-result img {
      width: 46px;
      height: 22px;
      object-fit: cover;
      border-radius: 2px;
      background: #0e141b;
      flex-shrink: 0;
    }
    .game-search-result span { font-size: 13px; }
    .game-search-result .appid-hint { color: var(--text-dim); font-size: 12px; }
    input[type="text"] {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      width: 220px;
    }
    label.checkbox {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border-radius: 6px;
      overflow: hidden;
      font-size: 13px;
    }
    th, td {
      padding: 9px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    th {
      background: var(--panel-alt);
      color: var(--text-dim);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { color: #fff; }
    tr.game-row.expandable { cursor: pointer; }
    tr.game-row:hover td { background: rgba(255,255,255,0.03); }
    .game-cell { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0 4px;
      color: var(--text-dim);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
    }
    .icon-btn svg { width: 16px; height: 16px; display: block; }
    .icon-btn.active-heart { color: var(--low); }
    .icon-btn.active-star { color: var(--mid); }
    .icon-btn:hover { opacity: 0.8; }
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-dim);
      opacity: 0.35;
      flex-shrink: 0;
      padding: 0 4px;
      margin-left: auto;
    }
    .delete-btn:hover { opacity: 1; color: var(--low); }
    .game-thumb {
      width: 64px;
      height: 30px;
      object-fit: cover;
      border-radius: 3px;
      flex-shrink: 0;
      background: #0e141b;
    }
    .game-name-main { font-weight: 500; }
    .bar-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 140px;
    }
    .bar-track {
      flex: 1;
      height: 6px;
      background: #0e141b;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill { height: 100%; border-radius: 3px; }
    .rate-text { width: 44px; text-align: right; color: var(--text-dim); font-size: 12px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 3px;
      background: rgba(212,160,23,0.15);
      color: var(--mid);
      margin-left: 6px;
    }
    .badge-new {
      background: rgba(164,208,7,0.15);
      color: var(--good);
    }
    .badge-btn {
      display: inline-block;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 3px;
      margin-left: 6px;
      cursor: pointer;
      font-family: inherit;
      background: none;
    }
    .badge-btn:hover { opacity: 0.85; }
    .badge-btn-on {
      border: 1px solid transparent;
      background: rgba(212,160,23,0.15);
      color: var(--mid);
    }
    .badge-btn-off {
      border: 1px dashed var(--border);
      color: var(--text-dim);
      opacity: 0.55;
    }
    .badge-btn-family-on {
      border: 1px solid transparent;
      background: rgba(102,192,244,0.15);
      color: var(--accent);
    }
    .manual-input {
      width: 56px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 6px;
      border-radius: 3px;
      font-size: 13px;
    }
    .manual-input:focus { outline: none; border-color: var(--accent); }
    .na { color: var(--text-dim); font-size: 12px; }
    .loading, .empty {
      color: var(--text-dim);
      padding: 40px;
      text-align: center;
    }
    .missing-row td {
      background: rgba(0,0,0,0.15);
      padding: 14px 20px;
    }
    .fav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .fav-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .fav-card-img {
      width: 100%;
      aspect-ratio: 460 / 215;
      object-fit: cover;
      display: block;
      background: #0e141b;
    }
    .fav-card-body { padding: 14px 16px; }
    .fav-card-name {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .fav-card-name .icon-btn { font-size: 15px; }
    .fav-card-name .icon-btn svg { width: 14px; height: 14px; }
    .fav-card-bar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .missing-header { font-size: 12px; color: var(--text-dim); margin-bottom: 10px; }
    .ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }
    .ach-item {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px;
    }
    .ach-icon { width: 32px; height: 32px; border-radius: 4px; flex-shrink: 0; background: #0e141b; }
    .ach-name { font-size: 12px; font-weight: 600; color: var(--text); }
    .ach-desc { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .guide-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      padding: 3px 8px;
      color: var(--text-dim);
      flex-shrink: 0;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
    }
    .guide-btn.has-guide {
      color: var(--accent);
      border-color: var(--accent);
      cursor: pointer;
    }
    .guide-btn.no-guide {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }
    .ach-guide-link {
      font-size: 11px;
      color: var(--accent);
      text-decoration: none;
      margin-top: 4px;
      display: inline-block;
    }
    .ach-guide-link:hover { text-decoration: underline; }
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px 28px;
      text-align: center;
      max-width: 400px;
    }
    .modal-box .game-name { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    .modal-box .appid-hint { margin-bottom: 20px; }
    .modal-box .modal-btns { display: flex; gap: 10px; justify-content: center; }
  </style>
</head>
<body>
  <h1>Steam Achievement Tracker</h1>
  <div class="subtitle" id="lastUpdated">加载中...</div>

  <div class="cards">
    <div class="card">
      <div class="label">游戏总数</div>
      <div class="value" id="cardTotal">-</div>
    </div>
    <div class="card">
      <div class="label">平均完成率 (AGCR)</div>
      <div class="value" id="cardAvg">-</div>
      <div class="sub" id="cardAvgPrecise"></div>
    </div>
    <div class="card">
      <div class="label">完美游戏数</div>
      <div class="value" id="cardPerfect">-</div>
    </div>
  </div>

  <div id="newAchSection" style="display:none; margin-bottom: 24px;">
    <h1 style="font-size:15px; margin-bottom:10px;">🆕 最近新增成就的游戏(30天内)</h1>
    <table>
      <thead>
        <tr>
          <th>游戏</th>
          <th>新增时间</th>
          <th>完成数</th>
          <th>成就总数</th>
        </tr>
      </thead>
      <tbody id="newAchTableBody"></tbody>
    </table>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabIncomplete" data-tab="incomplete">进行中 <span class="count" id="countIncomplete"></span></button>
    <button class="tab-btn" id="tabComplete" data-tab="complete">已完成 <span class="count" id="countComplete"></span></button>
    <button class="tab-btn" id="tabFavorites" data-tab="favorites">喜爱 <span class="count" id="countFavorites"></span></button>
  </div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="搜索游戏名...">
    <label class="checkbox">
      <input type="checkbox" id="favOnly"> 只看喜爱
    </label>
    <label class="checkbox">
      <input type="checkbox" id="priorityOnly"> 只看重点关注
    </label>
    <label class="checkbox">
      <input type="checkbox" id="hideUnvetted"> 隐藏 Unvetted 游戏
    </label>
    <label class="checkbox">
      <input type="checkbox" id="hideNoAch"> 隐藏无成就系统的游戏
    </label>
  </div>

  <div class="add-game-row">
    <input type="text" id="gameSearchBox" placeholder="添加新游戏...">
    <span class="add-game-msg" id="addGameMsg"></span>
  </div>
  <div id="gameSearchResults" class="game-search-results" style="display:none;"></div>

  <div class="modal-overlay" id="addConfirmModal">
    <div class="modal-box">
      <div style="font-size:13px; color:var(--text-dim); margin-bottom:8px;">确认将这款游戏添加到列表？</div>
      <div class="game-name" id="confirmGameName"></div>
      <div class="modal-btns">
        <button class="add-game-btn" id="confirmAddBtn">确认</button>
        <button class="add-game-btn" id="cancelAddBtn" style="background:var(--panel-alt); color:var(--text-dim);">取消</button>
      </div>
    </div>
  </div>

  <table id="gameTable">
    <thead>
      <tr>
        <th data-key="name">游戏</th>
        <th data-key="achieved">完成数</th>
        <th data-key="total">成就总数</th>
        <th data-key="rate">完成率</th>
      </tr>
    </thead>
    <tbody id="gameTableBody">
      <tr><td colspan="4" class="loading">正在读取数据...</td></tr>
    </tbody>
  </table>

  <div id="favGrid" class="fav-grid" style="display:none;"></div>

  <!-- 本地版:把 google.script.run 转成对本地 HTTP 服务的 fetch 调用。
       有了它下面这一千行前端代码不用改一个字,见 lib/rpc-shim.js -->
  <script src="/_rpc.js"></script>

  <script>
    let allGames = [];
    let sortKey = 'rate';
    let sortDir = -1;
    let activeTab = 'incomplete';
    let expandedAppid = null;
    const missingAchCache = {};

    function fmtPct(rate) {
      if (rate === null || rate === undefined) return '';
      return (rate * 100).toFixed(1) + '%';
    }

    function barColor(rate) {
      if (rate === null) return '#555';
      if (rate >= 1) return 'var(--good)';
      if (rate >= 0.5) return 'var(--mid)';
      return 'var(--low)';
    }

    function thumbUrl(appid) {
      return 'https://cdn.akamai.steamstatic.com/steam/apps/' + appid + '/header.jpg';
    }

    function heartSvg(filled) {
      const path = 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z';
      if (filled) {
        return '<svg viewBox="0 0 24 24"><path fill="currentColor" d="' + path + '"/></svg>';
      }
      return '<svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="' + path + '"/></svg>';
    }

    function renderNewAchTable() {
      const section = document.getElementById('newAchSection');
      section.style.display = 'block';

      const recent = allGames
        .filter(function(g){ return g.newAchDaysAgo !== null && g.newAchDaysAgo <= 30; })
        .sort(function(a, b){ return a.newAchDaysAgo - b.newAchDaysAgo; });

      if (recent.length === 0) {
        document.getElementById('newAchTableBody').innerHTML =
          '<tr><td colspan="4" class="empty">最近30天没有游戏新增成就</td></tr>';
        return;
      }

      document.getElementById('newAchTableBody').innerHTML = recent.map(function(g) {
        const achievedText = (g.achieved !== null) ? g.achieved : '-';
        const totalText = (g.total !== null && g.total !== 'N/A') ? g.total : '-';
        return '<tr class="game-row">'
          + '<td><div class="game-cell">'
          + '<img class="game-thumb" src="' + thumbUrl(g.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
          + '<div class="game-name-main">' + escapeHtml(g.name) + '</div>'
          + '</div></td>'
          + '<td>' + g.newAchDaysAgo + ' 天前</td>'
          + '<td>' + achievedText + '</td>'
          + '<td>' + totalText + '</td>'
          + '</tr>';
      }).join('');
    }

    function renderFavGrid(games) {
      const grid = document.getElementById('favGrid');
      if (games.length === 0) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">还没有标记喜爱的游戏</div>';
        return;
      }

      grid.innerHTML = games.map(function(g) {
        const rate = g.rate !== null ? g.rate : 0;
        const rateText = (g.total === 'N/A') ? '无成就系统' : (g.total === null ? '数据同步中...' : fmtPct(g.rate));
        const barHtml = (g.total !== 'N/A' && g.total !== null)
          ? '<div class="fav-card-bar"><div class="bar-track"><div class="bar-fill" style="width:' + (rate*100).toFixed(1) + '%; background:' + barColor(rate) + '"></div></div><span class="rate-text">' + rateText + '</span></div>'
          : '<div class="na">' + rateText + '</div>';

        return '<div class="fav-card">'
          + '<img class="fav-card-img" src="' + thumbUrl(g.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
          + '<div class="fav-card-body">'
          + '<div class="fav-card-name"><button class="icon-btn active-heart" data-fav-appid="' + g.appid + '">' + heartSvg(true) + '</button>' + escapeHtml(g.name) + '</div>'
          + barHtml
          + '</div></div>';
      }).join('');

      grid.querySelectorAll('[data-fav-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.favAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          game.favorite = !game.favorite;
          render();
          google.script.run.withSuccessHandler(function(result) {
            if (result && typeof result.favorite === 'boolean') game.favorite = result.favorite;
          }).withFailureHandler(function() {
            game.favorite = !game.favorite;
            render();
          }).toggleFavorite(appid);
        });
      });
    }

    function render() {
      const search = document.getElementById('searchBox').value.trim().toLowerCase();
      const hideUnvetted = document.getElementById('hideUnvetted').checked;
      const hideNoAch = document.getElementById('hideNoAch').checked;
      const favOnly = document.getElementById('favOnly').checked;
      const priorityOnly = document.getElementById('priorityOnly').checked;

      let filtered = allGames.filter(function(g) {
        if (search && g.name.toLowerCase().indexOf(search) === -1) return false;
        if (hideUnvetted && g.unvetted) return false;
        if (hideNoAch && g.total === 'N/A') return false;
        if (favOnly && !g.favorite) return false;
        if (priorityOnly && !g.priority) return false;
        return true;
      });

      const completeGames = filtered.filter(function(g){ return g.rate === 1; });
      const incompleteGames = filtered.filter(function(g){ return g.rate !== 1; });
      const favoriteGames = filtered.filter(function(g){ return g.favorite; });

      document.getElementById('countIncomplete').textContent = '(' + incompleteGames.length + ')';
      document.getElementById('countComplete').textContent = '(' + completeGames.length + ')';
      document.getElementById('countFavorites').textContent = '(' + favoriteGames.length + ')';

      const table = document.getElementById('gameTable');
      const grid = document.getElementById('favGrid');

      if (activeTab === 'favorites') {
        table.style.display = 'none';
        grid.style.display = 'grid';
        renderFavGrid(favoriteGames);
        return;
      }
      table.style.display = 'table';
      grid.style.display = 'none';

      let rows = activeTab === 'complete' ? completeGames : incompleteGames;

      rows = rows.slice().sort(function(a, b) {
        let av = a[sortKey], bv = b[sortKey];
        if (av === null || av === 'N/A') av = -1;
        if (bv === null || bv === 'N/A') bv = -1;
        if (typeof av === 'string') return sortDir * av.localeCompare(bv);
        return sortDir * ((av > bv) - (av < bv));
      });

      // 重点关注(星标)的游戏置顶,组内保持原来的排序结果
      rows = rows.filter(function(g){ return g.priority; }).concat(rows.filter(function(g){ return !g.priority; }));

      const body = document.getElementById('gameTableBody');
      if (rows.length === 0) {
        body.innerHTML = '<tr><td colspan="4" class="empty">没有符合条件的游戏</td></tr>';
        return;
      }

      let html = '';
      rows.forEach(function(g) {
        const unvettedBadge = g.unvetted ? '<span class="badge">Unvetted</span>' : '';
        const manualBadgeClass = 'badge-btn ' + (g.manual ? 'badge-btn-on' : 'badge-btn-off');
        const manualBadge = '<button class="' + manualBadgeClass + '" data-manual-appid="' + g.appid + '" title="'
          + (g.manual ? '取消Manual(恢复自动同步)' : '设为Manual(停止自动同步)') + '">Manual</button>';
        const familyBadgeClass = 'badge-btn ' + (g.family ? 'badge-btn-family-on' : 'badge-btn-off');
        const familyBadge = '<button class="' + familyBadgeClass + '" data-family-appid="' + g.appid + '" title="'
          + (g.family ? '取消家庭共享标记' : '标记为家庭共享(非自购,纯信息用途)') + '">家庭</button>';
        const newAchBadge = (g.newAchDaysAgo !== null && g.newAchDaysAgo <= 30)
          ? '<span class="badge badge-new">🆕 ' + g.newAchDaysAgo + '天前新增成就</span>'
          : '';
        const heartClass = 'icon-btn' + (g.favorite ? ' active-heart' : '');
        const starChar = g.priority ? '★' : '☆';
        const starClass = 'icon-btn' + (g.priority ? ' active-star' : '');
        const guideBtnClass = 'guide-btn ' + (g.guideUrl ? 'has-guide' : 'no-guide');
        const guideBtn = g.guideUrl
          ? '<a class="' + guideBtnClass + '" href="' + g.guideUrl + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">📖 攻略</a>'
          : '<span class="' + guideBtnClass + '">📖 攻略</span>';
        const gameCell = '<div class="game-cell">'
          + '<button class="' + starClass + '" data-priority-appid="' + g.appid + '">' + starChar + '</button>'
          + '<button class="' + heartClass + '" data-fav-appid="' + g.appid + '">' + heartSvg(g.favorite) + '</button>'
          + '<img class="game-thumb" src="' + thumbUrl(g.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
          + '<div class="game-name-main">' + escapeHtml(g.name) + unvettedBadge + manualBadge + familyBadge + newAchBadge + '</div>'
          + guideBtn
          + '<button class="delete-btn" data-delete-appid="' + g.appid + '" title="删除这一行">🗑</button>'
          + '</div>';

        const canExpand = activeTab === 'incomplete' && g.total !== 'N/A' && g.total !== null && g.appid;
        const rowClass = 'game-row' + (canExpand ? ' expandable' : '');

        if (g.manual) {
          const achievedVal = (typeof g.achieved === 'number') ? g.achieved : 0;
          const totalVal = (typeof g.total === 'number') ? g.total : 0;
          const manualRate = totalVal > 0 ? achievedVal / totalVal : 0;
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '">'
            + '<td>' + gameCell + '</td>'
            + '<td><input type="number" min="0" class="manual-input" data-manual-field="achieved" data-manual-row-appid="' + g.appid + '" value="' + achievedVal + '" onclick="event.stopPropagation()"></td>'
            + '<td><input type="number" min="0" class="manual-input" data-manual-field="total" data-manual-row-appid="' + g.appid + '" value="' + totalVal + '" onclick="event.stopPropagation()"></td>'
            + '<td><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:' + (manualRate*100).toFixed(1) + '%; background:' + barColor(manualRate) + '"></div></div><span class="rate-text">' + fmtPct(manualRate) + '</span></div></td>'
            + '</tr>';
        } else if (g.total === 'N/A') {
          html += '<tr class="' + rowClass + '"><td>' + gameCell + '</td><td class="na" colspan="3">无成就系统</td></tr>';
        } else if (g.total === null) {
          html += '<tr class="' + rowClass + '"><td>' + gameCell + '</td><td class="na" colspan="3">数据同步中...</td></tr>';
        } else {
          const rate = g.rate !== null ? g.rate : 0;
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '">'
            + '<td>' + gameCell + '</td>'
            + '<td>' + g.achieved + '</td>'
            + '<td>' + g.total + '</td>'
            + '<td><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:' + (rate*100).toFixed(1) + '%; background:' + barColor(rate) + '"></div></div><span class="rate-text">' + fmtPct(g.rate) + '</span></div></td>'
            + '</tr>';
        }

        if (canExpand && expandedAppid === String(g.appid)) {
          html += renderMissingRow(g.appid);
        }
      });

      body.innerHTML = html;

      body.querySelectorAll('[data-fav-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.favAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          game.favorite = !game.favorite; // 先本地乐观更新,界面立刻响应
          render();
          google.script.run.withSuccessHandler(function(result) {
            if (result && typeof result.favorite === 'boolean') game.favorite = result.favorite;
          }).withFailureHandler(function() {
            game.favorite = !game.favorite; // 失败了就改回去
            render();
          }).toggleFavorite(appid);
        });
      });

      body.querySelectorAll('[data-priority-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.priorityAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          game.priority = !game.priority; // 先本地乐观更新,界面立刻响应
          render();
          google.script.run.withSuccessHandler(function(result) {
            if (result && typeof result.priority === 'boolean') game.priority = result.priority;
          }).withFailureHandler(function() {
            game.priority = !game.priority; // 失败了就改回去
            render();
          }).togglePriority(appid);
        });
      });

      body.querySelectorAll('[data-manual-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.manualAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const newManual = !game.manual;
          game.manual = newManual;
          render();
          google.script.run.withSuccessHandler(function(result) {
            if (result && typeof result.manual === 'boolean') game.manual = result.manual;
          }).withFailureHandler(function() {
            game.manual = !game.manual;
            render();
          }).setManualStatus(appid, newManual);
        });
      });

      body.querySelectorAll('[data-family-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.familyAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const newFamily = !game.family;
          game.family = newFamily;
          render();
          google.script.run.withSuccessHandler(function(result) {
            if (result && typeof result.family === 'boolean') game.family = result.family;
          }).withFailureHandler(function() {
            game.family = !game.family;
            render();
          }).toggleFamily(appid);
        });
      });

      body.querySelectorAll('[data-delete-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.deleteAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          if (!confirm('确定要删除《' + game.name + '》吗?这会从本地数据库里彻底删掉这一行,无法撤销。')) return;

          btn.disabled = true;
          google.script.run.withSuccessHandler(function(result) {
            if (result && result.error) {
              btn.disabled = false;
              alert(result.error);
              return;
            }
            allGames = allGames.filter(function(g){ return String(g.appid) !== String(appid); });
            if (expandedAppid === String(appid)) expandedAppid = null;
            document.getElementById('cardTotal').textContent = allGames.length;
            render();
          }).withFailureHandler(function(err) {
            btn.disabled = false;
            alert('删除失败: ' + err.message);
          }).deleteGame(appid);
        });
      });

      body.querySelectorAll('.manual-input').forEach(function(input) {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') input.blur();
        });
        input.addEventListener('change', function() {
          const appid = input.dataset.manualRowAppid;
          const row = input.closest('tr');
          const achievedInput = row.querySelector('[data-manual-field="achieved"]');
          const totalInput = row.querySelector('[data-manual-field="total"]');
          const achieved = Math.max(0, parseInt(achievedInput.value, 10) || 0);
          const total = Math.max(0, parseInt(totalInput.value, 10) || 0);
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const prevAchieved = game.achieved;
          const prevTotal = game.total;
          const prevRate = game.rate;
          game.achieved = achieved; // 先本地乐观更新,界面立刻响应
          game.total = total;
          game.rate = total > 0 ? achieved / total : 0;
          render();
          function revert() {
            game.achieved = prevAchieved;
            game.total = prevTotal;
            game.rate = prevRate;
            render();
          }
          google.script.run.withSuccessHandler(function(result) {
            if (!result || result.error) revert(); // 服务器端校验没过(比如完成数>总数),改回去
          }).withFailureHandler(revert).setManualAchievements(appid, achieved, total);
        });
      });

      body.querySelectorAll('tr.expandable').forEach(function(tr) {
        tr.addEventListener('click', function() {
          const appid = tr.dataset.appid;
          expandedAppid = (expandedAppid === appid) ? null : appid;
          if (expandedAppid && !missingAchCache[expandedAppid]) {
            missingAchCache[expandedAppid] = { loading: true };
            google.script.run.withSuccessHandler(function(data) {
              missingAchCache[appid] = data;
              if (expandedAppid === appid) render();
            }).withFailureHandler(function(err) {
              missingAchCache[appid] = { error: err.message };
              if (expandedAppid === appid) render();
            }).getMissingAchievements(appid);
          }
          render();
        });
      });
    }

    function renderMissingRow(appid) {
      const data = missingAchCache[appid];
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      const gameName = game ? game.name : '';
      let inner;
      if (!data || data.loading) {
        inner = '<div class="missing-header">正在查询缺失成就...</div>';
      } else if (data.error) {
        inner = '<div class="missing-header">' + escapeHtml(data.error) + '</div>';
      } else if (data.missingCount === 0) {
        inner = '<div class="missing-header">所有成就都已解锁</div>';
      } else {
        inner = '<div class="missing-header">还差 ' + data.missingCount + ' / ' + data.total + ' 个成就</div>'
          + '<div class="ach-grid">' + data.missing.map(function(a) {
            const query = encodeURIComponent(gameName + ' ' + a.name + ' achievement guide');
            const guideUrl = 'https://www.google.com/search?q=' + query;
            return '<div class="ach-item">'
              + '<img class="ach-icon" src="' + a.icon + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
              + '<div><div class="ach-name">' + escapeHtml(a.name) + '</div><div class="ach-desc">' + escapeHtml(a.description) + '</div>'
              + '<a class="ach-guide-link" href="' + guideUrl + '" target="_blank" rel="noopener">🔍 搜攻略</a></div>'
              + '</div>';
          }).join('') + '</div>';
      }
      return '<tr class="missing-row"><td colspan="4">' + inner + '</td></tr>';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    document.querySelectorAll('th[data-key]').forEach(function(th) {
      th.addEventListener('click', function() {
        const key = th.dataset.key;
        if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = -1; }
        render();
      });
    });

    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        activeTab = btn.dataset.tab;
        expandedAppid = null;
        document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        render();
      });
    });

    document.getElementById('searchBox').addEventListener('input', render);
    document.getElementById('favOnly').addEventListener('change', render);
    document.getElementById('priorityOnly').addEventListener('change', render);
    document.getElementById('hideUnvetted').addEventListener('change', render);
    document.getElementById('hideNoAch').addEventListener('change', render);

    function addSelectedGame(appid, name) {
      const msg = document.getElementById('addGameMsg');
      msg.textContent = '添加中...';
      msg.className = 'add-game-msg';

      google.script.run.withSuccessHandler(function(result) {
        if (result && result.error) {
          msg.textContent = result.error;
          msg.className = 'add-game-msg error';
          return;
        }
        allGames.push(result);
        msg.textContent = '已添加: ' + result.name;
        msg.className = 'add-game-msg success';
        document.getElementById('cardTotal').textContent = allGames.length;
        render();
      }).withFailureHandler(function(err) {
        msg.textContent = '添加失败: ' + err.message;
        msg.className = 'add-game-msg error';
      }).addGame(appid, name);
    }

    function renderSearchResults(items) {
      const box = document.getElementById('gameSearchResults');
      if (!items || items.length === 0) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }
      box.style.display = 'flex';
      box.innerHTML = items.map(function(g) {
        return '<div class="game-search-result" data-appid="' + g.appid + '" data-name="' + escapeHtml(g.name) + '">'
          + '<img src="' + thumbUrl(g.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
          + '<span>' + escapeHtml(g.name) + ' <span class="appid-hint">(' + g.appid + ')</span></span>'
          + '</div>';
      }).join('');

      box.querySelectorAll('.game-search-result').forEach(function(el) {
        el.addEventListener('click', function() {
          // 选中后弹窗确认,不直接添加
          const appid = el.dataset.appid;
          const name = el.dataset.name;
          document.getElementById('confirmGameName').textContent = name;
          document.getElementById('addConfirmModal').dataset.appid = appid;
          document.getElementById('addConfirmModal').dataset.name = name;
          document.getElementById('addConfirmModal').classList.add('show');
        });
      });
    }

    function runGameSearch() {
      const query = document.getElementById('gameSearchBox').value.trim();
      const msg = document.getElementById('addGameMsg');
      if (!query) { renderSearchResults([]); msg.textContent = ''; return; }

      msg.textContent = '搜索中...';
      msg.className = 'add-game-msg';
      google.script.run.withSuccessHandler(function(items) {
        msg.textContent = (items && items.length === 0) ? '没有找到匹配的游戏' : '';
        msg.className = 'add-game-msg';
        renderSearchResults(items);
      }).withFailureHandler(function(err) {
        msg.textContent = '搜索失败: ' + err.message;
        msg.className = 'add-game-msg error';
      }).searchSteamGames(query);
    }

    let searchTimeout = null;
    document.getElementById('gameSearchBox').addEventListener('input', function() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(runGameSearch, 300);
    });
    document.getElementById('gameSearchBox').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { clearTimeout(searchTimeout); runGameSearch(); }
    });

    document.getElementById('confirmAddBtn').addEventListener('click', function() {
      const modal = document.getElementById('addConfirmModal');
      const appid = modal.dataset.appid;
      const name = modal.dataset.name;
      if (!appid) return;
      modal.classList.remove('show');
      renderSearchResults([]);
      document.getElementById('gameSearchBox').value = '';
      addSelectedGame(appid, name);
    });

    document.getElementById('cancelAddBtn').addEventListener('click', function() {
      document.getElementById('addConfirmModal').classList.remove('show');
    });

    // Click outside modal to dismiss
    document.getElementById('addConfirmModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('show');
    });

    google.script.run.withSuccessHandler(function(data) {
      allGames = data.games;
      document.getElementById('cardTotal').textContent = data.totalGames;
      document.getElementById('cardAvg').textContent = data.avgRounded || '-';
      document.getElementById('cardAvgPrecise').textContent = data.avgPrecise ? ('精确值: ' + data.avgPrecise) : '';
      document.getElementById('cardPerfect').textContent = data.perfectCount;
      document.getElementById('lastUpdated').textContent = '上次同步: ' + data.lastUpdated;
      renderNewAchTable();
      render();
    }).withFailureHandler(function(err) {
      document.getElementById('gameTableBody').innerHTML =
        '<tr><td colspan="4" class="empty">读取数据失败: ' + err.message + '</td></tr>';
    }).getDashboardData();
  </script>
</body>
</html>
