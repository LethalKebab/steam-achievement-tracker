            + (g.playedDaysAgo === 0 ? '今天在玩' : g.playedDaysAgo + '天前玩过') + '</span>'
          : '';
        // **行内的图标按钮是 .row-icon,不是 .icon-btn。** 后者是顶栏那种带底色描边的
        // 方块;两者原来共用一个类名,而 CSS 里行内那段写在后面,把顶栏那段整个盖掉了 ——
        // 顶栏按钮说好的底色和描边从来没画出来过,还不报错。分成两个名字之后不会再撞
        const heartClass = 'row-icon' + (g.favorite ? ' active-heart' : '');
        const starClass = 'row-icon' + (g.priority ? ' active-star' : '');
        const guideBtnClass = 'guide-btn ' + (g.guideUrl ? 'has-guide' : 'no-guide');
        const canGen = !g.guideUrl && aiReady && typeof g.total === 'number' && g.total > 0;
        const guideBtn = g.guideUrl
          ? '<a class="' + guideBtnClass + '" href="' + g.guideUrl + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + icon('book') + '攻略</a>'
          : canGen
            ? '<button class="' + guideBtnClass + ' can-gen" data-gen="' + g.appid + '" data-name="'
              + escapeHtml(g.name) + '" onclick="event.stopPropagation();window.genGuide(this)">' + icon('sparkle') + '生成</button>'
            : '<span class="' + guideBtnClass + '">' + icon('book') + '攻略</span>';
        // 一行里其实是三组东西:**标记**(星、心)、**身份**(封面、名字、状态徽章)、
        // **操作**(攻略、重写、更多)。它们原来是一串等距的兄弟节点,眼睛分不出组;
        // 而且只有最后那个「更多」带 margin-left:auto,于是攻略按钮浮在名字右边不上不下。
        // 现在标记和操作各自成块,操作整组靠右(margin 挂在 .row-actions 上)
        const gameCell = '<div class="game-cell">'
          + '<div class="row-marks">'
          + '<button class="' + starClass + '" data-priority-appid="' + g.appid + '" aria-label="重点关注">' + icon('star', g.priority) + '</button>'
          + '<button class="' + heartClass + '" data-fav-appid="' + g.appid + '" aria-label="喜爱">' + heartSvg(g.favorite) + '</button>'
          + '</div>'
          + '<img class="game-thumb" src="' + coverSrc(g) + '" loading="lazy"'
          + ' onerror="window.coverFailed(this, \'' + g.appid + '\')">'
          + '<div class="game-name-main">' + escapeHtml(g.name) + unvettedBadge + manualBadge + familyBadge + playedBadge + newAchBadge + '</div>'
          + '<div class="row-actions">'
          + guideBtn
          // 已经有攻略的行原来只有「攻略」,没有任何入口能重写它 —— 覆盖只能敲命令行。
          // 闸门不在这个按钮上,在它弹出的确认框里(会先算清楚要失去什么),所以露出来是安全的
          + (g.guideUrl && aiReady && typeof g.total === 'number' && g.total > 0
              ? '<button class="guide-btn rewrite" data-rewrite="' + g.appid + '" data-name="'
                + escapeHtml(g.name) + '" title="让 AI 重新写一份,覆盖现在这份(会先备份原文)"'
                + ' onclick="event.stopPropagation();window.rewriteGuide(this)">' + icon('rewrite') + '重写</button>'
              : '')
          + (g.guideKind === 'local' && notionReady
              ? '<button class="guide-btn to-notion" data-migrate="' + g.appid + '" data-name="'
                + escapeHtml(g.name) + '" title="把这份本地攻略搬到 Notion"'
                + ' onclick="event.stopPropagation();window.migrateGuide(this)">' + icon('upload') + 'Notion</button>'
              : '')
          // 改数字和删除**合到一个入口**。它们原来是行上并排的两个按钮,而删除不可撤销 ——
          // 挨着一个日常会点的按钮,迟早点错。现在都藏在菜单第二层
          + '<button class="delete-btn" data-edit-appid="' + g.appid + '" title="更多操作" aria-label="更多操作">' + icon('more') + '</button>'
          + '</div>'
          + '</div>';

        // 展开看的是「还差哪些成就」,判据是**这一行确实没打完**,不是标签页选了哪个。
        // 标签页没了之后,关掉「隐藏已完成」时打满的游戏也会出现在表里 —— 给它展开箭头
        // 会展出一个空列表
        const canExpand = g.rate !== 1 && g.total !== 'N/A' && g.total !== null && g.appid;
        const rowClass = 'game-row' + (canExpand ? ' expandable' : '');

        // **只有正在编辑的那一行才给输入框。** 锁着但没在编辑的行,数字和普通行一样
        // 是纯文本 —— 常驻的输入框等于把一个可以误触改数的控件摆在每一条锁定行上
        if (g.manual && String(editingAppid) === String(g.appid)) {
          const achievedVal = (typeof g.achieved === 'number') ? g.achieved : 0;
          const totalVal = (typeof g.total === 'number') ? g.total : 0;
          const manualRate = totalVal > 0 ? achievedVal / totalVal : 0;
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '">'
            + '<td>' + gameCell + '</td>'
            + '<td><input type="number" min="0" class="manual-input" data-manual-field="achieved" data-manual-row-appid="' + g.appid + '" value="' + achievedVal + '" onclick="event.stopPropagation()"></td>'
            + '<td><input type="number" min="0" class="manual-input" data-manual-field="total" data-manual-row-appid="' + g.appid + '" value="' + totalVal + '" onclick="event.stopPropagation()"></td>'
            + '<td>' + barCell(manualRate) + '</td>'
            + '</tr>';
        // **没有数字的三行也要带 data-appid。** 它原来只挂在「有数字」的两个分支上,
        // 于是「按 appid 找到那一行」对**刚添加进来的游戏恰好做不到** —— 新游戏
        // 十有八九就落在下面这三种长相里。data-appid 是这一行的身份,
        // 不是「它有没有数字」的标记
        } else if (g.total === 'N/A') {
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '"><td>' + gameCell + '</td><td class="na" colspan="3">无成就系统</td></tr>';
        } else if (g.total === null && g.manual) {
          // 锁着的行不会自动同步,所以「数据同步中」对它是句假话 —— 它在等你自己填
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '"><td>' + gameCell + '</td><td class="na" colspan="3">还没填数字</td></tr>';
        } else if (g.total === null) {
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '"><td>' + gameCell + '</td><td class="na" colspan="3">数据同步中...</td></tr>';
        } else {
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '">'
            + '<td>' + gameCell + '</td>'
            + '<td>' + g.achieved + '</td>'
            + '<td>' + g.total + '</td>'
            + '<td>' + barCell(g.rate) + '</td>'
            + '</tr>';
        }

        if (canExpand && expandedAppid === String(g.appid)) {
          html += renderMissingRow(g.appid);
        }
      });

      body.innerHTML = html;

      bindFavButtons(body);

      body.querySelectorAll('[data-priority-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.priorityAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          game.priority = !game.priority; // 先本地乐观更新,界面立刻响应
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.priority === 'boolean') game.priority = result.priority;
          }).withFailureHandler(function() {
            game.priority = !game.priority; // 失败了就改回去
            render();
          }).togglePriority(appid);
        });
      });

      body.querySelectorAll('[data-manual-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.manualAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const newManual = !game.manual;
          game.manual = newManual;
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.manual === 'boolean') game.manual = result.manual;
          }).withFailureHandler(function() {
            game.manual = !game.manual;
            render();
          }).setManualStatus(appid, newManual);
        });
      });

      body.querySelectorAll('[data-family-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.familyAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const newFamily = !game.family;
          game.family = newFamily;
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.family === 'boolean') game.family = result.family;
          }).withFailureHandler(function() {
            game.family = !game.family;
            render();
          }).toggleFamily(appid);
        });
      });

      body.querySelectorAll('[data-edit-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          openRowMenu(btn, btn.dataset.editAppid);
        });
      });

      body.querySelectorAll('.manual-input').forEach(function(input) {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') input.blur();
          if (e.key === 'Escape') { input.blur(); stopManualEdit(); }
        });
        // 焦点离开**这一行**才退出编辑 —— 在两个输入框之间跳不算离开。
        // setTimeout 是必须的:focusout 触发时 relatedTarget 有时还没落定,
        // 而且要让同一次失焦上的 change 先跑完(它负责存盘)
        input.addEventListener('focusout', function() {
          const row = input.closest('tr');
          setTimeout(function() {
            if (!row.contains(document.activeElement)) stopManualEdit();
          }, 0);
        });
        input.addEventListener('change', function() {
          const appid = input.dataset.manualRowAppid;
          const row = input.closest('tr');
          const achievedInput = row.querySelector('[data-manual-field="achieved"]');
          const totalInput = row.querySelector('[data-manual-field="total"]');
          const achieved = Math.max(0, parseInt(achievedInput.value, 10) || 0);
          const total = Math.max(0, parseInt(totalInput.value, 10) || 0);
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const prevAchieved = game.achieved;
          const prevTotal = game.total;
          const prevRate = game.rate;
          game.achieved = achieved; // 先本地乐观更新,界面立刻响应
          game.total = total;
          game.rate = total > 0 ? achieved / total : 0;
          // **编辑中不整页重绘。** render() 会重建 innerHTML,焦点跟着没了 ——
          // 于是从「完成数」跳到「成就总数」的那一下,第二个输入框会在手底下被换掉。
          // 编辑期间只就地更新进度条那一格,整页重绘留到退出编辑时
          if (String(editingAppid) === String(appid)) updateRateCell(row, game.rate);
          else render();
          function revert() {
            game.achieved = prevAchieved;
            game.total = prevTotal;
            game.rate = prevRate;
            if (String(editingAppid) === String(appid)) {
              achievedInput.value = (typeof prevAchieved === 'number') ? prevAchieved : 0;
              totalInput.value = (typeof prevTotal === 'number') ? prevTotal : 0;
              updateRateCell(row, game.rate ?? 0);
            } else {
              render();
            }
          }
          rpc.withSuccessHandler(function(result) {
            if (!result || result.error) revert(); // 服务器端校验没过(比如完成数>总数),改回去
          }).withFailureHandler(revert).setManualAchievements(appid, achieved, total);
        });
      });

      body.querySelectorAll('tr.expandable').forEach(function(tr) {
        tr.addEventListener('click', function() {
          const appid = tr.dataset.appid;
          expandedAppid = (expandedAppid === appid) ? null : appid;
          if (expandedAppid && !missingAchCache[expandedAppid]) {
            missingAchCache[expandedAppid] = { loading: true };
            rpc.withSuccessHandler(function(data) {
              missingAchCache[appid] = data;
              if (expandedAppid === appid) render();
            }).withFailureHandler(function(err) {
              missingAchCache[appid] = { error: err.message };
              if (expandedAppid === appid) render();
            }).getMissingAchievements(appid);
          }
          render();
        });
      });

      // 高度全交给 CSS 的 max-height,这里只判断"有没有真的被裁到"。
      // **先全部量完再统一改 class** —— 在同一个循环里读 scrollHeight 又写 class,
      // 每张卡片都强制一次重排,一个四百成就的游戏能卡住肉眼可见的一拍
      const wins = Array.prototype.slice.call(body.querySelectorAll('.ach-guide'));
      const overflowing = wins.map(function(el) { return el.scrollHeight > el.clientHeight + 1; });
      wins.forEach(function(el, i) {
        // 没被裁的什么都不做:它已经是完整的,不给渐变也不给手势
        if (!overflowing[i]) return;
        el.classList.add('clamped');
        // toggle 而不是 add —— 展开之后要能再点一下收回去。单参数的翻转是有意的
        el.addEventListener('click', function() {
          el.classList.toggle('expanded');
          const grid = el.closest('.ach-grid');
          // 第二个参数必须布尔化:传 undefined 的话 toggle 会**翻转**而不是关闭
          grid.classList.toggle('has-expanded', Boolean(grid.querySelector('.ach-guide.expanded')));
        });
      });
    }

    function renderMissingRow(appid) {
      const data = missingAchCache[appid];
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      const gameName = game ? game.name : '';
      let inner;
      if (!data || data.loading) {
        inner = '<div class="missing-header">正在查询缺失成就...</div>';
      } else if (data.error) {
        inner = '<div class="missing-header">' + escapeHtml(data.error) + '</div>';
      } else if (data.missingCount === 0) {
        inner = '<div class="missing-header">所有成就都已解锁</div>';
      } else {
        // 有登记攻略、而且这次真读到了,才谈得上"写了几条"。读失败就如实说读失败,
        // 别让 0 条看起来像"攻略一条都没写"
        const hasGuide = Boolean(data.guide) && !data.guide.error;
        let head = '还差 ' + data.missingCount + ' / ' + data.total + ' 个成就';
        if (hasGuide) {
          const written = data.missing.filter(function(a) { return a.guide; }).length;
          head += ' · 攻略里已写 ' + written + ' / ' + data.missingCount + ' 条';
        } else if (data.guide && data.guide.error) {
          head += ' · ' + data.guide.error;
        }
        inner = '<div class="missing-header">' + escapeHtml(head) + '</div>'
          + '<div class="ach-grid">' + data.missing.map(function(a) {
            const query = encodeURIComponent(gameName + ' ' + a.name + ' achievement guide');
            const search = '<a class="ach-guide-link" href="https://www.google.com/search?q=' + query
              + '" target="_blank" rel="noopener">' + GEN_SEARCH + ' 搜攻略</a>';
            let tail;
            if (a.guide) {
              // 削掉对官方名字/描述的复述之后可能什么都不剩(攻略里只抄了官方文案、
              // 没写打法)。那就干脆不画窗口 —— 名字、描述、跳转按钮都还在上面,
              // 画一个空框只是告诉你"这里本该有东西"
              const substeps = a.guide.subSteps.map(function(s) {
                return '<div class="ach-substep' + (s.checked ? ' done' : '') + '"'
                  + ' style="margin-left:' + (s.depth * 12) + 'px">' + escapeHtml(s.text) + '</div>';
              }).join('');
              tail = (a.guide.text || substeps)
                ? '<div class="ach-guide">'
                  + (a.guide.text ? '<div class="ach-guide-text">' + escapeHtml(a.guide.text) + '</div>' : '')
                  + substeps + '</div>'
                : '';
            } else if (hasGuide) {
              tail = '<div class="ach-gap">攻略里还没写这条</div>' + search;
            } else {
              tail = search;
            }
            // 跳转按钮挂在成就名旁边,不在攻略窗口里 —— 窗口是会被裁的,而这是这张
            // 卡片唯一的动作;放上面还顺带让它的位置不随攻略长短飘
            const jump = (a.guide && a.guide.url)
              ? '<a class="ach-jump" href="' + escapeHtml(a.guide.url)
                + '" target="_blank" rel="noopener" title="在攻略中打开">' + GEN_BOOK + '</a>'
              : '';
            return '<div class="ach-item">'
              + '<img class="ach-icon" src="' + a.icon + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
              + '<div class="ach-body">'
              + '<div class="ach-head"><div class="ach-name">' + escapeHtml(a.name) + '</div>' + jump + '</div>'
              + '<div class="ach-desc">' + escapeHtml(a.description) + '</div>' + tail + '</div>'
              + '</div>';
          }).join('') + '</div>';
      }
      return '<tr class="missing-row"><td colspan="4">' + inner + '</td></tr>';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    document.querySelectorAll('th[data-key]').forEach(function(th) {
      th.addEventListener('click', function() {
        const key = th.dataset.key;
        if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = -1; }
        render();
      });
    });


    // 每个筛选控件都要在这儿挂一个,漏一个的表现是「点了没反应」而不是报错 ——
    // 加 hideComplete 时就漏过一次:默认值照常生效(首次渲染读得到 checked),
    // 只有取消勾选时才看得出来。所以按 id 一次性挂,别再逐行写
    ['searchBox', 'hideComplete', 'favOnly', 'hideUnvetted', 'hideNoAch'].forEach(function(id) {
      const el = document.getElementById(id);
      el.addEventListener(el.type === 'checkbox' ? 'change' : 'input', render);
    });
    // 搜索框比别的多一件事:库里没有的时候去 Steam 找。**和 render 分开挂** ——
    // render 是纯粹的重画,谁改了筛选都要跑;这一条只属于搜索框,混进 render 里
    // 等于每次勾一下「隐藏已完成」都去想要不要发网络请求
    document.getElementById('searchBox').addEventListener('input', onSearchInput);

    document.querySelectorAll('.view-toggle button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        viewMode = btn.dataset.view;
        // 换视图时收起展开的那一行:图库没有展开这回事,留着切回表格会突然冒出来
        expandedAppid = null;
        document.querySelectorAll('.view-toggle button').forEach(function(b) {
          b.classList.toggle('on', b === btn);
          // 选中态只画不报的话,读屏用户读不到这一组里哪个是当前视图
          b.setAttribute('aria-pressed', String(b === btn));
        });
        render();
      });
    });

    // ---- 行的 Edit 菜单 -------------------------------------------------------
    //
    // 「改成就数量」和「删除」原来是行上并排的两个按钮。删除**不可撤销**,而它紧挨着
    // 一个日常会点的按钮 —— 这种排布迟早会点错。现在两个都收进菜单的第二层,
    // 而「锁定」(原来的 Manual)反过来提到行上做一个图标:它可逆、要常用,不该藏。

    /** 删除一行。从 🗑 按钮搬进菜单,所以提成独立函数 */
    async function deleteGameFlow(appid) {
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      if (!game) return;
      const ok = await askConfirm({
        title: '删除《' + game.name + '》?',
        body: '从本地数据库删掉这一行,无法撤销。',
        okText: '删除',
        danger: true,
      });
      if (!ok) return;
      rpc.withSuccessHandler(function(result) {
        if (result && result.error) {
          askConfirm({ title: '删除失败', body: result.error, okText: '知道了', notifyOnly: true });
          return;
        }
        allGames = allGames.filter(function(g){ return String(g.appid) !== String(appid); });
        if (expandedAppid === String(appid)) expandedAppid = null;
        render();
      }).withFailureHandler(function(err) {
        askConfirm({ title: '删除失败', body: String(err && err.message || err), okText: '知道了', notifyOnly: true });
      }).deleteGame(appid);
    }

    /**
     * 菜单里的「编辑」。**必然连带上锁。**
     *
     * 后端的 setManualAchievements 只接受锁定的行,而那个守卫是对的:没锁的话
     * 下一次同步会拿 Steam 的数字把你手填的直接覆盖掉,而且不会有任何提示。
     * 所以这里先锁再让输入框出现 —— 行上那把锁当场亮起来,就是这件事的反馈。
     */
    function startManualEdit(appid) {
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      if (!game) return;
      const focusInput = function() {
        const el = document.querySelector(
          '[data-manual-row-appid="' + appid + '"][data-manual-field="achieved"]');
        if (el) { el.focus(); el.select(); }
      };
      editingAppid = String(appid);
      if (game.manual) { render(); focusInput(); return; }

      game.manual = true;   // 乐观更新:输入框立刻出现,不等往返
      render();
      focusInput();
      rpc.withSuccessHandler(function(result) {
        if (result && typeof result.manual === 'boolean') game.manual = result.manual;
      }).withFailureHandler(function() {
        game.manual = false;
        editingAppid = null;
        render();
      }).setManualStatus(appid, true);
    }

    /** 退出编辑模式:锁保持不变,数字变回纯文本 */
    function stopManualEdit() {
      if (editingAppid === null) return;
      editingAppid = null;
      render();
    }

    const rowMenu = document.getElementById('rowEditMenu');
    const closeRowMenu = function() { rowMenu.hidden = true; };

    function openRowMenu(btn, appid) {
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      if (!game) return;
      rowMenu.innerHTML = '';
      const item = function(label, cls, title, fn) {
        const b = document.createElement('button');
        b.textContent = label;
        if (cls) b.className = cls;
        if (title) b.title = title;
        b.addEventListener('click', function(e) { e.stopPropagation(); closeRowMenu(); fn(); });
        rowMenu.appendChild(b);
      };
      // **标签只写动作,不写宾语。** 菜单是从某一行的按钮弹出来的,「这一行」和
      // 「成就数量」都是当场看得见的上下文,写进标签就是把已经知道的事又说一遍。
      // 「会连带上锁」同理留在 title 里:锁图标当场亮起来已经说明了这件事
      item('编辑', '', game.manual ? '' : '会同时锁定这一行(停止自动同步)',
        function(){ startManualEdit(appid); });
      item('删除', 'danger', '', function(){ deleteGameFlow(appid); });

      rowMenu.hidden = false;
      const r = btn.getBoundingClientRect();
      // 贴按钮下方左对齐,但不许越出右边缘 —— 这个按钮在行尾,靠右的行会顶出去
      const maxLeft = window.scrollX + document.documentElement.clientWidth - rowMenu.offsetWidth - 8;
      rowMenu.style.top = (window.scrollY + r.bottom + 6) + 'px';
      rowMenu.style.left = Math.max(8, Math.min(window.scrollX + r.left, maxLeft)) + 'px';
    }

    // 点别处 / Esc 收起。不能用 blur —— 菜单里的按钮拿到焦点也会触发,一点就自己关了
    document.addEventListener('click', function(e) {
      if (!rowMenu.hidden && !rowMenu.contains(e.target)) closeRowMenu();

      // **退出编辑的第二条路,和 focusout 并存。** 点空白处在有些浏览器里根本不移动
      // 焦点,那样 focusout 永远不来,行就一直停在可编辑状态 —— 而这正是这次要消除的
      // 「随时能被误改」。两条路都指向同一个 stopManualEdit,重复调用是安全的
      if (editingAppid !== null) {
        const row = document.querySelector('tr[data-appid="' + editingAppid + '"]');
        if (!row || !row.contains(e.target)) stopManualEdit();
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && !rowMenu.hidden) closeRowMenu();
    });

    /** 高亮停留多久。**CSS 里 row-flash / card-flash 的时长是同一个数**,改一个要一起改 */
    const FLASH_MS = 2000;

    /**
     * 滚到某个游戏那一行(或那张卡)并让它闪一下。**只由用户点击触发。**
     *
     * 两个细节是有理由的,不是顺手写的:
     *
     * - **不用 `scrollIntoView`,自己算落点。** 顶栏和表头都是 sticky,它们盖住的
     *   那一条不算"看得见",而 `scrollIntoView` 一个字都不知道这件事:`'start'` 把行
     *   送到视口顶上,正好在冻结的表头**底下**;`'center'` 送到视口正中,窄屏上顶栏
     *   读数换行变高之后同样是压着的。落点要算的是「盖不住的那块」的中间。
     * - **只在当前视图里找。** 另一个视图的 DOM 还留着上一次渲染的内容(render 里
     *   两个视图是分叉的,不显示的那个不会被清空),而搜索下拉和确认框上也各有一个
     *   data-appid —— 满页找第一个匹配,大概率找到的是那个藏起来的旧节点。
     */
    function revealGame(appid) {
      const view = document.getElementById(viewMode === 'gallery' ? 'gallery' : 'gameTableBody');
      const el = view.querySelector('[data-appid="' + appid + '"]');
      if (!el) return false;

      // 表头只在表格视图里存在;网格视图下 #gameTable 带着 hidden,offsetHeight 就是 0
      const bar = document.querySelector('.topbar');
      const head = document.querySelector('#gameTable thead');
      const covered = (bar ? bar.offsetHeight : 0) + (head ? head.offsetHeight : 0);

      const r = el.getBoundingClientRect();
      const top = window.scrollY + r.top - covered - (window.innerHeight - covered - r.height) / 2;
      const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      window.scrollTo({ top: Math.max(0, top), behavior: still ? 'auto' : 'smooth' });

      el.classList.add('just-added');
      setTimeout(function() { el.classList.remove('just-added'); }, FLASH_MS);
      return true;
    }

    /**
     * 「已添加」那句话 —— 做成可点的,点了跳过去。
     *
     * **不自动跳。** 加完接着加下一个是很常见的用法,而自动滚到几百行开外会把
     * 「添加新游戏」那个输入框一起带走,等于逼人再滚回来。所以跳不跳交给用户,
     * 那句本来就要显示的提示顺便当了按钮 —— 不额外占地方。
     *
     * 被筛选挡住时**点了就把那个筛选关掉再跳**:用户点的是"带我去看",
     * 而"告诉你为什么看不到"是上一步的事,已经写在这句话里了。
     */
    function showAddedMsg(game) {
      const old = document.getElementById('addGameMsg');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.id = 'addGameMsg';
      btn.className = 'add-game-msg success';

      const hidden = hidingFilter(game, currentFilters());
      btn.textContent = hidden
        ? '已添加: ' + game.name + '(被「' + hidden.label + '」挡住了,点这里查看)'
        : '已添加: ' + game.name + ' —— 点这里查看';
      btn.title = '跳到这一行';
      btn.addEventListener('click', function() {
        const blocking = hidingFilter(game, currentFilters());
        if (blocking) {
          // 搜索框是输入框,清空;其余四个是勾选框,取消勾选
          if (blocking.el.type === 'checkbox') blocking.el.checked = false;
          else blocking.el.value = '';
          render();
        }
        revealGame(game.appid);
      });
      old.replaceWith(btn);
    }

    /** 提示复位成一个不可点的 span —— 上一次那个按钮点了会跳到别的游戏去 */
    function setAddMsg(text, cls) {
      const old = document.getElementById('addGameMsg');
      const span = document.createElement('span');
      span.id = 'addGameMsg';
      span.className = 'add-game-msg' + (cls ? ' ' + cls : '');
      span.textContent = text;
      old.replaceWith(span);
    }

    function addSelectedGame(appid, name, family) {
      setAddMsg('添加中...');

      rpc.withSuccessHandler(function(result) {
        if (result && result.error) {
          setAddMsg(result.error, 'error');
          return;
        }
        allGames.push(result);
        render();
        showAddedMsg(result);
      }).withFailureHandler(function(err) {
        setAddMsg('添加失败: ' + err.message, 'error');
      }).addGame(appid, name, family);
    }

    /** 等 Steam 回话时的占位行。三条 —— 够看出「是个列表」,又不至于把冻结区撑高太多 */
    function renderSkeleton() {
      const box = document.getElementById('gameSearchResults');
      document.getElementById('steamLabel').hidden = false;
      box.style.display = 'flex';
      const row = '<div class="game-search-result skeleton" aria-hidden="true">'
        + '<span class="skel-img"></span><span class="skel-line"></span></div>';
      box.innerHTML = row.repeat(3);
      measureTopbar();
    }

    function renderSearchResults(items) {
      const box = document.getElementById('gameSearchResults');
      const label = document.getElementById('steamLabel');
      const extra = document.getElementById('searchExtra');
      steamItems = items || [];

      // **库里已经答完的时候,Steam 那份收成一行。**
      //
      // 展开十行是 ~370px,而这一块住在冻结区里 —— 每次筛自己的库都被顶掉十行表格,
      // 换来的是一份用户多半没在找的补充结果。所以:库里没有 ⇒ 结果就是答案,摊开;
      // 库里有 ⇒ 折成一行,点开才展开。**那一行的作用是让「还能加」看得见** ——
      // 上一版把这条路整个藏起来了,而藏起来的路和不存在的路没有区别
      if (steamItems.length && libHit && !steamExpanded) {
        extra.hidden = false;
        label.hidden = true;
        box.style.display = 'flex';
        box.innerHTML = '<button type="button" class="steam-more" id="steamMore">'
          + 'Steam 商店 · ' + steamItems.length + ' 个</button>';
        document.getElementById('steamMore').addEventListener('click', function() {
          steamExpanded = true;
          renderSearchResults(steamItems);
        });
        measureTopbar();
        return;
      }

      label.hidden = !steamItems.length;
      if (!items || items.length === 0) {
        box.style.display = 'none';
        box.innerHTML = '';
        // 收起来之后冻结区变矮了,表头要跟着上来 —— 这里主动量一次,不等 observer:
        // 这一条是**唯一一处冻结区高度会在会话中途变化**的地方,而它是我们自己改的,
        // 自己知道就自己报,比押在一条只在页面真的渲染时才有回调的通道上稳
        measureTopbar();
        return;
      }
      box.style.display = 'flex';
      // **button 而不是 div。** 原来是挂了 click 的 div:鼠标能用,键盘完全够不着 ——
      // tab 走不到、回车没反应,而这是「添加一个游戏」唯一的入口。
      // type="button" 是必须的:默认 type 是 submit,将来这块要是进了 form 就会提交页面
      box.innerHTML = items.map(function(g) {
        return '<button type="button" class="game-search-result" data-appid="' + g.appid + '" data-name="' + escapeHtml(g.name) + '">'
          + '<img src="' + thumbUrl(g.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'" alt="">'
          + '<span>' + escapeHtml(g.name) + ' <span class="appid-hint">(' + g.appid + ')</span></span>'
          + '</button>';
      }).join('');

      box.querySelectorAll('.game-search-result').forEach(function(el) {
        el.addEventListener('click', function() {
          // 选中后弹窗确认,不直接添加
          const appid = el.dataset.appid;
          const name = el.dataset.name;
          document.getElementById('confirmGameName').textContent = name;
          document.getElementById('addConfirmModal').dataset.appid = appid;
          document.getElementById('addConfirmModal').dataset.name = name;
          document.getElementById('addConfirmModal').classList.add('show');
        });
      });
      // 下拉展开之后冻结区高了一截,表头要让开(理由同上面那次)
      measureTopbar();
    }

    /**
     * 库里一个都没匹配上的时候,去 Steam 上找。
     *
     * **只有这一种情况才发这个请求。** 本地筛选是免费的、瞬时的,而这是个有限流的
     * 网络调用,而绝大多数搜索是在找自己已经有的游戏。因为搜索会绕开所有勾选框
     * (见 hidingFilter),「本地 0 条」是拿整个库判出来的,这个开关才站得住脚 ——
     * 要是还按筛选后的结果判,一半以上的搜索都会跑到这里来。
     */
    function runGameSearch(query) {
      // 在忙 = 画几条占位行,不是写一句话。见 .game-search-result.skeleton。
      // **库里已经有结果时不画** —— 那种情况下表格已经答完了,再为一个用户没要的
      // 补充结果闪三条占位行,是拿噪音换一个多半用不上的东西
      if (!libHit) renderSkeleton();
      rpc.withSuccessHandler(function(items) {
        // 请求回来时用户可能已经接着打字了。**用当时那个词对一下**,不然慢的那个响应
        // 会盖掉快的那个,列表和输入框对不上(经典的竞态,这里debounce 挡不住)
        if (document.getElementById('searchBox').value.trim() !== query) return;
        if (!items || items.length === 0) {
          // 库里也没有、Steam 也没有 —— 真正的死胡同,这一种才需要用词。
          // 库里有的话就什么都不说:用户要找的东西表格里已经给了
          if (!libHit) setAddMsg('没有找到「' + query + '」');
          renderSearchResults([]);
          return;
        }
        // **成功不写字。** 结果自己就是「搜到了」这句话:十行带封面的游戏一出来,
        // 不会有人还需要一句「下面是 Steam 上的结果」来确认
        setAddMsg('');
        renderSearchResults(items);
      }).withFailureHandler(function(err) {
        if (document.getElementById('searchBox').value.trim() !== query) return;
        // **别把本地的故障说成 Steam 的故障。** `Failed to fetch` 是这条 fetch 根本
        // 没发出去 —— 后台服务没在跑 / 端口被占 / 刚被关掉,和 Steam 一点关系没有。
        // 照直写「搜索 Steam 失败」会把人指去查网络和 Steam,而要修的是本地那个服务
        // (实测撞到过:开着页面的时候服务进程停了,提示说的是 Steam 挂了)
        const local = /Failed to fetch|NetworkError|load failed/i.test(String(err.message));
        setAddMsg(local ? '连不上后台服务,刷新一下页面' : '搜索 Steam 失败:' + err.message, 'error');
        renderSearchResults([]);
      }).searchSteamGames(query);
    }

    /**
     * 输入框每次变化都走这里。**两段速度不一样,故意的:**
     *
     * - 本地筛选**立刻**跑(render 已经在别处绑了,零成本、零延迟)
     * - Steam 那一段等 300ms 停下来再说,而且只在库里一条都没匹配上时才发
     *
     * 「加载提示要配得上等待时间,近乎瞬时的操作不要闪一下」—— 所以本地那段没有任何
     * 转圈,而「正在 Steam 上找…」只可能在 debounce 之后出现,不会为一次本地就能
     * 解决的搜索闪一下。
     */
    let searchTimeout = null;
    /**
     * 库里这个词有没有匹配到东西。**只影响怎么显示,不影响要不要搜** —— 见 onSearchInput。
     * steamExpanded:折起来那一行被点开了没有,换个搜索词就复位。
     * steamItems:已经拿回来的结果,展开时直接重画,不再发一次请求。
     */
    let libHit = false;
    let steamExpanded = false;
    let steamItems = [];
    function onSearchInput() {
      const query = document.getElementById('searchBox').value.trim();
      const extra = document.getElementById('searchExtra');
      clearTimeout(searchTimeout);

      // 开始搜下一个词,上一条「已添加…点这里查看」就该退场 —— 那个按钮指着的是
      // 上一款游戏,留在旁边只会让人点错
      renderSearchResults([]);
      setAddMsg('');

      steamExpanded = false;  // 换了个词,上一次展开的状态不该跟过来
      if (!query) {
        extra.hidden = true;
        measureTopbar();
        return;
      }
      // **库里有没有,只决定怎么显示,不再决定要不要搜。**
      //
      // 原来是「库里有就不去 Steam 找了」,而那条规则把两件事混成了一件:
      // 「找到了东西」不等于「找到了你要的那个东西」。想加 Silksong 的人打了 silk,
      // 库里刚好有个 Silkroad —— 添加这条路就凭空消失了,而且**看不出它消失了**。
      libHit = allGames.some(function(g) { return g.name.toLowerCase().indexOf(query.toLowerCase()) !== -1; });
      // 库里没有 ⇒ Steam 那边就是答案,先把位置腾出来画占位行;
      // 库里有  ⇒ 先安静着,等结果回来再决定露不露面(多半只露一行)
      extra.hidden = libHit;
      measureTopbar();
      searchTimeout = setTimeout(function() { runGameSearch(query); }, 300);
    }

    document.getElementById('confirmAddBtn').addEventListener('click', function() {
      const modal = document.getElementById('addConfirmModal');
      const appid = modal.dataset.appid;
      const name = modal.dataset.name;
      if (!appid) return;
      const family = document.getElementById('confirmFamily').checked;
      modal.classList.remove('show');
      renderSearchResults([]);
      // **搜索框不清空。** 它现在也是筛选框:清掉的话表格会瞬间跳回全库,
      // 而刚加进来的那一行就淹在三百行里了 —— 留着搜索词,新游戏正好就在表里
      // （它必然匹配这个词,不然搜不出来）,下面那句「已添加…点这里查看」也才对得上
      // 复位成默认勾选:这个框会被复用,上一次取消勾选不该留给下一款游戏
      document.getElementById('confirmFamily').checked = true;
      addSelectedGame(appid, name, family);
    });

    document.getElementById('cancelAddBtn').addEventListener('click', function() {
      document.getElementById('addConfirmModal').classList.remove('show');
    });

    /**
     * 页面内的确认框,回一个 Promise<boolean>。**所有确认都走这里,不要再用 window.confirm。**
     *
     * 原因是打包版:Electron 里原生 confirm 弹出后会立刻消失,用户点不到确定,
     * 而同一份页面在浏览器里完全正常 —— 于是"从 Dashboard 生成攻略"这条路在打包版上
     * 是断的,还断得毫无提示。原生对话框的生命周期归主进程管,页面夺不回来;
     * 页面内的框没有这个问题,而且浏览器和打包版行为完全一致。
     *
     * `notifyOnly` 时只有一个按钮,用来替掉 `alert()` —— 原生 alert 在打包版里
     * 和原生 confirm 是同一个毛病,只是后果轻些(错误提示看不见,而不是动作做不了)
     *
     * @param {{title: string, body: string, okText?: string, danger?: boolean, notifyOnly?: boolean}} o
     */
    function askConfirm(o) {
      return new Promise(function (resolve) {
        const modal = document.getElementById('askModal');
        const okBtn = document.getElementById('askOkBtn');
        const cancelBtn = document.getElementById('askCancelBtn');
        document.getElementById('askTitle').textContent = o.title;
        // 正文由下面的 paintBody() 写(它还要处理"跟着选择变"的那种)。
        // 没有正文就整个收起来,不然留一块带 margin 的空白,框看着是坏的
        const bodyEl = document.getElementById('askBody');
        okBtn.textContent = o.okText || '确认';

        // **返回值还是布尔。** 选择写回调用方自己传进来的 `o.choices[i].value`,
        // 所以 askConfirm 的契约没变 —— 它有六处调用点,为了多几个可选控件去改
        // 返回类型,等于让四个不相干的地方跟着动。
        //
        // 从单个 `choice` 改成 `choices` 数组,是因为重写那个框要问**两件事**
        // (改哪些、查多深)。留一个 `choice` 再加一个 `choice2` 会是同一个问题的
        // 第二套机制 —— 这个项目里那种形状每次都会漂
        const choicesWrap = document.getElementById('askChoices');
        choicesWrap.innerHTML = '';
        const groups = o.choices || [];

        /** 正文可以是一句话,也可以是一个"跟着选择变"的函数 —— 数字要当场对得上 */
        function paintBody() {
          const text = typeof o.body === 'function'
            ? o.body(groups.reduce(function (acc, g) { acc[g.key] = g.value; return acc; }, {}))
            : (o.body || '');
          bodyEl.textContent = text;
          bodyEl.style.display = text ? '' : 'none';
        }

        groups.forEach(function (g) {
          const row = document.createElement('div');
          row.className = 'ask-choice';
          const label = document.createElement('span');
          label.textContent = g.label;
          const group = document.createElement('div');
          group.className = 'view-toggle';
          group.setAttribute('role', 'group');
          group.setAttribute('aria-label', g.label);

          g.options.forEach(function (opt) {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = opt.label;
            // 比较式直接写在调用点上:html-smoke 要求 toggle 的第二个参数一眼看得出
            // 是布尔(局部变量名看不出来,而 undefined 会让它翻转而不是关闭)
            b.classList.toggle('on', opt.value === g.value);
            // 选中态要**说出来**,不能只靠底色 —— 只用 class 的话读屏用户读不到
            // 这一组里哪个是选中的(ui-ux-pro-max 把这条列为 Critical)
            b.setAttribute('aria-pressed', String(opt.value === g.value));
            // 选不了的要**能说出为什么**:一个灰按钮上写着「稀有 0」和一个因为
            // Steam 没答话而算不出来的灰按钮,长得一样、含义相反
            if (opt.disabled) {
              b.disabled = true;
              if (opt.title) b.title = opt.title;
            }
            b.addEventListener('click', function () {
              g.value = opt.value;
              [...group.children].forEach(function (c) {
                c.classList.toggle('on', c === b);
                c.setAttribute('aria-pressed', String(c === b));
              });
              // 选完立刻重画正文和依赖它的控件 —— 「只改 5 条」这种数字必须和
              // 当前选中的那个范围对得上,慢一步就是在骗人
              paintBody();
              syncInput();
            });
            group.appendChild(b);
          });

          row.appendChild(label);
          row.appendChild(group);
          choicesWrap.appendChild(row);
        });

        // 一句话输入。`o.input.when` 决定它在哪些选择下才出现 —— 渐进披露:
        // 「怎么改」只对局部重写有意义,整篇重写时摆在那儿是一个不会被读的输入框
        const inputWrap = document.getElementById('askInputWrap');
        const inputEl = document.getElementById('askInput');
        function syncInput() {
          if (!o.input) { inputWrap.hidden = true; return; }
          const state = groups.reduce(function (acc, g) { acc[g.key] = g.value; return acc; }, {});
          inputWrap.hidden = typeof o.input.when === 'function' ? !o.input.when(state) : false;
        }
        if (o.input) {
          document.getElementById('askInputLabel').textContent = o.input.label;
          inputEl.placeholder = o.input.placeholder || '';
          inputEl.value = o.input.value || '';
          inputEl.oninput = function () { o.input.value = inputEl.value; };
        } else {
          inputEl.oninput = null;
        }
        syncInput();
        paintBody();
        okBtn.style.background = o.danger ? '#a33' : '';
        cancelBtn.style.display = o.notifyOnly ? 'none' : '';

        function close(answer) {
          modal.classList.remove('show');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          modal.removeEventListener('click', onOutside);
          document.removeEventListener('keydown', onKey);
          resolve(answer);
        }
        function onOk() { close(true); }
        function onCancel() { close(false); }
        // 点框外和按 Esc 都算取消 —— 和原生 confirm 的习惯一致,别让人找不到出口
        function onOutside(e) { if (e.target === modal) close(false); }
        function onKey(e) {
          if (e.key === 'Escape') close(false);
          else if (e.key === 'Enter') {
            // **中文输入法按 Enter 是在上屏候选词,不是在确认。** 这个框现在有一个
            // 一句话输入,而这是个中文界面 —— 不挡的话,打「把互斥关系写清楚」的
            // 过程中每选一次词就会当场把这次(要花钱、且不可逆)的操作确认掉。
            //
            // 两道都要:`isComposing` 管输入法组词中的那次 Enter,而组词结束后
            // 焦点还在输入框里的 Enter 也不该算确认 —— 那时人还在写,不是在决定
            if (e.isComposing || e.keyCode === 229) return;
            if (e.target === document.getElementById('askInput')) return;
            close(true);
          }
        }

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        modal.addEventListener('click', onOutside);
        document.addEventListener('keydown', onKey);
        modal.classList.add('show');
        okBtn.focus();
      });
    }

    // Click outside modal to dismiss
    document.getElementById('addConfirmModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('show');
    });

    function loadDashboard() {
      rpc.withSuccessHandler(function(data) {
        allGames = data.games;
        // cardTotal 由 render() 独占 —— 它才知道筛选结果
        document.getElementById('cardAvg').textContent = data.avgRounded || '-';
        document.getElementById('cardPerfect').textContent = data.perfectCount;
        document.getElementById('lastUpdated').textContent = '上次同步: ' + data.lastUpdated;
        renderBell();
        render();
      }).withFailureHandler(function(err) {
        document.getElementById('gameTableBody').innerHTML =
          '<tr><td colspan="4" class="empty">读取数据失败: ' + err.message + '</td></tr>';
      }).getDashboardData();
    }

    loadDashboard();

    // ---- 「立即同步」按钮 ----------------------------------------------------
    // 这个按钮只负责"发起"。进度提示条、跑完后的就地刷新、新增成就提示,全都已经在
    // lib/rpc.js 里为启动时的自动同步实现过了,手动同步复用同一套,这里不重复造。
    const syncBtn = document.getElementById('syncNowBtn');
    const syncMsg = document.getElementById('syncMsg');
    // 点下去到第一次轮询确认 running 之间有最多 3 秒空窗,期间轮询可能还带着旧的
    // running:false 回来,会把按钮闪回可点。这个标记就是盖住那段空窗的。
    let syncStarting = false;

    syncBtn.addEventListener('click', function() {
      syncStarting = true;
      syncBtn.disabled = true;
      syncMsg.className = 'sync-msg';
      syncMsg.textContent = '正在启动...';

      rpc.withSuccessHandler(function(res) {
        if (res && res.error) {
          syncStarting = false;
          syncBtn.disabled = false;
          syncMsg.className = 'sync-msg error';
          syncMsg.textContent = res.error;
          return;
        }
        syncMsg.textContent = '';
      }).withFailureHandler(function(err) {
        syncStarting = false;
        syncBtn.disabled = false;
        syncMsg.className = 'sync-msg error';
        syncMsg.textContent = '启动同步失败: ' + err.message;
      }).startSync();
    });

    // lib/rpc.js 每 3 秒回调一次后台同步状态。按钮跟着后端的真实状态走,而不是自己记——
    // 这样 CLI 或另一个标签页发起的同步同样会把按钮按下去,同步失败时也能解禁
    // (失败那条路径故意不触发 reloadDashboard,只靠 loadDashboard 的话按钮就卡死了)。
    let wasSyncRunning = false;
    window.onSyncState = function(s) {
      if (s.running) syncStarting = false;
      syncBtn.disabled = s.running || syncStarting;
      // 按钮现在是个图标,**不能写 textContent** —— 那会把 🔄 换成文字,
      // 而且连带删掉里面那个 .icon-glyph。
      // 进行中的提示挂在顶栏底边那条线上(见 .topbar.syncing),不在按钮上:
      // 按钮本身只靠 disabled 变淡,title 给悬停时读
      // **Boolean() 不能省。** classList.toggle 的第二个参数是 undefined 时会**翻转**,
      // 不是关闭 —— 状态对象一旦缺了 running(轮询拿到异常响应就会这样),这条线
      // 会每 3 秒亮灭一次,永远停不下来。写死成布尔,最坏情况是"不亮",不是"乱闪"
      document.querySelector('.topbar').classList.toggle('syncing', Boolean(s.running));
      // 图标自己也转一圈。**这在 emoji 时代做不到** —— 🔄 在 Windows 上是「蓝底方块 +
      // 白箭头」的一整个字形,转它转的是那块底板,看着很蠢;换成内联 SVG 之后转的
      // 就是箭头本身。顶栏底边那条扫线仍然留着:那条是给余光的(滚到哪儿都看得见),
      // 按钮上这个是给「我刚点了它,它动了吗」的确认。同样要 Boolean(),理由同上
      syncBtn.classList.toggle('spinning', Boolean(s.running));
      syncBtn.title = s.running
        ? '正在同步…'
        : '立刻向 Steam 拉一次最新数据。刷新页面只会重读本地数据库,不会联网。';

      // 只清掉"正在启动..."这类过程提示。错误必须留着:轮询每 3 秒来一次,
      // 无条件清空会把刚显示出来的报错冲掉,而那是点击唯一的反馈。
      // (真会撞上的场景:CLI 或另一个标签页刚发起同步,按钮这边还没轮询到就被点了)
      if (s.running && !syncMsg.classList.contains('error')) syncMsg.textContent = '';

      // 反过来,同步一跑完,"同步已经在跑了"这条就过期了——留着就是在报假警。
      if (wasSyncRunning && !s.running) {
        syncMsg.className = 'sync-msg';
        syncMsg.textContent = '';
      }
      wasSyncRunning = s.running;
    };

    // ---------------------------------------------------------------
    // AI 生成攻略
    // ---------------------------------------------------------------
    // 这是页面上**唯一一个会花钱的按钮**,所以点下去之前必须先问一次,而且要把
    // "会发生什么、机器验不了什么"说清楚 —— 用户看不到 CLI 那些提示。
    const genBar = document.getElementById('gen-bar');
    const genMsg = document.getElementById('gen-msg');

    /**
     * **收起不等于关掉,而且任务还在跑的时候只能收起。**
     *
     * 这块原来只有一个 `genDismissed`:按下那个按钮就把它置真,`showGen` 直接
     * return。按钮的 title 写着「收起」,行为却是永久丢弃 —— 一次生成要 2–4 分钟,
     * 按下去之后这一次的进度**再也拿不回来**,唯一的复原办法是再发起一次生成
     * (那三个入口是仅有的会把标志清掉的地方)。标签说的和做的是两件事。
     *
     * 现在按状态分开:
     *   跑着  → 只给「收起」。剩一行,点一下整条回来。看不见进度这件事不该发生
     *   跑完  → 给「关闭」。结果已经读过了,让它一直占着屏幕才是打扰
     *
     * 轮询每 3 秒调一次 showGen,收起状态由 class 表达而不是靠拦住 showGen ——
     * 拦住它就等于让进度停在按下那一刻,展开回来看到的是旧消息
     */
    let genCollapsed = false;
    let genLive = false;

    function syncGenChrome() {
      // **Boolean() 不能省**,理由和同步按钮那两处一样:classList.toggle 的第二个
      // 参数是 undefined 时会**翻转**而不是关闭。这里更阴 —— 轮询每 3 秒来一次,
      // 一旦某次拿到的状态缺字段,进度条就会每 3 秒收起、展开、收起
      genBar.classList.toggle('collapsed', Boolean(genCollapsed));
      genBar.classList.toggle('live', Boolean(genLive));
    }

    document.getElementById('genToggle').addEventListener('click', function (e) {
      e.stopPropagation();
      genCollapsed = !genCollapsed;
      syncGenChrome();
    });
    document.getElementById('genClose').addEventListener('click', function (e) {
      e.stopPropagation();
      genBar.style.display = 'none';
    });
    // 收起之后整条都是"点我展开"。**只在收起时生效** —— 展开状态下这里面有链接
    // (打开攻略),整条可点会把点链接也吞成一次折叠
    genBar.addEventListener('click', function () {
      if (!genCollapsed) return;
      genCollapsed = false;
      syncGenChrome();
    });

    let aiReady = false;
    let notionReady = false;

    (async function loadAiState() {
      const s = await new Promise((resolve) => {
        rpc.withSuccessHandler(resolve).withFailureHandler(() => resolve({})).getSettings();
      });
      aiReady = Boolean(s && s.hasAiKey);
      // 搬去 Notion 要两样都有:token(能写)和数据库 ID(知道写去哪)
      notionReady = Boolean(s && s.hasNotionToken && s.notionDbId);

      // **只重绘,不重取。** `aiReady` / `notionReady` 只影响怎么画,不影响画什么,
      // 而 `allGames` 这时已经在内存里了 —— 以前这里调的是 `loadDashboard()`,
      // 为了翻一个布尔值把整个 dashboard 重新拉一遍。
      //
      // 那让一个竞态变得看得见:`aiReady` 初值是 false,页面加载时那次
      // `loadDashboard()`(下面那行)就已经在跑了,所以按钮在不在,取决于
      // `getSettings`(内存里读个对象)和 `getDashboardData`(读整个库)谁先回来。
      // 平时前者稳赢。但**第一次设置完的那一下服务器正忙** —— startupJobs 的
      // 全量同步、攻略发现、勾选都在跑,Node 又是单线程,顺序会翻:先画出一张
      // 没有按钮的表,然后要等第二次完整拉取排到队才补上。真实用户报过这个,
      // 现象是"刚连完 Notion 打开没有生成按钮,刷新一下就有了"。
      //
      // 两种到达顺序都对:`allGames` 还空着说明那次 loadDashboard 还在路上,
      // 它落地时读到的 aiReady 已经是 true 了,不需要这里补一刀。
      if ((aiReady || notionReady) && allGames.length) render();
    })();

    /**
     * 本地攻略 → Notion。**先预览再问**:转换可能把表格、折叠块降级成普通段落,
     * 不把这件事摆在确认框里,用户就是在不知道会损失什么的情况下点的"确定"。
     */
    /**
     * 重写已有攻略。**先预检再问**,和 `guide-to-notion` 的流程一样,理由也一样:
     * 不知道会失去什么的"确认"不算确认。
     *
     * 覆盖唯一真正丢掉的东西是**手动勾上的子步骤框** —— 成就框会被机械打勾按数据库
     * 勾回原样,子步骤框匹配不到任何成就。这句话由服务端的 formatPreflight 生成,
     * 和 CLI 那边是同一份措辞。
     */
    window.rewriteGuide = async function (btn) {
      const appid = btn.getAttribute('data-rewrite');
      const name = btn.getAttribute('data-name') || appid;
      genCollapsed = false;
      btn.disabled = true;
      showGen('⏳ 检查《' + name + '》…', false, true);

      // **两次预检一起拿。** 「整篇会失去什么」和「每个范围各改几条」是同一个决定
      // 的两半,分两次往返的话,那一排范围按钮会比对话框晚出来 —— 一个先画出来
      // 再自己长出五个按钮的框,看着像是刚才点漏了
      const [p, sc] = await Promise.all([
        new Promise((resolve) => {
          rpc.withSuccessHandler(resolve)
            .withFailureHandler((err) => resolve({ error: String(err && err.message || err) }))
            .previewGuideRewrite(appid);
        }),
        new Promise((resolve) => {
          rpc.withSuccessHandler(resolve)
            .withFailureHandler((err) => resolve({ error: String(err && err.message || err) }))
            .previewGuidePatch(appid);
        }),
      ]);
      if (!p || p.error) {
        btn.disabled = false;
        return showGen(GEN_WARN + ' ' + ((p && p.error) || '预检失败'), true, false);
      }

      /**
       * 范围那一排。**按钮上就带着条数,所以不需要一句解释它的话** ——
       * 「稀有 5」自己说完了自己是什么。这一格是这个框里的主要决定。
       *
       * 条数为 0 的范围**留在原位但点不动**,不隐藏:隐藏之后「这游戏没有稀有成就」
       * 和「没有这个功能」在界面上是同一件事,而它们不是。算不出来的(比如 Steam
       * 没给解锁率)也一样灰,但 title 里写的是原因 —— 那两种灰的含义正相反。
       */
      const presets = (sc && !sc.error && sc.presets) ? sc.presets : [];
      const byKey = presets.reduce(function (m, x) { m[x.key] = x; return m; }, {});
      const scopeChoice = {
        key: 'scope',
        label: '范围',
        value: 'all',
        options: [{ value: 'all', label: '整篇' }].concat(presets.map(function (x) {
          return {
            value: x.key,
            // **算不出来的写「—」,不写 0。** 两个都是灰按钮,但含义相反:0 是
            // 「这游戏没有稀有成就」,— 是「Steam 这次没给解锁率」。写成 0 就是在
            // 陈述一个我们并没有查出来的事实,而且它劝人别再试 —— 恰恰反了
            label: x.label + ' ' + (x.unavailable ? '—' : x.count),
            disabled: x.unavailable || x.count === 0,
            // 0 那种不给 title:标签上那个 0 已经把话说完了。— 那种必须给,
            // 否则用户看到的是一个没有任何解释的灰按钮
            title: x.unavailable ? x.reason : '',
          };
        })),
      };
      const rewriteChoice = effortChoice();
      // 一句要求。只在选了局部范围时露出来 —— 整篇重写用不到它,摆在那儿是一个
      // 不会被读的输入框
      const noteInput = {
        // **标签是一个能回答的问句,不是一个抽象名词。** 原来写的是「要求」,而那
        // 三个字要人先猜出这一栏想要什么 —— 一个需要先被理解的输入框等于没有标签。
        // 「怎么改」的任何回答都是合法输入
        label: '怎么改',
        // placeholder 要答的其实是**留空会怎样**:那才是「我该填什么」背后的问题。
        // 先说留空的后果,再给一个能照抄的例子
        placeholder: '留空 = 重新查着写。也可以:写详细点、标出易错过',
        value: '',
        when: function (s) { return s.scope !== 'all'; },
      };

      const ok = await askConfirm({
        title: '重写《' + name + '》的攻略?',
        // **正文跟着范围变。** 整篇讲「你会失去什么」,局部讲「什么会留下」——
        // 这两句话不是同一句话的两种说法,而这个框要能同时是两个框
        body: function (s) {
          if (s.scope === 'all') {
            return [
              '现有 ' + p.boxes + ' 个 checkbox 会被整份替换,原文先备份。',
              p.atRisk ? p.atRisk + ' 个手动勾的子步骤会变回未勾选。' : null,
              // 这里原来还有一句「约 2–4 分钟」。**删掉了**:同样的输入实测跑三次是
              // 76/174/337 秒,给区间就是在承诺一个我们给不出的东西;而且推理强度现在
              // 可调,低档快八倍,那句话会当场变成错的。时长看进度条 —— 隔壁那个生成框
              // 早就是这么决定的,这里跟上
            ].filter(Boolean).join('\n');
          }
          const x = byKey[s.scope];
          if (!x) return '';
          return [
            '只改 ' + x.count + ' 条,其余 ' + x.keeping + ' 个 checkbox 一字不动。原文先备份。',
            x.atRisk ? x.atRisk + ' 个手动勾的子步骤会变回未勾选。' : null,
            // 这一行是选局部而不是整篇唯一确凿、可量化的好处,别省
            x.savedTicks ? '另外 ' + x.savedTicks + ' 个手动勾选保住了。' : null,
            x.unlocatable ? x.unlocatable + ' 条攻略里没写过,这次改不到。' : null,
          ].filter(Boolean).join('\n');
        },
        okText: '重写',
        danger: true,
        choices: [scopeChoice, rewriteChoice],
        input: noteInput,
      });
      if (!ok) {
        btn.disabled = false;
        genBar.style.display = 'none';
        return;
      }

      // 整篇走 overwrite,局部走 scope。**两个不同时传** —— 服务端按 scope 是否为空
      // 分流,同时给会让"到底跑了哪条"取决于服务端的判断顺序
      const scope = scopeChoice.value === 'all'
        ? null
        : { selector: scopeChoice.value, note: noteInput.value.trim() || null };

      rpc
        .withSuccessHandler(function (r) {
          if (r && r.error) {
            btn.disabled = false;
            return showGen(GEN_WARN + ' ' + r.error, true, false);
          }
          showGen('⏳ 重写《' + name + '》…', false, true);
          pollGen();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showGen(GEN_WARN + ' ' + err, true, false);
        })
        .startGuideGen(appid, true, rewriteChoice.value, scope);
    };

    /**
     * 生成/重写共用的那一格。**默认 high**,而这个默认是量出来的不是拍的:
     * 同一款游戏同一套提示词,low 那份 16 条里有 9 条是「第 III 章全体查证正确即解锁」
     * 这种套模板的句子,high 一条都没有。省下来的八倍时间买的是那批中等难度成就的内容。
     *
     * 三档在效果上**不是等距的** —— 实测 high 和 medium 分不开(都是 0 条模板句,
     * 时间差埋在噪声里),断崖在 medium 和 low 之间。所以用三个离散按钮而不是滑块:
     * 滑块的形状本身在暗示均匀,而这里不均匀。
     */
    function effortChoice() {
      return {
        // 组名。askConfirm 把每组的当前值按 key 收成一个对象交给正文函数,
        // 于是「选了什么范围」和「选了多深」在那句话里都取得到
        key: 'effort',
        label: '推理强度',
        options: [
          { value: 'low', label: '低' },
          { value: 'medium', label: '中' },
          { value: 'high', label: '高' },
        ],
        value: 'high',
      };
    }

    window.migrateGuide = function (btn) {
      const appid = btn.getAttribute('data-migrate');
      const name = btn.getAttribute('data-name') || appid;
      genCollapsed = false; // 自己点的搬运,进度条要露出来
      btn.disabled = true;
      showGen('⏳ 检查《' + name + '》…', false, true);
      rpc
        .withSuccessHandler(async function (p) {
          if (!p || p.error) {
            btn.disabled = false;
            return showGen(GEN_WARN + ' ' + ((p && p.error) || '预览失败'), true, false);
          }
          // 逐条核对、对不上就不动本地文件、页面带图标 —— 都是"我们怎么保证不出事",
          // 不是他要决定的事。真正要他知道的只有两件:搬什么、原文去哪
          const lines = [
            p.todos + ' 个 checkbox 原样搬过去(含勾选状态)。',
            '本地文件挪进 guides/.migrated/,不会删。',
          ];
          if (p.unconverted && p.unconverted.length) {
            lines.push(GEN_WARN + ' ' + p.unconverted.length + ' 行排版会降级成普通段落,文字不丢。');
          }
          const goMigrate = await askConfirm({
            title: '把《' + p.game + '》的攻略搬到 Notion?',
            body: lines.join('\n'),
            okText: '搬过去',
          });
          if (!goMigrate) {
            btn.disabled = false;
            genBar.style.display = 'none';
            return;
          }
          showGen('⏳ 搬运《' + p.game + '》…', false, true);
          rpc
            .withSuccessHandler(function (r) {
              if (!r || r.error) {
                btn.disabled = false;
                return showGen(GEN_WARN + ' ' + ((r && r.error) || '搬运失败'), true, false);
              }
              showGen(
                GEN_OK + ' 《' + r.game + '》 ' + r.count + ' 个 checkbox 已搬到 Notion' +
                  '<br><a href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">打开 Notion 页面</a>' +
                  (r.archivedTo ? '<br><span class="warn">本地文件在 guides/.migrated/</span>' : ''),
                false, false
              );
              loadDashboard();
            })
            .withFailureHandler(function (err) {
              btn.disabled = false;
              showGen(GEN_WARN + ' ' + err, true, false);
            })
            .migrateGuideToNotion(appid);
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showGen(GEN_WARN + ' ' + err, true, false);
        })
        .previewGuideToNotion(appid);
    };

    // **按钮直接调这个,不走事件委托。** 按钮上带着 event.stopPropagation()
    // (行本身也可点,不拦住就会同时展开成就详情),而 stopPropagation 会让挂在
    // document 上的委托永远收不到这次点击 —— 表现就是"点了什么都没发生",
    // 而且控制台里一个错都没有。踩过一次
    window.genGuide = async function (btn) {
      const appid = btn.getAttribute('data-gen');
      const name = btn.getAttribute('data-name') || appid;
      // **只问,不解释。** 生成是可逆的(不满意删掉页面就行),没有"信错了会损失什么"
      // 要提醒 —— 时长看进度条就知道,而"内容未经验证"这条本来就该在攻略真的写出来、
      // 他要去读的时候说,所以留在结果那一行,不放在这里。
      // 带损失的那几个框(重写、删除)不适用这条,它们的正文是必须的
      const choice = effortChoice();
      const ok = await askConfirm({ title: '为《' + name + '》生成攻略?', okText: '生成', choices: [choice] });
      if (!ok) return;
      genCollapsed = false; // 自己点的生成,进度条要露出来
      btn.disabled = true;
      rpc
        .withSuccessHandler(function (r) {
          if (r && r.error) {
            btn.disabled = false;
            showGen(GEN_WARN + ' ' + r.error, true, false);
            return;
          }
          // 排队和开跑要说得不一样。**这条尤其重要**:一次生成 2–4 分钟,
          // 排上队之后进度条显示的是**别人**的游戏名 —— 不明说的话,用户会以为
          // 自己那一下点丢了
          showGen(r && r.queued
            ? GEN_QUEUE + ' 《' + name + '》已排队(前面还有 ' + r.position + ' 个)'
            : '⏳ 生成《' + name + '》…', false, true);
          pollGen();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showGen(GEN_WARN + ' ' + err, true, false);
        })
        .startGuideGen(appid, false, choice.value);
    };

    /**
     * @param {string}  html
     * @param {boolean} [dim]  暗色(警告/失败)
     * @param {boolean} [live] 这条说的是"还在跑"吗。**跑完的那一条要显式传 false**,
     *                         否则关不掉:关闭按钮只在非 live 时才露出来
     */
    function showGen(html, dim, live) {
      genBar.style.display = 'block';
      if (live !== undefined) {
        // 从"在跑"变成"跑完了"就自动展开一次。收起的理由是那一长串进度太占地方,
        // 而结果只有一行 —— 而且它带着攻略落在哪儿,恰恰是这几分钟等的东西
        if (genLive && !live) genCollapsed = false;
        genLive = live;
      }
      // 写进内层 span,不要覆盖 genBar 本身 —— 两个按钮是它的兄弟节点,
      // 覆盖 innerHTML 会把按钮一起冲掉
      genMsg.innerHTML = dim ? '<span class="warn">' + html + '</span>' : html;
      // 「打开文件夹」是每次重写内容之后新长出来的节点,所以在这里统一挂 ——
      // 事件委托挂不上:整条 #gen-bar 在收起状态下自己就是个"点一下展开"的按钮,
      // 冒泡上去会顺手把浮窗折起来
      genMsg.querySelectorAll('[data-reveal]').forEach(function(b) {
        b.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = b.getAttribute('data-reveal');
          b.disabled = true;
          rpc.withSuccessHandler(function(res) {
            b.disabled = false;
            // 打不开就把原因说出来,别做成一个点了没反应的按钮
            if (res && res.error) b.textContent = res.error;
          }).withFailureHandler(function(err) {
            b.disabled = false;
            b.textContent = '打不开:' + err.message;
          }).revealGuideFile(appid);
        });
      });
      syncGenChrome();
    }

    // 只在有任务在跑的时候轮询 —— 平时不给这个本地服务加一份常驻请求。
    // 页面加载时也查一次:另一个标签页(或上一次刷新前)发起的生成还在跑的话,这里要接上
    let genTimer = null;
    function pollGen() {
      if (genTimer) return;
      genTimer = setInterval(fetchGen, 3000);
      fetchGen();
    }

    function fetchGen() {
      rpc
        .withSuccessHandler(function (s) {
          if (!s) return;
          const waiting = (s.queue && s.queue.length)
            ? ' · 还有 ' + s.queue.length + ' 个排队'
            : '';
          // **队列没空也算"还在跑"。** 这个值决定右上角给的是「收起」还是「关闭」,
          // 而排队中把进度条关掉,后面那几个的进度就再也不会露面了 —— 那正是
          // 这次要修的毛病,只是换了个入口
          const live = Boolean(s.running) || Boolean(waiting);
          // 跑到一半就已经知道出了岔子的事(某一段没写出来)。**和 note 分开显示** ——
          // note 是"现在在干什么",三秒后就被下一个事件盖掉了,而这几句要一直留着
          // 到结果出来为止,否则用户全程不知道这份攻略缺了一块
          const warns = (s.warnings || [])
            .map(function (w) { return '<br><span class="warn">' + GEN_WARN + ' ' + escapeHtml(w) + '</span>'; })
            .join('');
          if (s.running) {
            // 只有真在重写(第 2 轮起)才显示轮数 —— 一次过的时候写"第 1/3 轮"
            // 反而像出了什么事要重来三次
            const round = s.rounds && s.round > 1 ? ' 第 ' + s.round + '/' + s.rounds + ' 轮' : '';
            showGen('⏳ 《' + s.game + '》' + round + (s.note ? ' · ' + s.note : '') + waiting + warns, false, true);
            return;
          }
          // **队列没空就别停轮询。** 一个跑完到下一个真正开跑之间有一个空档
          // (服务端要先把供应商建起来),这一刻 running 是 false 而队列非空 ——
          // 按老逻辑轮询就在这里停了,后面排着的那些进度再也不会显示,
          // 进度条永远停在上一个的结果上
          if (!waiting) {
            clearInterval(genTimer);
            genTimer = null;
          }
          if (s.error) return showGen(GEN_WARN + ' 生成失败:' + s.error + waiting, true, live);
          const r = s.result;
          if (!r) { genLive = live; return (genBar.style.display = 'none'); }

          if (!r.ok) {
            // **病因写在症状前面。** 少一段的表象是几十条"缺 checkbox",而这里只放得下
            // 五条 —— 全被同一句话占满的话,真正的原因("第 3 段没拿到结果")一个字
            // 都露不出来,用户会以为模型忘了写
            const failed = (r.chunkFailures || [])
              .map(function (c) {
                return '<br><span class="warn">第 ' + c.chunk + '/' + c.of + ' 段(' + c.count +
                  ' 个成就)没写出来:' + escapeHtml(String(c.reason).split('\n')[0]) + '</span>';
              })
              .join('');
            showGen(
              GEN_WARN + ' 《' + s.game + '》校验没过,已存草稿,没写进攻略。' + failed +
                (r.blocking && r.blocking.length ? '<br>' + r.blocking.join('<br>') : ''),
              true, live
            );
            return;
          }
          // 「能搜」和「搜了」是两回事,而用户在页面上看不出来 —— 搜过就并进事实那一行,
          // 没搜才单独警告(那是真会影响内容质量的一件事)
          const searches = r.searchQueries ? r.searchQueries.length : 0;
          const noResearch = !r.researched
            ? '<br><span class="warn">' + GEN_WARN + ' 没联网,内容是模型凭已有知识写的。</span>'
            : searches === 0
              ? '<br><span class="warn">' + GEN_WARN + ' 一次都没搜,内容等同于凭记忆写的。</span>'
              : '';
          // 写去哪了要说清楚 —— 这是用户自己的笔记,不能让他到处找。
          //
          // **两个后端给的不是同一组动作。** Notion 那份点开就是排好版的页面,一个链接
          // 就够;本地那份经 /guide/ 出来是**纯文本 markdown 源码**(防 XSS,见
          // server.js),真要读还得用编辑器开文件 —— 所以本地多给一个「打开文件夹」。
          //
          // 本地这条以前是一截**不可点的绝对路径**:同一份攻略,表格行里那个「📖 攻略」
          // 按钮能点(走 /guide/<appid>),偏偏生成完这一刻不能点 —— 而那正是最想
          // 立刻点进去看一眼的时刻
          const where = r.target === 'notion'
            ? '<a href="' + escapeHtml(r.path || '') + '" target="_blank" rel="noopener">打开攻略</a>'
            : '<a href="/guide/' + encodeURIComponent(r.appid) + '" target="_blank" rel="noopener">打开攻略</a>'
              + ' · <button type="button" class="gen-link" data-reveal="' + escapeHtml(r.appid) + '">打开文件夹</button>';
          // **搜索次数和 token 移到悬停里。** 屏幕上留下的三样是:哪款游戏、覆盖了
          // 多少成就、去哪看。token 仍然报(这是唯一花钱的功能,数字必须能查到),
          // 但它是事后对账用的,不该和「成了没有」抢同一行。
          // 「内容自己过一遍」留着 —— 机器只保证格式和数据,内容对不对没有任何东西能验,
          // 这是这个功能唯一必须每次都说的话
          genBar.title = [
            searches ? searches + ' 次搜索' : '没有联网搜索',
            Math.round((r.tokens || 0) / 100) / 10 + 'k token',
          ].join(' · ');
          // 同名 + Steam 上描述是空的那几个:攻略写对了,但自动勾选**永远**认不出它们。
          // 这不拦路(所以攻略已经落地了),可是不说出来的话,用户要等到某天注意到
          // 有几个框一直没动才会发现 —— 那时候更像是同步坏了。名字列出来,才知道是哪几个
          const unsyncable = (r.unsyncable || []).length
            ? '<br><span class="warn">' + GEN_WARN + ' ' + r.unsyncable.length +
              ' 个成就同名、Steam 上描述是空的,自动勾选认不出它们,要手动勾:' +
              escapeHtml(r.unsyncable.slice(0, 4).join('、')) +
              (r.unsyncable.length > 4 ? ' 等 ' + r.unsyncable.length + ' 个' : '') + '</span>'
            : '';
          // 局部重写要说的是**另一件事**:改了几条、其余没动。说成「已生成 · 11/11
          // 个成就」的话,一次只改了 5 条的操作看起来和整篇重写一模一样,而"没动的
          // 那部分"正是他选局部的理由。旧问题也在这里报 —— 这次没碰、也没拦路,
          // 但不说出来的话下次校验看到它们会以为是这次改坏的
          const pat = r.patched;
          const preExisting = pat && pat.preExisting
            ? '<br><span class="warn">' + GEN_WARN + ' 攻略里还有 ' + pat.preExisting +
              ' 条本来就有的校验问题,这次没碰</span>'
            : '';
          const headline = pat
            ? GEN_OK + ' 《' + s.game + '》已改 ' + pat.rewrote + ' 条 · 其余没动 · ' + where
            : GEN_OK + ' 《' + s.game + '》已生成 · ' + r.covered + '/' + r.total + ' 个成就 · ' + where;
          showGen(
            headline + noResearch + unsyncable + preExisting +
              '<br><span class="warn">内容需要你自己过一遍。</span>',
            false, live
          );
          loadDashboard();  // 攻略已登记,刷新一下让「📖 攻略」链接出来
        })
        .withFailureHandler(function () {})
        .guideGenStatus();
    }

    fetchGen();  // 接上可能还在跑的任务

    // 后台同步结束后 lib/rpc.js 会调这个就地刷新数据。暴露成全局是故意的:
    // 用 location.reload() 会把搜索词、筛选勾选、排序状态全清掉,那些是用户自己设的。
    window.reloadDashboard = loadDashboard;
  </script>
</body>
</html>
