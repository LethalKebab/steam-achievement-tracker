<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- 这一页一直没有 <title>,浏览器标签上是一串 127.0.0.1:8799。
       字串和 launcher/main.js 给 BrowserWindow 设的那个**保持一致** ——
       Electron 里页面的 <title> 会盖掉窗口的初始 title,写成两个不同的名字
       会让打包版的窗口标题在页面加载完的瞬间跳一下 -->
  <title>Steam 成就追踪器</title>
  <!-- 自托管的 Noto Sans SC Variable(见 :root 的 --font-ui)。**外链而不是内嵌**:
       这是唯一一份两页共用的样式表,而设计令牌那套仍然各存一份 —— 区别在于字体
       是 101 个 @font-face、近 100KB,复制两份既无意义又是第二个会漂移的地方,
       而令牌必须内联(零依赖时代留下的规矩,html-smoke 的比对就是为它写的)。 -->
  <link rel="stylesheet" href="/fonts/noto-sans-sc.css">
  <style>
    /* ========================================================================
       设计令牌
       ------------------------------------------------------------------------
       这一段是整套界面唯一的取值来源。改颜色、改间距、改圆角都只动这里,
       下面的规则一律引用令牌,不写字面量 —— 除了两处刻意的例外,都在原地注明。

       **和 Setup.html 的 :root 必须逐字相同。** 零依赖不允许有共享样式表,
       所以两页各存一份;html-smoke.test.js 会比对它们,防止改一页忘一页。
       ======================================================================== */
    :root {
      /* ---- 表面:四级同色相阶梯 ------------------------------------------
         原来只有 --panel(#1b2838)和 --panel-alt(#2a3f5a)两级,中间跨了一大步,
         而且 **--border 和 --panel-alt 是同一个值** —— 于是画在 hover 面上的边框
         直接消失。层级不够用时只能靠borders 硬分,那正是这一页看着「格子多」的根因。
         四级之后,悬停、表头、浮层各有自己的面,分隔可以交给面差而不是线。 */
      --bg:        #10151d;   /* 页面底 */
      --surface:   #18212f;   /* 表格、卡片、输入框 */
      --surface-2: #212c3d;   /* 表头、行悬停、次级按钮 */
      --surface-3: #2a3749;   /* 菜单、浮层 */

      /* ---- 线:三级,一律半透明白 ----------------------------------------
         **必须是 alpha,不能是定值 hex。** 定值只在某一个面上是对的,换个面
         要么消失要么刺眼 —— 上面那个 border == panel-alt 的 bug 就是这么来的。
         带一点蓝是为了留在 Steam 的色系里,纯白会读成灰。

         三级各有各的活:
           1 表内行分隔 —— 167 行叠起来,再重一点整页就变方格纸
           2 控件外沿   —— 输入框、按钮、卡片
           3 区块边界   —— 顶栏底边、浮层外沿,是「这里换了一块区域」 */
      --line-1: rgba(150, 180, 216, 0.085);
      --line-2: rgba(150, 180, 216, 0.16);
      --line-3: rgba(150, 180, 216, 0.28);

      /* ---- 文字:三级 ---------------------------------------------------- */
      /* 三级都必须在**四个表面上**都过 WCAG AA(4.5:1)。这不是可选的润色:
         上一版的 --text-3 (#6d7f95) 在 --bg 上 4.46、--surface 上 3.95、
         --surface-2 上 3.43、--surface-3 上只有 2.94 —— 而它承载的不是
         「占位、禁用、时间戳」,是表头、「无成就系统」这个数据值、攻略/重写
         按钮的标签、以及 #gen-bar 的警告文字。**警告文字曾经是全页最不可读的一处。**

         取值是在 OKLCH 里算的(色相 253.6),不是手调的十六进制:
         --surface-3 (L=0.333) 上要够 4.5:1,文字的 L 至少 0.698,而 --text 在
         L=0.921 —— **三级文字总共只有 0.223 的亮度余量**。旧阶梯的步长是
         0.192 / 0.139(本来就不匀),挤进 0.223 之后只能等分:0.110 / 0.111。
         写进这里的仍是十六进制,OKLCH 只用来算,不构成任何运行时依赖。

         **只调三级、不动二级是不行的**(那是评审时的方案 A):三级被顶到 AA 下限
         之后会贴到二级身上,感知差从 0.139 掉到 0.028,两档并成一档。
         要么三级一起重排,要么就别改。 */
      --text:   #dce6f2;   /* 正文 —— 未变;它离表面最远,本来就够 */
      --text-2: #b4c3d5;   /* 次要:标签、说明、表头。原 #98a9be */
      --text-3: #8ea0b6;   /* 三级:占位、禁用、时间戳。原 #6d7f95,最低 4.51 */
      --text-hi: #ffffff;  /* 标题和强调行 */

      /* ---- 强调色:Steam 蓝,保留 ---------------------------------------- */
      --accent:     #66c0f4;
      --accent-hi:  #8ed4ff;
      --accent-ink: #08111b;                    /* 蓝底上的字 */
      --accent-soft: rgba(102, 192, 244, 0.14); /* 蓝底的淡版,用于选中态 */

      /* ---- 进度色阶 ------------------------------------------------------
         原来是 good/mid/low 三档红黄绿,读起来像红绿灯 —— 而「完成率 30%」
         并不是一个警告。改成一条**递进**的四档,并且把「打满」交给强调蓝而不是绿:
         100% 在这个工具里是成就本身,不是「安全」。 */
      --prog-low:  #d9695f;
      --prog-mid:  #e0a63f;
      --prog-high: #8cc63f;
      --prog-done: #66c0f4;
      --prog-none: #3a4759;   /* 没有数据 */

      /* ---- 语义色 -------------------------------------------------------- */
      --ok:     #8cc63f;
      --warn:   #e0a63f;
      --danger: #e0685e;

      /* ---- 字体 ----------------------------------------------------------
         **自带字体,不再靠系统兜底。** 之前是 "Segoe UI" 打头再让系统接中文,
         结果有两个,都是实测出来的:

           1. 中文到底用了哪个字体,说不准。这台机器上它既不是微软雅黑
              (墨量曲线对不上),也不是栈里明写的 Noto Sans SC —— 换台机器就是
              另一副样子,而整页的字号、字距、行高都是照着其中一副调的。
           2. **600 / 650 / 700 在中文里是同一档。** 用 canvas 量「成」字的墨量:
              300→2116、400→3120、500→3776,然后 600/650/700 全部 4517。
              而 .wordmark 是 700、h1 是 650、.ach-name/.badge 是 600 ——
              设计系统里声明了三档,中文里只渲染出一档。

         Noto Sans SC Variable 两条都解决:自己带着走,而且是 100–900 的可变轴,
         三档是真三档。按 unicode-range 切成 101 片,浏览器只取用得上的那几片。
         后面的旧字体栈留着当兜底 —— 万一 /fonts/ 没伺服起来,页面仍然可读。

         **这一条必须在两个页面里一致**,所以它是令牌;html-smoke.test.js 的
         :root 比对会盯着它,免得哪天只改了一页。 */
      --font-ui: "Noto Sans SC Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif;

      /* ---- 字号:六级 ----------------------------------------------------
         原来有 11/12/13/15/17/18/22/28 八个值,彼此没有比例关系。 */
      --fs-display: 26px;
      --fs-xl: 19px;
      --fs-lg: 15px;
      --fs-md: 13px;   /* 正文和表格 */
      --fs-sm: 12px;
      --fs-xs: 11px;

      /* ---- 间距:4px 一格 ------------------------------------------------
         原来散落着 4/6/8/9/10/11/12/14/16/20/22/24/28/34 十四个值。 */
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 24px;
      --s6: 32px;

      /* 页面内边距。**顶栏的负外边距要用它算**,见 .topbar —— 两个值必须永远相等,
         所以它们现在出自同一个令牌,而不是两处各写一个 24px */
      --page-pad: var(--s5);

      /* ---- 圆角:四级(原来有 2/3/4/5/6/8 六个) -------------------------- */
      --r-sm: 4px;
      --r-md: 7px;
      --r-lg: 12px;
      --r-full: 999px;

      /* ---- 投影:三级 ---------------------------------------------------- */
      --sh-1: 0 1px 2px rgba(0, 0, 0, 0.3);
      --sh-2: 0 8px 24px rgba(0, 0, 0, 0.45);
      --sh-3: 0 16px 48px rgba(0, 0, 0, 0.6);

      /* ---- 动效 ---------------------------------------------------------- */
      --dur-1: 120ms;
      --dur-2: 200ms;
      --ease: cubic-bezier(0.2, 0.7, 0.3, 1);

      /* 原生控件(checkbox 等)的勾选色。不设的话是操作系统的蓝,
         和这一页的蓝不是一个 —— 同一类问题的另一个化身,见下面图标那段 */
      accent-color: var(--accent);
      color-scheme: dark;
    }

    /* 顶栏的实测高度,由 JS 写进来(见脚本里的 trackTopbarHeight)。表头要吸附在
       顶栏**下面**,而顶栏会随窗口宽度换行变高,写死必然错位。
       **它不在 :root 那一块里**,因为那一块是和 Setup.html 逐字相同的设计令牌;
       这个是本页的运行时测量值,不是设计系统的一部分。下面这个默认值只在 JS
       还没跑到的那一帧用一下 */
    html { --topbar-h: 88px; }

    * { box-sizing: border-box; }

    /* **`hidden` 属性必须真的隐藏。** 浏览器自带的 `[hidden] { display: none }` 来自
       user-agent 样式表,作者样式表里**任何**一条 `display:` 都比它优先。这里中招的是
       `.gallery { display: grid }`:切回表格视图时 `renderGallery` 不会被调用(见
       `render` 里那个 early return),所以网格内容原样留着,而 `.hidden = true` 又是
       个装饰 —— 逛过一次网格再切回表格,网格就挂在表格下面不走了。
       逐个补 `.x[hidden]` 是打地鼠,一条全局规则让这一类从构造上消失。 */
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--font-ui);
      font-size: var(--fs-md);
      background: var(--bg);
      color: var(--text);
      padding: var(--page-pad);
      /* 数字等宽是这一页的基线要求,不是某几个格子的特例:表格里所有列都是数字,
         比例数字会让上下两行的位数对不齐,扫一列的时候尤其难受 */
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    /* 全局焦点环。原来只有两个组件写了 :focus-visible,其余的键盘用户看不见落点。
       统一挂在这里,后面的组件只在需要偏移时覆盖 */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--r-sm);
    }

    /* 全局按下反馈。**整个文件里原来一个 `:active` 都没有** —— 每个按钮都写了
       hover,却没有一个在按下时给回应,而这是个每天要点几十次锁定/收藏/攻略的工具。
       和焦点环一样挂在全局:按下位移是所有可点元素的共同语言,逐个组件写只会漏。

       用 translate 而不是改 padding/margin:前者只走合成器,不触发重排 ——
       几百行的表格里,按一下就重排整页是看得出来的。
       `.g-card` 不在此列,它的 hover 已经是 translateY(-3px),再叠一层会打架。 */
    button:active:not(:disabled),
    .icon-btn:active,
    .guide-btn:active:not(:disabled),
    .badge-btn:active,
    .row-icon:active,
    .add-game-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    h1 {
      font-size: var(--fs-display);
      font-weight: 650;
      /* 负字距是给紧排的拉丁大字用的;标题现在是中文,汉字本来就方正,
         收字距只会让它挤在一起 */
      letter-spacing: 0.02em;
      margin: 0;
      color: var(--text-hi);
    }

    /* ========================================================================
       标题
       ------------------------------------------------------------------------
       **层级由字重扛,颜色只标关键词。** 一句话分三个角色:平台名(STEAM,细、
       拉开、暗)、关键词(成就,强调色)、其余(追踪器)。

       字重差是 2026-08-16 换自托管字体之后才成立的 —— 在那之前中文的
       600/650/700 渲染出来是同一档(见 :root 的 --font-ui),想让 STEAM 退下去
       只有「调暗」一条路,而调暗就撞对比度下限。现在 800 对 500 是真的三档差。

       **没有下划线,也不要再加回来。** 那道两笔 SVG 手绘线 2026-08-16 撤掉了:
       字重差已经把主次说清楚了,再加一道装饰线就是同一件事说两遍,而且它是整个
       顶栏唯一一处手绘图形 —— 旁边的图标全是 24 格规整描边,它跟谁都不像。
       撤线之后 `.wm-text` 不再需要 position: relative(它只为那条绝对定位的线存在)。

       **不要再尝试「画」这个字标。** 手写体字体、手绘 SVG 字形、位图描边三次都失败过,
       原因和教训见 CLAUDE.md —— 一句话:字形的正确性属于字体,任何重画 CJK 笔画的
       做法都是在重跑那三次。

       字号写在 `.wordmark` 上而**不动 `--fs-display`**:那个令牌和 Setup.html 逐字
       共用,跟着变会把设置页那个普通标题平白撑大一圈。
       ======================================================================== */
    .wordmark {
      display: flex;
      align-items: center;
      font-size: 27px;
      /* 800 而不是 900:这个字标只在 27px 出现,900 的汉字在这个尺寸上开始并笔,
         放大了好看不算数 */
      font-weight: 800;
      /* 短标题的中文稍微放一点字距更稳;负字距是给紧排拉丁大字用的,汉字不适用。
         字重加到 800 之后笔画更满,字距比原来(0.03em)收一点才不显拥挤 */
      letter-spacing: 0.02em;
      font-family: inherit;   /* 就是 body 那一栈,和表格里的中文同源 */
    }
    /* 「Steam」是平台名,不是产品名 —— 压小、拉开、**变细**,让中文当主角。

       「变细」是这里唯一改过的手段,而且改得有理由:原来是 600(比主体只轻一档),
       靠 --text-3 的暗色往后退。那个令牌为了过 AA 调亮之后,STEAM 就比设计意图
       抢戏了 —— 而**再调暗回去就是走回对比度失败**。500 让它靠字重后退,颜色不必
       再兼职做层级,两件事各归各的。

       **字号 0.74em 不要动。** 汉字几乎填满整个字身框,拉丁大写只到 cap-height,
       所以同样 px 下拉丁看着小一截;0.74em 是当年逐档比出来的。换成自托管字体之后
       复测过:拉丁大写高度与汉字墨高之比是 0.593,换之前约 0.58,差不到两个百分点 ——
       **它扛过了换字体,不需要重新校准。** */
    .wm-latin {
      font-size: 0.74em;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-right: 0.42em;
      vertical-align: 0.16em;
    }
    /* 「成就」是这个工具的关键词,给它强调色。整句全白太平,全上色又太吵 */
    .wm-key { color: var(--accent); }
    /* 不再需要 position: relative —— 它当初只是给那条绝对定位的下划线当锚点 */
    .wm-text { display: inline-block; white-space: nowrap; }

    /* ========================================================================
       顶栏
       ------------------------------------------------------------------------
       **负外边距是为了满宽**:body 有 --page-pad 的内边距,不抵消掉的话左右两侧
       会留出缝,表格从缝里滚过去,看着像背景漏了。两个值出自同一个令牌,不会再各改各的。
       z-index 100 —— 要压住表格,但必须让开两个浮层:#gen-bar(9990)和
       lib/rpc.js 的同步状态条(9999)。它们钉在屏幕底部,顶栏跟它们抢层级没有意义。
       背景必须是**不透明**的 var(--bg),否则滚动的表格会从下面透出来。
       ======================================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      /* 底色**必须不透明**,否则滚动的表格会从下面透出来。渐变叠在纯色 var(--bg)
         上面,所以它仍然是不透明的 —— 顺序反了(渐变在下)就会露。
         这一层是「让上面丰富一点」的全部:一点从上往下散掉的蓝、左上角一团很淡的光。
         **刻意不用图片、不做玻璃、不加纹理** —— 顶栏是常驻的,任何有花纹的东西
         在它上面看三次就烦了,而这一页真正要看的是下面那张表 */
      background:
        radial-gradient(60% 140% at 12% -20%, rgba(102, 192, 244, 0.13), transparent 70%),
        linear-gradient(180deg, rgba(102, 192, 244, 0.045), transparent 62%),
        var(--bg);
      margin: calc(var(--page-pad) * -1) calc(var(--page-pad) * -1) var(--s5);
      padding: var(--s5) var(--page-pad) var(--s4);
      /* 底边就是一条分隔线,不再是读数。**这里曾经是整库完成率(AGCR)的进度条**,
         2026-08-16 拆掉:那个数在一个几百款游戏的库里一天动不了零点几个百分点,
         所以它永远是一条填了三分之一的槽 —— 一个不会变的进度条只会一直在说
         「还没做完」,而它想表达的其实是「你已经打到这儿了」。读数没丢,
         「平均完成率」在上面的 readout 里照常有数字版;
         去掉的是那个把它画成"离满还差多远"的形状。**不要再把它做回进度条**。
         边框而不是绝对定位的子元素:分隔线是顶栏的一部分,不是叠在它上面的东西,
         而且 offsetHeight 会算上边框,--topbar-h 因此自动跟着对。
         **令牌是 --line-3 而不是进度条那会儿的 --line-2**:三级线各有各的活,
         进度槽是个控件面(2),而这里回到了「换了一块区域」的区块边界(3) */
      border-bottom: 1px solid var(--line-3);
    }
    /* 标题行:标题在左,读数带贴右。整行可换行 —— 窄屏上读数带整条掉到标题下面 */
    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--s3) var(--s6);
      flex-wrap: wrap;
      margin-bottom: var(--s3);
    }
    /* 第二行同样两端对齐:左边是状态文字,右边是那组图标按钮。
       原来图标紧跟在「上次同步」后面,读成了一串来历不明的东西挤在句子右边;
       靠到右上角之后,「这一栏右边是操作」变成一条一眼能认的规律 */
    .subtitle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s3);
      flex-wrap: wrap;
    }
    .subtitle {
      color: var(--text-3);
      font-size: var(--fs-sm);
    }
    .topbar-status {
      display: flex;
      align-items: center;
      gap: var(--s3);
      min-width: 0;
      flex-wrap: wrap;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: var(--s1);
      flex-shrink: 0;
    }

    /* 同步中的提示:顶栏底边那条来回扫的线。
       顶栏是冻结的,所以滚到哪儿都看得见,而按钮那一小格只有盯着它才注意得到 ——
       两处都报状态,一处给余光,一处给确认。
       **不能给 .topbar 加 overflow: hidden** —— 铃铛面板是它的绝对定位子元素,
       会被裁掉。所以让这条线在 0%~65% 之间来回,自己不越界。 */
    @keyframes sync-sweep {
      0%   { left: 0; }
      50%  { left: 65%; }
      100% { left: 0; }
    }
    .topbar::after {
      content: '';
      position: absolute;
      /* **-1px 不是微调**:绝对定位的 bottom 是对着*内边距盒*算的,而 1px 的
         border-bottom 画在它外面。差这一像素,扫线就悬在分隔线上方,同步时
         下沿变成"两条线",而不是原来那条线自己亮起来。往下挪一像素,2px 的
         扫线正好把 1px 的分隔线整个盖住 —— 顶栏底边始终只有一条 */
      bottom: -1px;
      left: 0;
      z-index: 1;            /* 边框画在父元素自己那层,定位子元素才压得住它 */
      width: 35%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-2);
    }
    .topbar.syncing::after {
      opacity: 1;
      animation: sync-sweep 1.6s ease-in-out infinite;
    }

    /* ========================================================================
       读数带
       ------------------------------------------------------------------------
       **这不是三张卡片,是一条仪表读数。**
       盒子 + 标签在上 + 大数字,是 dashboard 的模板答案 —— 而这一页真正的内容是
       下面那张表,这三个数字只是给它做的注脚。所以去掉盒子和边框,数值在前、
       说明跟在后面,整条贴在标题右边:读数属于机箱边框,不该自己占一整行。
       ======================================================================== */
    .readout {
      display: flex;
      align-items: baseline;
      gap: var(--s5);
      flex-wrap: wrap;
    }
    .reading {
      display: flex;
      align-items: baseline;
      gap: var(--s1) 7px;
      white-space: nowrap;
    }
    .reading .value {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .reading .label {
      font-size: var(--fs-sm);
      color: var(--text-3);
      letter-spacing: 0.03em;
    }

    /* ========================================================================
       图标
       ------------------------------------------------------------------------
       **整套图标是内联 SVG,不是 emoji。** 这不是审美偏好,是 emoji 有三件事做不到:
       颜色由字形自带(CSS 的 color 管不着,所以 ✏️ 压再低的透明度还是一支亮黄铅笔)、
       各操作系统画得不一样、以及无法和文字对齐到同一条基线。
       旧代码里为此留下过两处妥协 —— 行尾的「更多」只能退回文本符号 ⋮,
       同步图标不能转(🔄 在 Windows 上是「蓝底圆角方块 + 白箭头」的一整个字形,
       转它转的是那块底板)。两条限制在全部换成 SVG 之后同时消失。

       统一 24 格、1.75 描边、fill: none、currentColor,所以它们吃 color、吃 opacity,
       并且和旁边的文字一起变暗变亮。
       ======================================================================== */
    .ic {
      width: 1em;
      height: 1em;
      /* **inline-block,不是 block。** 图标既要当 flex 子项(按钮里),也要夹在
         一句话中间(生成进度条那些提示)。flex 容器会把 inline-block 当块处理,
         所以这个值两种场合都成立,而 block 会让句子中的图标自己占一行 */
      display: inline-block;
      vertical-align: -0.14em;   /* 压到和汉字的中线对齐 */
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      /* 实心图标(收藏的心、置顶的星)靠自己覆盖 fill,描边留着当轮廓 */
    }
    .ic.filled { fill: currentColor; stroke: currentColor; }
    /* 图标精灵本体:只提供 <symbol>,自己不占位 */
    #icon-sprite { display: none; }

    /* ---- 顶栏那三个图标按钮 ----------------------------------------------
       **它和表格行里的图标按钮是两个组件,不能共用一个类名。** 这里原来都叫
       `.icon-btn`,两段规则一前一后写在同一张表里,后面那段(行内的)整段盖掉了
       前面这段:说好的「底色 + 描边的方块按钮」在页面上从来没出现过,一直是三个
       裸字形 —— 而且没有任何东西报错。行内的那套现在叫 `.row-icon`。 */
    .icon-btn {
      background: var(--surface-2);
      color: var(--text-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;         /* .ic 的 1em 跟着它 */
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: none;   /* 「设置」是 <a> */
      font-family: inherit;
      transition: background var(--dur-1), color var(--dur-1), border-color var(--dur-1);
    }
    .icon-btn:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: var(--line-3);
      color: var(--text-hi);
    }
    .icon-btn:disabled { opacity: 0.45; cursor: default; }
    .icon-glyph { display: inline-flex; }

    /* 同步中,图标自己转。换成 SVG 之后转的是箭头本身,不再是 emoji 那块底板 */
    @keyframes icon-spin { to { transform: rotate(360deg); } }
    .icon-btn.spinning .icon-glyph { animation: icon-spin 1.1s linear infinite; }

    /* ---- 铃铛 ------------------------------------------------------------ */
    .bell-wrap { position: relative; display: inline-flex; }
    .bell-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 9px;
      height: 9px;
      border-radius: var(--r-full);
      background: var(--danger);
      /* 描边用页面底色,红点压在按钮边框上时才分得开 */
      border: 2px solid var(--bg);
      pointer-events: none;
    }
    .bell-panel {
      position: absolute;
      top: calc(100% + var(--s2));
      right: 0;
      width: 360px;
      max-width: calc(100vw - var(--s6) - var(--s4));
      max-height: 60vh;
      overflow-y: auto;
      background: var(--surface-3);
      border: 1px solid var(--line-3);
      border-radius: var(--r-lg);
      padding: var(--s1);
      z-index: 200;
      box-shadow: var(--sh-3);
      text-align: left;
    }
    .bell-group {
      font-size: var(--fs-xs);
      color: var(--text-3);
      letter-spacing: 0.06em;
      padding: var(--s2) var(--s2) var(--s1);
    }
    .bell-item {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: 7px var(--s2);
      border-radius: var(--r-sm);
    }
    .bell-item:hover { background: rgba(255, 255, 255, 0.05); }
    .bell-item img {
      width: 44px;
      height: 21px;
      object-fit: cover;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      background: var(--bg);
    }
    .bell-item .bell-name { font-size: var(--fs-md); color: var(--text); flex: 1; min-width: 0; }
    .bell-item .bell-when { font-size: var(--fs-xs); color: var(--text-3); flex-shrink: 0; }
    .bell-empty { font-size: var(--fs-sm); color: var(--text-3); padding: var(--s4) var(--s2); text-align: center; }

    .sync-msg { font-size: var(--fs-sm); color: var(--text-3); }
    .sync-msg.error { color: var(--danger); }

    /* ========================================================================
       工具条:搜索 + 筛选 + 添加
       ======================================================================== */
    .controls {
      display: flex;
      gap: var(--s2);
      margin-bottom: var(--s3);
      flex-wrap: wrap;
      align-items: center;
    }

    /* 筛选项从「原生 checkbox + 文字」改成**开关芯片**。
       两个原因,一个是外观(原生勾选框在深色底上是操作系统画的一块浅色方块,
       和这一页没有关系),一个是可读性:四个并排的裸勾选框,开没开要盯着看。
       芯片亮起来是一眼的事。
       **标记一个字没改** —— input 还在原处,id 还是那几个,`.checked` 照常读得到,
       所以 render() 里那些 getElementById(...).checked 全部不用动。 */
    label.checkbox {
      font-size: var(--fs-sm);
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: var(--s1);
      padding: 6px var(--s3);
      border: 1px solid var(--line-2);
      border-radius: var(--r-full);
      background: var(--surface);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background var(--dur-1), color var(--dur-1), border-color var(--dur-1);
    }
    label.checkbox:hover { border-color: var(--line-3); color: var(--text); }
    /* 勾选框本身不显示,但**必须留在无障碍树里** —— 所以是 0 尺寸 + opacity,
       不是 display:none(那会让它不可聚焦,键盘就选不到了) */
    label.checkbox input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      margin: 0;
      pointer-events: none;
    }
    label.checkbox::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: var(--r-full);
      background: var(--line-3);
      transition: background var(--dur-1), box-shadow var(--dur-1);
    }
    label.checkbox:has(input:checked) {
      background: var(--accent-soft);
      border-color: rgba(102, 192, 244, 0.45);
      color: var(--accent-hi);
    }
    label.checkbox:has(input:checked)::before {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(102, 192, 244, 0.2);
    }
    label.checkbox:has(input:focus-visible) {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    input[type="text"] {
      background: var(--surface);
      border: 1px solid var(--line-2);
      color: var(--text);
      padding: 7px var(--s3);
      border-radius: var(--r-md);
      font-size: var(--fs-md);
      font-family: inherit;
      width: 220px;
      transition: border-color var(--dur-1), background var(--dur-1);
    }
    input[type="text"]::placeholder { color: var(--text-3); }
    input[type="text"]:hover { border-color: var(--line-3); }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg);
    }
    #searchBox { width: 240px; }
    #gameSearchBox { width: 260px; }

    .add-game-row {
      display: flex;
      gap: var(--s2);
      margin-bottom: var(--s4);
      flex-wrap: wrap;
      align-items: center;
    }
    .add-game-btn {
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: var(--r-md);
      padding: 8px var(--s4);
      font-size: var(--fs-md);
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--dur-1);
    }
    .add-game-btn:hover:not(:disabled) { background: var(--accent-hi); }
    .add-game-btn:disabled { opacity: 0.45; cursor: default; }
    .add-game-msg { font-size: var(--fs-sm); }
    .add-game-msg.error { color: var(--danger); }
    .add-game-msg.success { color: var(--ok); }

    .game-search-results {
      display: flex;
      flex-direction: column;
      gap: var(--s1);
      margin: -6px 0 var(--s4) 0;
      max-width: 480px;
    }
    .game-search-result {
      display: flex;
      align-items: center;
      gap: var(--s3);
      padding: var(--s2) var(--s3);
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: border-color var(--dur-1), background var(--dur-1);
    }
    .game-search-result:hover { border-color: var(--accent); background: var(--surface-2); }
    .game-search-result img {
      width: 48px;
      height: 23px;
      object-fit: cover;
      border-radius: var(--r-sm);
      background: var(--bg);
      flex-shrink: 0;
    }
    .game-search-result span { font-size: var(--fs-md); }
    .game-search-result .appid-hint { color: var(--text-3); font-size: var(--fs-sm); }

    /* ========================================================================
       表格上方那一行:左边切视图,右边报数量
       ======================================================================== */
    .table-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s3);
      margin-bottom: var(--s2);
    }
    /* 结果计数**贴着表格**,因为它说的是这张表;顶栏那个读数说的是整个库。
       两个数字含义不同,放在一处会被读成同一个 */
    .row-count {
      font-size: var(--fs-sm);
      color: var(--text-3);
    }
    /* 分段控件:两个按钮共处一个凹槽,选中的那个浮起来。
       原来是两个各自独立的按钮,选中态只靠底色深浅,读不出「二选一」 */
    .view-toggle {
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
    }
    .view-toggle button {
      background: none;
      border: none;
      border-radius: var(--r-sm);
      color: var(--text-3);
      font-family: inherit;
      font-size: var(--fs-sm);
      padding: 4px var(--s3);
      cursor: pointer;
      transition: color var(--dur-1), background var(--dur-1);
    }
    .view-toggle button:hover { color: var(--text); }
    .view-toggle button.on {
      color: var(--text-hi);
      background: var(--surface-3);
      box-shadow: var(--sh-1);
    }

    /* ========================================================================
       表格
       ------------------------------------------------------------------------
       **`border-collapse` 是 separate,不是 collapse。** 表头要吸附
       (`position: sticky`),而原来为了圆角给 table 加的 `overflow: hidden`
       会把 sticky 的参照系限制在表格自己身上,吸附直接失效。所以圆角改挂到
       首末单元格上,分隔线由每个 td 自己的下边框画。
       ======================================================================== */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border-radius: var(--r-lg);
      font-size: var(--fs-md);
    }
    th, td {
      padding: var(--s2) var(--s3);
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--line-1);
    }
    tbody tr:last-child td { border-bottom: none; }
    th {
      position: sticky;
      /* 顶栏是冻结的,表头要停在它下面。这个高度由 JS 量出来写进 --topbar-h ——
         顶栏会随窗口宽度换行变高,写死必然错位 */
      top: var(--topbar-h);
      z-index: 5;
      /* 吸附的行必须是**不透明**底,否则滚动的行会从下面透出来 */
      background: var(--surface-2);
      color: var(--text-3);
      font-weight: 600;
      font-size: var(--fs-sm);
      letter-spacing: 0.03em;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      border-bottom: 1px solid var(--line-2);
      transition: color var(--dur-1);
    }
    th:first-child { border-top-left-radius: var(--r-lg); }
    th:last-child  { border-top-right-radius: var(--r-lg); }
    th:hover { color: var(--text-hi); }
    tbody tr:last-child td:first-child { border-bottom-left-radius: var(--r-lg); }
    tbody tr:last-child td:last-child  { border-bottom-right-radius: var(--r-lg); }

    /* 排序标记。**这里原来有两件事是不可见的**:按哪一列排、正序还是倒序,以及
       「表头能点」这件事本身 —— 鼠标不划过去根本看不出来。所以每个可排序的表头
       常驻一个淡的 ↕(告诉你能点),当前排序的那一列换成 ▲/▼ 并点亮。
       用文本符号不用 emoji:emoji 自带颜色,吃不到 color,淡不下去也点不亮 */
    th[data-key]::after {
      content: '↕';
      margin-left: var(--s1);
      font-size: 10px;
      opacity: 0.3;
    }
    th[data-key]:hover::after { opacity: 0.6; }
    th[data-key].sort-asc::after { content: '▲'; opacity: 1; color: var(--accent); }
    th[data-key].sort-desc::after { content: '▼'; opacity: 1; color: var(--accent); }
    th[data-key].sort-asc, th[data-key].sort-desc { color: var(--text-hi); }

    tr.game-row.expandable { cursor: pointer; }
    /* 悬停整行提亮。用面而不是线:167 行里再加一条线就是方格纸 */
    tr.game-row:hover td { background: var(--surface-2); }

    /* ---- 行内容 ----------------------------------------------------------
       一行里其实有三组东西:**标记**(星、心)、**身份**(封面、名字、状态徽章)、
       **操作**(攻略、重写、更多)。原来它们是一串等距的兄弟节点,gap 一律 10px,
       眼睛分不出组;而且只有最后那个 ⋮ 带 margin-left:auto,于是攻略按钮浮在名字
       右边不上不下。现在三组各自成块,组内紧、组间松,操作整组靠右。 */
    .game-cell {
      display: flex;
      align-items: center;
      gap: var(--s3);
    }
    .row-marks { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .row-actions {
      display: flex;
      align-items: center;
      gap: var(--s1);
      margin-left: auto;   /* 整组靠右,不再只推 ⋮ 一个 */
      flex-shrink: 0;
    }

    /* 行内图标按钮。**和顶栏的 .icon-btn 是两个组件** —— 见上面那段。
       这里要的是「贴着内容的一个字形」,不是按钮方块 */
    .row-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: var(--s1);
      color: var(--text-3);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      border-radius: var(--r-sm);
      transition: color var(--dur-1), background var(--dur-1);
    }
    .row-icon:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
    .row-icon.active-heart { color: var(--danger); }
    .row-icon.active-star { color: var(--warn); }

    /* 行尾的「更多」入口。现在是 SVG 的三个点,和别处一样吃 color ——
       原来只能用文本符号 ⋮,因为 emoji 的 ✏️ 压不暗(颜色是字形自带的) */
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: var(--text-3);
      opacity: 0.5;
      flex-shrink: 0;
      padding: var(--s1);
      border-radius: var(--r-sm);
      display: inline-flex;
      align-items: center;
      transition: opacity var(--dur-1), color var(--dur-1), background var(--dur-1);
    }
    /* 悬停不变红:它已经不是删除按钮,红色会把「打开菜单」暗示成危险动作 */
    .delete-btn:hover { opacity: 1; color: var(--text); background: rgba(255, 255, 255, 0.06); }

    .game-thumb {
      width: 68px;
      height: 32px;
      object-fit: cover;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      background: var(--bg);
      /* 封面亮度参差,给一圈内描边压住边缘,免得浅色封面直接糊进表格底 */
      box-shadow: inset 0 0 0 1px var(--line-2);
    }
    /* 名字块:名字和徽章之间要能换行,长中文名不该把徽章挤出可视区 */
    .game-name-main {
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: var(--s1) 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    /* ---- 进度条 ----------------------------------------------------------
       整页唯一的数据图形,所以它值得比「一条实心色块」多做一点:填充带一层
       从暗到亮的推进感,打满时给一圈很浅的辉光 —— 100% 是这个工具的目的地,
       它应该看起来到了。 */
    .bar-wrap {
      display: flex;
      align-items: center;
      gap: var(--s2);
      min-width: 148px;
    }
    .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: var(--r-full);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px var(--line-1);
    }
    .bar-fill {
      height: 100%;
      border-radius: var(--r-full);
      transition: width var(--dur-2) var(--ease);
    }
    .bar-fill.done { box-shadow: 0 0 8px rgba(102, 192, 244, 0.55); }
    .rate-text { width: 46px; text-align: right; color: var(--text-2); font-size: var(--fs-sm); }

    /* ---- 徽章 ------------------------------------------------------------
       原来有 .badge / .badge-new / .badge-played / .badge-btn 四套 + 三种边框写法
       (实线、虚线、无),尺寸也各不相同。现在共用一个基座,变体只改颜色。 */
    .badge, .badge-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--s1);
      font-size: var(--fs-xs);
      line-height: 1.5;
      padding: 1px 7px;
      border-radius: var(--r-full);
      border: 1px solid transparent;
      white-space: nowrap;
      font-family: inherit;
    }
    .badge { background: rgba(224, 166, 63, 0.14); color: var(--warn); }
    .badge-new { background: rgba(140, 198, 63, 0.14); color: var(--ok); }
    .badge-played { background: var(--accent-soft); color: var(--accent); }
    .badge .ic, .badge-btn .ic { font-size: var(--fs-sm); }

    /* **悬停不能让它变暗。** 这里原来是一条 `.badge-btn:hover { opacity: 0.85 }`,
       对「已开启」的两档来说,唯一的 hover 效果就是**淡下去** —— 指到一个能点的
       东西上,它反而更难看清了,方向是反的。(`-off` 那档还算凑合,因为另一条规则
       把字提到了 --text-2,但仍要再乘 0.85。)
       现在每档各给一个**加深底色**的 hover,一律往「更清楚」的方向走。
       transition 也从 `all` 收敛成三个具体属性 —— `all` 会把后来加的任何属性
       都卷进过渡,包括上面那条 :active 的 transform,按下去就会拖一下才落位。 */
    .badge-btn {
      cursor: pointer;
      background: none;
      transition: background var(--dur-1), color var(--dur-1), border-color var(--dur-1);
    }
    .badge-btn-on { background: rgba(224, 166, 63, 0.14); color: var(--warn); }
    .badge-btn-on:hover { background: rgba(224, 166, 63, 0.26); }
    .badge-btn-off { border-color: var(--line-2); color: var(--text-3); }
    .badge-btn-off:hover { border-color: var(--line-3); color: var(--text); background: rgba(255, 255, 255, 0.05); }
    .badge-btn-family-on { background: var(--accent-soft); color: var(--accent); }
    .badge-btn-family-on:hover { background: rgba(102, 192, 244, 0.26); }

    .manual-input {
      width: 60px;
      background: var(--bg);
      border: 1px solid var(--line-2);
      color: var(--text);
      padding: var(--s1) 6px;
      border-radius: var(--r-sm);
      font-size: var(--fs-md);
      font-family: inherit;
    }
    .manual-input:focus { outline: none; border-color: var(--accent); }

    .na { color: var(--text-3); font-size: var(--fs-sm); }
    .loading, .empty {
      color: var(--text-3);
      padding: var(--s6) var(--s5);
      text-align: center;
    }

    /* ---- 展开的「还差哪些成就」 ------------------------------------------ */
    .missing-row td {
      background: rgba(0, 0, 0, 0.22);
      padding: var(--s4) var(--s5);
    }
    .missing-header { font-size: var(--fs-sm); color: var(--text-3); margin-bottom: var(--s3); }
    .ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(264px, 1fr));
      gap: var(--s2);
      /* **等高由卡片承担,不由攻略窗口承担**(默认的 stretch,写出来是为了别再被改掉)。
         卡片有底色和边框,是个**容器** —— 里面多出来的余白读作 padding。而攻略左边
         那条 accent 竖线是**量度**:它沿着内容画,画多长就被读成有多少内容。之前把
         固定高度加在窗口上,等于让量度去承担对齐,于是短攻略的线一路拖到卡片底部,
         看起来像话没说完。让容器去对齐,量度只管说实话 */
      align-items: stretch;
    }
    /* 有卡片展开时,整行退回自然高度。grid 的行高等于本行最高的那张,展开那张一长,
       stretch 就把旁边几张也拉成大空盒子 —— 正是 stretch 本来要避免的那种空白。
       静止时对齐、展开时各归各的,两种状态各取所需 */
    .ach-grid.has-expanded .ach-item { align-self: start; }
    .ach-item {
      display: flex;
      gap: var(--s2);
      align-items: flex-start;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      padding: var(--s2);
    }
    /* flex 子项默认 min-width: auto,不会缩到比内容还窄 —— 攻略正文里一个长词
       就能把这一列顶宽,把整个 grid 挤变形。必须显式放开 */
    .ach-body { min-width: 0; flex: 1; }
    .ach-icon { width: 32px; height: 32px; border-radius: var(--r-sm); flex-shrink: 0; background: var(--bg); }
    .ach-head { display: flex; align-items: flex-start; gap: var(--s2); }
    .ach-name { font-size: var(--fs-sm); font-weight: 600; color: var(--text); flex: 1; min-width: 0; }
    /* 只有图标。它紧挨着成就名,一句「在攻略中打开」会把名字挤没,而 title 已经把话
       说清楚了 —— 屏幕上的字越少越好,长解释归 docs/ */
    .ach-jump {
      flex-shrink: 0;
      color: var(--text-3);
      line-height: 1;
      margin-top: 2px;
      text-decoration: none;
    }
    .ach-jump:hover { color: var(--accent); }
    .ach-desc { font-size: var(--fs-xs); color: var(--text-3); margin-top: 2px; line-height: 1.5; }
    .ach-guide-link {
      font-size: var(--fs-xs);
      color: var(--accent);
      text-decoration: none;
      margin-top: var(--s1);
      display: inline-block;
    }
    .ach-guide-link:hover { text-decoration: underline; }

    /* ---- 卡片里那段「你自己攻略里怎么写的」 ------------------------------- */
    /* 上面的名字和描述是 Steam 给的,这一段是你写的,两种来源不该看起来是一回事 ——
       左边那条 accent 竖线就是干这个的,不是装饰 */
    /* **固定高度的预览窗口,而且窗口是 .ach-guide 而不是里面的正文。** 子步骤是
       正文的兄弟节点,把高度钉在正文上的话,带子步骤的卡片会在窗口**外面**多出一截
       ——一行四张卡片,只有有子步骤的那张高出一头,正是这条规则要防的。
       用 height 而不是 max-height:后者让每条各缩各的,一行里两行的和八行的挨在
       一起高低参差。短的下面留白,换来同一行的卡片一样高 */
    .ach-guide {
      margin-top: var(--s2);
      padding-left: var(--s2);
      border-left: 2px solid var(--accent);
      /* **max-height,不是 height。** 短攻略就短,竖线跟着在正文结束的地方收住 ——
         固定高度会让线一路拖到底,读起来像还有下文(ui-ux-pro-max 的
         「Text Reflow and Spacing」把"在固定高度盒子里裁文字"列为 Critical 反模式,
         「Essential Text Truncation」则专门点名"只为了让卡片等高而裁内容")。
         封顶 6 行只对**真的很长**的攻略生效,而且配着渐变和点击展开,也就是那两条
         规则要求的"可见的看全文路径"。
         **不能写 em** —— .ach-guide 自己没有字号,em 会跟着表格的字号解析,调一下
         表格字号就顺带改了这里。按正文自己的 --fs-xs 和行高算,封顶才和"能看见
         几行攻略"绑在一起 */
      max-height: calc(var(--fs-xs) * 1.6 * 6);
      overflow: hidden;
      position: relative;
    }
    .ach-guide.expanded { max-height: none; }
    /* .clamped = 内容确实超出了预览窗口,由 JS 量出来后打上。渐变和手势都挂在它上面,
       而不是挂在 :not(.expanded) 上 —— 否则短攻略(没超出)也会顶着一层假的渐变,
       点上去还什么都不会发生 */
    .ach-guide.clamped { cursor: pointer; }
    .ach-guide-text {
      font-size: var(--fs-xs);
      line-height: 1.6;
      color: var(--text-2);
      /* Notion 的一个 to_do 块里,成就名 / 官方描述 / 你的打法是换行分隔的同一段文本
         (notionblocks.js 专门保证不把它拆成三个块),pre-wrap 才能把那个结构显示出来 */
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    /* 截断处压一层渐变。没有它,文字齐刷刷断在半路,看起来像攻略本身就写到这儿为止 */
    .ach-guide.clamped:not(.expanded)::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: calc(var(--fs-xs) * 1.6 * 2);   /* 两行正文,同样别用 em */
      background: linear-gradient(transparent, var(--surface));
      pointer-events: none;
    }
    .ach-substep {
      display: flex;
      gap: 6px;
      margin-top: 3px;
      font-size: var(--fs-xs);
      line-height: 1.5;
      color: var(--text-3);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    /* 勾选态用 CSS 画,不用字符 —— 见图标那一节:emoji 自带颜色,color 管不着它 */
    .ach-substep::before {
      content: '';
      flex-shrink: 0;
      width: 9px; height: 9px;
      margin-top: 0.3em;
      border: 1px solid var(--line-3);
      border-radius: 2px;
    }
    .ach-substep.done::before { background: var(--accent); border-color: var(--accent); }
    /* 「攻略里还没写这条」。刻意不用警告色:这不是错误,是一条待办 */
    .ach-gap { font-size: var(--fs-xs); color: var(--text-3); margin-top: var(--s2); }

    /* ---- 行尾的攻略按钮组 ------------------------------------------------ */
    .guide-btn {
      background: none;
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      cursor: pointer;
      font-size: var(--fs-xs);
      font-family: inherit;
      padding: var(--s1) var(--s2);
      color: var(--text-3);
      flex-shrink: 0;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: var(--s1);
      transition: color var(--dur-1), border-color var(--dur-1), background var(--dur-1);
    }
    .guide-btn .ic { font-size: var(--fs-sm); }
    .guide-btn.has-guide { color: var(--accent); border-color: rgba(102, 192, 244, 0.4); }
    .guide-btn.has-guide:hover { background: var(--accent-soft); }
    /* 没攻略又生成不了的那一档:留着位置,但不可点。用 opacity 而不是换色,
       免得又多一档需要记住的颜色 */
    .guide-btn.no-guide {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }
    /* 配了 AI 之后,没攻略的行变成「可以生成一份」 */
    .guide-btn.can-gen {
      opacity: 1;
      cursor: pointer;
      pointer-events: auto;
      color: var(--ok);
      border-color: rgba(140, 198, 63, 0.4);
    }
    .guide-btn.can-gen:hover:not(:disabled) { background: rgba(140, 198, 63, 0.12); }
    .guide-btn.can-gen:disabled { opacity: 0.4; cursor: default; }
    .guide-btn.to-notion:hover:not(:disabled) { color: var(--text); border-color: var(--line-3); }
    .guide-btn.to-notion:disabled { opacity: 0.4; cursor: default; }
    /* 重写会覆盖已有攻略,是这一行上唯一不可逆的动作 —— 平时低调,
       悬停时才显出警示色,免得一排 ♻ 把表格弄得像满屏警告 */
    .guide-btn.rewrite:hover:not(:disabled) { color: var(--warn); border-color: var(--warn); }
    .guide-btn.rewrite:disabled { opacity: 0.4; cursor: default; }

    /* ========================================================================
       图库视图
       ------------------------------------------------------------------------
       **整页唯一让视觉说话的地方。**
       胶囊图是 Steam 自己的语言,所以它铺满整张卡;名字压在底部渐变上,而不是
       缩成缩略图配一行说明 —— 那是表格已经在做的事。卡片最下沿那条进度线
       是这个工具唯一要说的事,所以它是卡上唯一的图形元素。

       **竖版,按最小宽度铺满,不再是固定一排四个。**
       竖版是 Steam 库里本来的形状,同样高度比横版能多塞一倍,而且不用把横图裁成
       竖的 —— 这一条没变。变的是列数:原来写死四列,理由是「auto-fill 会随宽度在
       3~5 列之间跳,而一排四个是这个视图的形状本身」。**那条理由只在卡片很大时成立。**
       四列在 1440px 宽的窗口上意味着每张 336px、504px 高,一屏连两行都放不下 ——
       而这个视图的用处恰恰是「一眼扫过一整个库」,308 款游戏要翻几十屏。
       卡片缩到 168px 起之后,少一列只差 12% 宽度,跳动已经看不太出来,
       「尽量多放」反而成了它真正的形状。**改密度只动下面这一个值。**
       ======================================================================== */
    .gallery {
      /* 每张卡的最小宽度。往上调 = 卡更大更少,往下调 = 更密。
         168px 时封面上的中文名还完全读得出来,再小就开始要眯眼了 */
      --card-min: 168px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
      /* 卡小了,间距也得跟着收 —— 16px 的沟在 168px 的卡之间会把网格切成一块块 */
      gap: var(--s2);
    }
    /* 窄到一列都放不下时,让最小宽度自己让步,别横向溢出 */
    @media (max-width: 400px) { .gallery { --card-min: 130px; } }
    .g-card {
      position: relative;
      aspect-ratio: 600 / 900;
      /* 圆角跟着卡片一起收:12px 挂在 168px 宽的卡上,比例上等于原来 24px 挂在 336px 上 */
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--line-2);
      transition: transform var(--dur-2) var(--ease), box-shadow var(--dur-2), border-color var(--dur-2);
    }
    .g-card.has-guide { cursor: pointer; }
    /* 悬停把整张卡抬起来,而不只是把图放大 —— 抬起来才是「这张可以点」 */
    .g-card:hover {
      transform: translateY(-3px);
      border-color: rgba(102, 192, 244, 0.5);
      box-shadow: var(--sh-2);
    }
    .g-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform var(--dur-2) var(--ease);
    }
    .g-card:hover img { transform: scale(1.04); }
    /* 竖版卡窄,名字和进度**上下叠**而不是左右排 —— 并排的话中文名两三个字就换行了。
       卡片缩小之后这一块也要跟着收:原来 32px 的顶部留白是给 336px 宽的卡准备的,
       照搬到 168px 上,光渐变就吃掉三分之一张封面 */
    .g-scrim {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: var(--s5) var(--s2) 7px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      /* 渐变兜住文字 —— 封面底部亮暗不一,没有它名字会在浅色封面上读不出来 */
      background: linear-gradient(to top, rgba(0,0,0,0.94) 26%, rgba(0,0,0,0.55) 62%, rgba(0,0,0,0));
    }
    .g-name {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      /* 最多两行,超出截断:封面高度是固定的,长名字撑开会把进度线顶出卡外 */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .g-rate { font-size: 10px; color: rgba(255, 255, 255, 0.75); }
    .g-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.16); }
    .g-bar span { display: block; height: 100%; }
    /* 心比原来小一号,而且**默认只在悬停或已收藏时才现身** —— 卡片密了之后,
       一屏三百个常驻的心会盖过封面本身,而收藏是个偶尔用一次的动作 */
    .g-heart {
      position: absolute;
      top: 2px;
      right: 2px;
      z-index: 2;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      opacity: 0;
      transition: opacity var(--dur-1);
      /* 封面什么颜色都有,给图标一层暗投影保底 */
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.8));
    }
    .g-card:hover .g-heart,
    .g-heart:focus-visible,
    .g-heart.active-heart { opacity: 1; }
    .g-heart:hover { background: none; color: #fff; }

    /* ========================================================================
       浮层:生成进度条、确认框、行菜单
       ======================================================================== */
    /*
      悬浮,不跟着页面滚走。一次生成要两到四分钟,而这段时间里人多半在往下翻表格 ——
      进度条钉在文档流最上面等于"想看就得先滚回去"。

      **靠左下角,因为右下角被 lib/rpc.js 的同步状态条占了**(那边写死
      right:16px / bottom:16px / z-index:9999)。两个浮层各占一角,谁也不压谁;
      z-index 比它低一档,万一真挤到一起也是同步状态条在上面。
    */
    #gen-bar {
      display: none;
      position: fixed;
      left: var(--s4);
      bottom: var(--s4);
      z-index: 9990;
      max-width: min(420px, calc(100vw - var(--s6)));
      max-height: 60vh;
      overflow-y: auto;
      /* 右边留出关闭按钮的位置 */
      padding: var(--s3) var(--s6) var(--s3) var(--s4);
      border: 1px solid rgba(140, 198, 63, 0.5);
      border-left: 3px solid var(--ok);
      border-radius: var(--r-md);
      /* 浮起来就必须有不透明背景,否则和下面的表格文字叠在一起没法读 */
      background: var(--surface-3);
      box-shadow: var(--sh-3);
      font-size: var(--fs-sm);
      line-height: 1.6;
      color: var(--text);
    }
    #gen-bar .warn { color: var(--text-3); }
    /* 有任务在跑 = 只能收起;跑完了 = 才能关掉。两个按钮永远只露一个 */
    #gen-bar.live #genClose,
    #gen-bar:not(.live) #genToggle { display: none; }
    /* 收起 = 只留一行。**用 max-height 卡高度,不是给文字加 nowrap** ——
       进度是用 <br> 拼起来的多行,nowrap 拦不住 <br>,照样撑开 */
    #gen-bar.collapsed {
      max-height: calc(1.6em + var(--s3) * 2);
      overflow: hidden;
      cursor: pointer;
    }
    /* 收起时整条都可以点回来。箭头翻个面表示"再点是展开" */
    #gen-bar.collapsed #genToggle .ic { transform: rotate(180deg); }
    #gen-bar .gen-close {
      position: absolute;
      top: var(--s1);
      right: var(--s1);
      background: none;
      border: none;
      padding: var(--s1);
      cursor: pointer;
      color: var(--text-3);
      font-size: var(--fs-lg);
      line-height: 1;
      border-radius: var(--r-sm);
      display: inline-flex;
    }
    #gen-bar .gen-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
    /* 窄屏上两个角会挤到一起,改成横跨一行并让开下面的同步状态条 */
    @media (max-width: 720px) {
      #gen-bar { left: var(--s3); right: var(--s3); bottom: 76px; max-width: none; }
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 7, 11, 0.68);
      backdrop-filter: blur(3px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--surface-3);
      border: 1px solid var(--line-3);
      border-radius: var(--r-lg);
      padding: var(--s5) var(--s6);
      text-align: center;
      max-width: 400px;
      box-shadow: var(--sh-3);
    }
    .modal-box .game-name { font-size: var(--fs-lg); font-weight: 600; color: var(--text-hi); margin-bottom: var(--s1); }
    .modal-box .appid-hint { margin-bottom: var(--s5); }
    /* **间距挂在按钮行上,不挂在标题或正文上。** 标题的 margin-bottom 只有 4px,
       那是给「下面还有正文」准备的;没有正文的框(比如生成攻略那个只有一句问话的)
       问句和按钮就贴到了一起,看着挤 */
    .modal-box .modal-btns {
      display: flex;
      gap: var(--s3);
      justify-content: center;
      margin-top: var(--s5);
    }
    .modal-box .modal-btns button { min-width: 96px; padding: 9px var(--s4); }
    /* 次级按钮:**透明底 + 正常字色 + 描边**。
       原来是 --panel-alt 底 + --text-dim 字,对比低到和这个组件自己的 :disabled
       态几乎一样 —— 于是「取消」看起来像不可点,或者像被劝阻的选项。
       次级动作要弱于主按钮,但必须一眼看得出可以点 */
    .modal-box .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line-2);
    }
    .modal-box .btn-secondary:hover { background: var(--surface-2); border-color: var(--line-3); }
    .modal-check {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: var(--fs-md);
      color: var(--text);
      /* 上边距挂在这儿,不去动 .game-name 的 4px —— 那个值在确认框里是标题的下边距,
         改大了会把另一个框撑开。同一条 4px 已经造成过两次「挤」了,但两次的解法都是
         在**后面那个元素**上补间距,而不是改共用的那一条 */
      margin-top: var(--s3);
      margin-bottom: 0;
      cursor: pointer;
      user-select: none;
    }
    .modal-check input { cursor: pointer; width: 15px; height: 15px; }

    /* 行的 Edit 菜单。**整页共用一个元素**,按点击位置移过去 —— 每行各挂一个
       意味着几百个隐藏节点,而同一时刻只可能开着一个 */
    .row-menu {
      position: absolute;
      z-index: 200;
      background: var(--surface-3);
      border: 1px solid var(--line-3);
      border-radius: var(--r-md);
      padding: var(--s1);
      /* 标签收成两个字之后,152px 的菜单里大半是空的 —— 宽度要跟着内容走 */
      min-width: 108px;
      box-shadow: var(--sh-3);
    }
    .row-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: var(--fs-md);
      padding: var(--s2) var(--s3);
      border-radius: var(--r-sm);
      cursor: pointer;
    }
    .row-menu button:hover { background: rgba(255, 255, 255, 0.07); }
    .row-menu button.danger { color: var(--danger); }
    .row-menu button.danger:hover { background: rgba(224, 104, 94, 0.14); }

    /* ========================================================================
       响应式与动效偏好
       ======================================================================== */
    /* 图库原来在这里有 760px / 520px 两个断点,把列数掰成 3 和 2 —— 那是「写死四列」
       的配套补丁。改成 auto-fill 之后列数本来就跟着宽度走,断点就是多余的了:
       它们只会在某个宽度上**强行少放一列**,和这个视图现在的目的正好相反 */
    @media (max-width: 640px) {
      :root { --page-pad: var(--s3); }
      /* **`.wordmark` 必须一起点名。** 类选择器(0,1,0)压过光秃秃的 h1(0,0,1),
         媒体查询不改变权重 —— 只写 h1 的话这条在标题上根本不生效,窄屏还是 27px,
         把右边的读数带挤下去 */
      h1, .wordmark { font-size: 21px; }
      .game-thumb { display: none; }   /* 窄屏优先保住名字 */
    }

    @media (prefers-reduced-motion: reduce) {
      /* 不动的话状态仍然看得见,只是不扫、不转、不放大 */
      .topbar.syncing::after { animation: none; width: 100%; opacity: 0.6; }
      .icon-btn.spinning .icon-glyph { animation: none; }
      .g-card, .g-card:hover, .g-card img, .g-card:hover img {
        transition: none;
        transform: none;
      }
      .bar-fill { transition: none; }
    }
  </style>
</head>
<body>
  <!--
    图标精灵。**整套界面的图标都从这里 <use>,页面上不再有 emoji。**

    换掉 emoji 不是为了好看,是因为 emoji 有三件事做不到:
      · 颜色由字形自带 —— CSS 的 `color` 管不着它,所以 ✏️ 无论压到多低的透明度
        都还是一支亮黄铅笔(这条在行尾那个「更多」按钮上已经吃过一次亏,当时的
        解法是退回文本符号 ⋮);
      · 各操作系统画得不一样 —— 🔄 在 Windows 上是「蓝底圆角方块 + 白箭头」的
        一整个字形,想让箭头转起来,转的却是那块底板,所以同步图标一直不能转;
      · 和文字对不齐 —— 它们不落在同一条基线上。

    全部换成单色 SVG 之后这三条一起消失:图标吃 color、吃 opacity、跟着字号走,
    上面那两处妥协(⋮ 和不转的同步图标)也就不必再保留了。

    统一 24 格、fill 由 .ic 控制、stroke-width 1.75 —— 加新图标请照这个网格画,

    <!-- 收起/展开。同一个字形转 180° 当展开用 —— 上下两版画两遍,迟早只改一边 -->
