<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <!-- This page had no <title> for a long time, leaving the browser tab reading
       127.0.0.1:8799.
       The string is kept **consistent** with the one launcher/main.js sets on the
       BrowserWindow — in Electron a page's <title> overrides the window's initial
       title, and two different names would make the packaged build's window title
       jump the instant the page finishes loading -->
  <title>Steam 成就追踪器</title>
  <!-- The self-hosted Noto Sans SC Variable (see --font-ui in :root). **Linked
       rather than inlined**: this is the one stylesheet the two pages share, while
       the design tokens are still stored separately in each — the difference is
       that the font is 101 @font-face rules and nearly 100KB, so two copies would
       be both pointless and a second thing that can drift, whereas the tokens have
       to be inlined (a rule left over from the zero-dependency era, and what
       html-smoke's comparison was written for). -->
  <link rel="stylesheet" href="/fonts/noto-sans-sc.css">
  <style>
    /* ========================================================================
       Design tokens
       ------------------------------------------------------------------------
       This block is the whole interface's single source of values. Changing a
       colour, a spacing or a corner radius touches only this; every rule below
       references a token and never a literal — apart from two deliberate
       exceptions, both noted in place.

       **It has to be word-for-word identical to Setup.html's :root.** Zero
       dependencies rules out a shared stylesheet, so each page keeps its own copy;
       html-smoke.test.js compares them, guarding against changing one and
       forgetting the other.
       ======================================================================== */
    :root {
      /* ---- Surfaces: a four-step ladder in one hue -----------------------
         There used to be only two levels, --panel (#1b2838) and --panel-alt
         (#2a3f5a), with a large gap between them — and **--border and
         --panel-alt were the same value**, so a border drawn on a hover surface
         simply disappeared. With too few levels, separation has to come from
         borders, which is exactly why this page read as "too many boxes".
         With four, hover, table headers and overlays each have their own surface,
         and separation can come from the surface difference rather than a line. */
      --bg:        #10151d;   /* the page floor */
      --surface:   #18212f;   /* tables, cards, inputs */
      --surface-2: #212c3d;   /* table headers, row hover, secondary buttons */
      --surface-3: #2a3749;   /* menus, overlays */

      /* ---- Lines: three levels, always translucent white -----------------
         **They have to be alpha, never a fixed hex.** A fixed value is right on
         exactly one surface and either disappears or glares on another — the
         border == panel-alt bug above came from precisely that.
         The slight blue keeps them inside Steam's palette; pure white reads as
         grey.

         Each level has its own job:
           1 in-table row separators — 167 rows stacked up, and any heavier the
             whole page turns into graph paper
           2 control outlines — inputs, buttons, cards
           3 block boundaries — the topbar's bottom edge, overlay outlines; they
             say "a different area starts here" */
      --line-1: rgba(150, 180, 216, 0.085);
      --line-2: rgba(150, 180, 216, 0.16);
      --line-3: rgba(150, 180, 216, 0.28);

      /* ---- Text: three levels -------------------------------------------- */
      /* All three have to pass WCAG AA (4.5:1) on **all four surfaces**. This is
         not optional polish: what --text-3 carries is not "placeholders, disabled,
         timestamps" but table headers, the 「无成就系统」 data value, the guide and
         rewrite buttons' labels, and #gen-bar's warning text — pick a grey that is
         only adequate on --bg (#6d7f95, say, which is 2.94 on --surface-3) and the
         least readable thing is that warning.

         The values were computed in OKLCH (hue 253.6) rather than hand-tuned in
         hex: to reach 4.5:1 on --surface-3 (L=0.333) the text needs at least
         L=0.698, while --text sits at L=0.921 — **the three text levels have only
         0.223 of lightness headroom in total**. The old ladder's steps were
         0.192 / 0.139 (uneven to begin with), and squeezed into 0.223 they can
         only be even: 0.110 / 0.111.
         What is written here is still hex; OKLCH was used only for the arithmetic
         and is no runtime dependency.

         **Adjusting level three alone without touching level two does not work**
         (that was option A at review): pushed to the AA floor, level three lands
         on top of level two, and the perceptual gap drops from 0.139 to 0.028,
         collapsing two tiers into one.
         Either all three are re-spaced, or none of them change. */
      --text:   #dce6f2;   /* body — unchanged; it is the furthest from the surface and was already fine */
      --text-2: #b4c3d5;   /* secondary: labels, notes, table headers. Was #98a9be */
      --text-3: #8ea0b6;   /* tertiary: placeholders, disabled, timestamps. Was #6d7f95, a floor of 4.51 */
      --text-hi: #ffffff;  /* headings and emphasised rows */

      /* ---- Accent: Steam blue, kept -------------------------------------- */
      --accent:     #66c0f4;
      --accent-hi:  #8ed4ff;
      --accent-ink: #08111b;                    /* text on the blue */
      --accent-soft: rgba(102, 192, 244, 0.14); /* the pale version of the blue, for selected states */

      /* ---- Progress scale ------------------------------------------------
         This used to be good/mid/low, three tiers of red/yellow/green, which
         reads like a traffic light — and 「完成率 30%」 is not a warning. It is
         now a **progressive** four-tier scale, with "complete" given to the
         accent blue rather than green: 100% in this tool is the achievement
         itself, not "safe". */
      --prog-low:  #d9695f;
      --prog-mid:  #e0a63f;
      --prog-high: #8cc63f;
      --prog-done: #66c0f4;
      --prog-none: #3a4759;   /* no data */

      /* ---- Semantic colours ---------------------------------------------- */
      --ok:     #8cc63f;
      --warn:   #e0a63f;
      --danger: #e0685e;

      /* ---- Fonts ---------------------------------------------------------
         **The font is bundled; there is no relying on system fallback.** Leading
         with "Segoe UI" and letting the system pick up Chinese has two measured
         consequences:

           1. Which font Chinese actually lands in is unpredictable. On this
              machine it was neither Microsoft YaHei (the ink curve does not
              match) nor the Noto Sans SC named explicitly in the stack — another
              machine is another appearance, while the whole page's sizes,
              letter-spacing and line-height were tuned against one of them.
           2. **600 / 650 / 700 are one tier in Chinese.** Measuring the ink of
              the character 成 on a canvas: 300→2116, 400→3120, 500→3776, and then
              600/650/700 all 4517.
              Meanwhile .wordmark is 700, h1 is 650 and .ach-name/.badge are 600 —
              the design system declares three tiers and Chinese renders one.

         Noto Sans SC Variable solves both: it travels with the app, and it is a
         100–900 variable axis, so three tiers really are three. Sliced into 101
         shards by unicode-range, the browser fetches only the ones it needs.
         The old font stack stays behind it as a fallback — if /fonts/ ever fails
         to serve, the page is still readable.

         **This entry has to match across both pages**, which is why it is a token;
         html-smoke.test.js's :root comparison watches it, in case only one page
         ever gets changed. */
      --font-ui: "Noto Sans SC Variable", "Segoe UI", -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif;

      /* ---- Type scale: six levels ----------------------------------------
         There used to be eight values, 11/12/13/15/17/18/22/28, with no
         proportional relationship between them. */
      --fs-display: 26px;
      --fs-xl: 19px;
      --fs-lg: 15px;
      --fs-md: 13px;   /* body text and tables */
      --fs-sm: 12px;
      --fs-xs: 11px;

      /* ---- Spacing: a 4px grid -------------------------------------------
         There used to be fourteen values scattered around: 4/6/8/9/10/11/12/14/16/20/22/24/28/34. */
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 24px;
      --s6: 32px;

      /* The page padding. **The topbar's negative margin has to be computed from
         it**, see .topbar — the two values must always be equal, so they now come
         from the same token instead of 24px being written out in two places */
      --page-pad: var(--s5);

      /* ---- Corner radii: four levels (there used to be six: 2/3/4/5/6/8) -- */
      --r-sm: 4px;
      --r-md: 7px;
      --r-lg: 12px;
      --r-full: 999px;

      /* ---- Shadows: three levels ----------------------------------------- */
      --sh-1: 0 1px 2px rgba(0, 0, 0, 0.3);
      --sh-2: 0 8px 24px rgba(0, 0, 0, 0.45);
      --sh-3: 0 16px 48px rgba(0, 0, 0, 0.6);

      /* ---- Motion --------------------------------------------------------- */
      --dur-1: 120ms;
      --dur-2: 200ms;
      --ease: cubic-bezier(0.2, 0.7, 0.3, 1);

      /* The tick colour for native controls (checkboxes and the like). Unset, it
         is the operating system's blue, which is not this page's blue — another
         incarnation of the same class of problem, see the icon block below */
      accent-color: var(--accent);
      color-scheme: dark;
    }

    /* The topbar's measured height, written in by JS (see trackTopbarHeight in the
       script). The table header sticks **below** the topbar, and the topbar wraps
       and grows taller with the window width, so a hardcoded value is necessarily
       wrong.
       **It is not inside the :root block**, because that block is the design tokens
       kept word-for-word identical with Setup.html; this is a runtime measurement
       for this page and no part of the design system. The default below is used
       only for the one frame before JS gets to it.

       **`overflow-anchor: none` sits on the same rule.** Both `.topbar` and the table
       header are `position: sticky`, and content above the scroll position (the search
       dropdown) changes height as part of normal use — exactly the shape the CSS Scroll
       Anchoring spec exists for, and exactly the shape browsers are known to mis-anchor
       against a sticky element (a scroll compensation applied against the wrong node
       reads as a stray downward jump, nothing to do with the app's own JS). Nothing here
       relies on scroll anchoring, so there is nothing to trade away by turning it off */
    html { --topbar-h: 88px; overflow-anchor: none; }

    * { box-sizing: border-box; }

    /* **The `hidden` attribute has to actually hide.** The browser's built-in
       `[hidden] { display: none }` comes from the user-agent stylesheet, and
       **any** `display:` in an author stylesheet outranks it. What was hit here is
       `.gallery { display: grid }`: switching back to the table view does not call
       `renderGallery` (see the early return inside `render`), so the grid's content
       stays as it was while `.hidden = true` is decoration — browse the grid once,
       switch back to the table, and the grid stays hanging below the table.
       Patching them one by one with `.x[hidden]` is whack-a-mole; one global rule
       makes the whole class structurally impossible. */
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: var(--font-ui);
      font-size: var(--fs-md);
      background: var(--bg);
      color: var(--text);
      padding: var(--page-pad);
      /* Tabular figures are a baseline requirement for this page rather than a
         special case for a few cells: every column in the table is numeric, and
         proportional figures misalign the digits between adjacent rows, which is
         especially unpleasant when scanning a column */
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    /* The global focus ring. Only two components used to declare :focus-visible,
       leaving keyboard users unable to see where they are everywhere else.
       Declared here once, with components overriding it only when they need a
       different offset */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: var(--r-sm);
    }

    /* Global pressed feedback. **There was not one `:active` in the whole file** —
       every button declared a hover and none of them answered a press, in a tool
       where the lock/favourite/guide controls are clicked dozens of times a day.
       Declared globally like the focus ring: a press displacement is the common
       language of every clickable element, and writing it per component only leads
       to omissions.

       It uses translate rather than changing padding/margin: the former stays on
       the compositor and triggers no reflow — in a table of several hundred rows,
       reflowing the whole page on a click is visible.
       `.g-card` is excluded: its hover is already translateY(-3px), and stacking
       another would fight it. */
    button:active:not(:disabled),
    .icon-btn:active,
    .guide-btn:active:not(:disabled),
    .badge-btn:active,
    .row-icon:active,
    .add-game-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    h1 {
      font-size: var(--fs-display);
      font-weight: 650;
      /* Negative letter-spacing is for tightly set Latin display type; the heading
         is Chinese now, and Han characters are square to begin with, so tightening
         only crowds them */
      letter-spacing: 0.02em;
      margin: 0;
      color: var(--text-hi);
    }

    /* ========================================================================
       The wordmark
       ------------------------------------------------------------------------
       **Hierarchy is carried by weight, and colour only marks the keyword.** One
       phrase, three roles: the platform name (STEAM — light, spaced out, dim), the
       keyword (成就, in the accent), and the rest (追踪器).

       **The weight difference only works because the font is self-hosted** (see
       --font-ui in :root): with system fonts, Chinese renders 600/650/700 as one
       tier, so the only way to push STEAM back would be dimming it — and dimming
       runs into the contrast floor. 800 against 500 really is a three-tier gap.

       **There is no underline, and it must not be added back.** The weight
       difference already states the hierarchy, and adding a decorative line says
       the same thing twice — while it would be the one hand-drawn shape in the
       whole topbar, next to icons that are all regular 24-grid strokes and
       resembling none of them. (Which is also why `.wm-text` needs no
       position: relative.)

       **Do not try to "draw" this wordmark again.** A handwriting font, a
       hand-drawn SVG glyph and a bitmap outline have each failed once; the causes
       and the lessons are in CLAUDE.md — in one sentence: glyph correctness belongs
       to the font, and any approach that redraws CJK strokes is re-running those
       three attempts.

       The size is set on `.wordmark` and **does not touch `--fs-display`**: that
       token is shared word-for-word with Setup.html, and changing it would inflate
       that page's ordinary heading for nothing.
       ======================================================================== */
    .wordmark {
      display: flex;
      align-items: center;
      font-size: 27px;
      /* 800 rather than 900: this wordmark only appears at 27px, and Han characters
         at 900 start to merge strokes at that size — looking good enlarged does not
         count */
      font-weight: 800;
      /* A short Chinese title reads more steadily with a little extra letter
         spacing; negative spacing is for tightly set Latin display type and does not
         apply to Han characters.
         With the weight raised to 800 the strokes are fuller, so the spacing is
         pulled in a little from the original 0.03em to avoid looking crowded */
      letter-spacing: 0.02em;
      font-family: inherit;   /* i.e. body's stack, the same source as the Chinese in the table */
    }
    /* 「Steam」 is the platform name rather than the product name — smaller, spaced
       out and **lighter**, letting the Chinese take the lead.

       "Lighter" is the only technique changed here, and it was changed for a reason:
       it used to be 600 (only one tier below the body) and receded through
       --text-3's dimness. Once that token was brightened to pass AA, STEAM competed
       for attention more than the design intended — and **dimming it back is
       walking straight back into a contrast failure**. 500 makes it recede by
       weight, so colour no longer moonlights as hierarchy and the two jobs are
       separated.

       **The size is 0.86em, and the number is not a free choice — read this before
       nudging it.** Han characters nearly fill the em box while Latin capitals only
       reach cap-height, measured on the self-hosted font at a ratio of 0.593. So the
       size set here is not what STEAM looks like: at 0.86em its caps stand about
       0.51 of the Han ink height, i.e. it still reads as roughly half the size of
       the Chinese, which is the recession the design wants. Below ~0.8em that
       compounding drops it under 0.45 and it stops looking subordinate and starts
       looking like a mistake.
       **In English the compounding does not apply** — the whole wordmark is Latin
       there, so this is a plain 0.86-against-1 comparison, and the weight gap
       (500 against 800) is carrying most of the hierarchy rather than the size. */
    .wm-latin {
      font-size: 0.86em;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-right: 0.42em;
      /* **No vertical nudge — the two scripts share a baseline, and that is what "the same height"
         means here.** A length `vertical-align` resolves against the element's **own** font-size, so
         a lift added here scales with STEAM and drifts the moment the size above it is touched.
         Ink relative to each own baseline, measured on this font at the shipping sizes: STEAM
         (23.22px/500) reaches 18.0 up and 1.0 down; 成就追踪器 (27px/800) reaches 24.0 up and 3.0
         down. A shared baseline therefore sets the bottoms flush and leaves the Han taller at the
         top, which is what a smaller Latin word beside larger Han is supposed to look like. If it
         ever reads as tilted, look for a reintroduced lift before touching the size. */
    }
    /* 「成就」 is this tool's keyword, so it gets the accent. All white is too flat, and colouring the whole phrase is too noisy */
    .wm-key { color: var(--accent); }
    /* **The word gap belongs to the script, and it is a real character.** 成就追踪器 is one
       uninterrupted phrase, so its spans sit flush; English needs a space between 「Achievement」 and
       「Tracker」 or the two words run together.
       A space in the DOM rather than a margin, because a margin separates the glyphs and leaves the
       *text* still reading 「AchievementTracker」 — which is what a screen reader announces and what
       copying the heading puts on the clipboard. It is shown only under lang="en", the attribute
       `applyStrings` already sets on <html>; hidden it contributes nothing to the accessible name,
       which is correct for Chinese. The string table is the wrong home for it: a literal space
       there is invisible in a diff and the first thing a trim eats. */
    .wm-gap { display: none; }
    :root[lang="en"] .wm-gap { display: inline; }
    /* position: relative is no longer needed — it was only ever the anchor for that absolutely positioned underline */
    .wm-text { display: inline-block; white-space: nowrap; }

    /* ========================================================================
       The topbar
       ------------------------------------------------------------------------
       **The negative margin is what makes it full width**: body has --page-pad of
       padding, and without cancelling it there is a gap down each side with the
       table scrolling through it, which looks like the background showing through.
       The two values come from the same token and can no longer be changed
       separately.
       z-index 100 — it has to sit above the table but must yield to two overlays:
       #gen-bar (9990) and lib/rpc.js's sync status bar (9999). Those are pinned to
       the bottom of the screen, and the topbar competing with them for layer order
       would be pointless.
       The background has to be **opaque** var(--bg), or the scrolling table shows
       through from underneath.
       ======================================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      /* The base colour **has to be opaque**, or the scrolling table shows through
         from underneath. The gradients are layered on top of the solid var(--bg), so
         the whole thing stays opaque — reversing the order (gradients underneath)
         would let it show through.
         This layer is all there is to "make the top a bit richer": a little blue
         dispersing downwards, and a very faint glow in the top left corner.
         **Deliberately no image, no glass, no texture** — the topbar is permanent,
         and anything patterned there is tiresome by the third look, while what this
         page is really for is the table below */
      background:
        radial-gradient(60% 140% at 12% -20%, rgba(102, 192, 244, 0.13), transparent 70%),
        linear-gradient(180deg, rgba(102, 192, 244, 0.045), transparent 62%),
        var(--bg);
      margin: calc(var(--page-pad) * -1) calc(var(--page-pad) * -1) var(--s5);
      padding: var(--s5) var(--page-pad) var(--s4);
      /* The bottom edge is a separator line, and **it must not be turned back into
         the whole-library completion (AGCR) progress bar**.
         In a library of several hundred games that number cannot move by a fraction
         of a percent in a day, so it is permanently a slot filled one third of the
         way — a progress bar that never moves only ever says 「还没做完」, while what
         it wants to express is 「你已经打到这儿了」. The reading is not missing:
         「平均完成率」 has a numeric version in the readout above, and all that is
         missing is drawing it in the shape of "how far from full".
         A border rather than an absolutely positioned child: the separator is part
         of the topbar rather than something laid over it, and offsetHeight counts a
         border, so --topbar-h follows automatically.
         **The token is --line-3 rather than the --line-2 of the progress-bar era**:
         the three line levels each have their own job, and a progress slot is a
         control surface (2) while this is back to a block boundary meaning "a
         different area starts here" (3) */
      border-bottom: 1px solid var(--line-3);
    }
    /* The title row: the wordmark on the left, the readout strip flush right. The whole row can wrap — on a narrow screen the readout strip drops below the title */
    .title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--s3) var(--s6);
      flex-wrap: wrap;
      margin-bottom: var(--s3);
    }
    /* The second row is likewise justified to both edges: status text on the left,
       that group of icon buttons on the right.
       The icons used to follow directly after 「上次同步」, reading as a run of
       unexplained things crowded to the right of a sentence; moved to the top right
       corner, "the right of this strip is where the actions are" becomes a pattern
       recognisable at a glance */
    .subtitle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s3);
      flex-wrap: wrap;
    }
    .subtitle {
      color: var(--text-3);
      font-size: var(--fs-sm);
    }
    .topbar-status {
      display: flex;
      align-items: center;
      gap: var(--s3);
      min-width: 0;
      flex-wrap: wrap;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: var(--s1);
      flex-shrink: 0;
    }

    /* The syncing indicator: a line sweeping back and forth along the topbar's
       bottom edge.
       The topbar is frozen, so it is visible however far the page is scrolled, while
       the small button cell is only noticeable if you are looking at it — both
       report the state, one for peripheral vision and one for confirmation.
       **`.topbar` must not be given overflow: hidden** — the bell panel is an
       absolutely positioned child of it and would be clipped. So the line travels
       between 0% and 65% and stays inside on its own. */
    @keyframes sync-sweep {
      0%   { left: 0; }
      50%  { left: 65%; }
      100% { left: 0; }
    }
    .topbar::after {
      content: '';
      position: absolute;
      /* **-1px is not a nudge**: an absolutely positioned bottom is measured against
         the *padding box*, while the 1px border-bottom is drawn outside it. One pixel
         out and the sweep hangs above the separator, turning the bottom edge into
         "two lines" while syncing instead of that one line lighting up. Moved down a
         pixel, the 2px sweep covers the 1px separator entirely — the topbar's bottom
         edge is always exactly one line */
      bottom: -1px;
      left: 0;
      z-index: 1;            /* the border is painted on the parent's own layer, and only a positioned child can cover it */
      width: 35%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-2);
    }
    .topbar.syncing::after {
      opacity: 1;
      animation: sync-sweep 1.6s ease-in-out infinite;
    }

    /* ========================================================================
       The readout strip
       ------------------------------------------------------------------------
       **This is not three cards, it is one instrument readout.**
       A box with a label above and a large number is the template answer for a
       dashboard — while this page's real content is the table below, and these
       three numbers are only a footnote to it. So the boxes and borders are gone,
       the value comes first with the description after it, and the whole strip sits
       to the right of the title: a readout belongs on the chassis bezel and should
       not take a row of its own.
       ======================================================================== */
    .readout {
      display: flex;
      align-items: baseline;
      gap: var(--s5);
      flex-wrap: wrap;
    }
    .reading {
      display: flex;
      align-items: baseline;
      gap: var(--s1) 7px;
      white-space: nowrap;
    }
    .reading .value {
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      letter-spacing: -0.01em;
    }
    .reading .label {
      font-size: var(--fs-sm);
      color: var(--text-3);
      letter-spacing: 0.03em;
    }

    /* ========================================================================
       Icons
       ------------------------------------------------------------------------
       **The whole icon set is inline SVG, not emoji.** This is not an aesthetic
       preference; there are three things emoji cannot do: their colour comes with
       the glyph (CSS colour cannot touch it, so ✏️ is still a bright yellow pencil
       at any opacity), every operating system draws them differently, and they
       cannot be aligned to the same baseline as the text.
       The old code carried two compromises because of it — the row-end 「更多」 had
       to fall back to the text symbol ⋮, and the sync icon could not rotate (🔄 on
       Windows is one whole glyph of "a blue rounded square with a white arrow", so
       rotating it rotates that plate). Both limitations disappeared at once once
       everything became SVG.

       A uniform 24 grid, a 1.75 stroke, fill: none and currentColor, so they respond
       to color and to opacity and dim and brighten alongside the text next to them.
       ======================================================================== */
    .ic {
      width: 1em;
      height: 1em;
      /* **inline-block, not block.** An icon has to work both as a flex item (inside
         a button) and inside a sentence (the generation progress bar's notices). A
         flex container treats inline-block as a block, so this value holds in both
         cases, while block would make an icon inside a sentence take a line of its
         own */
      display: inline-block;
      vertical-align: -0.14em;   /* pulled down to align with a Han character's centre line */
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      /* Solid icons (the favourite heart, the pin star) override fill themselves, keeping the stroke as an outline */
    }
    .ic.filled { fill: currentColor; stroke: currentColor; }
    /* The icon sprite itself: it provides <symbol> only and takes no space */
    #icon-sprite { display: none; }

    /* ---- The three icon buttons in the topbar ----------------------------
       **These and the icon buttons inside table rows are two components and cannot
       share a class name.** Both used to be called `.icon-btn`, with the two rule
       blocks written one after the other in the same stylesheet, and the later one
       (the in-row set) overrode this one entirely: the promised "filled square
       button with a border" never once appeared on the page, which showed three bare
       glyphs instead — and nothing raised an error. The in-row set is now called
       `.row-icon`. */
    .icon-btn {
      background: var(--surface-2);
      color: var(--text-2);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      width: 32px;
      height: 32px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;         /* .ic's 1em follows it */
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: none;   /* 「设置」 is an <a> */
      font-family: inherit;
      transition: background var(--dur-1), color var(--dur-1), border-color var(--dur-1);
    }
    .icon-btn:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: var(--line-3);
      color: var(--text-hi);
    }
    .icon-btn:disabled { opacity: 0.45; cursor: default; }
    .icon-glyph { display: inline-flex; }

    /* While syncing, the icon rotates on its own. What rotates is the SVG arrow itself — an emoji would rotate its plate with it */
    @keyframes icon-spin { to { transform: rotate(360deg); } }
    .icon-btn.spinning .icon-glyph { animation: icon-spin 1.1s linear infinite; }

    /* ---- The bell ------------------------------------------------------- */
    .bell-wrap { position: relative; display: inline-flex; }
    .bell-dot {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 9px;
      height: 9px;
      border-radius: var(--r-full);
      background: var(--danger);
      /* The outline uses the page floor colour, so the red dot separates from the button border it overlaps */
      border: 2px solid var(--bg);
      pointer-events: none;
    }
    .bell-panel {
      position: absolute;
      top: calc(100% + var(--s2));
      right: 0;
      width: 360px;
      max-width: calc(100vw - var(--s6) - var(--s4));
      max-height: 60vh;
      overflow-y: auto;
      background: var(--surface-3);
      border: 1px solid var(--line-3);
      border-radius: var(--r-lg);
      padding: var(--s1);
      z-index: 200;
      box-shadow: var(--sh-3);
      text-align: left;
    }
    .bell-group {
      font-size: var(--fs-xs);
      color: var(--text-3);
      letter-spacing: 0.06em;
      padding: var(--s2) var(--s2) var(--s1);
    }
    .bell-item {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: 7px var(--s2);
      border-radius: var(--r-sm);
    }
    .bell-item:hover { background: rgba(255, 255, 255, 0.05); }
    .bell-item img {
      width: 44px;
      height: 21px;
      object-fit: cover;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      background: var(--bg);
    }
    .bell-item .bell-name { font-size: var(--fs-md); color: var(--text); flex: 1; min-width: 0; }
    .bell-item .bell-when { font-size: var(--fs-xs); color: var(--text-3); flex-shrink: 0; }
    .bell-empty { font-size: var(--fs-sm); color: var(--text-3); padding: var(--s4) var(--s2); text-align: center; }

    .sync-msg { font-size: var(--fs-sm); color: var(--text-3); }
    .sync-msg.error { color: var(--danger); }

    /* ========================================================================
       The toolbar: search + filters + add
       ======================================================================== */
    .controls {
      display: flex;
      gap: var(--s2);
      margin-bottom: var(--s3);
      flex-wrap: wrap;
      align-items: center;
    }

    /* Filter chips: **one control, three states** — neutral / only / exclude.
       **A checkbox cannot be used**: it has two positions while this row of controls
       has to express three things: "ignore this attribute", "keep only the ones with
       it", "drop the ones with it". Three things do not fit in two positions, and the
       only way out is splitting them across two kinds of control (「只看喜爱」 plus
       「隐藏已完成」), at the cost of leaving no control for looking at the same
       attribute the other way round (want 「只看已完成」 as a trophy wall? there is no
       such thing), and of having to decide for every new attribute whether it is an
       "only" type or a "hide" type. With three states, five chips are one kind of
       thing and the order follows nothing but frequency of use.

       **The cycle runs neutral → only → exclude → neutral, and that was worked out
       rather than picked; do not casually change it.** The three states form a ring,
       and neutral has only one predecessor, so only one direction makes it a single
       click. At startup favourites/family are neutral and the other three are
       excluded — the most common next step for the former is 「只看」 and for the
       latter 「回中立」 (un-hiding to go find a game), and this direction gives each
       of those exactly one click.
       Reversed, both of the most frequent actions become two clicks.
       The cost is that "back to the state I just left" takes two clicks (only →
       neutral, neutral → exclude). **That is a topological property of the ring and
       cannot be removed**; the only choice is which path gets to be cheap. Erasing
       it would need a reverse gesture (right-click to step back one), which is a
       separate thing and is not implemented.

       **The state is carried by the leading marker, and the text does not move by one
       pixel.** Striking through the label in the excluded state was tried and
       rejected — a strikethrough **changes the text itself**, and this row of text is
       scanned dozens of times a day, while changing a marker's shape changes
       something whose only job is to indicate state and reads far more quietly. So
       the three states differ in one place:
         neutral   a small dot        + the ordinary fill
         only      the dot lit        + a blue fill   — blue on this page has always meant "selected/narrowed"
         exclude   a cross            + a recessed fill — the dot splits into two diagonals
       **Exclusion uses a cross, not a minus.** A horizontal bar in checkbox convention
       means "partially selected" — HTML's indeterminate, and every system's
       half-checked box, draws exactly that. What this has to say is "removed
       entirely", and one glyph carrying two opposite meanings makes the reader guess
       which. A cross has no such ambiguity.
       (#i-close on the page is also a cross, but that is a standalone 24px button;
       this is 9px, not clickable, and followed by a label, so the cost of mistaking
       it is one extra glance rather than a wrong action.)
       **Shape is the primary signal and colour is secondary.** Colour carrying state
       alone is an accessibility red line, and this page's four surfaces differ by
       only about 15% in lightness, so a small chip cannot distinguish three tiers by
       fill alone — the dot/cross shape difference survives even a greyscale print.
       **The excluded state is not red.** Red on this page is the danger colour
       (--danger), while exclusion is the startup state for three of the five, and
       marking those red means shouting permanently. Being recessed says 「被推开了」,
       and that is what it means. */
    .chip {
      font-size: var(--fs-sm);
      font-family: inherit;
      line-height: 1.4;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      gap: var(--s1);
      padding: 6px var(--s3);
      border: 1px solid var(--line-2);
      border-radius: var(--r-full);
      background: var(--surface);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: background var(--dur-1), color var(--dur-1), border-color var(--dur-1);
    }
    .chip:hover { border-color: var(--line-3); color: var(--text); }
    .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* The state marker. **The outer box is a constant 9×9 and only the two strokes
       inside change** — changing the element's own width would make the chip change
       width with it, and since the chips sit in a row, one cycle would shift the whole
       row right. An empty box acts as the stage, both strokes are absolutely
       positioned pinned to its centre, and the layout never moves.
       **Two pseudo-elements, of which only one is normally visible**: ::before is the
       dot, and ::after has zero width so it draws nothing. In the excluded state both
       become 9×2 bars, one rotated +45° and one -45°, forming a cross.
       The dot becoming a cross is this page's only shape change, so the width, height
       and transform all have to be transitioned — transitioning colour alone would
       make the shape jump between two frames. The corner radius stays --r-full
       throughout: at 6×6 it renders as a circle and at 9×2 as a capsule, one value
       with two appearances, needing no part in the transition. */
    .chip-dot {
      position: relative;
      width: 9px;
      height: 9px;
      flex-shrink: 0;
    }
    .chip-dot::before,
    .chip-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: var(--r-full);
      background: var(--line-3);
      transform: translate(-50%, -50%);
      transition: background var(--dur-1), box-shadow var(--dur-1), width var(--dur-1),
                  height var(--dur-1), transform var(--dur-1);
    }
    .chip-dot::before { width: 6px; height: 6px; }
    /* **The lit state's glow can only hang on ::before.** A box-shadow's spread is
       painted outwards whether or not the box has any width, so putting it on this
       stroke would conjure a 6×8 rounded rectangle beside the dot */
    .chip-dot::after { width: 0; height: 2px; }
    .chip[data-state="only"] {
      background: var(--accent-soft);
      border-color: rgba(102, 192, 244, 0.45);
      color: var(--accent-hi);
    }
    .chip[data-state="only"] .chip-dot::before {
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(102, 192, 244, 0.2);
    }
    /* A fill one step darker than --surface = **recessed** relative to the surface
       this row of controls sits on. It steps straight onto the page floor --bg rather
       than inventing another colour: the chip sinks into the background, and that
       reads as 「这些被推开了」.
       --text-3 on --bg is 6.85:1 */
    .chip[data-state="not"] {
      background: var(--bg);
      color: var(--text-3);
    }
    .chip[data-state="not"]:hover { color: var(--text-2); }
    /* The cross is **one step brighter than the label** (--text-2 against --text-3).
       The whole chip is dim, while those two strokes say "this one is currently
       excluded" — making them the clearest thing in the chip puts the eye on the
       marker with no need to read the words.
       Each stroke is 9×2, and rotated 45° the cross's bounding box is about 7.8×7.8,
       still inside the 9×9 stage */
    .chip[data-state="not"] .chip-dot::before,
    .chip[data-state="not"] .chip-dot::after {
      width: 9px;
      height: 2px;
      background: var(--text-2);
      box-shadow: none;
    }
    .chip[data-state="not"] .chip-dot::before { transform: translate(-50%, -50%) rotate(45deg); }
    .chip[data-state="not"] .chip-dot::after  { transform: translate(-50%, -50%) rotate(-45deg); }

    input[type="text"] {
      background: var(--surface);
      border: 1px solid var(--line-2);
      color: var(--text);
      padding: 7px var(--s3);
      border-radius: var(--r-md);
      font-size: var(--fs-md);
      font-family: inherit;
      width: 220px;
      transition: border-color var(--dur-1), background var(--dur-1);
    }
    input[type="text"]::placeholder { color: var(--text-3); }
    input[type="text"]:hover { border-color: var(--line-3); }
    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--bg);
    }
    /* One field does two jobs, so it gets to be wider than either of the originals — a full game name is far longer than a filter term */
    #searchBox { width: 280px; }

    /* ---- The clear cross inside an input ---- */
    /**
     * **The cross sits inside the input's padding rather than after it.** After it,
     * appearing and disappearing would nudge whatever is to the right, and the search
     * box sits inside the frozen area where every keystroke already recomputes the
     * height (measureTopbar); inside, the whole row's geometry never changes.
     *
     * **Whether it shows is left to `:placeholder-shown`, with no second copy of the
     * state.** Whether the field has text in it is something the input knows, and a
     * variable or a class following it along is a second source of truth — while both
     * of these fields have paths where code assigns `value` directly (the dialog
     * clears the previous filter term every time it opens), and a direct assignment
     * fires no input event, so the copy following along is wrong on the spot,
     * presenting as a cross that does nothing when pressed.
     * The cost is one hard constraint: **both fields have to keep a placeholder**.
     * Without one, `:placeholder-shown` never matches and the cross hangs on even an
     * empty field.
     *
     * It uses `visibility` rather than `opacity`: while invisible it should also be
     * unclickable, untabbable and unread by a screen reader.
     */
    .search-field { position: relative; display: flex; }
    /* The room for the cross is **always reserved**. Adding the padding only when
       there is text would make the already-typed characters jump one notch left the
       instant the first character is typed */
    .search-field input { padding-right: 30px; }
    .search-field input:placeholder-shown + .field-clear { visibility: hidden; }
    /* `type=search` stays for the semantics. The clear cross browsers give such an
       input is switched off: this cell's cross is drawn by the rule above, and whether
       the built-in one appears is up to the browser, so leaving it in would hand "how
       many crosses are there" to the runtime environment */
    .search-field input[type="search"]::-webkit-search-cancel-button { display: none; }
    .field-clear {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      /* 24×24 is WCAG 2.2's floor for a pointer target, while the cross inside it is
         --fs-lg (the same size as #gen-bar's close cross) — the stage being larger
         than the marker is deliberate: drawing the cross larger to match would
         overpower the text beside it */
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-3);
      font-size: var(--fs-lg);
      border-radius: var(--r-sm);
      transition: color var(--dur-1), background var(--dur-1);
    }
    .field-clear:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
    /* An inset outline: the cross is flush against the input's inner wall, and drawing it outside would push a ring beyond the field */
    .field-clear:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* Only appears while searching, so the margin travels with it: normally the whole
       block is hidden and leaves no gap.
       (The global `[hidden] { display:none !important }` outranks the display:flex
        here — that rule exists precisely because "an author's display quietly demotes
        the hidden attribute to decoration") */
    .search-extra {
      display: flex;
      flex-direction: column;
      gap: var(--s2);
      margin-bottom: var(--s3);
    }
    .add-game-btn {
      background: var(--accent);
      color: var(--accent-ink);
      border: none;
      border-radius: var(--r-md);
      padding: 8px var(--s4);
      font-size: var(--fs-md);
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--dur-1);
    }
    .add-game-btn:hover:not(:disabled) { background: var(--accent-hi); }
    .add-game-btn:disabled { opacity: 0.45; cursor: default; }
    /* Only ever a state or a fault: adding writes nothing on success, because the row
       appears in the table below */
    .add-game-msg { font-size: var(--fs-sm); }
    .add-game-msg.error { color: var(--danger); }

    .game-search-results {
      display: flex;
      flex-direction: column;
      gap: var(--s1);
      max-width: 480px;
    }
    /* The small 「Steam 商店」 line. **It is a label, not an explanation** — the
       results appear below the search box while the table above is simultaneously
       empty, and without saying so they read as "these are what I have". Two words
       finish it */
    .steam-label {
      font-size: var(--fs-sm);
      color: var(--text-3);
      letter-spacing: 0.04em;
    }
    /* The collapse row. **Made a chip rather than a link**: it is the same kind of
       thing as the filters above — 「还能往下看什么」, not 「跳去别处」. It sits
       quietly and only lights up on hover */
    .steam-more {
      align-self: flex-start;
      font: inherit;
      font-size: var(--fs-sm);
      color: var(--text-3);
      background: var(--surface);
      border: 1px dashed var(--line-2);
      border-radius: var(--r-full);
      padding: 5px var(--s3);
      cursor: pointer;
      transition: color var(--dur-1), border-color var(--dur-1);
    }
    .steam-more:hover { color: var(--text); border-color: var(--accent); border-style: solid; }
    /* A few placeholder rows while waiting for Steam to answer. **It speaks through
       shape rather than a sentence** — and says two things at once: it is busy, and
       what is coming will look like this. This used to be the sentence 「库里没有,
       正在 Steam 上找…」, and staring at one motionless sentence for two seconds does
       not distinguish running from stuck */
    .game-search-result.skeleton {
      cursor: default;
      pointer-events: none;
      animation: skel-pulse 1.1s ease-in-out infinite;
    }
    .skel-img, .skel-line {
      background: var(--surface-3);
      border-radius: var(--r-sm);
    }
    .skel-img { width: 48px; height: 23px; flex-shrink: 0; }
    .skel-line { height: 10px; flex: 1; max-width: 220px; }
    @keyframes skel-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    /* **A button, not a div.** This used to be a div with a click handler — usable
       with a mouse and entirely out of reach from the keyboard: tab could not get to
       it and Enter did nothing. As a button, keyboard reachability and the global
       :focus-visible both come for free, at the cost of a few lines resetting the
       button defaults */
    .game-search-result {
      display: flex;
      align-items: center;
      gap: var(--s3);
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      padding: var(--s2) var(--s3);
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      cursor: pointer;
      transition: border-color var(--dur-1), background var(--dur-1);
    }
    .game-search-result:hover { border-color: var(--accent); background: var(--surface-2); }
    .game-search-result img {
      width: 48px;
      height: 23px;
      object-fit: cover;
      border-radius: var(--r-sm);
      /* **`--surface-3` rather than `--bg`.** The cover URL is a guess (Steam moved
         some store assets under a content-hash path, see "cover art is guessed first"
         in CLAUDE.md), and on the store-search path there is only an appid with no
         `resolveCover` fallback that asks appdetails once — measured, searching for
         silk misses on three out of ten. Against `--bg` that cell is darker than the
         row itself and reads as a hole or a broken image; against --surface-3 it is
         simply an empty slot, the same colour as a skeleton row.
         (Do not redesign around "most of them have no image": that number came from
          a screenshot taken before the images had finished loading, and on a second
          look it is 7/10 with images.) */
      background: var(--surface-3);
      flex-shrink: 0;
    }
    .game-search-result span { font-size: var(--fs-md); }
    .game-search-result .appid-hint { color: var(--text-3); font-size: var(--fs-sm); }

    /* ========================================================================
       The row above the table: view switch on the left, count on the right
       ======================================================================== */
    /* All three things speak about **the table below**: how to look at it (view),
       what to look at (filters), and how much is showing (the count).
       Search is not here — it now bypasses the filters, and grouping them together
       would suggest the two still affect each other.

       **The controls run together on the left and the reading is pinned right.** It
       used to be space-between with three children, which pushed the filters floating
       into the exact middle with a gap on each side — reading as misaligned rather
       than as grouped. The view and the filters are both "things you can adjust" and
       the count is "the result of adjusting", and grouping by that leaves exactly two
       groups */
    .table-bar {
      display: flex;
      align-items: center;
      gap: var(--s3);
      margin-bottom: var(--s2);
      flex-wrap: wrap;
    }
    .filter-chips {
      display: flex;
      align-items: center;
      gap: var(--s2);
      flex-wrap: wrap;
      /* Search bypasses the filters (see hidingFilter). **This is shown, not read** —
         a sentence 「搜索时不看筛选」 used to follow the count, which is using text to
         patch a state that should be visible at a glance. The controls going grey say
         it completely: they genuinely have no effect at that moment */
      transition: opacity var(--dur-1);
    }
    .filter-chips.inert { opacity: 0.35; }
    /* **The last row inside the frozen area gets no bottom margin**: every extra pixel
       there is one pixel less visible table, and the topbar's own padding-bottom
       already provides the spacing.
       Likewise, the `margin-bottom: var(--s5)` at the end of the frozen area belongs
       to the topbar rather than to the rows inside it */
    .topbar .table-bar { margin-bottom: 0; }
    /* The same for the block that only appears while searching: it is the **temporary**
       last segment the frozen area grows, and a bottom margin of its own would push the
       table header down a notch on every search */
    .topbar .search-extra { margin-bottom: 0; }
    /* The result count sits **against the table**, because it speaks about this table;
       the readout in the topbar speaks about the whole library.
       Two numbers with different meanings, and putting them in one place makes them
       read as the same one */
    .row-count {
      font-size: var(--fs-sm);
      color: var(--text-3);
      margin-left: auto;   /* the reading pinned right, the controls running together on the left */
    }
    /* A segmented control: two buttons sharing one trough, with the selected one
       raised. It used to be two independent buttons whose selected state was only a
       difference in fill darkness, which does not read as "one of two" */
    /* The run's history. Fixed height with its own scroll: it grows for twenty minutes, and a
       progress bar that keeps getting taller pushes the page around while somebody is reading it */
    .gen-log {
      margin-top: var(--s2);
      max-height: 168px;
      overflow-y: auto;
      font-size: var(--fs-sm);
      color: var(--text-2);
      border-top: 1px solid var(--line-2);
      padding-top: var(--s2);
    }
    .gen-log div { display: flex; gap: var(--s2); padding: 1px 0; }
    /* Tabular figures so the times form a column instead of shifting line to line */
    .gen-log time { color: var(--text-3); font-variant-numeric: tabular-nums; flex: none; }
    .view-toggle {
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
    }
    .view-toggle button {
      background: none;
      border: none;
      border-radius: var(--r-sm);
      color: var(--text-3);
      font-family: inherit;
      font-size: var(--fs-sm);
      padding: 4px var(--s3);
      cursor: pointer;
      transition: color var(--dur-1), background var(--dur-1);
    }
    .view-toggle button:hover { color: var(--text); }
    .view-toggle button.on {
      color: var(--text-hi);
      background: var(--surface-3);
      box-shadow: var(--sh-1);
    }

    /* ========================================================================
       The table
       ------------------------------------------------------------------------
       **`border-collapse` is separate, not collapse.** The table header has to stick
       (`position: sticky`), and the `overflow: hidden` that used to be on the table
       for its corner radius confines sticky's containing block to the table itself,
       breaking the stickiness outright. So the radii moved onto the first and last
       cells, and the separators are drawn by each td's own bottom border.
       ======================================================================== */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border-radius: var(--r-lg);
      font-size: var(--fs-md);
    }
    th, td {
      padding: var(--s2) var(--s3);
      text-align: left;
      vertical-align: middle;
      border-bottom: 1px solid var(--line-1);
    }
    tbody tr:last-child td { border-bottom: none; }
    th {
      position: sticky;
      /* The topbar is frozen and the header has to stop below it. That height is
         measured by JS and written into --topbar-h — the topbar wraps and grows taller
         with the window width, so a hardcoded value is necessarily wrong */
      top: var(--topbar-h);
      z-index: 5;
      /* A sticky row has to have an **opaque** background, or the scrolling rows show through from underneath */
      background: var(--surface-2);
      color: var(--text-3);
      font-weight: 600;
      font-size: var(--fs-sm);
      letter-spacing: 0.03em;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      border-bottom: 1px solid var(--line-2);
      transition: color var(--dur-1);
    }
    th:first-child { border-top-left-radius: var(--r-lg); }
    th:last-child  { border-top-right-radius: var(--r-lg); }
    th:hover { color: var(--text-hi); }
    tbody tr:last-child td:first-child { border-bottom-left-radius: var(--r-lg); }
    tbody tr:last-child td:last-child  { border-bottom-right-radius: var(--r-lg); }

    /* The sort marker. **Two things used to be invisible here**: which column is
       sorted and in which direction, and the fact that **the header is clickable** at
       all — without moving the mouse over it there was no way to tell. So every
       sortable header carries a permanent faint ↕ (telling you it is clickable), and
       the currently sorted column switches to ▲/▼ and lights up.
       Text symbols rather than emoji: emoji come with their own colour, ignore color,
       and can be neither dimmed nor lit */
    th[data-key]::after {
      content: '↕';
      margin-left: var(--s1);
      font-size: 10px;
      opacity: 0.3;
    }
    th[data-key]:hover::after { opacity: 0.6; }
    th[data-key].sort-asc::after { content: '▲'; opacity: 1; color: var(--accent); }
    th[data-key].sort-desc::after { content: '▼'; opacity: 1; color: var(--accent); }
    th[data-key].sort-asc, th[data-key].sort-desc { color: var(--text-hi); }

    tr.game-row.expandable { cursor: pointer; }
    /* The whole row brightens on hover. A surface rather than a line: one more line among 167 rows is graph paper */
    tr.game-row:hover td { background: var(--surface-2); }

    /* ---- Row contents ----------------------------------------------------
       A row really holds three groups: **marks** (star, heart), **identity** (cover,
       name, status badges) and **actions** (guide, rewrite, more). They used to be a
       run of evenly spaced siblings with a uniform 10px gap, so the eye could not
       separate the groups; and only the final ⋮ carried margin-left:auto, leaving the
       guide button floating indeterminately to the right of the name. Now each group
       is its own block, tight within and loose between, with the action group flush
       right. */
    .game-cell {
      display: flex;
      align-items: center;
      gap: var(--s3);
    }
    .row-marks { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .row-actions {
      display: flex;
      align-items: center;
      gap: var(--s1);
      margin-left: auto;   /* the whole group flush right, rather than pushing only the ⋮ */
      flex-shrink: 0;
    }

    /* In-row icon buttons. **A different component from the topbar's .icon-btn** — see
       the block above. What is wanted here is "a glyph sitting against the content",
       not a button block */
    .row-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: var(--s1);
      color: var(--text-3);
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      border-radius: var(--r-sm);
      transition: color var(--dur-1), background var(--dur-1);
    }
    .row-icon:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
    .row-icon.active-heart { color: var(--danger); }
    .row-icon.active-star { color: var(--warn); }

    /* The 「更多」 entry at the end of a row. It is now an SVG of three dots and responds
       to color like everything else — it could previously only be the text symbol ⋮,
       because the emoji ✏️ cannot be dimmed (its colour comes with the glyph) */
    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: var(--text-3);
      opacity: 0.5;
      flex-shrink: 0;
      padding: var(--s1);
      border-radius: var(--r-sm);
      display: inline-flex;
      align-items: center;
      transition: opacity var(--dur-1), color var(--dur-1), background var(--dur-1);
    }
    /* It does not turn red on hover: it is no longer a delete button, and red would suggest "open the menu" is a dangerous action */
    .delete-btn:hover { opacity: 1; color: var(--text); background: rgba(255, 255, 255, 0.06); }

    .game-thumb {
      width: 68px;
      height: 32px;
      object-fit: cover;
      border-radius: var(--r-sm);
      flex-shrink: 0;
      background: var(--bg);
      /* Cover art varies in brightness, so an inset outline holds the edge and stops a pale cover blending straight into the table's fill */
      box-shadow: inset 0 0 0 1px var(--line-2);
    }
    /* The name block: the name and the badges have to be able to wrap, and a long Chinese name should not push the badges out of view */
    .game-name-main {
      font-weight: 500;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: var(--s1) 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    /* ---- The progress bar ------------------------------------------------
       The page's only data graphic, so it deserves a little more than "one solid
       block of colour": the fill carries a dark-to-light sense of advance, and at
       100% it gets a very faint glow — 100% is this tool's destination, and it should
       look like it arrived. */
    .bar-wrap {
      display: flex;
      align-items: center;
      gap: var(--s2);
      min-width: 148px;
    }
    .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: var(--r-full);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px var(--line-1);
    }
    .bar-fill {
      height: 100%;
      border-radius: var(--r-full);
      transition: width var(--dur-2) var(--ease);
    }
    .bar-fill.done { box-shadow: 0 0 8px rgba(102, 192, 244, 0.55); }
    .rate-text { width: 46px; text-align: right; color: var(--text-2); font-size: var(--fs-sm); }

    /* ---- Badges ----------------------------------------------------------
       There used to be four sets — .badge / .badge-new / .badge-played / .badge-btn —
       plus three border treatments (solid, dashed, none), all at different sizes. They
       now share one base and the variants change only the colour. */
    .badge, .badge-btn {
      display: inline-flex;
      align-items: center;
      gap: var(--s1);
      font-size: var(--fs-xs);
      line-height: 1.5;
      padding: 1px 7px;
      border-radius: var(--r-full);
      border: 1px solid transparent;
      white-space: nowrap;
      font-family: inherit;
    }
    .badge { background: rgba(224, 166, 63, 0.14); color: var(--warn); }
    .badge-new { background: rgba(140, 198, 63, 0.14); color: var(--ok); }
    .badge-played { background: var(--accent-soft); color: var(--accent); }
    .badge .ic, .badge-btn .ic { font-size: var(--fs-sm); }

    /* **Hover must not dim it.** A `.badge-btn:hover { opacity: 0.85 }` does exactly
       one thing to the two "switched on" tiers: **fades them** — point at something
       clickable and it becomes harder to see, which is backwards. Each tier gets a
       hover that **deepens the fill** instead, always moving towards "clearer".
       The transition names three specific properties rather than `all` — `all` sweeps
       in any property added later, including the :active transform above, which would
       make a press drag before settling. */
    .badge-btn {
      cursor: pointer;
      background: none;
      transition: background var(--dur-1), color var(--dur-1), border-color var(--dur-1);
    }
    .badge-btn-on { background: rgba(224, 166, 63, 0.14); color: var(--warn); }
    .badge-btn-on:hover { background: rgba(224, 166, 63, 0.26); }
    .badge-btn-off { border-color: var(--line-2); color: var(--text-3); }
    .badge-btn-off:hover { border-color: var(--line-3); color: var(--text); background: rgba(255, 255, 255, 0.05); }
    .badge-btn-family-on { background: var(--accent-soft); color: var(--accent); }
    .badge-btn-family-on:hover { background: rgba(102, 192, 244, 0.26); }

    .manual-input {
      width: 60px;
      background: var(--bg);
      border: 1px solid var(--line-2);
      color: var(--text);
      padding: var(--s1) 6px;
      border-radius: var(--r-sm);
      font-size: var(--fs-md);
      font-family: inherit;
    }
    .manual-input:focus { outline: none; border-color: var(--accent); }

    .na { color: var(--text-3); font-size: var(--fs-sm); }
    .loading, .empty {
      color: var(--text-3);
      padding: var(--s6) var(--s5);
      text-align: center;
    }

    /* ---- The expanded 「还差哪些成就」 ---------------------------------- */
    .missing-row td {
      background: rgba(0, 0, 0, 0.22);
      padding: var(--s4) var(--s5);
    }
    .missing-header { font-size: var(--fs-sm); color: var(--text-3); margin-bottom: var(--s3); }
    .ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(264px, 1fr));
      gap: var(--s2);
      /* **Equal heights are carried by the card, not by the guide window** (the
         default stretch, written out so it does not get changed again).
         A card has a fill and a border and is a **container** — extra whitespace
         inside it reads as padding. Whereas the accent vertical line to the left of a
         guide is a **measure**: it is drawn along the content, and however long it is
         drawn reads as how much content there is. Putting a fixed height on the window
         made the measure carry the alignment, so a short guide's line ran all the way
         to the bottom of the card and looked like an unfinished sentence. Let the
         container align, and let the measure only tell the truth.
         **The alignment holds while a guide is expanded, too.** Letting the expanded
         card's row fall back to `align-self: start` is rejected, and should not be
         re-proposed: a row is the one place cards are read side by side, so several
         different bottom edges in it read as breakage, while the room left over inside
         a card reads as padding — which is the container/measure split above. Whatever
         height the tallest card in a row takes, its row-mates take with it */
      align-items: stretch;
    }
    .ach-item {
      display: flex;
      gap: var(--s2);
      align-items: flex-start;
      background: var(--surface);
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      padding: var(--s2);
    }
    /* A flex item defaults to min-width: auto and will not shrink below its content —
       one long word in a guide's prose can widen this column and distort the whole
       grid. It has to be released explicitly */
    .ach-body { min-width: 0; flex: 1; }
    .ach-icon { width: 32px; height: 32px; border-radius: var(--r-sm); flex-shrink: 0; background: var(--bg); }
    .ach-head { display: flex; align-items: flex-start; gap: var(--s2); }
    .ach-name { font-size: var(--fs-sm); font-weight: 600; color: var(--text); flex: 1; min-width: 0; }
    /* Icon only. It sits right against the achievement name, and a sentence 「在攻略中
       打开」 would crowd the name out, while the title attribute already says it — the
       fewer words on screen the better, and long explanations belong in docs/ */
    .ach-jump {
      flex-shrink: 0;
      color: var(--text-3);
      line-height: 1;
      margin-top: 2px;
      text-decoration: none;
    }
    .ach-jump:hover { color: var(--accent); }
    .ach-desc { font-size: var(--fs-xs); color: var(--text-3); margin-top: 2px; line-height: 1.5; }
    .ach-guide-link {
      font-size: var(--fs-xs);
      color: var(--accent);
      text-decoration: none;
      margin-top: var(--s1);
      display: inline-block;
    }
    .ach-guide-link:hover { text-decoration: underline; }

    /* ---- The 「你自己攻略里怎么写的」 passage inside a card ------------- */
    /* The name and description above come from Steam and this passage is what you
       wrote; two sources should not look like the same thing — that accent vertical
       line on the left is what does that, and it is not decoration */
    /* **A fixed-height preview window, and the window is .ach-guide rather than the
       prose inside it.** Sub-steps are siblings of the prose, so pinning the height to
       the prose would leave a card with sub-steps sticking out **beyond** the window —
       four cards to a row with only the one with sub-steps standing a head taller,
       which is exactly what this rule prevents.
       height rather than max-height: the latter lets each shrink to its own size, so a
       two-line one and an eight-line one sitting side by side end up ragged. A short
       one leaves whitespace below, in exchange for equal-height cards in a row */
    .ach-guide {
      margin-top: var(--s2);
      padding-left: var(--s2);
      border-left: 2px solid var(--accent);
      /* **max-height, not height.** A short guide is short, and the vertical line
         stops where the prose ends — a fixed height drags the line to the bottom and
         reads as though there is more to come (ui-ux-pro-max's "Text Reflow and
         Spacing" lists "clipping text inside a fixed-height box" as a Critical
         anti-pattern, and "Essential Text Truncation" specifically names "clipping
         content just to make cards equal height").
         The 6-line cap applies only to a **genuinely long** guide, and comes with a
         gradient and click-to-expand, which is the "visible path to the full text"
         those two rules require.
         **em cannot be used** — .ach-guide has no font size of its own, so em would
         resolve against the table's size and adjusting the table's font size would
         change this in passing. Computed from the prose's own --fs-xs and line height,
         the cap is genuinely tied to "how many lines of guide are visible" */
      max-height: calc(var(--fs-xs) * 1.6 * 6);
      overflow: hidden;
      position: relative;
    }
    .ach-guide.expanded { max-height: none; }
    /* .clamped = the content really does overflow the preview window, applied by JS
       after measuring. The gradient and the gesture hang on it rather than on
       :not(.expanded) — otherwise a short guide (which does not overflow) would carry
       a false gradient and clicking it would do nothing */
    .ach-guide.clamped { cursor: pointer; }
    .ach-guide-text {
      font-size: var(--fs-xs);
      line-height: 1.6;
      color: var(--text-2);
      /* Inside one Notion to_do block, the achievement name / official description /
         your own method are one piece of text separated by newlines (notionblocks.js
         specifically guarantees it is not split into three blocks), and only pre-wrap
         can render that structure */
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    /* A gradient over the clip. Without it the text cuts off flat and looks as though the guide itself simply ends there */
    .ach-guide.clamped:not(.expanded)::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: calc(var(--fs-xs) * 1.6 * 2);   /* two lines of prose, and likewise no em */
      background: linear-gradient(transparent, var(--surface));
      pointer-events: none;
    }
    .ach-substep {
      display: flex;
      gap: 6px;
      margin-top: 3px;
      font-size: var(--fs-xs);
      line-height: 1.5;
      color: var(--text-3);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    /* The ticked state is drawn in CSS rather than with a character — see the icon section: emoji come with their own colour, which color cannot touch */
    .ach-substep::before {
      content: '';
      flex-shrink: 0;
      width: 9px; height: 9px;
      margin-top: 0.3em;
      border: 1px solid var(--line-3);
      border-radius: 2px;
    }
    .ach-substep.done::before { background: var(--accent); border-color: var(--accent); }
    /* 「攻略里还没写这条」. Deliberately not a warning colour: this is not an error, it is an item to do */
    .ach-gap { font-size: var(--fs-xs); color: var(--text-3); margin-top: var(--s2); }

    /* ---- The guide button group at the end of a row --------------------- */
    .guide-btn {
      background: none;
      border: 1px solid var(--line-2);
      border-radius: var(--r-md);
      cursor: pointer;
      font-size: var(--fs-xs);
      font-family: inherit;
      padding: var(--s1) var(--s2);
      color: var(--text-3);
      flex-shrink: 0;
      white-space: nowrap;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: var(--s1);
      transition: color var(--dur-1), border-color var(--dur-1), background var(--dur-1);
    }
    .guide-btn .ic { font-size: var(--fs-sm); }
    .guide-btn.has-guide { color: var(--accent); border-color: rgba(102, 192, 244, 0.4); }
    .guide-btn.has-guide:hover { background: var(--accent-soft); }
    /* The tier with no guide and no way to generate one: the space is kept but it is
       not clickable. opacity rather than another colour, to avoid adding one more
       colour that has to be remembered */
    .guide-btn.no-guide {
      opacity: 0.3;
      cursor: default;
      pointer-events: none;
    }
    /* With AI configured, a row without a guide becomes 「可以生成一份」 */
    .guide-btn.can-gen {
      opacity: 1;
      cursor: pointer;
      pointer-events: auto;
      color: var(--ok);
      border-color: rgba(140, 198, 63, 0.4);
    }
    .guide-btn.can-gen:hover:not(:disabled) { background: rgba(140, 198, 63, 0.12); }
    .guide-btn.can-gen:disabled { opacity: 0.4; cursor: default; }
    .guide-btn.to-notion:hover:not(:disabled) { color: var(--text); border-color: var(--line-3); }
    .guide-btn.to-notion:disabled { opacity: 0.4; cursor: default; }
    /* Rewriting overwrites an existing guide and is the one irreversible action on
       this row — normally understated, showing its warning colour only on hover, so
       that a column of ♻ does not make the table look like a screen full of warnings */
    .guide-btn.rewrite:hover:not(:disabled) { color: var(--warn); border-color: var(--warn); }
    .guide-btn.rewrite:disabled { opacity: 0.4; cursor: default; }
    /* Backups are the one action on this row that goes **backwards**, and it only
       appears when there really are backups — so it does not need to catch the eye,
       only to be there when it is needed. The number follows the label one level down,
       because "how many" is the reason to click it rather than its name */
    .guide-btn.backups:hover { color: var(--text); border-color: var(--line-3); }

    /* ========================================================================
       The gallery view
       ------------------------------------------------------------------------
       **The one place on the page where the visuals do the talking.**
       The capsule image is Steam's own language, so it covers the whole card; the
       name sits over a bottom gradient rather than shrinking to a thumbnail beside a
       line of description — that is what the table already does. The progress line at
       the very bottom edge of the card is the one thing this tool has to say, which is
       why it is the only graphic element on the card.

       **Portrait, filled to a minimum width, with no hardcoded column count.**
       Portrait is the shape Steam's own library uses, fits twice as many at the same
       height as landscape, and does not require cropping a landscape image into a
       portrait one.
       The reasoning for a hardcoded four columns ("auto-fill jumps between 3 and 5
       columns with the width, and four across is the shape of this view itself")
       **only holds while the cards are large**: four columns in a 1440px window means
       336px each and 504px tall, which does not fit two rows on a screen —
       and the point of this view is precisely 「一眼扫过一整个库」, where 308 games
       take dozens of screens.
       Once the cards drop to around two hundred, one column fewer costs only 9% (wide
       window) to 21% (narrow window) of width, the jumping stops being the main event,
       and "fit as many as possible" becomes its real shape instead. **To change the
       density, change only the one value below.**
       ======================================================================== */
    .gallery {
      /* Each card's minimum width. Raise it = larger and fewer cards, lower it =
         denser.
         **This value is a floor, not the rendered width** — `1fr` shares the remaining
         space among the columns, so the actual card width is (container - gaps) /
         columns and only jumps when the column count changes. In a 1217px container a
         floor of 200 gives 5 columns of 237px; to get any larger it has to cross the
         next column-count boundary, and adjusting in between has no effect */
      --card-min: 200px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
      /* The gap has to be an order of magnitude smaller than a card, or the grid is cut into blocks by trenches — which 16px is between 200px cards */
      gap: var(--s2);
    }
    /* When it is too narrow to fit even one column, let the minimum width yield rather than overflowing horizontally */
    @media (max-width: 400px) { .gallery { --card-min: 130px; } }
    .g-card {
      position: relative;
      aspect-ratio: 600 / 900;
      /* `--r-md` is 7px and **does not scale with the card width**. The cover is
         somebody else's artwork, and every extra pixel of radius cuts a little more
         off it, so what is wanted here is the minimum amount that still reads as a
         card, not an amount proportional to the card's width */
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--line-2);
      transition: transform var(--dur-2) var(--ease), box-shadow var(--dur-2), border-color var(--dur-2);
    }
    .g-card.has-guide { cursor: pointer; }
    /* Hover lifts the whole card rather than merely enlarging the image — being lifted is what says "this one is clickable" */
    .g-card:hover {
      transform: translateY(-3px);
      border-color: rgba(102, 192, 244, 0.5);
      box-shadow: var(--sh-2);
    }
    .g-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
