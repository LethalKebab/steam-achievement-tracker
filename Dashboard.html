         * takes have to be the same batch: written twice, 「全选」 would quietly take things not on
         * screen, and this dialog's next step spends money and is irreversible.
         *
         * Between the numeric filters (attributes) and the text filter (the search box) it is
         * **and**, and between several attributes it is likewise and.
         */
        function shownFilter() {
          const q = (pickFilter.value || '').trim().toLowerCase();
          const active = o.picker.active;
          const fs = o.picker.filters || [];
          return function (it) {
            if (q && it.name.toLowerCase().indexOf(q) < 0) return false;
            for (let i = 0; i < fs.length; i++) {
              if (active.has(fs[i].key) && !fs[i].test(it)) return false;
            }
            return true;
          };
        }

        /**
         * Every pickable entry in this guide, flattened.
         *
         * **Computed from `o.picker.groups` rather than scooped out of the caller's closure.** The
         * caller does have a ready-made `allItems`, but it lives in that click handler's scope
         * while these functions are inside `askConfirm` — referencing it is a runtime
         * ReferenceError that `node --check` cannot see
         */
        function pickerItems() {
          return o.picker.groups.reduce(function (a, g) { return a.concat(g.items); }, []);
        }

        /** The batch currently displayed. Used by 「全选」 and by its own availability check */
        function shownItems() {
          return pickerItems().filter(shownFilter());
        }

        function paintFilters() {
          if (!o.picker || !o.picker.filters) return;
          const active = o.picker.active;
          pickQuick.innerHTML = '';
          o.picker.filters.forEach(function (f) {
            // **Each is computed on its own, with no intersection.** This number is "how many
            // entries in this guide match it", a fact that does not move when another chip is
            // toggled; how many are visible with two chips pressed is given by the list and by the
            // n/total on each section, and the buttons need not jump along with it
            const hits = pickerItems().filter(f.test).length;
            const on = active.has(f.key);
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'ask-pick-quick' + (on ? ' on' : '');
            b.textContent = f.label;
            const n = document.createElement('span');
            n.className = 'n';
            n.textContent = hits;
            b.appendChild(n);
            // A filter with no matches would only produce an empty list, so it is greyed out; the 0 on the label already explains why
            b.disabled = hits === 0;
            b.setAttribute('aria-pressed', String(on));
            if (f.title) b.title = f.title;
            b.addEventListener('click', function () {
              if (on) active.delete(f.key); else active.add(f.key);
              // **Repaint only; the selection is untouched, so refreshOk() is not needed either** —
              // the confirm button's gate looks only at how many are selected, and this click
              // changed none. That boundary is pinned by html-smoke: sel or selected appearing in
              // this handler counts as broken
              paintPicker();
            });
            pickQuick.appendChild(b);
          });
        }

        function paintPicker() {
          if (!o.picker) return;
          const sel = o.picker.selected;
          const ok = shownFilter();
          // While filtering, every section is expanded: people filter in order to find something,
          // and hiding the results behind a collapsed section makes the filter pointless. Text
          // filters and attribute filters are no different in this respect
          const filtering = Boolean((pickFilter.value || '').trim()) || o.picker.active.size > 0;
          paintFilters();
          pickList.innerHTML = '';

          o.picker.groups.forEach(function (g) {
            const items = g.items.filter(ok);
            if (!items.length) return;

            const sec = document.createElement('div');
            sec.className = 'ask-pick-sec';

            const allOn = items.every(function (it) { return sel.has(it.apiName); });
            const someOn = !allOn && items.some(function (it) { return sel.has(it.apiName); });
            const secName = g.heading || t('pick.unsectioned');

            /**
             * The section's row is split into **two buttons, each doing one thing**:
             *
             *   the box   → select/deselect the whole section
             *   the rest  → collapse/expand
             *
             * With the whole row as one button and the box as a span inside it, there would be
             * nowhere for the collapse to go. Split in two, each action has its own target and both
             * remain native `<button>`s — the keyboard can Tab to them and Enter triggers them, with
             * no need to write a set of key handlers. **They cannot be nested**: a button inside a
             * button is invalid HTML, the browser lifts the inner one out, and the behaviour becomes
             * unpredictable.
             */
            const head = document.createElement('div');
            head.className = 'ask-pick-head';

            const box = document.createElement('button');
            box.type = 'button';
            box.className = 'ask-pick-box' + (allOn ? ' on' : someOn ? ' some' : '');
            // The box has no visible text and **has to carry its own name** — otherwise a screen
            // reader announces an unlabelled button. Written as an action rather than a state: it
            // says what pressing it will do
            box.setAttribute('aria-label', t(allOn ? 'pick.deselectAll' : 'pick.selectAll', { section: secName }));
            box.setAttribute('aria-pressed', String(allOn));
            box.addEventListener('click', function () {
              items.forEach(function (it) {
                if (allOn) sel.delete(it.apiName); else sel.add(it.apiName);
              });
              paintPicker();
              refreshOk();
            });

            const toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'ask-pick-toggle';
            const open = !o.picker.collapsed.has(secName) || filtering;
            toggle.setAttribute('aria-expanded', String(open));
            const caret = document.createElement('span');
            caret.className = 'ask-pick-caret';
            caret.setAttribute('aria-hidden', 'true');
            const nm = document.createElement('span');
            nm.className = 'nm';
            nm.textContent = secName;
            const n = document.createElement('span');
            n.className = 'n';
            n.textContent = items.filter(function (it) { return sel.has(it.apiName); }).length + '/' + items.length;
            toggle.appendChild(caret);
            toggle.appendChild(nm);
            toggle.appendChild(n);
            toggle.addEventListener('click', function () {
              if (o.picker.collapsed.has(secName)) o.picker.collapsed.delete(secName);
              else o.picker.collapsed.add(secName);
              paintPicker();
            });

            head.appendChild(box);
            head.appendChild(toggle);
            sec.appendChild(head);

            const body = document.createElement('div');
            body.className = 'ask-pick-items';
            // **Filtering ignores collapsed state.** Having to expand a section to see the matches
            // after typing a keyword makes the filter useless; and the collapsed state is recorded
            // in `collapsed`, so it is restored as it was once the filter box is cleared
            body.hidden = !open;
            sec.appendChild(body);

            items.forEach(function (it) {
              const row = document.createElement('label');
              row.className = 'ask-pick-item';
              const cb = document.createElement('input');
              cb.type = 'checkbox';
              cb.checked = sel.has(it.apiName);
              cb.addEventListener('change', function () {
                if (cb.checked) sel.add(it.apiName); else sel.delete(it.apiName);
                // Repaint only this section's count, box and body, never the whole list — a full
                // repaint bounces the scroll position back to the top while somebody is ticking
                // their way down
                const on = items.filter(function (x) { return sel.has(x.apiName); }).length;
                n.textContent = on + '/' + items.length;
                box.setAttribute('aria-pressed', String(on === items.length));
                box.setAttribute('aria-label',
                  t(on === items.length ? 'pick.deselectAll' : 'pick.selectAll', { section: secName }));
                box.className = 'ask-pick-box' + (on === items.length ? ' on' : on ? ' some' : '');
                paintCount();
                refreshOk();
              });
              const label = document.createElement('span');
              label.className = 'nm';
              label.textContent = it.name;
              row.appendChild(cb);
              row.appendChild(label);
              if (it.rarity !== null && it.rarity !== undefined) {
                const pct = document.createElement('span');
                // The threshold is sent down by the server rather than the frontend picking its own
                // — 「难」 in the interface and 「难」 as the program understands it have to be one
                // line. The 10 after it is only the fallback for when the server sends nothing, and
                // a test pins it equal to RARE_PCT
                pct.className = 'pct' + (it.rarity < (o.picker.rarePct || 10) ? ' rare' : '');
                pct.textContent = it.rarity + '%';
                row.appendChild(pct);
              }
              if (it.unlocked) {
                const d = document.createElement('span');
                d.className = 'done';
                d.textContent = t('pick.unlocked');
                row.appendChild(d);
              }
              body.appendChild(row);
            });

            pickList.appendChild(sec);
          });

          if (!pickList.children.length) {
            const empty = document.createElement('div');
            empty.className = 'ask-pick-count';
            /**
             * There are several kinds of empty, and they are **different things**: saying only
             * "empty" makes people assume the last kind, which is the only one with no way out.
             *
             * When a filter and a search are **both** active, both have to be said — reporting only
             * one sends the person off to change the other, which is not the problem. This was
             * thought of afterwards: the earlier version branched on the number of filter chips and
             * never considered the search term at all
             */
            const hasQ = Boolean((pickFilter.value || '').trim());
            const nf = o.picker.active.size;
            empty.textContent = !pickerItems().length ? t('pick.noneRewritable')
              : hasQ && nf ? t('pick.noneMatchBoth')
                : hasQ ? t('pick.noneMatchSearch')
                  : nf > 1 ? t('pick.noneMatchAll')
                    : t('pick.noneMatchOne');
            pickList.appendChild(empty);
          }
          paintCount();
        }

        /**
         * The availability of 「已选 N 条」 and 「清空」.
         *
         * **It is pulled out because it has to be callable on its own.** It used to sit at the end
         * of `paintPicker`, while ticking one entry **deliberately does not repaint the whole list**
         * (a repaint bounces the scroll position back to the top while somebody is ticking their way
         * down) — so ticking a single entry never updated this line: the numbers in the body moved
         * while it stayed stuck at the value from the last full repaint.
         *
         * The reason it went unnoticed for so long is that the sentence above it was correct, and
         * **the two numbers only disagree when read together**. It was caught by comparing the
         * number of genuinely ticked boxes in the DOM against the displayed number, rather than by
         * reading the interface.
         */
        function paintCount() {
          const sel = o.picker.selected;
          pickCount.textContent = t('pick.chosen', { n: sel.size });
          pickClear.disabled = sel.size === 0;
          // 「全选」 has nothing to do when **the displayed batch is already entirely in the
          // selection** — an empty list falls into this branch too (every is true for an empty set).
          // Greyed out beats doing nothing when pressed
          const shown = shownItems();
          pickAll.disabled = shown.every(function (it) { return sel.has(it.apiName); });
        }

        /** Hand-picking with nothing ticked = no executable request. **The gate is on the button, not in an error message** */
        function refreshOk() {
          const blocked = pickerShown() && o.picker.selected.size === 0;
          okBtn.disabled = blocked;
          okBtn.style.opacity = blocked ? '0.45' : '';
          okBtn.style.cursor = blocked ? 'default' : '';
        }

        function syncPicker() {
          const show = pickerShown();
          pickWrap.hidden = !show;
          if (show) paintPicker();
          // **It has to run whether or not there is a picker.** This dialog reuses one DOM, and the
          // previous call may have left the confirm button disabled; without an unconditional reset,
          // the next dialog without a picker opens unclickable, with nothing to explain why
          refreshOk();
        }
        if (o.picker) {
          pickFilter.value = '';
          pickFilter.oninput = paintPicker;
          // **What it takes is the displayed batch, not everything.** With no filter active the two
          // are the same, so in the most common case this button is still "select the whole set";
          // with a filter active it becomes the filter's destination
          pickAll.onclick = function () {
            const sel = o.picker.selected;
            shownItems().forEach(function (it) { sel.add(it.apiName); });
            paintPicker();
            refreshOk();
          };
          pickClear.onclick = function () {
            o.picker.selected.clear();
            paintPicker();
            refreshOk();
          };
        } else {
          // This dialog reuses one DOM: without detaching the previous callbacks, the next dialog
          // without a picker would run holding the previous o.picker
          pickFilter.oninput = null;
          pickAll.onclick = null;
          pickClear.onclick = null;
        }

        syncInput();
        syncPicker();
        okBtn.style.background = o.danger ? '#a33' : '';
        cancelBtn.style.display = o.notifyOnly ? 'none' : '';

        function close(answer) {
          modal.classList.remove('show');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          modal.removeEventListener('click', onOutside);
          document.removeEventListener('keydown', onKey);
          resolve(answer);
        }
        function onOk() { close(true); }
        function onCancel() { close(false); }
        // Clicking outside the box and pressing Esc both count as cancelling — consistent with a native confirm's convention, so nobody has to hunt for the way out
        function onOutside(e) { if (e.target === modal) close(false); }
        function onKey(e) {
          if (e.key === 'Escape') close(false);
          else if (e.key === 'Enter') {
            // **Pressing Enter with a Chinese IME commits a candidate word, it does not confirm.**
            // This dialog now has a one-line input, and this is a Chinese interface — without
            // blocking it, every word committed while typing 「把互斥关系写清楚」 would confirm this
            // (money-spending and irreversible) operation on the spot.
            //
            // Both checks are needed: `isComposing` covers the Enter during IME composition, while
            // an Enter after composition ends with focus still in the input should also not count as
            // confirming — the person is still writing rather than deciding
            if (e.isComposing || e.keyCode === 229) return;
            // Both inputs in the dialog (「怎么改」 and the picker list's filter) count as "still writing", not deciding
            if (e.target === inputEl || e.target === pickFilter) return;
            if (okBtn.disabled) return; // 「自选」 chosen with nothing ticked: Enter must not bypass that gate
            close(true);
          }
        }

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        modal.addEventListener('click', onOutside);
        document.addEventListener('keydown', onKey);
        modal.classList.add('show');
        okBtn.focus();
      });
    }

    // Click outside modal to dismiss
    document.getElementById('addConfirmModal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('show');
    });

    function loadDashboard() {
      rpc.withSuccessHandler(function(data) {
        // **Before the first paint.** Everything below composes through t(), so the language has to
        // be settled first or the readings, the table and the bell all bake in the wrong one and
        // only correct themselves the next time each happens to be redrawn.
        //
        // There is no live toggle on this page — it lives on /setup, and coming back from there is
        // a full navigation — so this is the only place the language is read
        LANG = data.uiLanguage === 'en' ? 'en' : 'zh';
        docTitleKey = 'title.page';
        applyStrings();
        allGames = data.games;
        // cardTotal belongs solely to render() — only it knows the filter results
        document.getElementById('cardAvg').textContent = data.avgRounded || '-';
        document.getElementById('cardPerfect').textContent = fmtCount(data.perfectCount);
        document.getElementById('cardAchieved').textContent = fmtCount(data.achievedTotal);
        // The element ships with data-t="ui.loading" so it reads correctly before this arrives.
        // Once it holds a real timestamp that key is wrong, and applyStrings would repaint 「加载中…」
        // over it on the next call — so the key is removed along with the placeholder text
        const updated = document.getElementById('lastUpdated');
        delete updated.dataset.t;
        updated.textContent = t('sync.lastUpdated', { when: data.lastUpdated });
        renderBell();
        render();
      }).withFailureHandler(function(err) {
        document.getElementById('gameTableBody').innerHTML =
          '<tr><td colspan="4" class="empty">' + escapeHtml(t('sync.loadFailed', { reason: err.message })) + '</td></tr>';
      }).getDashboardData();
    }

    loadDashboard();
    // The archive index is fetched in parallel with the table and **not chained after
    // loadDashboard**: it feeds only one count in the ⋯ menu, and being slow or unavailable should
    // not hold up the whole table. On failure archiveIndex keeps its previous value, since a menu
    // missing a number beats a row disappearing (which is what that return inside loadArchiveIndex
    // means)
    loadArchiveIndex();

    // ---- The 「立即同步」 button ---------------------------------------------
    // This button is only responsible for starting. The progress bar, the in-place refresh
    // afterwards and the new-achievement notice were all implemented in lib/rpc.js for the automatic
    // sync at startup; the manual sync reuses that set and none of it is rebuilt here.
    const syncBtn = document.getElementById('syncNowBtn');
    const syncMsg = document.getElementById('syncMsg');
    // Between the press and the first poll confirming running there is a window of up to 3 seconds,
    // during which a poll may still come back with a stale running:false and flash the button back
    // to clickable. This flag is what covers that window.
    let syncStarting = false;

    syncBtn.addEventListener('click', function() {
      syncStarting = true;
      syncBtn.disabled = true;
      syncMsg.className = 'sync-msg';
      syncMsg.textContent = t('sync.starting');

      rpc.withSuccessHandler(function(res) {
        if (res && res.error) {
          syncStarting = false;
          syncBtn.disabled = false;
          syncMsg.className = 'sync-msg error';
          syncMsg.textContent = res.error;
          return;
        }
        syncMsg.textContent = '';
      }).withFailureHandler(function(err) {
        syncStarting = false;
        syncBtn.disabled = false;
        syncMsg.className = 'sync-msg error';
        syncMsg.textContent = t('sync.startFailed', { reason: err.message });
      }).startSync();
    });

    // lib/rpc.js calls back with the background sync's state every 3 seconds. The button follows the
    // backend's real state rather than keeping its own — so a sync started by the CLI or by another
    // tab also presses the button in, and a failed sync also releases it
    // (the failure path deliberately does not trigger reloadDashboard, and relying on loadDashboard
    // alone would leave the button stuck).
    let wasSyncRunning = false;
    window.onSyncState = function(s) {
      if (s.running) syncStarting = false;
      syncBtn.disabled = s.running || syncStarting;
      // The button is an icon now, so **textContent must not be written** — that would replace the
      // 🔄 with text and take the .icon-glyph inside it with it.
      // The in-progress indication hangs on the line along the topbar's bottom edge (see
      // .topbar.syncing) rather than on the button: the button itself only dims through disabled,
      // with a title to read on hover
      // **Boolean() cannot be dropped.** classList.toggle's second argument being undefined makes it
      // **flip** rather than clear — so the moment the state object lacks running (which happens
      // when a poll gets a malformed response), this line lights and goes dark every 3 seconds and
      // never stops. Hardcoded to a boolean, the worst case is "does not light up" rather than
      // "flickers"
      document.querySelector('.topbar').classList.toggle('syncing', Boolean(s.running));
      // The icon spins as well. **That was impossible in the emoji era** — 🔄 on Windows is one
      // whole glyph of "a blue square with a white arrow", so rotating it rotates that plate, which
      // looks ridiculous; as an inline SVG what rotates is the arrow itself. The sweep along the
      // topbar's bottom edge stays: that one is for peripheral vision (visible however far the page
      // is scrolled) while this one on the button is for confirming "I just pressed it, did it do
      // something". Boolean() is likewise required, for the reason above
      syncBtn.classList.toggle('spinning', Boolean(s.running));
      syncBtn.title = s.running
        ? t('sync.running')
        : t('sync.buttonTitle');

      // Only progress notices like "正在启动…" are cleared. An error has to stay: the poll comes
      // every 3 seconds, and clearing unconditionally would wash away an error that has just
      // appeared, which is the click's only feedback.
      // (A scenario that genuinely happens: the CLI or another tab has just started a sync and the
      // button is clicked before its poll notices)
      if (s.running && !syncMsg.classList.contains('error')) syncMsg.textContent = '';

      // Conversely, once a sync finishes, "同步正在进行" is out of date — leaving it up is a false
      // alarm.
      if (wasSyncRunning && !s.running) {
        syncMsg.className = 'sync-msg';
        syncMsg.textContent = '';
      }
      wasSyncRunning = s.running;
    };

    // ---------------------------------------------------------------
    // AI guide generation
    // ---------------------------------------------------------------
    // This is **the only button on the page that costs money**, so it has to ask before being
    // pressed, and it has to say clearly what will happen and what the machine cannot verify — the
    // user does not see any of the CLI's notices.
    const genBar = document.getElementById('gen-bar');
    const genMsg = document.getElementById('gen-msg');

    /**
     * **A running job's progress cannot be dismissed; a finished one's result can.**
     *
     * There is one control, and which one it is comes from state: while live, 「取消生成」 and
     * nothing else; once finished, 「关闭」. The strip itself stays put for the length of the run —
     * it is a few lines, and the one part that grows, the step history, is behind its own
     * disclosure and closed by default.
     */
    let genLive = false;
    /**
     * The job the Cancel button targets — set from `guideGenStatus`'s own `appid`/`game` each time
     * it reports one running, never from what the button that started it happened to click.
     * Otherwise the bar would keep pointing at whichever game the user pressed 生成/重写 on most
     * recently, which after a queued job actually starts running is a **different** game than the
     * one the bar is now showing progress for — cancel would hit the wrong job with no error at all.
     */
    let genRunningAppid = null;
    let genRunningGame = '';

    function syncGenChrome() {
      // **Boolean() cannot be dropped**, for the same reason as the two on the sync button:
      // classList.toggle's second argument being undefined makes it **flip** rather than clear. It
      // is nastier here — the poll comes every 3 seconds, so once one arrives with a missing field,
      // the bar swaps its buttons every 3 seconds
      genBar.classList.toggle('live', Boolean(genLive));
    }

    document.getElementById('genClose').addEventListener('click', function () {
      genBar.style.display = 'none';
    });

    const genCancelBtn = document.getElementById('genCancel');
    genCancelBtn.addEventListener('click', async function () {
      if (!genRunningAppid) return;
      const appid = genRunningAppid;
      const name = genRunningGame || appid;
      const ok = await askConfirm({
        title: t('gen.cancelTitle', { game: name }),
        body: t('gen.cancelBody'),
        okText: t('gen.cancelOk'),
        danger: true,
      });
      if (!ok) return;
      // Disabled until the next poll — not to prevent a double-send (a second cancel on an
      // already-cancelling job is harmless, see cancelGuideGen), but because the confirm dialog
      // makes a second click while waiting an easy accident, and a button that visibly did
      // something is less alarming than one that silently accepted a second click
      genCancelBtn.disabled = true;
      // **Said out loud immediately, not left to the next 3-second poll.** The disabled icon
      // alone is not "feedback" in any sense a confirm-then-wait interaction needs — the request
      // to cancel still has to reach the server, tear down the in-flight call, and unwind the
      // job's promise before a real result exists, and none of that is instant. Overwritten by
      // the next poll either way, so a stale "cancelling…" can never be stranded on screen
      showGen('⏳ ' + escapeHtml(t('gen.cancelling', { game: name })), false, true);
      rpc
        .withSuccessHandler(function (r) {
          // **The actual outcome never arrives here.** A successful cancel only tears down the
          // in-flight request; the job's own promise still has to unwind (reject, run its
          // `.catch`, call `guideGenState.end`) before `finished` carries a record of it — that
          // is what the next poll picks up, same as any other ending. This handler only has to
          // report a request that could not even be issued
          if (!r || !r.cancelled) {
            genCancelBtn.disabled = false;
            showGen(GEN_WARN + ' ' + escapeHtml((r && r.error) || t('gen.cancelOk')), true, true);
          }
        })
        .withFailureHandler(function (err) {
          genCancelBtn.disabled = false;
          showGen(GEN_WARN + ' ' + escapeHtml(String(err)), true, true);
        })
        .cancelGuideGen(appid);
    });
    let aiReady = false;
    let notionReady = false;

    (async function loadAiState() {
      const s = await new Promise((resolve) => {
        rpc.withSuccessHandler(resolve).withFailureHandler(() => resolve({})).getSettings();
      });
      aiReady = Boolean(s && s.hasAiKey);
      // Moving to Notion needs both: a token (able to write) and a database ID (knowing where)
      notionReady = Boolean(s && s.hasNotionToken && s.notionDbId);

      // **Repaint only; do not re-fetch.** `aiReady` / `notionReady` affect only how things are
      // drawn, not what is drawn, and `allGames` is already in memory by now — calling
      // `loadDashboard()` here would re-fetch the whole dashboard to flip one boolean.
      //
      // And that would make a race visible: `aiReady` starts false, and the `loadDashboard()` on
      // page load (the line below) is already in flight, so whether the buttons appear depends on
      // which returns first, `getSettings` (reading an object from memory) or `getDashboardData`
      // (reading the whole database). Normally the former wins comfortably. But **the server is busy
      // right after first-run setup** — startupJobs' full sync, guide discovery and ticking are all
      // running, and Node is single-threaded, so the order inverts: a table with no buttons is
      // painted first and they only appear once a second full fetch reaches the front of the queue.
      // A real user reported this; the symptom is "no generate button after connecting Notion, and a
      // refresh brings it back".
      //
      // Both arrival orders are correct: `allGames` still being empty means that loadDashboard is
      // still on its way, and by the time it lands aiReady is already true, so nothing extra is
      // needed here.
      if ((aiReady || notionReady) && allGames.length) render();
    })();

    /**
     * A local guide → Notion. **Preview before asking**: the conversion may degrade tables and
     * toggle blocks into plain paragraphs, and without putting that in the confirm dialog the user
     * is pressing "confirm" without knowing what will be lost.
     */
    /**
     * Rewrites an existing guide. **Preflight before asking**, the same flow as `guide-to-notion`
     * and for the same reason: a "confirmation" given without knowing what will be lost is not a
     * confirmation.
     *
     * The one thing an overwrite genuinely loses is **hand-ticked sub-step boxes** — achievement
     * boxes are ticked back exactly as they were by the mechanical pass from the database, while
     * sub-step boxes match no achievement. That sentence is produced by the server's
     * formatPreflight, the same wording as on the CLI side.
     */
    window.rewriteGuide = async function (appid, name) {
      setGuideBusy(appid, true);
      showGen(escapeHtml(t('gen.checking', { game: name })), false, true);

      // **Both preflights are fetched together, and their failures are not the same thing.**
      //
      // `previewGuideRewrite` is the **gate**: it runs the very plan a whole rewrite would run, and
      // if that does not go through the dialog should not open at all (the default lands on whole).
      // `previewGuidePatch` only fetches the pickable entries back, and its failure merely greys out
      // 「自选」 while whole proceeds — which is why `p.error` blocks and `sc.error` does not.
      //
      // They run in parallel because in series the picker list would appear after the dialog: a
      // dialog painted first and then growing a column of achievements by itself looks like the
      // click missed
      const [p, sc] = await Promise.all([
        new Promise((resolve) => {
          rpc.withSuccessHandler(resolve)
            .withFailureHandler((err) => resolve({ error: String(err && err.message || err) }))
            .previewGuideRewrite(appid);
        }),
        new Promise((resolve) => {
          rpc.withSuccessHandler(resolve)
            .withFailureHandler((err) => resolve({ error: String(err && err.message || err) }))
            .previewGuidePatch(appid);
        }),
      ]);
      if (!p || p.error) {
        setGuideBusy(appid, false);
        return showGen(GEN_WARN + ' ' + escapeHtml((p && p.error) || t('gen.preflightFailed')), true, false);
      }

      /**
       * The scope row. **The buttons carry their counts, so no sentence explaining them is
       * needed** — 「稀有 5」 says what it is by itself. This cell is the main decision in this
       * dialog.
       *
       * A scope with a count of 0 **stays in place but is unclickable** rather than hidden: hidden,
       * 「这游戏没有稀有成就」 and 「没有这个功能」 are the same thing in the interface, and they are
       * not. One that cannot be computed (Steam not returning unlock rates, say) is likewise grey,
       * but its title states the reason — the two greys mean opposite things.
       */
      const pickGroups = (sc && !sc.error && sc.pickable) ? sc.pickable : [];
      const pickable = pickGroups.reduce(function (n, g) { return n + g.items.length; }, 0);
      // The threshold is sent down by the server (see rarePct in previewGuidePatch) rather than the
      // frontend picking its own — which entries 「稀有」 selects, when a percentage is coloured as
      // emphasis, and which entries the prompt decides to write in depth all have to be one line
      const rarePct = (sc && sc.rarePct) || 10;

      /**
       * The two chips above the list. **They are filters, not selections** — pressing one changes
       * only "what is displayed" and touches nothing already ticked. This cell went through two
       * rounds of changes, both overturned by real use:
       *
       * **Version one: a switch-like "batch select".** Lit meant "this batch is entirely in the
       * selection". That meaning is a **derived fact**, while users read it as "I pressed this key":
       * press 「稀有」 → 27 entries tick → the one unlocked achievement happens to be rare as well →
       * everything under 「未解锁」 is now in the selection → it **lights up too**, though nobody
       * pressed it; press it again (lit, so the action subtracts) → 「稀有」 goes dark with it. Press
       * one key, and what lights or darkens is the other.
       *
       * **Version two: a one-shot "add to selection" with no pressed state.** That chain reaction
       * was gone, but it could only ever produce a **union** — 「稀有里去掉已解锁的」 and 「既稀有又
       * 没打的」 could not be expressed (those two are in fact the same set), leaving no option but
       * selecting 22 and then unticking them one at a time.
       *
       * **Now: filters.** Both pressed = and, which is precisely the unreachable intersection; while
       * "take this batch" goes to the 「全选」 below — **looking and selecting are separated**, so
       * you first see what those 22 look like and then decide whether you want them.
       * That is also what this dialog should be: the next step spends money and is irreversible, and
       * should not be confirmed over a set nobody has looked at.
       *
       * The pressed state is honest again as a result: it means "I pressed this filter", a state
       * changed only by clicking.
       *
       * 「全选」 is not here — it is not an attribute but an action, and belongs in the cell beside
       * the count.
       */
      const filters = [
        {
          key: 'rare', label: t('scope.rare'),
          title: t('scope.rareTitle', { pct: rarePct }),
          test: function (it) { return it.rarity !== null && it.rarity !== undefined && it.rarity < rarePct; },
        },
        {
          key: 'locked', label: t('scope.locked'),
          title: t('scope.lockedTitle'),
          test: function (it) { return !it.unlocked; },
        },
      ];

      // `collapsed` stores the names of the sections that are **collapsed**, not the expanded ones —
      // everything is expanded by default, and "the default is an empty set" is one less piece of
      // state that has to be kept in sync with groups than "the default is every section name"
      const picker = {
        groups: pickGroups,
        selected: new Set(),
        collapsed: new Set(),
        filters: filters,
        // Which chips are pressed. **A separate set from selected**, which is the point of the whole
        // change: filtering touches this one, selecting touches selected, and neither touches the
        // other
        active: new Set(),
        rarePct: rarePct,
        when: function (s) { return s.scope === 'pick'; },
      };

      /**
       * **The scope is now a genuine choice of two.**
       *
       * This row used to mix 「整篇」 with three computed sets, and the latter are not "scopes" but
       * "starting points for a selection" — modelling them as scopes was a category error. Now:
       * whole = rewrite everything, hand-picked = I choose.
       */
      const scopeChoice = {
        key: 'scope',
        label: t('scope.range'),
        value: 'all',
        options: [
          { value: 'all', label: t('scope.whole') },
          {
            value: 'pick',
            label: t('scope.pick'),
            // With nothing locatable there is nothing to pick. Greyed out with an explanation beats opening an empty list
            disabled: pickable === 0,
            title: pickable === 0 ? t('pick.noneRewritable') : t('scope.pickTitle'),
          },
        ],
      };
      const rewriteChoice = effortChoice();
      // The one-line requirement. It appears only when a partial scope is chosen — a whole rewrite
      // has no use for it, and leaving it there is an input field nobody reads
      const noteInput = {
        /**
         * This field's label changed twice, both times for the same thing: sparing people from
         * guessing what goes in it.
         *
         *   「要求」    — too abstract; two characters later you still do not know what is wanted
         *   「怎么改」  — concrete, but it is a **question**, while the two labels beside it (scope,
         *                 treatment) are noun phrases. One question among a group of nouns reads as
         *                 careless — exactly the problem 「挑几条」 once had in a row of nouns
         *   「重写要求」— a noun phrase, keyed to this dialog's title (重写…), and carrying the "a
         *                 requirement about what" half that a bare 「要求」 lacks
         *
         * "What to put in it" is handled by the placeholder, which answers the real question: what
         * happens if it is left blank.
         */
        label: t('rw.requirements'),
        // What the placeholder really has to answer is **what happens if it is left blank**: that is
        // the question behind 「我该填什么」.
        // State the consequence of leaving it blank first, then give an example that can be copied
        placeholder: t('rw.placeholder'),
        value: '',
        when: function (s) { return s.scope !== 'all'; },
      };

      const ok = await askConfirm({
        title: t(p.existing && p.existing.lang && p.existing.lang !== LANG ? 'rw.titleLang' : 'rw.title', { game: name }),
        /**
         * **This dialog has no body.** Four rounds of cutting left not one sentence, because every
         * one of them restated something already on screen:
         *
         *   「约 2–4 分钟」                      the same input measured 76/174/337 seconds, and once
         *                                        the treatment became selectable the fast tier is
         *                                        eight times faster, so a fixed figure is simply wrong
         *   「现有 51 个 checkbox 会被整份替换」  「整篇」 already says everything is replaced, and 51
         *                                        is just a count
         *   「只改选中的 27 条」                  the 「已选 27 条」 line at the foot of the list is
         *                                        right beside it
         *   「原文先备份」                        a safety net on our side, not a decision for them
         *   「N 个手动勾的子步骤会变回未勾选」    「重写」 already implies this, and the backup exists
         *
         * The title asks whether to rewrite, while scope, count and requirement are all stated by the
         * controls below — the state sits there itself and needs no narration.
         *
         * **The CLI side is not cut along with it:** `formatPreflight` still prints every manual tick
         * that will be lost. The command line is read by somebody who typed a flag and can afford
         * detail; the interface has to be short. Forcing one piece of copy on both suits neither —
         * the same reasoning as `previewGuideRewrite` returning numbers rather than sentences.
         */
        okText: t('rw.ok'),
        danger: true,
        choices: [scopeChoice, rewriteChoice],
        input: noteInput,
        picker: picker,
      });
      if (!ok) {
        setGuideBusy(appid, false);
        genBar.style.display = 'none';
        return;
      }

      /**
       * Whole goes through overwrite and hand-picked through scope. **The two are never sent
       * together** — the server branches on whether scope is empty, and sending both would make
       * "which one actually ran" depend on the server's order of checks.
       *
       * Hand-picked always sends **a list of named api_names**, taking the backend's explicit-list
       * branch in `resolveScope` — the interface needs no selector kinds of its own. api_name rather
       * than the achievement name, because achievements with duplicate names cannot be named by name
       * (the library genuinely has 12 such groups).
       *
       */
      const scope = scopeChoice.value === 'all'
        ? null
        : { selector: [...picker.selected].join(','), note: noteInput.value.trim() || null };

      rpc
        .withSuccessHandler(function (r) {
          if (r && r.error) {
            setGuideBusy(appid, false);
            return showGen(GEN_WARN + ' ' + escapeHtml(r.error), true, false);
          }
          showGen(escapeHtml(t('rw.running', { game: name })), false, true);
          pollGen();
        })
        .withFailureHandler(function (err) {
          setGuideBusy(appid, false);
          showGen(GEN_WARN + ' ' + escapeHtml(err), true, false);
        })
        .startGuideGen(appid, true, rewriteChoice.value, scope);
    };

    /**
     * The cell shared by generation and rewriting. **Defaults to 「深度模式」**, and that default was
     * measured rather than chosen: for one game with one prompt, 9 of low's 16 entries were
     * template sentences like 「第 III 章全体查证正确即解锁」, while high had none.
     *
     * **Two tiers, not three.** In the same measurement high and medium could not be told apart —
     * both had 0 template sentences and the time difference was buried in the noise, with the cliff
     * only between medium and low. Three buttons of which two have no measurable difference makes
     * people stop and weigh up a choice that does not exist; and the only note that could honestly be
     * written for it is 「这两个一样」. medium is still accepted in config.json, it is simply not put
     * on screen.
     *
     * And medium is not even cheap: 262 seconds against high's 280, saving 6%.
     *
     * **Which achievements those 9 fell on is on record**, see the Obra Dinn A/B in CLAUDE.md: high's
     * extra searches buy **breadth across the medium-difficulty batch** (the fifth query in the
     * search log looked up the chapter list), while on the single hardest entry low actually wrote
     * better. So the low tier loses on the middle batch, not on the hard ones.
     *
     * **But that does not go into the on-screen copy.** Nobody sorts their achievements by difficulty
     * before generating, and 「中等难度的成就会变差」 does not help them decide. The copy states the
     * two ends they genuinely weigh: how much is saved and what is lost. The difficulty layer stays
     * here and in CLAUDE.md.
     *
     * Every conclusion rests on one measurement (one game, 16 entries) — including the "the three
     * tiers are not evenly spaced" one, so two tiers are no riskier than three; they rest on the same
     * number. To change the conclusion, measure again first.
     *
     * A segmented control rather than a slider: a slider does not work at all with two tiers, and
     * even with three its shape implied even spacing.
     */
    function effortChoice() {
      return {
        // The group's key. askConfirm collects each group's current value into an object for the body
        // function, so both "which scope was chosen" and "how deep" are readable in that sentence
        key: 'effort',
        /**
         * The group name and the tier names state the **outcome**, not the parameter. The knob on the
         * API is called effort with values low/high, but what the screen has to answer is 「选它会怎
         * 样」 — carrying the parameter name across says not one word about what deep does or what
         * shallow does.
         *
         * **Labels only: no note line.** Each tier used to carry a sentence, and the fast one named
         * the measured cost (9 of 16 entries came back as template sentences). Stacked explanations
         * turn a two-click confirmation into something to read. The difference between the tiers is
         * not lost, it moved: `docs/configuration.md` carries the whole measured table, which is
         * more than a note line could ever say. **A dialog is not where someone reads.**
         */
        label: t('gen.style'),
        options: [
          { value: 'low', label: t('gen.fast') },
          { value: 'high', label: t('gen.deep') },
        ],
        value: 'high',
      };
    }

    window.migrateGuide = function (appid, name) {
      setGuideBusy(appid, true);
      showGen(escapeHtml(t('gen.checking', { game: name })), false, true);
      rpc
        .withSuccessHandler(async function (p) {
          if (!p || p.error) {
            setGuideBusy(appid, false);
            return showGen(GEN_WARN + ' ' + escapeHtml((p && p.error) || t('gen.previewFailed')), true, false);
          }
          // Verifying entry by entry, leaving the local file alone on a mismatch, and the page's icon
          // are all "how we make sure nothing goes wrong" rather than decisions for them. The only
          // two things they genuinely need to know are: what is being moved, and where the original
          // goes
          const lines = [
            t('mv.checkboxes', { n: p.todos }),
            t('mv.localKept'),
          ];
          if (p.unconverted && p.unconverted.length) {
            lines.push(GEN_WARN + ' ' + t('mv.unconverted', { n: p.unconverted.length }));
          }
          const goMigrate = await askConfirm({
            title: t('mv.title', { game: p.game }),
            body: lines.join('\n'),
            okText: t('mv.ok'),
          });
          if (!goMigrate) {
            setGuideBusy(appid, false);
            genBar.style.display = 'none';
            return;
          }
          showGen(escapeHtml(t('mv.running', { game: p.game })), false, true);
          rpc
            .withSuccessHandler(function (r) {
              if (!r || r.error) {
                setGuideBusy(appid, false);
                return showGen(GEN_WARN + ' ' + escapeHtml((r && r.error) || t('gen.moveFailed')), true, false);
              }
              showGen(
                GEN_OK + ' ' + escapeHtml(t('mv.done', { game: r.game, n: r.count })) +
                  '<br><a href="' + escapeHtml(r.url) + '" target="_blank" rel="noopener">' + escapeHtml(t('mv.openPage')) + '</a>' +
                  (r.archivedTo ? '<br><span class="warn">' + escapeHtml(t('mv.archived')) + '</span>' : ''),
                false, false
              );
              // The success path used to release nothing — it relied on loadDashboard() repainting a
              // fresh button to "wash" the greying away. Once the greying was rendered from guideBusy
              // that route was gone, and without an explicit release it would be stuck permanently.
              // The migration has also just moved the local original into `.migrated/`, so the backup
              // count changed too
              setGuideBusy(appid, false);
              refreshArchives();
              loadDashboard();
            })
            .withFailureHandler(function (err) {
              setGuideBusy(appid, false);
              showGen(GEN_WARN + ' ' + escapeHtml(err), true, false);
            })
            .migrateGuideToNotion(appid);
        })
        .withFailureHandler(function (err) {
          setGuideBusy(appid, false);
          showGen(GEN_WARN + ' ' + escapeHtml(err), true, false);
        })
        .previewGuideToNotion(appid);
    };

    // **The button calls this directly rather than going through event delegation.** The button
    // carries event.stopPropagation() (the row itself is clickable too, and without blocking it the
    // achievement detail would expand at the same time), and stopPropagation means a delegate on
    // document never receives that click — presenting as "clicked and nothing happened", with not one
    // error in the console. Stepped on once
    window.genGuide = async function (btn) {
      const appid = btn.getAttribute('data-gen');
      const name = btn.getAttribute('data-name') || appid;
      // **Ask only; do not explain.** Generation is reversible (delete the page if you do not like
      // it) and there is no "what you lose by trusting this wrongly" to warn about — the duration is
      // visible on the progress bar, and "the content is unverified" belongs at the point where the
      // guide has actually been written and they are about to read it, so it stays on the result line
      // rather than here.
      // The dialogs that do lose something (rewrite, delete) are not covered by this rule; their
      // bodies are mandatory
      const choice = effortChoice();
      const ok = await askConfirm({ title: t('gen.title', { game: name }), okText: t('gen.ok'), choices: [choice] });
      if (!ok) return;
      btn.disabled = true;
      rpc
        .withSuccessHandler(function (r) {
          if (r && r.error) {
            btn.disabled = false;
            showGen(GEN_WARN + ' ' + escapeHtml(r.error), true, false);
            return;
          }
          // Queued and started have to read differently. **This one especially**: one generation takes
          // several minutes, and once queued the progress bar shows **somebody else's** game name —
          // without saying so, the user concludes their click was lost
          showGen(r && r.queued
            ? GEN_QUEUE + ' ' + escapeHtml(t('gen.queued', { game: name, n: r.position }))
            : escapeHtml(t('gen.running', { game: name })), false, true);
          pollGen();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          showGen(GEN_WARN + ' ' + escapeHtml(err), true, false);
        })
        .startGuideGen(appid, false, choice.value, null);
    };

    /**
     * @param {string}  html
     * @param {boolean} [dim]  dimmed (a warning or a failure)
     * @param {boolean} [live] does this line mean "still running". **The finished line has to pass
     *                         false explicitly**, or it cannot be closed: the close button only
     *                         appears when not live
     */
    /**
     * The run's history, behind a disclosure.
     *
     * **Closed by default.** The one line above answers "what now"; this answers "has it moved",
     * and only somebody who has started to doubt that goes looking. Opening it is what issue #78
     * asked for — during a twenty-minute run the bar could only ever show the current sentence, so
     * a run that had been working for a quarter of an hour looked like one that had died.
     *
     * The times are what does the work here, not the wording: a line stamped four minutes ago says
     * "stuck" and one stamped four seconds ago says "fine", without anyone having to describe either.
     */
    let genLogOpen = false;

    /**
     * `hh:mm:ss`, built from the parts rather than through `toLocaleTimeString`.
     *
     * **No locale is involved, deliberately.** The system one gives `3:45:47 PM` under a Chinese
     * interface, and hardcoding `zh-CN` instead is the defect this project has already been bitten
     * by twice — a locale argument is invisible to the string table, so it survives a language
     * switch untouched. A timestamp column is not prose; it wants one fixed shape and a stable
     * width, which is also what `tabular-nums` on it is for.
     */
    function logTime(iso) {
      const d = new Date(iso);
      const two = function(n) { return String(n).padStart(2, '0'); };
      return two(d.getHours()) + ':' + two(d.getMinutes()) + ':' + two(d.getSeconds());
    }

    function genLogHtml(s) {
      const log = (s && s.log) || [];
      if (!log.length) return '';
      const btn = '<button type="button" class="gen-link" data-genlog="1">'
        + escapeHtml(t(genLogOpen ? 'gen.hideLog' : 'gen.showLog')) + '</button>';
      // Newest last, so it reads downward like a transcript and the live end is where it rests
      const rows = log.map(function(e) {
        return '<div><time>' + escapeHtml(logTime(e.at)) + '</time>'
          + '<span>' + escapeHtml(e.text) + '</span></div>';
      }).join('');
      // **Always emitted, hidden when closed**, so opening it is one attribute rather than a
      // repaint. The repaint is driven by a three-second poll, and a disclosure that does nothing
      // for up to three seconds reads as a button that does not work
      return '<br>' + btn + '<div class="gen-log"' + (genLogOpen ? '' : ' hidden') + '>' + rows + '</div>';
    }

    function showGen(html, dim, live) {
      genBar.style.display = 'block';
      if (live !== undefined) genLive = live;
      // Written into the inner span rather than overwriting genBar itself — the two buttons are its
      // siblings, and overwriting innerHTML would wash them away with it
      genMsg.innerHTML = dim ? '<span class="warn">' + html + '</span>' : html;
      // 「打开文件夹」 is a node created afresh every time the content is rewritten, so every
      // handler below is bound here, on the nodes this repaint just made
      // Deleting a backup is **irreversible**, so it uses the same gesture as the backup panel: the
      // first click turns the button into the consequence and only the second deletes. This one
      // opens no dialog — the progress bar is already a floater, and stacking another would push
      // 「删的是哪一份」 out of sight
      // Restoring is **another overwrite**, and on the Notion side it also deletes the whole page's
      // blocks before writing back, so it takes the same two-click gesture as the backup panel, with
      // the second click's label stating the consequence rather than 「确定」
      genMsg.querySelectorAll('[data-restore-backup]').forEach(function(b) {
        const label = b.textContent;
        let armed = false;
        b.addEventListener('click', function(e) {
          e.stopPropagation();
          if (!armed) {
            armed = true;
            b.textContent = b.getAttribute('data-restore-label');
            b.classList.add('armed');
            return;
          }
          b.disabled = true;
          rpc.withSuccessHandler(function(res) {
            if (res && res.error) {
              b.disabled = false;
              armed = false;
              b.classList.remove('armed');
              b.textContent = t('res.actionFailed', { label: label, reason: res.error });
              return;
            }
            // **Where the displaced copy went has to be said.** Restoring is itself an overwrite, and
            // the copy just created is now its way back — not saying so buries the same thing all
            // over again
            b.textContent = res && res.backedUpTo ? t('res.rolledBackKept') : t('res.rolledBack');
            b.classList.remove('armed');
            // The 「删除备份」 beside it now points at **the source of the content just written
            // back**, while what one most likely wants to delete is the new version that was just
            // displaced. Leaving it would only delete the wrong copy, so it is removed
            const drop = genMsg.querySelector('[data-drop-backup]');
            if (drop) drop.remove();
            refreshArchives();  // the 「备份 N」 at the end of the row has changed
            loadDashboard();    // the registration may have flipped from notion back to local, so the row's guide link has to follow
          }).withFailureHandler(function(err) {
            b.disabled = false;
            armed = false;
            b.classList.remove('armed');
            b.textContent = t('res.restoreFailed', { reason: err.message });
          }).restoreGuideArchive(b.getAttribute('data-restore-backup'));
        });
      });

      genMsg.querySelectorAll('[data-drop-backup]').forEach(function(b) {
        const label = b.textContent;
        let armed = false;
        b.addEventListener('click', function(e) {
          e.stopPropagation();
          if (!armed) {
            armed = true;
            b.textContent = t('res.deleteArmed');
            b.classList.add('armed');
            return;
          }
          b.disabled = true;
          rpc.withSuccessHandler(function(res) {
            if (res && res.error) {
              b.disabled = false;
              armed = false;
              b.classList.remove('armed');
              b.textContent = t('res.actionFailed', { label: label, reason: res.error });
              return;
            }
            // Once deleted the action has no object — leave a sentence of result rather than a button that can still be pressed
            b.textContent = t('res.backupDeleted');
            b.classList.remove('armed');
            refreshArchives(); // the 「备份 N」 at the end of the row has to lose one
          }).withFailureHandler(function(err) {
            b.disabled = false;
            armed = false;
            b.classList.remove('armed');
            b.textContent = t('res.deleteFailed', { reason: err.message });
          }).deleteGuideArchive(b.getAttribute('data-drop-backup'));
        });
      });

      genMsg.querySelectorAll('[data-genlog]').forEach(function(b) {
        b.addEventListener('click', function(e) {
          e.stopPropagation();   // the bar itself is a collapse target while collapsed
          genLogOpen = !genLogOpen;
          const box = genMsg.querySelector('.gen-log');
          if (box) {
            box.hidden = !genLogOpen;
            if (genLogOpen) box.scrollTop = box.scrollHeight;
          }
          b.textContent = t(genLogOpen ? 'gen.hideLog' : 'gen.showLog');
        });
      });
      // **The tail is the live end**, and a repaint every three seconds would otherwise drop the
      // reader back to the top of a log that is still growing
      const openLog = genMsg.querySelector('.gen-log:not([hidden])');
      if (openLog) openLog.scrollTop = openLog.scrollHeight;

      genMsg.querySelectorAll('[data-reveal]').forEach(function(b) {
        b.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = b.getAttribute('data-reveal');
          b.disabled = true;
          rpc.withSuccessHandler(function(res) {
            b.disabled = false;
            // If it cannot be opened, say why rather than leaving a button that does nothing when pressed
            if (res && res.error) b.textContent = res.error;
          }).withFailureHandler(function(err) {
            b.disabled = false;
            b.textContent = t('res.openFailed', { reason: err.message });
          }).revealGuideFile(appid);
        });
      });
      syncGenChrome();
    }

    // Polls only while a job is running — no permanent extra request is added to this local service
    // otherwise.
    // It also checks once on page load: a generation started by another tab (or before the last
    // refresh) may still be running, and this has to pick it up
    let genTimer = null;
    /**
     * The highest `seq` this page has already received. `-1` = just opened and nothing received yet.
     *
     * The server stacks each finished job in `finished` by sequence number, and the page takes only
     * the ones above this.
     * **Whether one finished cannot be judged from "is running false at this instant"** — between one
     * queued job finishing and the next starting there is only a single microtask, while this polls
     * every three seconds and cannot catch that instant (see the comment on `finished` in server.js)
     */
    let genSeen = -1;
    /**
     * The ones finished this round, already rendered as HTML. **They accumulate**: while the queue is
     * still running, the screen has to show both "what is running now" and "those just finished, and
     * here are their guides"
     */
    let genDoneHtml = [];

    function pollGen() {
      if (genTimer) return;
      genTimer = setInterval(fetchGen, 3000);
      fetchGen();
    }

    /** The sentences that have to survive the run (a shard not written, and the like), rendered as styled lines */
    function warnLines(list) {
      return (list || [])
        .map(function (w) { return '<br><span class="warn">' + GEN_WARN + ' ' + escapeHtml(w) + '</span>'; })
        .join('');
    }

    /**
     * Renders one **finished** job into a line on screen.
     *
     * **It is a function because it now has two call sites**: the ones that finish mid-queue, and the
     * last one left on screen after the queue drains. Only the latter existed originally, written
     * inline in fetchGen, and the former had no code path at all — which is the other half of the
     * reason for "while queueing generations, no result but the last one is visible".
     *
     * Merging them has a harder reason too: two renderers eventually get changed in only one place,
     * so "the ones that finished mid-queue" would quietly lose some warning — and the warnings that
     * would be lost (no web access, some boxes can never be ticked) are precisely the ones only the
     * guide's own author can act on
     */
    function renderFinished(f) {
      const game = escapeHtml(f.game || '');
      // **Checked before `f.error`, never folded into it.** A cancellation carries `error: null` —
      // the run did exactly what was asked — and `res.genFailed`'s wording ("生成失败") would tell
      // the person who just pressed Cancel that something went wrong. warnLines still applies:
      // whatever was salvaged before the cancel landed is exactly what a mid-run cancellation most
      // needs to say
      if (f.result && f.result.cancelled) {
        return '<span class="warn">' + GEN_CANCEL + ' ' +
          escapeHtml(t('res.genCancelled', { game: f.game || '' })) + '</span>' + warnLines(f.warnings);
      }
      if (f.error) {
        return '<span class="warn">' + GEN_WARN + ' ' +
          escapeHtml(t('res.genFailed', { game: f.game || '', reason: f.error })) + '</span>' + warnLines(f.warnings);
      }
      const r = f.result;
      if (!r) return '';
      if (!r.ok) {
        // **The cause goes before the symptom.** A missing shard presents as dozens of "missing
        // checkbox" findings, and only five fit here — filled entirely with the same sentence, not
        // one word of the real reason ("shard 3 never came back") would show through and the user
        // would conclude the model forgot to write them
        const failed = (r.chunkFailures || [])
          .map(function (c) {
            return '<br><span class="warn">' + escapeHtml(t('res.chunkFailed', {
              chunk: c.chunk, of: c.of, count: c.count, reason: String(c.reason).split('\n')[0],
            })) + '</span>';
          })
          .join('');
        return '<span class="warn">' + GEN_WARN + ' ' + escapeHtml(t('res.draftKept', { game: f.game || '' })) + '</span>' + failed +
          (r.blocking && r.blocking.length ? '<br>' + r.blocking.join('<br>') : '') +
          warnLines(f.warnings);
      }
      // 「能搜」 and 「搜了」 are two different things that the user cannot tell apart on the page —
      // having searched is folded into the line of facts, and only not having searched gets its own
      // warning (that being the one that genuinely affects content quality)
      const searches = r.searchQueries ? r.searchQueries.length : 0;
      const noResearch = !r.researched
        ? '<br><span class="warn">' + GEN_WARN + ' ' + escapeHtml(t('res.noSearch')) + '</span>'
        : searches === 0
          ? '<br><span class="warn">' + GEN_WARN + ' ' + escapeHtml(t('res.neverSearched')) + '</span>'
          : '';
      // Where it was written has to be stated clearly — these are the user's own notes and they
      // should not have to hunt for them.
      //
      // **The two backends do not offer the same set of actions.** The Notion copy opens as a
      // formatted page, so one link is enough; the local copy served through /guide/ is **plain-text
      // markdown source** (an XSS guard, see server.js), and actually reading it means opening the
      // file in an editor — so the local one gets an extra 「打开文件夹」.
      //
      // The local one **must not be written as an unclickable absolute path**: for the same guide,
      // the 「📖 攻略」 button in the table row is clickable (through /guide/<appid>), and it would be
      // the moment right after generating that was not — which is exactly when one most wants to
      // click straight in and look
      const where = r.target === 'notion'
        ? '<a href="' + escapeHtml(r.path || '') + '" target="_blank" rel="noopener">' + escapeHtml(t('res.openGuide')) + '</a>'
        : '<a href="/guide/' + encodeURIComponent(f.appid) + '" target="_blank" rel="noopener">' + escapeHtml(t('res.openGuide')) + '</a>'
          + ' · <button type="button" class="gen-link" data-reveal="' + escapeHtml(f.appid) + '">' + escapeHtml(t('res.openFolder')) + '</button>';
      // **「删除备份」 sits right beside 「打开攻略」**, because that is exactly the moment it is
      // wanted: open it, read it, confirm this version is fine, and the old one is of no further use
      // — anywhere else means 「等会儿再收拾」, and later mostly never comes.
      //
      // **「恢复备份」 and 「删除备份」 are the two answers to the same moment.** After reading it
      // through there are only two conclusions: this version is fine → the old one is useless; this
      // version is worse than the old one → go back to the old one. Offering only the second means
      // that at the moment one is most likely to want to go back, the only button provided
      // **destroys the means of going back**.
      //
      // The order is restore then delete: what can be undone comes first, and the irreversible one
      // comes last.
      //
      // The consequence the second click states is **computed by the backend and hung on a data
      // attribute** rather than decided again in the handler — decided twice, only one place gets
      // changed sooner or later. An overwrite only ever writes back to the guide's own backend
      // (changing backend is guide-to-notion's job), so `r.target` is this backup's backend
      const restoreBackup = r.backup && r.backup.id
        ? ' · <button type="button" class="gen-link" data-restore-backup="'
          + escapeHtml(r.backup.id) + '" data-restore-label="'
          + escapeHtml(r.target === 'notion' ? t('arc.restoreNotion') : t('arc.restoreLocal'))
          + '">' + escapeHtml(t('res.restoreBackup')) + '</button>'
        : '';
      // Only an overwrite or a partial rewrite has a backup (a freshly generated whole guide has no
      // old one to save), and with `r.backup` empty this action does not appear at all — a button
      // that can never be pressed is worse than none
      const dropBackup = r.backup && r.backup.id
        ? ' · <button type="button" class="gen-link danger" data-drop-backup="'
          + escapeHtml(r.backup.id) + '">' + escapeHtml(t('res.dropBackup')) + '</button>'
        : '';
      // **The search count and the token count moved into a hover.** What remains on screen is three
      // things: which game, how many achievements were covered, and where to look. Tokens are still
      // reported (this is the only feature that costs money and the number has to be findable), but
      // it is for reconciling afterwards and should not compete with 「成了没有」 for the same line.
      // 「内容自己过一遍」 stays — the machine only guarantees format and data, nothing can verify
      // whether the content is right, and this is the one sentence this feature has to say every time
      genBar.title = [
        searches ? t('res.searches', { n: searches }) : t('res.noSearches'),
        Math.round((r.tokens || 0) / 100) / 10 + 'k token',
      ].join(' · ');
      // The ones with duplicate names whose Steam description is empty: the guide is written
      // correctly, but automatic ticking will **never** recognise them.
      // This does not block (so the guide has already landed), but without saying so the user would
      // only find out one day on noticing a few boxes that never move — and by then it looks more
      // like the sync being broken. Listing the names is what tells them which
      const unsyncable = (r.unsyncable || []).length
        ? '<br><span class="warn">' + GEN_WARN + ' ' + escapeHtml(t('res.unsyncable', { n: r.unsyncable.length })) +
          escapeHtml(r.unsyncable.slice(0, 4).join('、')) +
          (r.unsyncable.length > 4 ? escapeHtml(t('res.andMore', { n: r.unsyncable.length })) : '') + '</span>'
        : '';
      // A partial rewrite has **something else** to say: how many were changed, and that the rest
      // were untouched. Written as 「已生成 · 11/11 个成就」, an operation that changed only 5 looks
      // identical to a whole rewrite, while "the part that was untouched" is the reason they chose
      // partial. Pre-existing problems are reported here too — untouched this run and not blocking,
      // but without saying so the next validation would read them as damage from this change
      const pat = r.patched;
      const preExisting = pat && pat.preExisting
        ? '<br><span class="warn">' + GEN_WARN + ' ' + escapeHtml(t('res.preExisting', { n: pat.preExisting })) + '</span>'
        : '';
      const headline = pat
        ? GEN_OK + ' ' + escapeHtml(t('res.rewrote', { game: f.game || '', n: pat.rewrote })) + where + restoreBackup + dropBackup
        : GEN_OK + ' ' + escapeHtml(t('res.generated', { game: f.game || '', covered: r.covered, total: r.total })) + where + restoreBackup + dropBackup;
      return headline + noResearch + unsyncable + preExisting + warnLines(f.warnings) +
        '<br><span class="warn">' + escapeHtml(t('res.readItYourself')) + '</span>';
    }

    function fetchGen() {
      rpc
        .withSuccessHandler(function (s) {
          if (!s) return;
          const waiting = (s.queue && s.queue.length)
            ? t('res.queueLeft', { n: s.queue.length })
            : '';
          // **A non-empty queue also counts as "still running".** This value decides whether the top
          // right offers 「收起」 or 「关闭」, and closing the progress bar mid-queue means the
          // remaining jobs' progress would never appear again — which is the very fault being fixed
          // here, merely through a different entrance
          const live = Boolean(s.running) || Boolean(waiting);

          /**
           * **Collect the finished ones first, then look at what is running now.** While queueing
           * both are true at once, and the original code returned at that `if (s.running)` — so every
           * queued job's result but the last went uncollected: the table did not refresh (「📖 攻略」
           * never appeared), that row stayed greyed out, and the result never left a line in the
           * floater. What the user saw was "the first one finished but the interface did not respond
           * and still says generating"
           */
          const all = s.finished || [];
          const fresh = all.filter(function (f) { return f.seq > genSeen; });
          if (fresh.length) {
            // **On a fresh page load only the last one is filled in.** The server keeps the most
            // recent 20, and dumping them all would smear a screenful of history over every refresh —
            // whereas what used to be displayed was the last one (`state.result`), and this keeps
            // that
            const first = genSeen < 0;
            genSeen = all[all.length - 1].seq;
            // The greying has to be released for **every one** regardless of how many are displayed: miss one and that row's button stays grey forever
            fresh.forEach(function (f) { setGuideBusy(f.appid, false); });
            genDoneHtml = genDoneHtml.concat(
              (first ? fresh.slice(-1) : fresh).map(renderFinished).filter(Boolean)
            );
            if (!first) {
              // `refreshArchives()` — an overwrite/rewrite has just put the original into
              // `.backups/`, and the 「备份 N」 at the end of the row is rendered from archiveIndex,
              // so without re-fetching the new one is invisible.
              // `loadDashboard()` — the guide is registered, and the 「📖 攻略」 link has to appear.
              // On a fresh page load both already ran during initialisation and need not run again
              refreshArchives();
              loadDashboard();
            }
          }
          const doneTail = genDoneHtml.length ? '<br>' + genDoneHtml.join('<br>') : '';

          if (s.running) {
            // **What the Cancel button targets, read from the state that is actually running** —
            // never from the appid the button that started it was on, which may by now be a
            // different, already-drained queue entry. Re-enabled here too: the one case that needs
            // it is a cancel that raced the job finishing on its own (see the comment on the
            // button's own handler), and this is the only path that still shows `s.running`.
            genRunningAppid = s.appid;
            genRunningGame = s.game;
            genCancelBtn.disabled = false;
            // Things already known to have gone wrong mid-run (a shard not written). **Displayed
            // separately from note** — note is "what is happening now" and is covered by the next
            // event three seconds later, while these have to stay until the result appears, or the
            // user never learns that this guide is missing a piece
            const warns = warnLines(s.warnings);
            // The round is shown only during an actual rewrite (round 2 onwards) — writing "round
            // 1/3" on a first pass reads as though something went wrong and it needs three attempts
            const round = s.rounds && s.round > 1 ? t('res.round', { round: s.round, rounds: s.rounds }) : '';
            // **Which step, out of a total that was settled before the run started.** The total is
            // the answer to "how much longer is this"; a total that grew while somebody watched
            // would be worse than none, which is why the rewrite rounds are not steps (see
            // generationSteps). The round is still shown separately, as progress within the writing
            const stepTxt = s.steps && s.steps.length
              ? ' · ' + t('gen.stepOf', { n: Math.max(1, s.step || 1), of: s.steps.length })
              : '';
            // The live count of entries. **Only while a shard is being written** — left on screen
            // afterwards it would read as the guide's size rather than as something in progress
            const wrote = s.written && s.written.of
              ? ' · ' + t('gen.written', { done: s.written.done, of: s.written.of })
              : '';
            showGen('⏳ 《' + escapeHtml(s.game) + '》' + escapeHtml(round) + escapeHtml(stepTxt)
              + (s.note ? ' · ' + escapeHtml(s.note) : '') + escapeHtml(wrote)
              + escapeHtml(waiting) + warns + doneTail + genLogHtml(s), false, true);
            return;
          }
          genRunningAppid = null;
          genRunningGame = '';
          // **Do not stop polling while the queue is non-empty.** Between one finishing and the next
          // actually starting there is a gap (the server has to build the provider first), and at
          // that instant running is false while the queue is not — under the old logic polling
          // stopped right there, the remaining jobs' progress never appeared again, and the progress
          // bar stayed frozen on the previous one's result
          if (!waiting) {
            clearInterval(genTimer);
            genTimer = null;
          }
          // Once drained, what remains on screen is the batch collected. **`s.result` / `s.error` are
          // no longer read separately** — they are the same thing as the last entry in `finished`, and
          // rendering the same thing in two places means only one of them gets changed sooner or later
          if (doneTail) return showGen(genDoneHtml.join('<br>'), false, live);
          genLive = live;
          genBar.style.display = 'none';
        })
        .withFailureHandler(function () {})
        .guideGenStatus();
    }

    fetchGen();  // pick up a job that may still be running

    // After a background sync finishes, lib/rpc.js calls this to refresh the data in place. Exposing
    // it globally is deliberate: location.reload() would clear the search term, the filter states and
    // the sort order, all of which the user set themselves.
    window.reloadDashboard = loadDashboard;
  </script>
</body>
</html>
