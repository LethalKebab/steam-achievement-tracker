     * When the browser does not support it, nothing happens: the default in the CSS is still
     * there and the header still sticks, only possibly a few pixels off — which beats
     * throwing and taking every later initialisation down with it.
     */
    /**
     * Re-measures the frozen area's height. **Called deliberately from the places that know
     * they just made it taller** (currently only the search dropdown) rather than relying
     * entirely on the observer to catch it — see the note below.
     * The default is a no-op, so nobody can call it before trackTopbarHeight has run.
     */
    let measureTopbar = function() {};

    (function trackTopbarHeight() {
      const bar = document.querySelector('.topbar');
      if (!bar) return;
      const apply = function() {
        document.documentElement.style.setProperty('--topbar-h', bar.offsetHeight + 'px');
      };
      measureTopbar = apply;
      // **The observer has to be stored.** By spec an observer with an observed target should
      // not be collected, but creating an object and throwing it away in the hope that
      // somebody else keeps it for you was never a bet worth taking
      if (typeof ResizeObserver !== 'undefined') {
        window.__topbarRO = new ResizeObserver(apply);
        window.__topbarRO.observe(bar);
      }
      apply();

      /**
       * **Besides the observer, it also has to measure once at each of these two moments.**
       *
       * The synchronous measurement above happens the moment the script executes, when the
       * layout is not yet settled: the self-hosted Chinese font is not in place, so the
       * character widths differ → the filter chips wrap in a different place → the topbar's
       * height differs. The frozen area has four rows, and that difference is not a matter of
       * a few pixels — measure it wrong once and the header parks below a gap, and **it does
       * not fix itself until the next window resize**.
       *
       * The observer should catch the reflow the font swap causes, but it only calls back
       * while the page is **actually rendering** (something measured in practice: with the
       * preview panel hidden, even observe()'s initial callback never arrives).
       * So these two explicit moments measure again themselves, rather than betting
       * correctness entirely on one channel.
       */
      window.addEventListener('load', apply, { once: true });
      if (document.fonts?.ready) document.fonts.ready.then(apply);
    })();

    /**
     * The ♥ toggle. **Shared by the table and the gallery** — written twice, the optimistic
     * update, the rollback on failure and the server's correction would eventually be changed
     * on one side and not the other
     */
    function bindFavButtons(root) {
      root.querySelectorAll('[data-fav-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.favAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          game.favorite = !game.favorite; // optimistic local update first, so the UI responds immediately
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.favorite === 'boolean') game.favorite = result.favorite;
          }).withFailureHandler(function() {
            game.favorite = !game.favorite; // on failure, put it back
            render();
          }).toggleFavorite(appid);
        });
      });
    }

    /**
     * The gallery view. **The table gives numbers, the gallery gives images.**
     *
     * The capsule image is Steam's own visual language, so it covers the whole card with the
     * name over a bottom gradient — shrinking it to a thumbnail beside a line of description
     * is what the table already does. The 3px progress line at the card's very bottom edge is
     * the one thing this tool has to say, which is why it is the only graphic element on the
     * card.
     *
     * The filter results are **entirely shared** with the table: the filters decide what to
     * look at, and the view only decides how.
     */
    function renderGallery(rows) {
      const el = document.getElementById('gallery');
      if (!rows.length) {
        el.innerHTML = '<div class="empty">' + escapeHtml(t('table.empty')) + '</div>';
        return;
      }
      el.innerHTML = rows.map(function(g) {
        const rate = typeof g.rate === 'number' ? g.rate : 0;
        const rateText = (g.total === 'N/A') ? t('table.noAchSystem')
          : (g.total === null ? t('table.syncing') : g.achieved + '/' + g.total + ' · ' + fmtPct(rate));
        return '<div class="g-card' + (g.guideUrl ? ' has-guide' : '') + '"'
          // The same identity attribute as a table row: "jump to this game" takes one path in both views
          + ' data-appid="' + g.appid + '"'
          + (g.guideUrl ? ' data-guide="' + g.guideUrl + '"' : '')
          + ' title="' + escapeHtml(g.name + (g.guideUrl ? t('table.openGuide') : '')) + '">'
          // The portrait cover first, falling back to the landscape header; only when the
          // landscape one is unavailable too does it ask the server for the real address.
          // **Every leg has to replace or clear onerror first** (see portraitFailed /
          // coverFailed) — otherwise the fallback failing triggers it again, into an infinite
          // loop
          + '<img src="' + portraitUrl(g.appid) + '" loading="lazy"'
          + ' onerror="window.portraitFailed(this, \'' + g.appid + '\')">'
          + '<button class="row-icon g-heart' + (g.favorite ? ' active-heart' : '') + '"'
          + ' data-fav-appid="' + g.appid + '">' + heartSvg(g.favorite) + '</button>'
          + '<div class="g-scrim">'
          + '<span class="g-name">' + escapeHtml(g.name) + '</span>'
          + '<span class="g-rate">' + rateText + '</span>'
          + '</div>'
          + '<div class="g-bar"><span style="width:' + (rate * 100).toFixed(1)
          + '%; background:' + barColor(rate) + '"></span></div>'
          + '</div>';
      }).join('');

      bindFavButtons(el);
      el.querySelectorAll('.g-card.has-guide').forEach(function(card) {
        card.addEventListener('click', function() {
          window.open(card.dataset.guide, '_blank', 'noopener');
        });
      });
    }


    function render() {
      const filters = currentFilters();
      let rows = allGames.filter(function(g) { return !hidingFilter(g, filters); });

      // The topbar's reading is **always the library total** — it answers 「我一共有多少游戏」
      // and should not be rewritten by one search. The filtered count is a different question
      // (「这张表现在给我看多少」) and sits against the table
      document.getElementById('cardTotal').textContent = fmtCount(allGames.length);
      document.getElementById('rowCount').textContent =
        t('table.count', { shown: rows.length, total: allGames.length });
      // While searching, the filters have no effect (see hidingFilter). **Let the controls say
      // so themselves** — a greyed-out chip is 「现在不作数」, with no need for a sentence of
      // explanation after the count. The text version was tried and is redundant: it requires
      // reading a sentence to understand a state that should be visible at a glance
      document.getElementById('filterChips').classList.toggle('inert', Boolean(filters.search));

      // The sort markers follow sortKey/sortDir. **Inside render rather than in the click
      // handler** — the sort state has a default (descending by completion rate on first
      // load), and hanging it off the click means nothing is shown on a first visit and you
      // have to click once to see what you were already sorted by
      document.querySelectorAll('th[data-key]').forEach(function(th) {
        const active = th.dataset.key === sortKey;
        th.classList.toggle('sort-asc', active && sortDir === 1);
        th.classList.toggle('sort-desc', active && sortDir === -1);
      });

      rows = rows.slice().sort(function(a, b) {
        let av = a[sortKey], bv = b[sortKey];
        if (av === null || av === 'N/A') av = -1;
        if (bv === null || bv === 'N/A') bv = -1;
        // **Sorted in the interface's language, not the browser's.** A bare localeCompare()
        // follows whatever locale the browser is set to, so the same library sorted differently
        // on two machines showing the same page — and with names in two scripts mixed together
        // that is the column where it shows
        if (typeof av === 'string') return sortDir * av.localeCompare(bv, LANG === 'en' ? 'en' : 'zh-CN');
        return sortDir * ((av > bv) - (av < bv));
      });

      // Pinning has two layers, each keeping the order established above within the group:
      //   1. priority (★) — chosen by hand, and always outranks any automatic judgement
      //   2. recently played and having an achievement system — automatic, and only competes
      //      for position below ★ (see pinsToTop)
      // Within recently played they are sorted again by "how long ago", so today's come first
      const recent = rows.filter(pinsToTop)
        .sort(function(a, b){ return a.playedDaysAgo - b.playedDaysAgo; });
      const rest = rows.filter(function(g){ return !pinsToTop(g); });
      rows = recent.concat(rest);
      rows = rows.filter(function(g){ return g.priority; }).concat(rows.filter(function(g){ return !g.priority; }));

      // The view branches **after sorting and pinning** — the gallery and the table see the
      // same rows in the same order, or the same filters would give different results in the
      // two views, which looks like a bug rather than a design
      document.getElementById('gameTable').hidden = viewMode !== 'table';
      document.getElementById('gallery').hidden = viewMode === 'table';
      if (viewMode === 'gallery') { renderGallery(rows); return; }

      const body = document.getElementById('gameTableBody');
      if (rows.length === 0) {
        body.innerHTML = '<tr><td colspan="4" class="empty">' + escapeHtml(t('table.empty')) + '</td></tr>';
        return;
      }

      let html = '';
      rows.forEach(function(g) {
        const unvettedBadge = g.unvetted
          ? '<span class="badge" title="' + escapeHtml(t('table.unvettedTitle')) + '">' + escapeHtml(t('filter.unvetted')) + '</span>'
          : '';
        // The word 「Manual」 is only still that name in the database (the status column); in
        // the interface it is a **lock** — what it actually does is 「停掉这一行的自动同步」,
        // which is what a lock means.
        // data-manual-appid is carried over, so the existing toggle handler needs not one word
        // changed
        const manualBadgeClass = 'badge-btn ' + (g.manual ? 'badge-btn-on' : 'badge-btn-off');
        const manualBadge = '<button class="' + manualBadgeClass + '" data-manual-appid="' + g.appid + '" title="'
          + escapeHtml(g.manual ? t('table.lockOn') : t('table.lockOff'))
          + '" aria-label="' + escapeHtml(g.manual ? t('table.locked') : t('table.unlocked')) + '">'
          + icon(g.manual ? 'lock' : 'unlock') + '</button>';
        const familyBadgeClass = 'badge-btn ' + (g.family ? 'badge-btn-family-on' : 'badge-btn-off');
        const familyBadge = '<button class="' + familyBadgeClass + '" data-family-appid="' + g.appid + '" title="'
          + escapeHtml(g.family ? t('table.familyOff') : t('table.familyOn')) + '">' + escapeHtml(t('filter.family')) + '</button>';
        const newAchBadge = (g.newAchDaysAgo !== null && g.newAchDaysAgo <= 30)
          ? '<span class="badge badge-new">' + icon('sparkle') + escapeHtml(t('table.newAch', { n: g.newAchDaysAgo })) + '</span>'
          : '';
        const playedBadge = isRecentlyPlayed(g)
          ? '<span class="badge badge-played">' + icon('gamepad')
            + escapeHtml(g.playedDaysAgo === 0 ? t('table.playedToday') : t('table.playedAgo', { n: g.playedDaysAgo })) + '</span>'
          : '';
        // **In-row icon buttons are .row-icon, not .icon-btn.** The latter is the topbar's
        // filled, outlined square; the two used to share one class name, and the in-row block
        // came later in the CSS and overrode the topbar's entirely — the topbar buttons'
        // promised fill and outline were never drawn, with no error. Split into two names,
        // they cannot collide again
        const heartClass = 'row-icon' + (g.favorite ? ' active-heart' : '');
        const starClass = 'row-icon' + (g.priority ? ' active-star' : '');
        const guideBtnClass = 'guide-btn ' + (g.guideUrl ? 'has-guide' : 'no-guide');
        const canGen = !g.guideUrl && aiReady && typeof g.total === 'number' && g.total > 0;
        const guideBtn = g.guideUrl
          ? '<a class="' + guideBtnClass + '" href="' + g.guideUrl + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + icon('book') + escapeHtml(t('table.guide')) + '</a>'
          : canGen
            ? '<button class="' + guideBtnClass + ' can-gen" data-gen="' + g.appid + '" data-name="'
              + escapeHtml(g.name) + '" onclick="event.stopPropagation();window.genGuide(this)">' + icon('sparkle') + escapeHtml(t('table.generate')) + '</button>'
            : '<span class="' + guideBtnClass + '">' + icon('book') + escapeHtml(t('table.guide')) + '</span>';
        // A row really holds three groups: **marks** (star, heart), **identity** (cover, name,
        // status badges) and **actions** (guide, rewrite, more). They used to be a run of
        // evenly spaced siblings that the eye could not separate; and only the final 「更多」
        // carried margin-left:auto, leaving the guide button floating indeterminately to the
        // right of the name.
        // Now the marks and the actions are each their own block, with the action group flush
        // right (the margin hangs on .row-actions)
        const gameCell = '<div class="game-cell">'
          + '<div class="row-marks">'
          + '<button class="' + starClass + '" data-priority-appid="' + g.appid + '" aria-label="' + escapeHtml(t('table.priority')) + '">' + icon('star', g.priority) + '</button>'
          + '<button class="' + heartClass + '" data-fav-appid="' + g.appid + '" aria-label="' + escapeHtml(t('table.favourite')) + '">' + heartSvg(g.favorite) + '</button>'
          + '</div>'
          + '<img class="game-thumb" src="' + coverSrc(g) + '" loading="lazy"'
          + ' onerror="window.coverFailed(this, \'' + g.appid + '\')">'
          + '<div class="game-name-main">' + escapeHtml(g.name) + unvettedBadge + manualBadge + familyBadge + playedBadge + newAchBadge + '</div>'
          // What sits on the row is **the four things that can be done to this guide**, while
          // the ⋯ holds the two things that can be done to this game's row.
          // The dividing line is the object, not the frequency — an earlier version collapsed
          // by frequency (keeping only the guide plus the ⋯ and moving the other three into
          // the menu), and the conclusion was that it collapsed too far: opening, rewriting and
          // moving to Notion are all **deliberate actions**, and burying them one level down
          // adds a click to each; while 「备份」, rare as it is, is the only way out when
          // something has gone wrong, so hiding it costs the most.
          //
          // 「备份」 only appears when there really are backups — a greyed-out one on the row is
          // permanent noise.
          // (In the menu it is the opposite: only by being greyed out can it answer 「这个游戏
          // 到底有没有」, which is a different context)
          + '<div class="row-actions">'
          + guideBtn
          // A row that already had a guide used to have only 「攻略」 with no entry point for
          // rewriting it — overwriting meant typing a command.
          // The gate is not on this button but in the confirm dialog it opens (which computes
          // exactly what will be lost), so exposing it is safe
          + (g.guideUrl && aiReady && typeof g.total === 'number' && g.total > 0
              ? '<button class="guide-btn rewrite" ' + (guideBusy.has(String(g.appid)) ? 'disabled ' : '')
                + 'title="' + escapeHtml(t('table.rewriteTitle')) + '"'
                + ' onclick="event.stopPropagation();window.rewriteGuide(\'' + g.appid + '\',this.dataset.name)"'
                + ' data-name="' + escapeHtml(g.name) + '">' + icon('rewrite') + escapeHtml(t('table.rewrite')) + '</button>'
              : '')
          + (g.guideKind === 'local' && notionReady
              ? '<button class="guide-btn to-notion" ' + (guideBusy.has(String(g.appid)) ? 'disabled ' : '')
                + 'title="' + escapeHtml(t('table.moveTitle')) + '"'
                + ' onclick="event.stopPropagation();window.migrateGuide(\'' + g.appid + '\',this.dataset.name)"'
                + ' data-name="' + escapeHtml(g.name) + '">' + icon('upload') + 'Notion</button>'
              : '')
          + (archivesFor(g.appid).length
              ? '<button class="guide-btn backups" data-backups="' + g.appid + '"'
                + ' title="' + escapeHtml(t('table.backupsTitle')) + '"'
                + ' onclick="event.stopPropagation();window.openBackups(\'' + g.appid + '\',this.dataset.name)"'
                + ' data-name="' + escapeHtml(g.name) + '">' + icon('clock')
                + escapeHtml(t('table.backups', { n: archivesFor(g.appid).length })) + '</button>'
              : '')
          // Editing numbers and deleting are **merged into one entry point**. They used to be
          // two buttons side by side on the row, and deleting is irreversible — next to a
          // button clicked daily, it gets clicked by mistake sooner or later. Both are now one
          // level down in the menu
          + '<button class="delete-btn" data-edit-appid="' + g.appid + '" title="' + escapeHtml(t('table.more')) + '" aria-label="' + escapeHtml(t('table.more')) + '">' + icon('more') + '</button>'
          + '</div>'
          + '</div>';

        // Expanding shows 「还差哪些成就」, and the criterion is **this row genuinely not being
        // finished**, not which tab is selected. With the tabs gone, a completed game also
        // appears in the table whenever 「已完成」 is not excluded — giving it an expand arrow
        // would expand an empty list
        const canExpand = g.rate !== 1 && g.total !== 'N/A' && g.total !== null && g.appid;
        const rowClass = 'game-row' + (canExpand ? ' expandable' : '');

        // **Only the row being edited gets input fields.** A locked row that is not being
        // edited shows its numbers as plain text like any other — permanent input fields would
        // put a control that can change a number by mis-touch on every locked row
        if (g.manual && String(editingAppid) === String(g.appid)) {
          const achievedVal = (typeof g.achieved === 'number') ? g.achieved : 0;
          const totalVal = (typeof g.total === 'number') ? g.total : 0;
          const manualRate = totalVal > 0 ? achievedVal / totalVal : 0;
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '">'
            + '<td>' + gameCell + '</td>'
            + '<td><input type="number" min="0" class="manual-input" data-manual-field="achieved" data-manual-row-appid="' + g.appid + '" value="' + achievedVal + '" onclick="event.stopPropagation()"></td>'
            + '<td><input type="number" min="0" class="manual-input" data-manual-field="total" data-manual-row-appid="' + g.appid + '" value="' + totalVal + '" onclick="event.stopPropagation()"></td>'
            + '<td>' + barCell(manualRate) + '</td>'
            + '</tr>';
        // **The three rows without numbers need data-appid too.** It used to hang only off the
        // two branches that have numbers, so "find the row by appid" **happened not to work
        // for a game that was just added** — a new game lands in one of the three shapes below
        // nine times out of ten. data-appid is this row's identity, not a marker for "does it
        // have numbers"
        } else if (g.total === 'N/A') {
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '"><td>' + gameCell + '</td><td class="na" colspan="3">' + escapeHtml(t('table.noAchSystem')) + '</td></tr>';
        } else if (g.total === null && g.manual) {
          // A locked row is never synced automatically, so 「数据同步中」 would be a lie for it — it is waiting for you to fill it in
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '"><td>' + gameCell + '</td><td class="na" colspan="3">' + escapeHtml(t('table.noNumbers')) + '</td></tr>';
        } else if (g.total === null) {
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '"><td>' + gameCell + '</td><td class="na" colspan="3">' + escapeHtml(t('table.syncingRow')) + '</td></tr>';
        } else {
          html += '<tr class="' + rowClass + '" data-appid="' + g.appid + '">'
            + '<td>' + gameCell + '</td>'
            + '<td>' + g.achieved + '</td>'
            + '<td>' + g.total + '</td>'
            + '<td>' + barCell(g.rate) + '</td>'
            + '</tr>';
        }

        if (canExpand && expandedAppid === String(g.appid)) {
          html += renderMissingRow(g.appid);
        }
      });

      body.innerHTML = html;

      bindFavButtons(body);

      body.querySelectorAll('[data-priority-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.priorityAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          game.priority = !game.priority; // optimistic local update first, so the UI responds immediately
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.priority === 'boolean') game.priority = result.priority;
          }).withFailureHandler(function() {
            game.priority = !game.priority; // on failure, put it back
            render();
          }).togglePriority(appid);
        });
      });

      body.querySelectorAll('[data-manual-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.manualAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const newManual = !game.manual;
          game.manual = newManual;
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.manual === 'boolean') game.manual = result.manual;
          }).withFailureHandler(function() {
            game.manual = !game.manual;
            render();
          }).setManualStatus(appid, newManual);
        });
      });

      body.querySelectorAll('[data-family-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const appid = btn.dataset.familyAppid;
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const newFamily = !game.family;
          game.family = newFamily;
          render();
          rpc.withSuccessHandler(function(result) {
            if (result && typeof result.family === 'boolean') game.family = result.family;
          }).withFailureHandler(function() {
            game.family = !game.family;
            render();
          }).toggleFamily(appid);
        });
      });

      body.querySelectorAll('[data-edit-appid]').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          openRowMenu(btn, btn.dataset.editAppid);
        });
      });

      body.querySelectorAll('.manual-input').forEach(function(input) {
        input.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') input.blur();
          if (e.key === 'Escape') { input.blur(); stopManualEdit(); }
        });
        // Editing exits only when focus leaves **this row** — moving between the two inputs
        // does not count as leaving.
        // The setTimeout is mandatory: when focusout fires, relatedTarget is sometimes not
        // settled yet, and the change on the same blur has to run first (it does the saving)
        input.addEventListener('focusout', function() {
          const row = input.closest('tr');
          setTimeout(function() {
            if (!row.contains(document.activeElement)) stopManualEdit();
          }, 0);
        });
        input.addEventListener('change', function() {
          const appid = input.dataset.manualRowAppid;
          const row = input.closest('tr');
          const achievedInput = row.querySelector('[data-manual-field="achieved"]');
          const totalInput = row.querySelector('[data-manual-field="total"]');
          const achieved = Math.max(0, parseInt(achievedInput.value, 10) || 0);
          const total = Math.max(0, parseInt(totalInput.value, 10) || 0);
          const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
          if (!game) return;
          const prevAchieved = game.achieved;
          const prevTotal = game.total;
          const prevRate = game.rate;
          game.achieved = achieved; // optimistic local update first, so the UI responds immediately
          game.total = total;
          game.rate = total > 0 ? achieved / total : 0;
          // **No full-page repaint while editing.** render() rebuilds innerHTML and takes the
          // focus with it — so moving from 「完成数」 to 「成就总数」 would swap the second input
          // out from under the hand.
          // While editing, only the progress cell is updated in place, with the full repaint
          // left until editing exits
          if (String(editingAppid) === String(appid)) updateRateCell(row, game.rate);
          else render();
          function revert() {
            game.achieved = prevAchieved;
            game.total = prevTotal;
            game.rate = prevRate;
            if (String(editingAppid) === String(appid)) {
              achievedInput.value = (typeof prevAchieved === 'number') ? prevAchieved : 0;
              totalInput.value = (typeof prevTotal === 'number') ? prevTotal : 0;
              updateRateCell(row, game.rate ?? 0);
            } else {
              render();
            }
          }
          rpc.withSuccessHandler(function(result) {
            if (!result || result.error) revert(); // the server-side validation failed (achieved > total, say), so put it back
          }).withFailureHandler(revert).setManualAchievements(appid, achieved, total);
        });
      });

      body.querySelectorAll('tr.expandable').forEach(function(tr) {
        tr.addEventListener('click', function() {
          const appid = tr.dataset.appid;
          expandedAppid = (expandedAppid === appid) ? null : appid;
          if (expandedAppid && !missingAchCache[expandedAppid]) {
            missingAchCache[expandedAppid] = { loading: true };
            rpc.withSuccessHandler(function(data) {
              missingAchCache[appid] = data;
              if (expandedAppid === appid) render();
            }).withFailureHandler(function(err) {
              missingAchCache[appid] = { error: err.message };
              if (expandedAppid === appid) render();
            }).getMissingAchievements(appid);
          }
          render();
        });
      });

      // The height is left entirely to the CSS max-height, and this only decides "was it
      // genuinely clipped".
      // **Measure everything first, then change the classes together** — reading scrollHeight
      // and writing a class in the same loop forces one reflow per card, and a game with four
      // hundred achievements can stall for a visible beat
      const wins = Array.prototype.slice.call(body.querySelectorAll('.ach-guide'));
      const overflowing = wins.map(function(el) { return el.scrollHeight > el.clientHeight + 1; });
      wins.forEach(function(el, i) {
        // Nothing is done to an unclipped one: it is already complete and gets neither the gradient nor the gesture
        if (!overflowing[i]) return;
        el.classList.add('clamped');
        // toggle rather than add — once expanded it has to be collapsible with another click. The single-argument flip is deliberate
        el.addEventListener('click', function() { el.classList.toggle('expanded'); });
      });
    }

    function renderMissingRow(appid) {
      const data = missingAchCache[appid];
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      const gameName = game ? game.name : '';
      let inner;
      if (!data || data.loading) {
        inner = '<div class="missing-header">' + escapeHtml(t('ach.loading')) + '</div>';
      } else if (data.error) {
        inner = '<div class="missing-header">' + escapeHtml(data.error) + '</div>';
      } else if (data.missingCount === 0) {
        inner = '<div class="missing-header">' + escapeHtml(t('ach.allDone')) + '</div>';
      } else {
        // A guide that was genuinely read this time is the only one whose language can be trusted;
        // a failed read puts its own message here instead
        const hasGuide = Boolean(data.guide) && !data.guide.error;
        let head = t('ach.remaining', { n: data.missingCount });
        if (hasGuide) {
          // A guide written in the other language says so **here and nowhere else**. This panel is
          // the one place the guide's own text is on screen, so it is the one place the mismatch is
          // about to matter. On the row button it would be a badge on most rows carrying the same
          // word, which stops being information the second time it is seen
          if (data.guide.lang && data.guide.lang !== LANG) {
            head += ' · ' + t(data.guide.lang === 'en' ? 'ach.guideLangEn' : 'ach.guideLangZh');
          }
        } else if (data.guide && data.guide.error) {
          head += ' · ' + data.guide.error;
        }
        inner = '<div class="missing-header">' + escapeHtml(head) + '</div>'
          + '<div class="ach-grid">' + data.missing.map(function(a) {
            const query = encodeURIComponent(gameName + ' ' + a.name + ' achievement guide');
            const search = '<a class="ach-guide-link" href="https://www.google.com/search?q=' + query
              + '" target="_blank" rel="noopener">' + GEN_SEARCH + ' ' + escapeHtml(t('ach.searchGuide')) + '</a>';
            let tail;
            if (a.guide) {
              // After stripping the restatement of the official name and description there may
              // be nothing left (the guide copied only the official copy and wrote no method).
              // In that case no window is drawn at all — the name, the description and the jump
              // button are all still above, and an empty box only tells you "there should have
              // been something here"
              const substeps = a.guide.subSteps.map(function(s) {
                return '<div class="ach-substep' + (s.checked ? ' done' : '') + '"'
                  + ' style="margin-left:' + (s.depth * 12) + 'px">' + escapeHtml(s.text) + '</div>';
              }).join('');
              tail = (a.guide.text || substeps)
                ? '<div class="ach-guide">'
                  + (a.guide.text ? '<div class="ach-guide-text">' + escapeHtml(a.guide.text) + '</div>' : '')
                  + substeps + '</div>'
                : '';
            } else if (hasGuide) {
              tail = '<div class="ach-gap">' + escapeHtml(t('ach.notWritten')) + '</div>' + search;
            } else {
              tail = search;
            }
            // The jump button hangs beside the achievement name rather than inside the guide
            // window — the window gets clipped, and this is the card's only action; putting it
            // above also stops its position drifting with the guide's length
            const jump = (a.guide && a.guide.url)
              ? '<a class="ach-jump" href="' + escapeHtml(a.guide.url)
                + '" target="_blank" rel="noopener" title="' + escapeHtml(t('ach.openInGuide')) + '">' + GEN_BOOK + '</a>'
              : '';
            return '<div class="ach-item">'
              + '<img class="ach-icon" src="' + a.icon + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
              + '<div class="ach-body">'
              + '<div class="ach-head"><div class="ach-name">' + escapeHtml(a.name) + '</div>' + jump + '</div>'
              + '<div class="ach-desc">' + escapeHtml(a.description) + '</div>' + tail + '</div>'
              + '</div>';
          }).join('') + '</div>';
      }
      return '<tr class="missing-row"><td colspan="4">' + inner + '</td></tr>';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    document.querySelectorAll('th[data-key]').forEach(function(th) {
      th.addEventListener('click', function() {
        const key = th.dataset.key;
        if (sortKey === key) { sortDir *= -1; } else { sortKey = key; sortDir = -1; }
        render();
      });
    });


    // **The chips are bound by delegation on the container rather than one by one.** Binding
    // them one by one from an id array presents a missed one as 「点了没反应」 rather than an
    // error, and the default still applies (the first render reads the state), so it only
    // shows when somebody touches it. With delegation, adding a chip to the HTML makes it
    // respond automatically and there is no second place to remember to change
    document.getElementById('filterChips').addEventListener('click', function(e) {
      const chip = e.target.closest('.chip');
      if (!chip) return;
      setChipState(chip, NEXT_STATE[chip.dataset.state]);
      render();
    });
    // Fill in the aria-labels at startup — the HTML carries only data-state (the Chinese
    // wording for the states exists once in STATE_NAME, and putting it in the markup would be
    // a second copy)
    document.querySelectorAll('#filterChips .chip').forEach(function(chip) {
      setChipState(chip, chip.dataset.state);
    });
    document.getElementById('searchBox').addEventListener('input', render);
    // The search box does one thing more than the rest: when the library has nothing, go and
    // look on Steam. **Bound separately from render** — render is a pure repaint that has to
    // run whoever changed a filter, while this belongs only to the search box, and folding it
    // into render would mean weighing up a network request every time 「已完成」 is clicked
    document.getElementById('searchBox').addEventListener('input', onSearchInput);

    /**
     * The cross inside an input: pressing it clears the field. **One binding covers every
     * search box on the page**, so adding another only means writing the markup in
     * .search-field's shape, with no line to come back and add here.
     *
     * **After clearing it dispatches an input event rather than calling those handlers by
     * name.** The search box carries both render and onSearchInput, while the dialog's filter
     * field carries its own oninput — calling by name means coming back here for every
     * listener added, and missing one presents as 「清空了,结果还留在屏幕上」.
     *
     * **Esc is this button's keyboard equivalent, and it only intercepts while the field has
     * text.** In the dialog's field, Esc also means closing the whole dialog: with text it
     * clears the text and only without it closes the dialog, the same rule as the archive
     * dialog's 「先撤销待确认的那一下,再按才关框」.
     *
     * **The mouse path fires on `pointerdown`, not `click`.** A native `click` only fires
     * when `pointerdown` and the matching release land on the same element — this button is
     * the WCAG-floor 24×24, and anything that reflows in that window (a debounced search
     * result arriving, the topbar re-measuring after `#searchExtra` changes size) can put the
     * release a pixel outside it, and the whole click is silently dropped. That presented as
     * 「点了没反应,得再点一次」. `pointerdown` fires the instant the button is pressed and
     * needs no matching release, so it cannot be lost that way. `e.preventDefault()` only
     * stops the button from taking focus first — `clearField` already sends it to the input.
     * `clearField` is idempotent (clearing an already-empty field, refocusing an
     * already-focused input), so the plain `click` kept below for keyboard activation
     * (Space/Enter on a focused button, which fires `click` and never `pointerdown`) is safe
     * to also fire on the same mouse press without double-applying anything visible.
     */
    document.querySelectorAll('.search-field').forEach(function(field) {
      const input = field.querySelector('input');
      function clearField() {
        input.value = '';
        input.dispatchEvent(new Event('input', { bubbles: true }));
        // Typing the next term straight after clearing is the most common use, so focus should not fall back to the page
        input.focus();
      }
      const clearBtn = field.querySelector('.field-clear');
      clearBtn.addEventListener('pointerdown', function(e) {
        e.preventDefault();
        clearField();
      });
      clearBtn.addEventListener('click', clearField);
      input.addEventListener('keydown', function(e) {
        if (e.key !== 'Escape' || input.value === '') return;
        e.stopPropagation();
        clearField();
      });
    });

    document.querySelectorAll('.view-toggle button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        viewMode = btn.dataset.view;
        // Collapse the expanded row when switching view: the gallery has no such thing as expanding, and leaving it would make it appear out of nowhere on switching back
        expandedAppid = null;
        document.querySelectorAll('.view-toggle button').forEach(function(b) {
          b.classList.toggle('on', b === btn);
          // Painting the selected state without announcing it leaves screen-reader users unable to hear which view in the group is current
          b.setAttribute('aria-pressed', String(b === btn));
        });
        render();
      });
    });

    // ---- The row's Edit menu -------------------------------------------------
    //
    // 「改成就数量」 and 「删除」 used to be two buttons side by side on the row. Deleting is
    // **irreversible**, and it sat right next to a button clicked daily — that arrangement
    // gets clicked wrong sooner or later. Both are now one level down in the menu, while
    // 「锁定」 (formerly Manual) went the other way and became an icon on the row: it is
    // reversible and frequently used, and should not be hidden.

    /** Deletes a row. Moved from the 🗑 button into the menu, hence a standalone function */
    async function deleteGameFlow(appid) {
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      if (!game) return;
      const ok = await askConfirm({
        title: t('del.title', { game: game.name }),
        body: t('del.body'),
        okText: t('del.ok'),
        danger: true,
      });
      if (!ok) return;
      rpc.withSuccessHandler(function(result) {
        if (result && result.error) {
          askConfirm({ title: t('del.failed'), body: result.error, okText: t('del.gotIt'), notifyOnly: true });
          return;
        }
        allGames = allGames.filter(function(g){ return String(g.appid) !== String(appid); });
        if (expandedAppid === String(appid)) expandedAppid = null;
        render();
      }).withFailureHandler(function(err) {
        askConfirm({ title: t('del.failed'), body: String(err && err.message || err), okText: t('del.gotIt'), notifyOnly: true });
      }).deleteGame(appid);
    }

    /**
     * The menu's 「编辑」. **It necessarily locks the row as well.**
     *
     * The backend's setManualAchievements only accepts a locked row, and that guard is right:
     * unlocked, the next sync would overwrite the hand-entered numbers with Steam's, with no
     * warning at all.
     * So this locks first and then shows the inputs — the lock lighting up on the row is the
     * feedback for that.
     */
    function startManualEdit(appid) {
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      if (!game) return;
      const focusInput = function() {
        const el = document.querySelector(
          '[data-manual-row-appid="' + appid + '"][data-manual-field="achieved"]');
        if (el) { el.focus(); el.select(); }
      };
      editingAppid = String(appid);
      if (game.manual) { render(); focusInput(); return; }

      game.manual = true;   // optimistic update: the inputs appear immediately, without waiting for the round trip
      render();
      focusInput();
      rpc.withSuccessHandler(function(result) {
        if (result && typeof result.manual === 'boolean') game.manual = result.manual;
      }).withFailureHandler(function() {
        game.manual = false;
        editingAppid = null;
        render();
      }).setManualStatus(appid, true);
    }

    /** Exits edit mode: the lock is unchanged and the numbers revert to plain text */
    /**
     * Flips one row's hidden mark. **The same optimistic shape as the family toggle**: change it
     * locally, repaint, and put it back if the write fails — a mark that appears to take and then
     * silently is not there next reload is worse than one that visibly refuses.
     *
     * The repaint is what makes the row vanish (the 「已隐藏」 chip starts excluded), and that
     * disappearance **is** the confirmation — there is no message to write.
     */
    function toggleHiddenFlag(appid) {
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      if (!game) return;
      game.hidden = !game.hidden;
      render();
      rpc.withSuccessHandler(function(result) {
        if (result && typeof result.hidden === 'boolean') game.hidden = result.hidden;
      }).withFailureHandler(function() {
        game.hidden = !game.hidden;
        render();
      }).toggleHidden(appid);
    }

    function stopManualEdit() {
      if (editingAppid === null) return;
      editingAppid = null;
      render();
    }

    const rowMenu = document.getElementById('rowEditMenu');
    const closeRowMenu = function() { rowMenu.hidden = true; };

    // ========================================================================
    // Guide backups
    // ------------------------------------------------------------------------
    // The entry point for retrieving from the three archive directories (`.backups/`,
    // `.migrated/`, `.drafts/`) is **on each game's row**, because the question is always
    // 「这个游戏的上一版哪去了」. The global list on the settings page covers only two things:
    // how much space is taken in total, and the ones whose game has been deleted and are
    // unreachable from a row.
    // ========================================================================

    /**
     * The appids currently running a rewrite or a migration. **The state hangs on the appid,
     * not on the button.**
     *
     * **It cannot be written as `btn.disabled = true`** — that button is reassembled on every
     * `render()`, so one background sync colliding with a two-or-three-minute rewrite washes
     * the disabled state away, leaving the button clickable again while the job is still
     * running.
     * The button's disabled attribute is **rendered from this set**, so it survives any number
     * of repaints.
     *
     * Changing it triggers one repaint, or the button stays grey after the job finishes.
     * **Not while editing** — `render()` rebuilds innerHTML and would swap out the two number
     * fields being typed into, along with the focus.
     */
    const guideBusy = new Set();
    function setGuideBusy(appid, busy) {
      const id = String(appid);
      if (busy) guideBusy.add(id); else guideBusy.delete(id);
      if (editingAppid === null && allGames.length) render();
    }

    /**
     * appid → that game's archives. **Fetched once for the whole table and cached locally**
     * rather than queried each time a menu opens: the menu has to state how many there are at
     * the instant it is pressed (the count is the reason to press it or not), and one request's
     * round trip is long enough for the menu to be painted first and then grow a number.
     */
    let archiveIndex = {};
    function archivesFor(appid) {
      return archiveIndex[String(appid)] || [];
    }

    /**
     * After touching an archive, repaint **both places**: the list in the dialog, and the
     * 「备份 N」 at the end of the row.
     *
     * Missing the second is the shape this project keeps falling into — one number with two
     * render points and only one repaint path. Measured: after deleting one, the dialog said
     * 「1 份」 while the row still said 「备份 2」, two numbers contradicting each other on one
     * screen, and without a page refresh they would never agree.
     */
    async function refreshArchives() {
      await loadArchiveIndex();
      // Do not paint the dialog when it is not open — this function is also called after a
      // rewrite/migration finishes, and at that point arcAppid is still the last game looked at
      // (or null), so painting produces an unrelated list
      if (arcModal.classList.contains('show')) paintArchive();
      if (editingAppid === null && allGames.length) render();
    }

    async function loadArchiveIndex() {
      const list = await new Promise(function (resolve) {
        rpc.withSuccessHandler(resolve).withFailureHandler(function(){ resolve(null); })
          .listGuideArchives(null);
      });
      if (!Array.isArray(list)) return; // failing to fetch keeps the previous copy: a menu missing a number beats a row disappearing
      const next = {};
      for (const e of list) {
        if (!e.appid) continue;
        (next[e.appid] = next[e.appid] || []).push(e);
      }
      archiveIndex = next;
    }

    const arcModal = document.getElementById('archiveModal');
    let arcAppid = null;
    /** The button awaiting confirmation. Only one at a time */
    let arcArmed = null;

    function arcDisarm() {
      if (!arcArmed) return;
      arcArmed.btn.textContent = arcArmed.label;
      arcArmed.btn.classList.remove('armed');
      const row = arcArmed.btn.closest('.arc');
      if (row) row.classList.remove('armed');
      arcArmed = null;
    }

    /** The two-click gesture: the first click turns the button into **the consequence**, and the second actually runs it */
    function arcArm(btn, label, confirmLabel, run) {
      btn.onclick = async function (e) {
        e.stopPropagation();
        if (arcArmed && arcArmed.btn === btn) {
          arcDisarm();
          btn.disabled = true;
          // finally: if run() throws, the button would stay disabled forever. As in Setup.html's arm()
          try {
            await run();
          } finally {
            btn.disabled = false;
          }
          return;
        }
        arcDisarm();
        arcArmed = { btn: btn, label: label };
        btn.textContent = confirmLabel;
        btn.classList.add('armed');
        const row = btn.closest('.arc');
        if (row) row.classList.add('armed');
      };
    }

    const arcKb = function(n){ return n >= 1024 ? (n / 1024).toFixed(1) + ' KB' : n + ' B'; };
    const arcWhen = function(iso) {
      // The locale follows the interface language, not the machine
      return new Date(iso).toLocaleString(LANG === 'en' ? 'en-GB' : 'zh-CN',
        { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    };
    function setArcMsg(text, cls) {
      const el = document.getElementById('arcMsg');
      el.className = 'arc-msg' + (cls ? ' ' + cls : '');
      el.textContent = text || '';
    }

    /**
     * One archive row. **Built with DOM rather than innerHTML** — the file name comes from the
     * user's own directory.
     *
     * In this row `label` is the entire identity (「覆盖前的原文」 / 「搬去 Notion 时留下的原
     * 件」 / 「没过校验的草稿」) — the dialog title already says which game it is, and writing the
     * game name again on every row prints the same sentence ten times
     */
    function arcRow(e) {
      const li = document.createElement('li');
      li.className = 'arc';
      const row = document.createElement('div');
      row.className = 'arc-row';

      const main = document.createElement('div');
      main.className = 'arc-main';
      const name = document.createElement('b');
      name.textContent = e.label;
      const meta = document.createElement('span');
      meta.className = 'arc-meta';
      meta.textContent = arcWhen(e.savedAt) + ' · ' + arcKb(e.bytes)
        + (e.kind === 'notion' ? t('arc.notionWhole') : '');
      main.appendChild(name);
      main.appendChild(meta);

      const acts = document.createElement('div');
      acts.className = 'arc-acts';

      // 「看」 is the one action that changes nothing, so it needs no second click
      const view = document.createElement('button');
      view.type = 'button';
      view.textContent = t('arc.view');
      view.onclick = async function (ev) {
        ev.stopPropagation();
        const open = li.querySelector('.arc-body');
        if (open) { open.remove(); view.textContent = t('arc.view'); return; }
        view.disabled = true;
        const r = await new Promise(function (resolve) {
          rpc.withSuccessHandler(resolve).withFailureHandler(function(err){ resolve({ error: String(err) }); })
            .readGuideArchive(e.id);
        });
        view.disabled = false;
        const body = document.createElement('pre');
        body.className = 'arc-body';
        body.textContent = r && r.error ? r.error : ((r && r.text) || t('arc.empty'));
        li.appendChild(body);
        view.textContent = t('arc.collapse');
      };

      const restore = document.createElement('button');
      restore.type = 'button';
      restore.textContent = t('arc.restore');
      arcArm(restore, t('arc.restore'), e.kind === 'notion' ? t('arc.restoreNotion') : t('arc.restoreLocal'), async function () {
        setArcMsg(t('arc.restoring'));
        const r = await new Promise(function (resolve) {
          rpc.withSuccessHandler(resolve).withFailureHandler(function(err){ resolve({ error: String(err) }); })
            .restoreGuideArchive(e.id);
        });
        if (!r || r.error) return setArcMsg((r && r.error) || t('arc.restoreFailed'), 'error');
        // **Where the displaced copy went has to be said.** Restoring is itself an overwrite,
        // and the backup just created is its way back — not saying so buries the same thing all
        // over again
        setArcMsg(
          (r.kind === 'notion' ? t('arc.wroteNotion', { n: r.count }) : t('arc.wroteFile', { file: r.file }))
            + (r.unregisteredNotion ? t('arc.unregistered') : '')
            + (r.backedUpTo ? t('arc.backedUp') : ''),
          'ok'
        );
        await refreshArchives();
        loadDashboard(); // the registration may have flipped from notion to local, so the row's guide link has to follow
      });

      const del = document.createElement('button');
      del.type = 'button';
      del.textContent = t('arc.delete');
      arcArm(del, t('arc.delete'), t('arc.deleteArmed'), async function () {
        const r = await new Promise(function (resolve) {
          rpc.withSuccessHandler(resolve).withFailureHandler(function(err){ resolve({ error: String(err) }); })
            .deleteGuideArchive(e.id);
        });
        if (!r || r.error) return setArcMsg((r && r.error) || t('arc.deleteFailed'), 'error');
        setArcMsg(t('arc.deletedOne', { size: arcKb(r.bytes) }), 'ok');
        await refreshArchives();
      });

      acts.appendChild(view);
      acts.appendChild(restore);
      acts.appendChild(del);
      row.appendChild(main);
      row.appendChild(acts);
      li.appendChild(row);
      return li;
    }

    function paintArchive() {
      arcArmed = null;
      const list = archivesFor(arcAppid);
      const ul = document.getElementById('arcList');
      ul.textContent = '';
      for (const e of list) ul.appendChild(arcRow(e));
      const bytes = list.reduce(function(n, e){ return n + e.bytes; }, 0);
      document.getElementById('arcSum').textContent = list.length
        ? t('arc.summary', { n: list.length, size: arcKb(bytes) })
        : t('arc.none');
    }

    // The 「备份 N」 button on the row calls into here — hung on window like rewriteGuide /
    // migrateGuide, because the button is HTML assembled as a string by render()
    window.openBackups = function (appid, name) {
      arcAppid = String(appid);
      document.getElementById('arcTitle').textContent = name || appid;
      setArcMsg('');
      paintArchive();
      arcModal.classList.add('show');
    };

    function closeArchiveModal() {
      arcDisarm();
      arcModal.classList.remove('show');
    }

    document.getElementById('arcCloseBtn').addEventListener('click', closeArchiveModal);
    // Clicking the overlay closes it, clicking inside the box does not — as with the page's other two modals
    arcModal.addEventListener('click', function (e) {
      if (e.target === arcModal) closeArchiveModal();
      else if (arcArmed && !e.target.closest('.arc-acts')) arcDisarm();
    });

    function openRowMenu(btn, appid) {
      const game = allGames.find(function(g){ return String(g.appid) === String(appid); });
      if (!game) return;
      rowMenu.innerHTML = '';
      const item = function(o) {
        const b = document.createElement('button');
        b.textContent = o.label;
        if (o.cls) b.className = o.cls;
        if (o.title) b.title = o.title;
        b.addEventListener('click', function(e) { e.stopPropagation(); closeRowMenu(); o.run(); });
        rowMenu.appendChild(b);
      };

      // **A label states the action only, never the object.** The menu pops out of a button on
      // a row, so 「这一行」 and 「成就数量」 are context visible on the spot, and writing them
      // into the label repeats what is already known.
      // 「会连带上锁」 likewise stays in a title: the lock icon lighting up on the spot already
      // says so
      //
      // The two groups exist because the menu now holds two different objects: the upper group
      // acts on **this guide** and the lower one on **this game's row**. Without the split,
      // 「删除」 has two readings
      // **This menu holds only what is done to 「这一行游戏」.** All four things done to the
      // guide (open, rewrite, move to Notion, backups) are on the row: those four are
      // deliberate actions, and burying them one level down adds a click to each. The dividing
      // line is the object, not the frequency — and because only one object is left, no group
      // headings are needed here
      item({
        label: t('menu.edit'),
        title: game.manual ? '' : t('menu.editTitle'),
        run: function(){ startManualEdit(appid); },
      });
      // Between 编辑 and 删除 rather than beside 删除: both of those act on this row, and hiding is
      // the reversible one of the pair, so it must not sit inside the danger group's reading distance
      item({
        label: game.hidden ? t('menu.unhide') : t('menu.hide'),
        title: t('menu.hideTitle'),
        run: function(){ toggleHiddenFlag(appid); },
      });
      item({ label: t('menu.delete'), cls: 'danger', run: function(){ deleteGameFlow(appid); } });

      rowMenu.hidden = false;
      const r = btn.getBoundingClientRect();
      // Left-aligned just below the button, but never past the right edge — this button is at the end of the row, so rows near the right would push it out
      const maxLeft = window.scrollX + document.documentElement.clientWidth - rowMenu.offsetWidth - 8;
      rowMenu.style.top = (window.scrollY + r.bottom + 6) + 'px';
      rowMenu.style.left = Math.max(8, Math.min(window.scrollX + r.left, maxLeft)) + 'px';
    }

    // Clicking elsewhere / Esc closes it. blur cannot be used — a button inside the menu taking focus fires it too, so one click would close it
    document.addEventListener('click', function(e) {
      if (!rowMenu.hidden && !rowMenu.contains(e.target)) closeRowMenu();

      // **The second route out of editing, coexisting with focusout.** In some browsers
      // clicking blank space does not move focus at all, so focusout never arrives and the row
      // stays editable — which is precisely the 「随时能被误改」 this change set out to remove.
      // Both routes point at the same stopManualEdit, and calling it twice is safe
      if (editingAppid !== null) {
        const row = document.querySelector('tr[data-appid="' + editingAppid + '"]');
        if (!row || !row.contains(e.target)) stopManualEdit();
      }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key !== 'Escape') return;
      if (!rowMenu.hidden) return closeRowMenu();
      // In the archive dialog, Esc first disarms the pending confirmation and only closes the
      // dialog on a second press — while holding up 「永久删除」, what you want to take back is
      // that press, not the whole dialog
      if (arcModal.classList.contains('show')) {
        if (arcArmed) arcDisarm();
        else closeArchiveModal();
      }
    });

    /** The one line under the search box. Empty text clears it. */
    function setAddMsg(text, cls) {
      const old = document.getElementById('addGameMsg');
      const span = document.createElement('span');
      span.id = 'addGameMsg';
      span.className = 'add-game-msg' + (cls ? ' ' + cls : '');
      span.textContent = text;
      old.replaceWith(span);
    }

    function addSelectedGame(appid, name, family) {
      setAddMsg(t('add.adding'));

      rpc.withSuccessHandler(function(result) {
        if (result && result.error) {
          setAddMsg(result.error, 'error');
          return;
        }
        allGames.push(result);
        render();
        // **Success writes nothing**, for the same reason the search itself writes nothing:
        // the term stays in the box, so the row just added is in the table this render drew
        setAddMsg('');
      }).withFailureHandler(function(err) {
        setAddMsg(t('add.failed', { reason: err.message }), 'error');
      }).addGame(appid, name, family);
    }

    /** The skeleton rows shown while waiting for Steam. Three — enough to read as "a list" without making the frozen area much taller */
    function renderSkeleton() {
      const box = document.getElementById('gameSearchResults');
      document.getElementById('steamLabel').hidden = false;
      box.style.display = 'flex';
      const row = '<div class="game-search-result skeleton" aria-hidden="true">'
        + '<span class="skel-img"></span><span class="skel-line"></span></div>';
      box.innerHTML = row.repeat(3);
      measureTopbar();
    }

    function renderSearchResults(items) {
      const box = document.getElementById('gameSearchResults');
      const label = document.getElementById('steamLabel');
      const extra = document.getElementById('searchExtra');
      steamItems = items || [];

      // **When the library has already answered, Steam's results collapse to one line.**
      //
      // Ten rows expanded is ~370px, and this block lives in the frozen area — every search of
      // one's own library would push ten rows of table off the screen in exchange for
      // supplementary results the user most likely was not looking for. So: nothing in the
      // library ⇒ the results are the answer, laid out; something in the library ⇒ folded to one
      // line, expanded on click. **That line's job is to make 「还能加」 visible** — hidden
      // entirely, a hidden path and a nonexistent path are the same thing
      if (steamItems.length && libHit && !steamExpanded) {
        extra.hidden = false;
        label.hidden = true;
        box.style.display = 'flex';
        box.innerHTML = '<button type="button" class="steam-more" id="steamMore">'
          + escapeHtml(t('add.storeResults', { n: steamItems.length })) + '</button>';
        document.getElementById('steamMore').addEventListener('click', function() {
          steamExpanded = true;
          renderSearchResults(steamItems);
        });
        measureTopbar();
        return;
      }

      label.hidden = !steamItems.length;
      if (!items || items.length === 0) {
        box.style.display = 'none';
        box.innerHTML = '';
        // Collapsed, the frozen area is shorter and the header has to come up with it — measured
        // here deliberately rather than waiting for the observer: this is the **only place the
        // frozen area's height changes mid-session**, and we are the ones changing it, so
        // reporting it ourselves is steadier than betting on a channel that only calls back while
        // the page is genuinely rendering
        measureTopbar();
        return;
      }
      box.style.display = 'flex';
      // **A button, not a div.** It used to be a div with a click handler: usable with a mouse and
      // entirely out of reach from the keyboard — tab could not get to it and Enter did nothing,
      // and this is the only entry point for 「添加一个游戏」.
      // type="button" is mandatory: the default type is submit, so if this block ever ends up
      // inside a form it would submit the page
      box.innerHTML = items.map(function(g) {
        return '<button type="button" class="game-search-result" data-appid="' + g.appid + '" data-name="' + escapeHtml(g.name) + '">'
          + '<img src="' + thumbUrl(g.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'" alt="">'
          + '<span>' + escapeHtml(g.name) + ' <span class="appid-hint">(' + g.appid + ')</span></span>'
          + '</button>';
      }).join('');

      box.querySelectorAll('.game-search-result').forEach(function(el) {
        el.addEventListener('click', function() {
          // Selecting opens a confirm dialog rather than adding directly
          const appid = el.dataset.appid;
          const name = el.dataset.name;
          document.getElementById('confirmGameName').textContent = name;
          document.getElementById('addConfirmModal').dataset.appid = appid;
          document.getElementById('addConfirmModal').dataset.name = name;
          document.getElementById('addConfirmModal').classList.add('show');
        });
      });
      // With the dropdown expanded the frozen area is taller, so the header has to yield (the same reasoning as the measurement above)
      measureTopbar();
    }

    /**
     * When nothing in the library matched, go and look on Steam.
     *
     * **This request is sent only in that one case.** Local filtering is free and instant, while
     * this is a rate-limited network call, and the vast majority of searches are for games one
     * already has. Because search bypasses every checkbox (see hidingFilter), 「本地 0 条」 is
     * judged against the whole library, which is what makes this switch hold up — judged against
     * the filtered results instead, more than half of all searches would end up here.
     */
    function runGameSearch(query) {
      // Being busy = drawing a few skeleton rows, not writing a sentence. See
      // .game-search-result.skeleton.
      // **Not drawn when the library already has results** — the table has already answered in
      // that case, and flashing three skeleton rows for a supplementary result the user did not
      // ask for trades noise for something most likely unused
      if (!libHit) renderSkeleton();
      rpc.withSuccessHandler(function(items) {
        // By the time the request returns the user may have kept typing. **Compare against the
        // term as it was**, or a slow response overwrites a fast one and the list no longer
        // matches the input (a classic race, which the debounce cannot stop here)
        if (document.getElementById('searchBox').value.trim() !== query) return;
        if (!items || items.length === 0) {
          // Nothing in the library and nothing on Steam — a genuine dead end, and this is the case
          // that needs words.
          // With something in the library, nothing is said: what the user was looking for was
          // already given by the table
          if (!libHit) setAddMsg(t('add.notFound', { query: query }));
          renderSearchResults([]);
          return;
        }
        // **Success writes nothing.** The results are themselves the sentence 「搜到了」: with ten
        // rows of games and cover art on screen, nobody needs a 「下面是 Steam 上的结果」 to
        // confirm it
        setAddMsg('');
        renderSearchResults(items);
      }).withFailureHandler(function(err) {
        if (document.getElementById('searchBox').value.trim() !== query) return;
        // **Do not report a local fault as a Steam fault.** `Failed to fetch` means this fetch
        // never went out at all — the background service is not running, the port is taken, it was
        // just shut down — and has nothing to do with Steam.
        // Writing 「搜索 Steam 失败」 outright sends people off to check their network and Steam
        // while what needs fixing is that local service (measured in practice: the service process
        // stopped while the page was open, and the notice said Steam was down)
        const local = /Failed to fetch|NetworkError|load failed/i.test(String(err.message));
        setAddMsg(local ? t('add.unreachable') : t('add.searchFailed', { reason: err.message }), 'error');
        renderSearchResults([]);
      }).searchSteamGames(query);
    }

    /**
     * Every change in the input comes through here. **The two halves run at different speeds,
     * deliberately:**
     *
     * - the local filter runs **immediately** (render is already bound elsewhere; zero cost, zero
     *   delay)
     * - the Steam half waits 300ms for typing to stop, and is only sent when nothing in the
     *   library matched
     *
     * "A loading indicator has to be worth the wait, and a near-instant operation should not
     * flash one" — so the local half has no spinner at all, and 「正在 Steam 上找…」 can only
     * appear after the debounce, never flashing for a search that a local lookup solves.
     */
    let searchTimeout = null;
    /**
     * Whether this term matched anything in the library. **It affects only how things are
     * displayed, not whether to search** — see onSearchInput.
     * steamExpanded: whether the folded line has been expanded; it resets on a new search term.
     * steamItems: the results already fetched, repainted directly on expansion rather than
     * requested again.
     */
    let libHit = false;
    let steamExpanded = false;
    let steamItems = [];
    function onSearchInput() {
      const query = document.getElementById('searchBox').value.trim();
      const extra = document.getElementById('searchExtra');
      clearTimeout(searchTimeout);

      // The previous term owns both its results and its notice, so a new term clears them
      // before it has anything of its own to put there
      renderSearchResults([]);
      setAddMsg('');

      steamExpanded = false;  // a new term, so the previous expansion state should not carry over
      if (!query) {
        extra.hidden = true;
        measureTopbar();
        return;
      }
      // **Whether the library has it decides only how things are displayed, no longer whether to
      // search.**
      //
      // The rule used to be "if the library has it, do not go to Steam", and that conflated two
      // things: 「找到了东西」 is not 「找到了你要的那个东西」. Somebody wanting to add Silksong
      // types silk, the library happens to contain a Silkroad — and the route to adding vanishes,
      // **without it being visible that it vanished**.
      libHit = allGames.some(function(g) { return nameMatches(g, query); });
      // Nothing in the library ⇒ Steam's results are the answer, so clear the space first and draw
      // the skeletons;
      // something in the library ⇒ stay quiet and decide whether to appear once the results are
      // back (most likely as one line only)
      extra.hidden = libHit;
      measureTopbar();
      searchTimeout = setTimeout(function() { runGameSearch(query); }, 300);
    }

    document.getElementById('confirmAddBtn').addEventListener('click', function() {
      const modal = document.getElementById('addConfirmModal');
      const appid = modal.dataset.appid;
      const name = modal.dataset.name;
      if (!appid) return;
      const family = document.getElementById('confirmFamily').checked;
      modal.classList.remove('show');
      renderSearchResults([]);
      // **The search box is not cleared.** It is also the filter box now: clearing it would snap
      // the table back to the whole library and drown the row just added among three hundred —
      // keeping the term leaves the new game right there in the table (it necessarily matches
      // the term, or it could not have been found)
      // Reset to ticked by default: this dialog is reused, and the previous unticking should not carry over to the next game
      document.getElementById('confirmFamily').checked = true;
      addSelectedGame(appid, name, family);
    });

    document.getElementById('cancelAddBtn').addEventListener('click', function() {
      document.getElementById('addConfirmModal').classList.remove('show');
    });

    /**
     * The in-page confirm dialog, returning a Promise<boolean>. **Every confirmation goes through
     * here; do not use window.confirm any more.**
     *
     * The reason is the packaged build: in Electron a native confirm appears and immediately
     * disappears, leaving the user unable to press OK, while the same page is entirely fine in a
     * browser — so the route "generate a guide from the Dashboard" was broken in the packaged
     * build, and broken with no warning at all. A native dialog's lifecycle belongs to the main
     * process and the page cannot take it back; an in-page box has no such problem, and browsers
     * and the packaged build behave identically.
     *
     * With `notifyOnly` there is only one button, used to replace `alert()` — a native alert has
     * the same illness as a native confirm in the packaged build, only with lighter consequences
     * (an error notice goes unseen, rather than an action being impossible)
     *
     * @param {{title: string, body: string, okText?: string, danger?: boolean, notifyOnly?: boolean}} o
     */
    function askConfirm(o) {
      return new Promise(function (resolve) {
        const modal = document.getElementById('askModal');
        // A dialog with a picker list gets a fixed width: its content changes, and an interface
        // should not twitch while somebody is operating it.
        // The criterion is "does this dialog have a picker", not "is the picker showing right now"
        // — otherwise switching between whole/hand-picked would change the width each time, which
        // is the same illness with a different trigger
        modal.querySelector('.modal-box').classList.toggle('ask-wide', Boolean(o.picker));
        const okBtn = document.getElementById('askOkBtn');
        const cancelBtn = document.getElementById('askCancelBtn');
        document.getElementById('askTitle').textContent = o.title;
        // With no body the whole element collapses, or a block of whitespace with margins is left
        // and the dialog looks broken.
        //
        // **The body is a fixed sentence and does not change with the selection** — no function is
        // accepted and nothing is computed from the currently selected scope. A mechanism with no
        // caller drifts
        const bodyEl = document.getElementById('askBody');
        bodyEl.textContent = o.body || '';
        bodyEl.style.display = o.body ? '' : 'none';
        okBtn.textContent = o.okText || t('dlg.ok');

        // **The return value is still a boolean.** The choice is written back into the caller's own
        // `o.choices[i].value`, so askConfirm's contract is unchanged — it has six call sites, and
        // changing the return type for the sake of a few optional controls would make four
        // unrelated places follow along.
        //
        // The change from a single `choice` to a `choices` array is because the rewrite dialog asks
        // **two things** (which entries, how deep to research). Keeping one `choice` and adding a
        // `choice2` would be a second mechanism for the same question — a shape that drifts every
        // time in this project
        const choicesWrap = document.getElementById('askChoices');
        choicesWrap.innerHTML = '';
        const groups = o.choices || [];

        groups.forEach(function (g) {
          const row = document.createElement('div');
          row.className = 'ask-choice';
          const label = document.createElement('span');
          label.textContent = g.label;
          const group = document.createElement('div');
          group.className = 'view-toggle';
          group.setAttribute('role', 'group');
          group.setAttribute('aria-label', g.label);

          /**
           * The note for the current tier, on the line below the buttons. **It cannot be a
           * `title`** — hover does not exist at all on a touchscreen and a screen reader does not
           * announce it, and this is exactly the kind of information that "somebody who has never
           * used it does not know which to pick": it has to be visible **before** choosing.
           * `aria-describedby` attaches it to this group, so a screen reader reading these buttons
           * announces the current sentence along with them
           */
          const hasHints = g.options.some(function (o2) { return o2.hint; });
          const hintEl = hasHints ? document.createElement('div') : null;
          if (hintEl) {
            hintEl.className = 'ask-hint';
            hintEl.id = 'askHint-' + g.key;
            group.setAttribute('aria-describedby', hintEl.id);
          }
          function paintHint() {
            if (!hintEl) return;
            const cur = g.options.filter(function (o2) { return o2.value === g.value; })[0];
            hintEl.textContent = (cur && cur.hint) || '';
          }

          g.options.forEach(function (opt) {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = opt.label;
            // The comparison is written at the call site: html-smoke requires toggle's second
            // argument to be visibly a boolean (a local variable name is not, and undefined would
            // make it flip rather than clear)
            b.classList.toggle('on', opt.value === g.value);
            // The selected state has to be **announced** and cannot rely on the fill alone — with
            // only a class, a screen-reader user cannot hear which of the group is selected
            // (ui-ux-pro-max lists this as Critical)
            b.setAttribute('aria-pressed', String(opt.value === g.value));
            // **title and disabled are two different things and must not be tied together.**
            // Putting this line inside `if (opt.disabled)` (on the grounds that a title is only for
            // explaining "why is it grey") makes a **clickable** button like 「稀有成就」 lose its
            // title — not one word of the criterion (a global unlock rate below 10%) appears, while
            // the button looks entirely normal.
            // An unavailable one still has to be able to say why: a grey button reading 「稀有 0」
            // and a grey button caused by Steam not answering look the same and mean the opposite
            if (opt.title) b.title = opt.title;
            if (opt.disabled) b.disabled = true;
            b.addEventListener('click', function () {
              g.value = opt.value;
              [...group.children].forEach(function (c) {
                c.classList.toggle('on', c === b);
                c.setAttribute('aria-pressed', String(c === b));
              });
              paintHint();
              syncInput();
              syncPicker();
            });
            group.appendChild(b);
          });

          row.appendChild(label);
          row.appendChild(group);
          if (hintEl) {
            paintHint();
            row.appendChild(hintEl);
          }
          choicesWrap.appendChild(row);
        });

        // The one-line input. `o.input.when` decides which choices it appears under — progressive
        // disclosure: 「怎么改」 only means anything for a partial rewrite, and during a whole
        // rewrite it would be an input field nobody reads
        const inputWrap = document.getElementById('askInputWrap');
        const inputEl = document.getElementById('askInput');
        function syncInput() {
          if (!o.input) { inputWrap.hidden = true; return; }
          const state = groups.reduce(function (acc, g) { acc[g.key] = g.value; return acc; }, {});
          inputWrap.hidden = typeof o.input.when === 'function' ? !o.input.when(state) : false;
        }
        if (o.input) {
          document.getElementById('askInputLabel').textContent = o.input.label;
          inputEl.placeholder = o.input.placeholder || '';
          inputEl.value = o.input.value || '';
          inputEl.oninput = function () { o.input.value = inputEl.value; };
        } else {
          inputEl.oninput = null;
        }

        /**
         * Hand-picking: a list grouped by section, where **clicking a section heading selects the
         * whole section**.
         *
         * The selection is written back into `o.picker.selected` (a Set), as with choices —
         * askConfirm's return value is still a boolean, and the caller takes the result off the
         * object it passed in.
         */
        const pickWrap = document.getElementById('askPickWrap');
        const pickList = document.getElementById('askPickList');
        const pickFilter = document.getElementById('askPickFilter');
        const pickCount = document.getElementById('askPickCount');
        const pickQuick = document.getElementById('askPickQuick');
        const pickClear = document.getElementById('askPickClear');
        const pickAll = document.getElementById('askPickAll');

        function pickerShown() {
          if (!o.picker) return false;
          const state = groups.reduce(function (acc, g) { acc[g.key] = g.value; return acc; }, {});
          return typeof o.picker.when === 'function' ? o.picker.when(state) : true;
        }

        /**
         * The row of shortcuts. **Each is a switch**: with the whole batch in the selection it is
         * "selected", and pressing again clears it.
         *
         * The same behaviour as the section heading's box, and that is no coincidence — they are
         * two axes of one thing, one grouping by position and the other by attribute. Behaving
         * differently in the two places would mean learning it twice.
         */
        /**
         * The display criterion. **There is exactly one** — who the list draws and who 「全选」
