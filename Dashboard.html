      transition: transform var(--dur-2) var(--ease);
    }
    .g-card:hover img { transform: scale(1.04); }
    /* A portrait card is narrow, so the name and the progress **stack** rather than
       sitting side by side — side by side, a Chinese name wraps after two or three
       characters.
       The top padding is set from the card's height rather than from the absolute
       value of a large 336px card: 32px of padding moved onto a card a couple of
       hundred pixels wide means the gradient alone eats a third of the cover */
    .g-scrim {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: var(--s5) var(--s2) 7px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      /* The gradient holds the text — the bottom of a cover varies between light and dark, and without it the name is unreadable on a pale cover */
      background: linear-gradient(to top, rgba(0,0,0,0.94) 26%, rgba(0,0,0,0.55) 62%, rgba(0,0,0,0));
    }
    .g-name {
      font-size: var(--fs-sm);
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
      /* Two lines at most, clipped beyond: the cover's height is fixed, and a long name expanding would push the progress line off the card */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .g-rate { font-size: 10px; color: rgba(255, 255, 255, 0.75); }
    .g-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.16); }
    .g-bar span { display: block; height: 100%; }
    /* The heart is a size smaller than before, and **by default only appears on hover
       or when already favourited** — once the cards are dense, three hundred permanent
       hearts on one screen overpower the covers themselves, while favouriting is an
       occasional action */
    .g-heart {
      position: absolute;
      top: 2px;
      right: 2px;
      z-index: 2;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      opacity: 0;
      transition: opacity var(--dur-1);
      /* Covers come in every colour, so a dark drop shadow gives the icon a floor */
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.8));
    }
    .g-card:hover .g-heart,
    .g-heart:focus-visible,
    .g-heart.active-heart { opacity: 1; }
    .g-heart:hover { background: none; color: #fff; }

    /* ========================================================================
       Overlays: the generation progress bar, the confirm dialog, the row menu
       ======================================================================== */
    /*
      Floating, so it does not scroll away with the page. One generation takes two to
      four minutes, and during that time people are mostly scrolling down the table —
      a progress bar pinned at the top of the document flow means "to see it you have
      to scroll back".

      **Bottom left, because the bottom right is taken by lib/rpc.js's sync status bar**
      (which hardcodes right:16px / bottom:16px / z-index:9999). Each overlay takes a
      corner and neither covers the other; the z-index here is one tier lower, so if
      they ever do collide the sync status bar is on top.
    */
    #gen-bar {
      display: none;
      position: fixed;
      left: var(--s4);
      bottom: var(--s4);
      z-index: 9990;
      max-width: min(420px, calc(100vw - var(--s6)));
      max-height: 60vh;
      overflow-y: auto;
      /* Room reserved on the right for the one corner button — cancel while live, close once
         finished, never both. 42px is its 31px (see .gen-close's padding below) plus the 4px it
         is inset by, plus room to breathe */
      padding: var(--s3) 42px var(--s3) var(--s4);
      border: 1px solid rgba(140, 198, 63, 0.5);
      border-left: 3px solid var(--ok);
      border-radius: var(--r-md);
      /* Anything floating has to have an opaque background, or it overlaps the table text below and becomes unreadable */
      background: var(--surface-3);
      box-shadow: var(--sh-3);
      font-size: var(--fs-sm);
      line-height: 1.6;
      color: var(--text);
    }
    #gen-bar .warn { color: var(--text-3); }
    /* The actions in this floater look the same whether an <a> or a <button> is
       underneath — 「打开攻略」 and 「打开文件夹」 are two things of equal standing, and
       making one an underline and the other a solid button would rank them */
    #gen-bar a,
    #gen-bar .gen-link {
      color: var(--accent);
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    #gen-bar .gen-link:disabled { opacity: 0.5; cursor: default; }
    /* Deleting a backup is the one irreversible action on this progress bar. It does
       not compete for attention normally (an underline like the others) and only turns
       red after the first press — a permanently red link makes the whole screen read
       as an error */
    #gen-bar .gen-link.danger { color: var(--text-2); }
    #gen-bar .gen-link.danger:hover:not(:disabled) { color: var(--danger); }
    #gen-bar .gen-link.armed { color: var(--danger); font-weight: 600; }
    /* A job running = it can be cancelled; finished = it can only be closed */
    #gen-bar.live #genClose,
    #gen-bar:not(.live) #genCancel { display: none; }
    #gen-bar .gen-close {
      position: absolute;
      /* Centred on the first line of #gen-msg, not on the container's own top edge — those are
         not the same thing. The container's padding-top is var(--s3) (12px); #gen-msg's line box
         is 12px font × 1.6 line-height = 19.2px, so that line's own centre sits at 12 + 19.2/2 =
         21.6px from the top. This button is 31px tall (see the padding comment below), so its top
         has to be 21.6 − 31/2 = 6.1px for the two centres to land on the same line — not var(--s1)
         (4px), which is 2px shy and reads as "floating slightly above the text" */
      top: 6px;
      right: var(--s1);
      background: none;
      border: none;
      /* var(--s1) (4px) used to leave this at 15px icon + 8px padding = 23×23 CSS px — one pixel
         under WCAG 2.2 AA's 24×24 minimum pointer target (Success Criterion 2.5.8). var(--s2)
         clears it with real margin: 15 + 16 = 31×31 */
      padding: var(--s2);
      cursor: pointer;
      color: var(--text-3);
      font-size: var(--fs-lg);
      line-height: 1;
      border-radius: var(--r-sm);
      display: inline-flex;
    }
    #gen-bar .gen-close:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
    /* Disabling with no visual change reads as "did my click even register" for the ~3s until
       the next poll updates the message — the one case that hits this is genCancel mid-click */
    #gen-bar .gen-close:disabled { opacity: 0.4; cursor: default; }
    #gen-bar .gen-close:disabled:hover { color: var(--text-3); background: none; }
    /* genCancel sits immediately left of the toggle/close corner rather than stacked on it —
       while live the two are shown together, so they need two positions, not one.
       34px = the sibling's own 31px width plus a 3px gap, both measured from the 31×31 size above */
    #gen-bar #genCancel:hover { color: var(--danger); background: rgba(255, 255, 255, 0.08); }
    /* On a narrow screen the two corners crowd each other, so it spans a row and yields to the sync status bar below */
    @media (max-width: 720px) {
      #gen-bar { left: var(--s3); right: var(--s3); bottom: 76px; max-width: none; }
    }

    /* ---- Back to top ----------------------------------------------------
       The filter controls and 「添加新游戏」 are both **above** the table and outside the
       frozen topbar (which holds only the title and that row of icons), so once three
       hundred rows down, changing a filter means scrolling all the way back.

       This bottom-right position is the same corner as lib/rpc.js's sync status bar
       (which hardcodes right/bottom 16px and z-index 9999). **It yields to it**: a
       lower layer, and it steps up a notch the moment that bar appears — both
       overlays being visible at once is the normal case (people keep scrolling the
       table while a sync runs), and crowded together they cover each other.
       The bottom left is unused because that is #gen-bar's, which occupies it for two
       to four minutes per generation. */
    #toTop {
      position: fixed;
      right: var(--s4);
      bottom: var(--s4);
      z-index: 9998;
      width: 40px;
      height: 40px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      background: var(--surface-3);
      color: var(--text-2);
      box-shadow: var(--sh-2);
      cursor: pointer;
    }
    #toTop.on { display: inline-flex; }
    #toTop:hover { color: var(--text-hi); border-color: rgba(102, 192, 244, 0.5); }
    /* Yields when the sync bar appears. 76px = that bar's height plus a little margin, the same number as the narrow-screen rule above */
    #toTop.clear-bar { bottom: 76px; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 7, 11, 0.68);
      backdrop-filter: blur(3px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--surface-3);
      border: 1px solid var(--line-3);
      border-radius: var(--r-lg);
      padding: var(--s5) var(--s6);
      text-align: center;
      max-width: 400px;
      box-shadow: var(--sh-3);
    }
    .modal-box .game-name { font-size: var(--fs-lg); font-weight: 600; color: var(--text-hi); margin-bottom: var(--s1); }
    .modal-box .appid-hint { margin-bottom: var(--s5); }
    /* **The spacing hangs on the button row rather than on the title or the body.**
       The title's margin-bottom is only 4px, which is there for "a body follows"; in a
       dialog with no body (the guide-generation one, which is a single question) the
       question and the buttons ended up flush against each other and looked crowded */
    .modal-box .modal-btns {
      display: flex;
      gap: var(--s3);
      justify-content: center;
      margin-top: var(--s5);
    }
    .modal-box .modal-btns button { min-width: 96px; padding: 9px var(--s4); }
    /* Label and control on one line: three tiers are short, and splitting them into two lines gives this cell more weight than it carries */
    /* **Only this one inside the confirm dialog is enlarged; .view-toggle itself is
       untouched.** The one in the topbar is a secondary control while this one is the
       main decision in this dialog, and the confirm/cancel buttons directly below it
       are 38px tall — carrying over the topbar's 25px would make it read as a footnote.
       The same class carrying different weight in two places is determined by position
       rather than being style drift */
    .ask-choice .view-toggle button { padding: 8px var(--s4); }
    .ask-choice {
      display: flex;
      align-items: center;
      justify-content: center;
      /* The wrapping is for .ask-hint: its flex-basis is 100%, and this is what drops it onto its own line below the buttons */
      flex-wrap: wrap;
      gap: var(--s3);
      margin-top: var(--s4);
      font-size: var(--fs-sm);
      color: var(--text-3);
    }
    /* Aligning the label widths: with two or three groups of controls stacked
       vertically, unequal labels make each row's controls start at a different place
       and read like three unrelated blocks. A fixed width plus right alignment pins
       them into one column */
    .ask-choice > span:first-child,
    .ask-choice > label:first-child { flex: 0 0 auto; min-width: 4.5em; text-align: right; }
    /* The selected state **cannot rely on fill alone** — .view-toggle button.on already
       provides a fill, and this adds an outline, because this group contains disabled
       items (a range with a count of 0) and disabled is also a grey fill; distinguishing
       "selected" from "unavailable" by lightness alone is far too close in a dark theme */
    .ask-choice .view-toggle button.on { box-shadow: inset 0 0 0 1px var(--accent); }
    .ask-choice .view-toggle button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    /* The note for the currently selected tier, taking a full row below the buttons.
       The colour is --text-2 rather than --text-3: this sentence is **prose to be read
       while making a choice**, not a placeholder or a timestamp, and --text-3 sits
       exactly on the 4.5:1 floor.
       min-height holds a row's worth of space — without it, switching tiers makes the
       dialog jump */
    .ask-hint {
      flex: 1 0 100%;
      min-height: 1.4em;
      text-align: center;
      font-size: var(--fs-xs);
      color: var(--text-2);
    }
    /* A one-line input. It carries over the fill and outline of the page's other input controls rather than inventing another appearance for one field */
    .ask-input {
      flex: 1 1 auto;
      min-width: 0;
      padding: 8px var(--s3);
      font: inherit;
      font-size: var(--fs-sm);
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line-2);
      border-radius: var(--r-sm);
    }
    .ask-input::placeholder { color: var(--text-3); }
    .ask-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    /* ---- Hand-picking: the achievement list grouped by section ---- */
    /**
     * **The dialog holding a picker list has a fixed width and does not follow its
     * content.**
     *
     * `.modal-box` is normally sized by its content, which suits a dialog holding a
     * sentence or two. But this one holds a list that changes: tick an entry, collapse
     * a section, apply a filter, and the widest line becomes a different one, so the
     * whole dialog twitches — while the pointer is resting on some checkbox.
     * **An interface moving while you operate it is the most unpleasant kind**, and it
     * costs you your sense of where that box just was.
     *
     * Only dialogs given a `picker` are fixed (JS applies `.ask-wide`); the other
     * confirm dialogs stay as they were — they hold no changing content, and a fixed
     * width would only make them look empty.
     */
    .modal-box.ask-wide { width: 520px; max-width: 100%; }
    #askPickWrap { margin-top: var(--s4); text-align: left; }
    /* The margin hangs on the outer layer rather than on the input itself: the cross is
       centred against .search-field's height, and a margin left on the input would make
       that layer taller and shift the cross down by half a margin */
    #askPickWrap .search-field { margin-bottom: var(--s2); }
    #askPickFilter { width: 100%; }
    /* The row of shortcuts. **Made lighter than the range row above** — they are not
       decisions but shortcuts saving dozens of clicks, and giving them more weight than
       the list below would invert the priorities */
    #askPickQuick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--s2); }
    .ask-pick-quick {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: var(--r-full, 999px);
      font: inherit; font-size: var(--fs-xs); color: var(--text-2);
      background: var(--surface-2); border: 1px solid transparent; cursor: pointer;
    }
    .ask-pick-quick:hover { color: var(--text); border-color: var(--line-2); }
    /* **The pressed state is back, with a different meaning.** It used to mean "this
       batch is entirely in the selection" — a derived fact, which users read as "I
       pressed this key", so pressing one key made another light up or go dark.
       It now means exactly "I pressed this filter", a state changed only by clicking.
       The visuals carry over this dialog's other pressed state (.view-toggle button.on)
       rather than inventing another way to light up */
    .ask-pick-quick.on {
      color: var(--text-hi); background: var(--surface-3);
      border-color: var(--accent); box-shadow: var(--sh-1);
    }
    .ask-pick-quick .n { font-variant-numeric: tabular-nums; opacity: .75; }
    .ask-pick-quick:disabled { opacity: .35; cursor: default; }
    .ask-pick-quick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* **Fixed height, scrolling itself.** A guide routinely runs to dozens or hundreds
       of entries, and letting it expand the dialog would push confirm/cancel off the
       screen — and those are the only two ways out of this dialog */
    #askPickList {
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid var(--line-2);
      border-radius: var(--r-sm);
      background: var(--bg);
      padding: var(--s2);
    }
    .ask-pick-sec { margin-bottom: var(--s3); }
    .ask-pick-sec:last-child { margin-bottom: 0; }

    /* A section's row holds **two buttons each doing one thing**: the box selects the
       whole section, and the rest collapses it. Nesting them inside one button would
       produce nested interactive elements — two stops per Tab, two paths per click */
    .ask-pick-head { display: flex; align-items: center; gap: var(--s2); }

    /**
     * A section heading has to be **distinguishable at a glance from the entries below it**.
     *
     * **The heading's box must not align to the same left edge as the entries'
     * checkboxes.** The reason "looking like the same kind of thing is how you know it
     * is clickable" is not wrong in itself, but doing that flattens the **hierarchy**
     * too: the same left edge and the same size of box make the heading and the entries
     * read as one flat column.
     *
     * Three things separate them while the box stays a box (so clickability is not
     * lost):
     *   1. **The entries as a whole are indented** (.ask-pick-items' padding-left), with
     *      the heading staying at the far left
     *   2. The heading is a size smaller, bold, with extra letter spacing and a brighter
     *      colour
     *   3. A faint line under the heading marks out this section's extent
     */
    .ask-pick-toggle {
      flex: 1 1 auto; min-width: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 3px 4px; border: 0; border-radius: var(--r-sm);
      font: inherit; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em;
      color: var(--text); background: none; cursor: pointer; text-align: left;
    }
    .ask-pick-toggle:hover { background: var(--surface-2); }
    .ask-pick-toggle .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ask-pick-toggle .n { margin-left: auto; font-weight: 400; letter-spacing: 0; color: var(--text-3); }
    /* The collapse caret: a pure-CSS triangle, pointing down when expanded and right
       when collapsed. transform is a compositor property, so one expansion does not
       relayout the whole list */
    .ask-pick-caret {
      flex: 0 0 auto; width: 0; height: 0;
      border-left: 4px solid transparent; border-right: 4px solid transparent;
      border-top: 5px solid var(--text-3);
      transition: transform var(--dur-fast, .12s) ease;
    }
    .ask-pick-toggle[aria-expanded="false"] .ask-pick-caret { transform: rotate(-90deg); }
    .ask-pick-sec > .ask-pick-items { border-top: 1px solid var(--line-1); padding-top: 2px; }

    /* The tri-state box. The entries' checkboxes now look like this too (see below), so
       the two are still "the same kind of thing" — they simply no longer stand on the
       same left edge */
    .ask-pick-box {
      flex: 0 0 auto;
      width: 13px; height: 13px;
      border: 1px solid var(--text-3);
      border-radius: 3px;
      background: var(--surface-2);
      padding: 0; position: relative; cursor: pointer;
    }
    .ask-pick-box:hover { border-color: var(--text); }
    .ask-pick-box.on, .ask-pick-box.some { background: var(--accent); border-color: var(--accent); }
    /* All selected: a tick. Partially: a bar. Both drawn with ::after, introducing no extra glyph */
    .ask-pick-box.on::after {
      content: ''; position: absolute; left: 3px; top: 0;
      width: 3px; height: 7px;
      border: solid var(--accent-ink); border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .ask-pick-box.some::after {
      content: ''; position: absolute; left: 2px; top: 4px;
      width: 7px; height: 2px; background: var(--accent-ink);
    }

    /* The entries as a whole are indented one notch — that is the only visual statement that "these belong to the heading above" */
    .ask-pick-items { padding-left: 16px; }
    .ask-pick-items[hidden] { display: none; }
    .ask-pick-item {
      display: flex; align-items: center; gap: var(--s2);
      padding: 4px 6px; border-radius: var(--r-sm);
      font-size: var(--fs-sm); color: var(--text-2); cursor: pointer;
    }
    .ask-pick-item:hover { background: var(--surface-2); color: var(--text); }
    /**
     * **A native checkbox reads as disabled on a dark theme.**
     *
     * `accent-color` only governs the colour **once ticked**; unticked, what is drawn is
     * still the browser's own pale grey fill and pale grey border, which is extremely
     * low contrast on this dark surface — reading as a row of boxes that cannot be
     * pressed. And the vast majority of the boxes in this list are precisely the
     * unticked ones, meaning the default state looks entirely "unavailable".
     *
     * So they are drawn here: `appearance: none` plus a clearly visible outline. **They
     * are still real `<input type=checkbox>` elements** — the keyboard, the label
     * association and the screen-reader semantics are all intact, and only the painting
     * is replaced. The size matches the section's box, since the two are the same kind
     * of thing.
     */
    .ask-pick-item input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      flex: 0 0 auto; margin: 0;
      width: 13px; height: 13px;
      border: 1px solid var(--text-3);
      border-radius: 3px;
      background: var(--surface-2);
      position: relative; cursor: pointer;
    }
    .ask-pick-item:hover input[type="checkbox"] { border-color: var(--text); }
    .ask-pick-item input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
    .ask-pick-item input[type="checkbox"]:checked::after {
      content: ''; position: absolute; left: 3px; top: 0;
      width: 3px; height: 7px;
      border: solid var(--accent-ink); border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .ask-pick-item input[type="checkbox"]:focus-visible,
    .ask-pick-box:focus-visible,
    .ask-pick-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .ask-pick-item .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* Rarity and unlock state are **the two things most worth knowing while picking**,
       so they travel with every entry. Right-aligned into a column, the eye can run
       down them without hunting inside each row */
    .ask-pick-item .pct { flex: 0 0 auto; font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
    .ask-pick-item .pct.rare { color: var(--accent); }
    .ask-pick-item .done { flex: 0 0 auto; font-size: var(--fs-xs); color: var(--prog-done); }
    .ask-pick-foot { display: flex; align-items: baseline; gap: var(--s2); margin-top: var(--s2); }
    .ask-pick-count { font-size: var(--fs-xs); color: var(--text-3); }
    /* 「清空」 is the one action in this cell that loses something, but the loss is
       slight (picking again), so it is a quiet text button — findable, but not
       competing */
    /* The two actions sit in one box that is pushed right — with margin-left:auto on
       each, flex would split the remaining space between them and push 「全选」 and
       「清空」 to opposite ends */
    .ask-pick-acts { margin-left: auto; display: flex; gap: 2px; }
    .ask-pick-clear {
      padding: 2px 6px;
      font: inherit; font-size: var(--fs-xs); color: var(--text-3);
      background: none; border: 0; border-radius: var(--r-sm); cursor: pointer;
    }
    .ask-pick-clear:hover:not(:disabled) { color: var(--text); background: var(--surface-2); }
    .ask-pick-clear:disabled { opacity: .3; cursor: default; }
    .ask-pick-clear:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    /* Secondary buttons: **transparent fill + normal text colour + an outline**.
       They used to be a --panel-alt fill with --text-dim text, whose contrast was so low
       it was nearly identical to this component's own :disabled state — so 「取消」 looked
       unclickable, or like a discouraged option.
       A secondary action has to be weaker than the primary button while still being
       visibly clickable at a glance */
    .modal-box .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line-2);
    }
    .modal-box .btn-secondary:hover { background: var(--surface-2); border-color: var(--line-3); }
    .modal-check {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: var(--fs-md);
      color: var(--text);
      /* The top margin hangs here rather than touching .game-name's 4px — in a confirm
         dialog that value is the title's bottom margin, and enlarging it would expand
         another dialog. That one 4px has already caused two cases of "crowded", and both
         times the fix was adding spacing on **the element that follows**, rather than
         changing the shared value */
      margin-top: var(--s3);
      margin-bottom: 0;
      cursor: pointer;
      user-select: none;
    }
    .modal-check input { cursor: pointer; width: 15px; height: 15px; }

    /* A row's Edit menu. **One element shared by the whole page**, moved to wherever was
       clicked — one per row would mean several hundred hidden nodes, while only one can
       be open at a time */
    .row-menu {
      position: absolute;
      z-index: 200;
      background: var(--surface-3);
      border: 1px solid var(--line-3);
      border-radius: var(--r-md);
      padding: var(--s1);
      /* With the labels shortened to two characters, most of a 152px menu is empty — the width has to follow the content */
      min-width: 108px;
      box-shadow: var(--sh-3);
    }
    .row-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: var(--fs-md);
      padding: var(--s2) var(--s3);
      border-radius: var(--r-sm);
      cursor: pointer;
    }
    .row-menu button:hover { background: rgba(255, 255, 255, 0.07); }
    .row-menu button.danger { color: var(--danger); }
    .row-menu button.danger:hover { background: rgba(224, 104, 94, 0.14); }

    /* ========================================================================
       Guide backups
       ------------------------------------------------------------------------
       **A row is not a card.** One game may have a dozen historical versions, and a box
       per row would turn this dialog into graph paper. Separation goes to one --line-1,
       the same approach as the table above.

       `Setup.html` holds an almost identical copy of these styles — that one covers "how
       much space is taken plus orphaned archives" rather than being the everyday entry
       point. Keeping the same row appearance in both places is **deliberate**: the same
       thing should not look like two different things on two pages.
       ======================================================================== */
    .arc-list { list-style: none; margin: 0; padding: 0; text-align: left; }
    .arc { border-top: 1px solid var(--line-1); }
    .arc-row { display: flex; align-items: center; gap: var(--s3); padding: var(--s2) 0; }
    .arc-main { flex: 1; min-width: 0; }
    .arc-main b {
      display: block; color: var(--text); font-weight: 600; font-size: var(--fs-md);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .arc-meta { font-size: var(--fs-xs); color: var(--text-3); }
    .arc-acts { display: flex; gap: var(--s2); flex-shrink: 0; }
    .arc-acts button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--line-2);
      border-radius: var(--r-sm);
      font-family: inherit;
      font-size: var(--fs-xs);
      padding: 4px 10px;
      cursor: pointer;
    }
    .arc-acts button:hover:not(:disabled) { background: var(--surface-3); border-color: var(--line-3); }
    .arc-acts button:disabled { opacity: 0.45; cursor: default; }
    /* The armed second click: **the button itself becomes the consequence**, with no
       second box around it. Opening a dialog inside something that is already a dialog
       makes 「删哪一份」 entirely invisible */
    /* **The `:hover` rule has to be written alongside.** After the first click the cursor
       is resting on the button, and `.arc-acts button:hover:not(:disabled)` outranks a
       bare `.armed` — the red border would be covered by the hover border colour at
       exactly the moment it most needs to be seen */
    .arc-acts button.armed,
    .arc-acts button.armed:hover:not(:disabled) { color: var(--danger); border-color: var(--danger); }
    .arc.armed { background: var(--surface-2); }
    .arc-body {
      margin: 0 0 var(--s3);
      padding: var(--s3);
      border-radius: var(--r-md);
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: var(--fs-xs);
      color: var(--text-2);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 260px;
      overflow: auto;
    }
    /* The archive dialog is both wider and taller than a confirm dialog: it is for
       **browsing**, not for answering a yes/no.
       The list scrolls itself and the box does not grow with it — a dozen backups would
       push the dialog out of the viewport */
    .modal-box.arc-box { max-width: 560px; width: calc(100vw - var(--s6) * 2); text-align: left; }
    .arc-scroll { max-height: min(52vh, 420px); overflow-y: auto; margin-top: var(--s3); }
    /* The result is written on the line below the list, **not into the row**: restoring
       generates a new archive on the spot, which is newer than the one just restored and
       sorts to the top — after the repaint, "which row was that" no longer holds.
       Empty, it takes no space, or a 20px gap would hang permanently below the box */
    .arc-msg { font-size: var(--fs-sm); margin-top: var(--s3); line-height: 1.5; }
    .arc-msg:empty { display: none; }
    .arc-msg.ok { color: var(--ok); }
    .arc-msg.error { color: var(--danger); }

    /* ========================================================================
       Responsiveness and motion preferences
       ======================================================================== */
    /* The gallery used to have 760px / 520px breakpoints here forcing the column count
       to 3 and 2 — those were the patch that went with "hardcode four columns". Switched
       to auto-fill, the column count follows the width anyway and the breakpoints are
       redundant: all they do is **force one column fewer** at some width, which is the
       exact opposite of this view's purpose now */
    @media (max-width: 640px) {
      :root { --page-pad: var(--s3); }
      /* **`.wordmark` has to be named alongside.** A class selector (0,1,0) outranks a
         bare h1 (0,0,1), and a media query does not change specificity — with h1 alone
         this rule has no effect on the title at all, leaving it 27px on a narrow screen
         and pushing the readout strip on the right off the row */
      h1, .wordmark { font-size: 21px; }
      .game-thumb { display: none; }   /* on a narrow screen the name comes first */
    }

    @media (prefers-reduced-motion: reduce) {
      /* Motionless, the states are still visible; they simply do not sweep, spin or scale */
      .topbar.syncing::after { animation: none; width: 100%; opacity: 0.6; }
      .icon-btn.spinning .icon-glyph { animation: none; }
      .g-card, .g-card:hover, .g-card img, .g-card:hover img {
        transition: none;
        transform: none;
      }
      .bar-fill { transition: none; }
      /* The skeleton rows **do not pulse**, but they stay — they are not decoration, they are the sentence "waiting for Steam to answer" */
      .game-search-result.skeleton { animation: none; opacity: 0.6; }
      /* **The transition is on .chip and the two pseudo-elements, not on the container** —
         writing .filter-chips selects an element that has no transition to begin with. The
         marker now rotates 45°, which is exactly the kind of motion somebody switching
         motion off wants switched off, so the selector has to be right */
      .chip, .chip-dot::before, .chip-dot::after { transition: none; }
    }
  </style>
</head>
<body>
  <!--
    The icon sprite. **Every icon in the interface <use>s from here, and there is no
    longer any emoji on the page.**

    Replacing the emoji was not for looks; it is because there are three things emoji
    cannot do:
      · their colour comes with the glyph — CSS's `color` cannot touch it, so ✏️ is still
        a bright yellow pencil at any opacity (this already cost us once on the row-end
        「更多」 button, where the fix at the time was falling back to the text symbol ⋮);
      · every operating system draws them differently — 🔄 on Windows is one whole glyph
        of "a blue rounded square with a white arrow", so rotating the arrow rotates that
        plate, which is why the sync icon could never rotate;
      · they do not align with text — they do not sit on the same baseline.

    All three disappear together once everything is a monochrome SVG: icons respond to
    color, to opacity and to font size, and the two compromises above (the ⋮ and the
    non-rotating sync icon) no longer have to be kept.

    A uniform 24 grid, fill controlled by .ic, stroke-width 1.75 — draw new icons on this
    grid; mix in a different weight and the whole row of icons will look uneven.
  -->

    <!-- The cancel button, and the "cancelled" line in a finished job's report.
         **Deliberately not a circle-plus-glyph badge like i-check/i-clock** — a first version
         drawn that way (a 9-radius circle around a tiny inner square) read as just another round
         dot at 15px, indistinguishable at a glance from those two unrelated status icons and from
         a plain bullet. A stop icon has exactly one universal convention — the plain solid square
         from every media player and IDE "stop" button — and deviating from it to fit this file's
         badge family made it *less* recognisable, not more consistent. Rendered filled
         (`icon('stop', true)`), never as an outline: a hollow square reads as an empty checkbox or
         a placeholder, not "stop" -->
    <symbol id="i-stop" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="10.8" cy="10.8" r="6.8"/>
      <path d="m15.8 15.8 4.4 4.4"/>
    </symbol>


  </svg>

  <div class="topbar">
    <div class="title-row">
      <!-- 「Steam」 is the platform, 「成就」 is the keyword and 「追踪器」 is the noun;
           three roles, three treatments: weight, accent colour, plain. **There is no
           underline**; the reasoning is in the .wordmark block in the stylesheet -->
      <h1 class="wordmark"><span class="wm-text"><span class="wm-latin">Steam</span><span class="wm-key" data-t="wm.key">成就</span><span class="wm-gap">&#160;</span><span data-t="wm.rest">追踪器</span></span></h1>
      <!-- The exact values and their definitions go in title attributes (readable on hover) rather than taking screen space -->
      <div class="readout">
        <!-- **Always the library total, and it does not follow the filters.** The
             filtered count belongs to the table and sits above it (#rowCount); the two
             numbers mean different things, and putting them together makes them read as
             the same one -->
        <span class="reading" title="库里的游戏总数" data-t-title="card.totalTitle">
          <span class="value" id="cardTotal">–</span><span class="label" data-t="card.total">游戏</span>
        </span>
        <!-- Second, beside the game count and ahead of the two rates: these two are the plain
             「库里有多少」 pair, and both rates after them are derived from these numbers.
             **The label names the state, not the noun.** A bare 「成就」 sitting next to 「游戏」
             reads as 「库里一共有多少个成就」, which is a different and equally believable
             number; 「已解锁成就」 can only mean the one thing -->
        <span class="reading" title="整个库里已解锁的成就总数" data-t-title="card.achievedTitle">
          <span class="value" id="cardAchieved">–</span><span class="label" data-t="card.achieved">已解锁成就</span>
        </span>
        <span class="reading" title="AGCR:所有游戏完成率的平均值" data-t-title="card.avgTitle">
          <span class="value" id="cardAvg">–</span><span class="label" data-t="card.avg">平均完成率</span>
        </span>
        <span class="reading" title="已经打满全部成就的游戏" data-t-title="card.perfectTitle">
          <span class="value" id="cardPerfect">–</span><span class="label" data-t="card.perfect">完美</span>
        </span>
      </div>
    </div>
    <!-- Status on the left, actions on the right. **One group at each end**; it used to
         be 「上次同步」 followed directly by three icons and then a message — a run of
         differently sourced things crowded to the right of a sentence, with no readable
         grouping. Moved to the top right corner, "the right of this strip is what can be
         clicked" becomes a pattern recognisable at a glance -->
    <div class="subtitle-row">
      <div class="topbar-status">
        <div class="subtitle" id="lastUpdated" data-t="ui.loading">加载中…</div>
        <span class="sync-msg" id="syncMsg"></span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="syncNowBtn"
                title="立即从 Steam 拉取最新数据。刷新页面只重读本地数据,不会联网。" data-t-title="sync.buttonTitle"
                aria-label="立即同步" data-t-aria-label="ui.syncNow"><span class="icon-glyph"><svg class="ic"><use href="#i-sync"/></svg></span></button>
        <!-- The packaged build has no address bar, and without an entry point here the settings page becomes unreachable after first-run setup -->
        <a class="icon-btn" href="/setup"
           title="修改 Steam 凭据、配置 AI 攻略生成和 Notion 攻略同步、备份与恢复" data-t-title="ui.settingsTitle"
           aria-label="设置" data-t-aria-label="ui.settings"><span class="icon-glyph"><svg class="ic"><use href="#i-settings"/></svg></span></a>
        <span class="bell-wrap">
          <button class="icon-btn" id="bellBtn" type="button"
                  title="提醒" data-t-title="ui.bell" aria-label="提醒" data-t-aria-label="ui.bell" aria-expanded="false"><span class="icon-glyph"><svg class="ic"><use href="#i-bell"/></svg></span></button>
          <span class="bell-dot" id="bellDot" hidden></span>
          <div class="bell-panel" id="bellPanel" hidden role="dialog" aria-label="提醒" data-t-aria-label="ui.bell"></div>
        </span>
      </div>
    </div>

    <!-- ====================================================================
      **The filter, add and count rows are inside the frozen area too.**

      All three speak about "what the table below is showing you right now", and once
      three hundred rows down, changing a filter or glancing at 「显示 8 / 共 314」 used to
      mean scrolling all the way back to the top.

      They go inside .topbar rather than into a separate sticky container, so that
      `--topbar-h` keeps meaning the single thing "how much is frozen": the header's
      sticky offset (`th { top: var(--topbar-h) }`), the jump-target arithmetic and the
      ResizeObserver re-measurement all need not change one word.
      A second layer would mean maintaining a second height variable, and two variables
      eventually disagree.

      **`#rowEditMenu` and the dialogs cannot come in**: the former is absolutely
      positioned with coordinates computed against the whole page
      (`window.scrollY + rect.bottom`), and sticky is a positioned element that would
      become its containing block; the latter are fixed, so coming in only adds a
      pointless level of nesting.
      ==================================================================== -->
    <div class="controls">
      <!-- **One input.** There used to be one here and one below: one filtering the
           library and one searching Steam to add a new game — two identical-looking
           fields side by side asking the same question in the user's head (「X 这游戏在
           哪」), differing only in 「你有没有」, and **that is something the program knows
           and the user need not**.
           So they merged into one: look in the library first, and only if it is not
           there go and look on Steam, where anything found can be added.
           An aria-label states more clearly than a placeholder that it now does two
           things; there is no visible label because this is inside the frozen area and
           one more line of heading would exactly cancel the height this merge saved
           (see --topbar-h) -->
      <div class="search-field">
        <input type="text" id="searchBox" placeholder="搜索游戏名…" data-t-placeholder="ui.searchPlaceholder"
               aria-label="搜索游戏。库里没有的会去 Steam 上找,可以直接添加" data-t-aria-label="ui.searchAria"
               autocomplete="off">
        <!-- The cross is only present when the field has text (the rule is the
             :placeholder-shown one in the CSS).
             No title: a cross living inside a search box needs no sentence of
             explanation, and the aria-label already covers the screen-reader side -->
        <button type="button" class="field-clear" aria-label="清除搜索" data-t-aria-label="ui.clearSearch"><svg class="ic"><use href="#i-close"/></svg></button>
      </div>
    </div>

    <!-- The block below the search box **only appears while searching** and takes no
         space otherwise. It answers two questions in order:
         「库里有几个」 → and if there are none in the library, 「Steam 上有这些,点一个就
         能加」.
         Adding says nothing more: the term stays in the box, so the row just added is in
         the table below on the next render.
         The whole block stays inside the frozen area: it belongs to the input above. The
         frozen area therefore grows temporarily, and --topbar-h is re-measured by
         measureTopbar(), so the table header yields on its own -->
    <div class="search-extra" id="searchExtra" hidden>
      <!-- A two-word source label. The results appear below the search box while the
           table above is simultaneously empty, and without labelling it they read as
           "these are what I have" -->
      <div class="steam-label" id="steamLabel" hidden data-t="ui.steamStore">Steam 商店</div>
      <div id="gameSearchResults" class="game-search-results" style="display:none;"></div>
      <!-- **Words only when words are genuinely needed**: neither side has it, and the
           service is unreachable. Being busy is conveyed by the skeleton rows, and success
           by the results and by the row appearing — neither needs words -->
      <span class="add-game-msg" id="addGameMsg"></span>
    </div>

    <!-- 「怎么看」, 「看什么」 and 「看到多少」 share one row: all three speak about the
         table below.
         **The filters moved here from the search box's row.** Search now bypasses every
         filter (see hidingFilter), and side by side the two read as "search finds things
         within these filters" — which is exactly backwards. Moving them next to the count
         also puts cause and effect together: change a filter and the number on the right
         changes on the spot. -->
    <div class="table-bar">
      <div class="view-toggle" role="group" aria-label="视图" data-t-aria-label="ui.view">
        <!-- 「网格 / 列表」 is the settled wording for this switch in a Chinese interface
             and needs no learning.
             The first two versions both fell over the same thing: 「图库」 is a literal
             translation of Gallery, and 「封面」 uses a noun as a view name, reading like
             labelling a picture rather than naming a way of looking. -->
        <button type="button" class="on" aria-pressed="true" data-view="table" data-t="ui.viewTable">列表</button>
        <button type="button" aria-pressed="false" data-view="gallery" data-t="ui.viewGrid">网格</button>
      </div>
      <!-- Five tri-state chips (neutral/only/exclude; the cycle and the palette are in
           .chip in the CSS).
           **The order follows frequency of use rather than the nature of the attribute**:
           favourites and family are the ones normally wanted as 「只看」 and go first; the
           other three start excluded and are the "leave me alone by default" kind, so they
           go last.

           **The markup carries only data-state and no aria-label** — the Chinese wording
           for the states exists once in STATE_NAME, and writing it here would be a second
           copy where changing one leaves the other stale. setChipState fills it in at
           startup.

           **The text is a bare noun.** Wording like 「隐藏已完成」 or 「只看喜爱」 welds the
           direction into the name — with three states the direction is stated by the
           chip's own state, and a name carrying a direction as well reads as
           「只看隐藏已完成」. -->
      <div class="filter-chips" id="filterChips">
      <button type="button" class="chip" data-filter="fav" data-state="off"><span class="chip-dot"></span><span class="chip-label" data-t="filter.fav">喜爱</span></button>
      <button type="button" class="chip" data-filter="family" data-state="off"><span class="chip-dot"></span><span class="chip-label" data-t="filter.family">家庭</span></button>
      <!-- Excluded at startup. It replaced the old 「进行中」 tab — this page's question is
           「还有什么值得打」, and a completed game contributes nothing to it. With three
           states a trophy wall comes free: two clicks turns it into 「只看」 -->
      <button type="button" class="chip" data-filter="complete" data-state="not"><span class="chip-dot"></span><span class="chip-label" data-t="filter.complete">已完成</span></button>
      <!-- **"Unvetted" does not appear in the interface** — that is a word from Steam's
           API rather than the user's; the database column is still called Unvetted (it
           reaches CSV and is a compatibility surface). The explanation goes in a title and
           takes no screen space -->
      <button type="button" class="chip" data-filter="unvetted" data-state="not" data-t-title="chip.unvettedTitle" title="Steam 把这些游戏归为「个人资料功能受限」,默认不出现在它的库存接口里。这里照常同步它们,但不计入上方「平均完成率」 —— 和 Steam 自己的算法一致。"><span class="chip-dot"></span><span class="chip-label" data-t="filter.unvetted">受限</span></button>

  <!--
    The generic confirm dialog. **A replacement for window.confirm()**, and not for looks
    — in the packaged build (Electron) a native confirm appears and disappears immediately,
    leaving no time to press OK, while everything is fine in a browser. Native dialogs
    belong to Electron's main process and the renderer has no say; an in-page box cannot be
    taken away by anyone.
    It also solves two long-standing problems with a native confirm: layout is only possible
    through \n, and there is no way to mark a dangerous action in red.
  -->

           「要不要花这笔」 and 「改什么、花多深」 are the same question, and splitting them
           into two steps means agreeing before choosing. This slot is normally empty and
           only grows when the caller passes choices — reusing .view-toggle (a segmented
           control the page already has) rather than inventing a shape that appears only
           here.
           One row per group, generated dynamically by askConfirm: the rewrite dialog asks
           two things (scope and treatment) while the generate one asks a single thing —
           hardcoding the group count in the markup would mean reserving an empty slot for
           whichever asks fewer -->

           carries a for** — a placeholder used as a label disappears the moment typing
           starts, and this is precisely the field where confirming "what is this box for"
           matters most once something has been typed -->

           heading = selecting the whole section**, so 「选一个小节」 and 「选几条成就」 are
           two uses of one control — the interface needs no separate mode for each, and the
           request sent is always a list of named achievements, which is a path the backend
           already had -->

             **and**.

             character** — this is the shape this cell reached after two rounds of changes,
             and the reasoning is in the long comment in the js -->
        <div id="askPickQuick" role="group" aria-label="筛选" data-t-aria-label="pick.filter"></div>

      'res.openFolder':       ['打开文件夹', 'Open folder'],
      'res.restoreBackup':    ['恢复备份', 'Restore the backup'],
      'res.dropBackup':       ['删除备份', 'Delete the backup'],
      'res.searches':         ['{n} 次搜索', '{n} searches'],
      'res.noSearches':       ['没有联网搜索', 'no web searches'],
      'res.unsyncable':       ['{n} 个成就同名、Steam 上描述是空的,自动勾选认不出它们,需手动勾选:', '{n} achievements share a name and have no description on Steam, so automatic ticking cannot tell them apart. Tick these by hand:'],

      'res.preExisting':      ['攻略里还有 {n} 条原有的校验问题,本次未处理', 'The guide still has {n} pre-existing check failures, untouched this time'],
      'res.rewrote':          ['《{game}》已改 {n} 条 · 其余不变 · ', '{game}: {n} rewritten, the rest unchanged · '],
      'res.generated':        ['《{game}》已生成 · {covered}/{total} 个成就 · ', '{game} generated · {covered} of {total} achievements · '],
      'res.readItYourself':   ['内容需要你自己过一遍。', 'Read it through yourself.'],
      'res.queueLeft':        [' · 还有 {n} 个排队', ' · {n} still queued'],
      'res.round':            [' 第 {round}/{rounds} 轮', ' round {round} of {rounds}'],
    };

    let LANG = 'zh';
    /** The key for <title>. Empty on a page that never renames itself; applyStrings leaves the tag alone then */
    let docTitleKey = '';

    /**
     * One string, with `{slot}` filled from `values`.
     *
     * **An unknown key returns the key.** A blank label reads as a layout bug and sends the reader
     * into the CSS; the key on screen names the entry that is missing. A missing translation falls
     * back to the Chinese for the same reason the rest of the app does — the other language beats
     * nothing at all.
     */
    function t(key, values) {
      const pair = STRINGS[key];
      if (!pair) return key;
      let s = pair[LANG === 'en' ? 1 : 0] || pair[0];
      if (values) for (const k in values) s = s.split('{' + k + '}').join(values[k]);
      return s;
    }

    /** Attribute keys: `data-t-placeholder` reaches `dataset.tPlaceholder`, and so on */
    const T_ATTRS = [['tPlaceholder', 'placeholder'], ['tValue', 'value'], ['tAriaLabel', 'aria-label'], ['tTitle', 'title']];

    /**
     * Repaint every string in the markup. Cheap enough to run again on each language change — this
     * page is one screen, and the alternative is reloading it, which costs whichever step you were
     * on.
     */
    function applyStrings() {
      document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
      T_ATTRS.forEach(([prop, attr]) => {
        document.querySelectorAll('[data-t-' + attr + ']').forEach((el) => {
          const key = el.dataset[prop];
          if (!key) return;
          if (attr === 'value') el.value = t(key); else el.setAttribute(attr, t(key));
        });
      });
      if (docTitleKey) document.title = t(docTitleKey);
      // The document's own language, so a screen reader announces it correctly and the browser
      // picks the right line-breaking rules
      document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
    }

    /**
     * Repainting an **interpolated** string is not applyStrings' job: there is no key on the element
     * to read back, because the value was spliced in at the moment it was painted. Those painters
     * register here and are re-run when the language changes.
     *
     * Leaving one out is invisible in Chinese and only shows after a switch — the guide-archive line
     * went on reading 「0 份 · 0 B」 in an otherwise entirely English page, which is the failure this
     * exists to prevent. A painter that throws must not stop the rest of the page changing language.
     */
    const REPAINT = [];
    function repaintInterpolated() {
      REPAINT.forEach((fn) => { try { fn(); } catch { /* one stale line beats a half-switched page */ } });
    }

    // How recently counts as "recently played". The badge and the pin share this one
    // window and cannot each declare their own, or a state appears where a row is pinned
    // to the top with no badge explaining why
    const RECENT_PLAY_DAYS = 5;
    const isRecentlyPlayed = function(g) {
      return g.playedDaysAgo !== null && g.playedDaysAgo <= RECENT_PLAY_DAYS;
    };

    // Pinning adds one more condition: the game has to **actually have achievements to
    // track**. Pinning means "you have been playing this, come and see what is left", which
    // does not hold at all for a game with no achievements, and pinning one only pushes the
    // ones genuinely worth watching down.
    //
    // The condition is written as "total is a number greater than 0" rather than
    // "total !== 'N/A'", because "nothing to track" has three appearances and blocking only
    // one of them is the same as blocking none:
    //   'N/A'  — genuinely no achievement system (has_achievements = 0)
    //   null   — the achievement count has not synced yet. **A game newly added to the
    //            library is exactly in this state**, and it happens to be a heavy source of
    //            "recently played", so without blocking it every new game pins an empty row
    //   0      — has an achievement system but not one achievement
    // All three are "no progress to look at right now" and are treated alike.
    //
    // **Only the pinning is removed, not the badge**: 🎮 still shows, because it states a
    // fact and takes no position. Once the achievement count syncs in (or the developer adds
    // achievements) and total becomes a positive number, it takes part in pinning again.
    const pinsToTop = function(g) {
      return isRecentlyPlayed(g) && typeof g.total === 'number' && g.total > 0;
    };

    /**
     * The five filterable attributes. **The order is the order on screen**, by frequency of
     * use rather than by the nature of the attribute.
     *
     * One tri-state chip per attribute (neutral/only/exclude) rather than two checkboxes for
     * the two directions — the reasoning is in the `.chip` block in the CSS. This table is
     * the **single source of truth**: filtering goes through it, and so does the wording of
     * 「被谁挡住了」. Adding an attribute means one line here and one chip in the HTML.
     *
     * **One thing recorded in four places leaks**: a checkbox in the HTML, a line in
     * currentFilters, a line in hidingFilter and a string in the id array for the event
     * binding — and missing the last one presents as "clicking does nothing", with no error.
     * The events are delegated, so the id array does not exist.
     */
    const FILTERS = [
      { key: 'fav',      labelKey: 'filter.fav',      has: (g) => Boolean(g.favorite) },
      { key: 'family',   labelKey: 'filter.family',   has: (g) => Boolean(g.family) },
      { key: 'complete', labelKey: 'filter.complete', has: (g) => g.rate === 1 },
      { key: 'unvetted', labelKey: 'filter.unvetted', has: (g) => Boolean(g.unvetted) },
      { key: 'noach',    labelKey: 'filter.noach',    has: (g) => g.total === 'N/A' },
      { key: 'hidden',   labelKey: 'filter.hidden',   has: (g) => Boolean(g.hidden) },
    ];

    /** The next position one click moves to. **neutral → only → exclude → neutral; do not casually change the direction** (see .chip in the CSS) */
    const NEXT_STATE = { off: 'only', only: 'not', not: 'off' };

    /** The Chinese wording for the three states. **For the accessibility tree only, never on
     *  screen** — on screen the three things are said completely by the dot, the lit dot and
     *  the cross, and writing them out again is using text to patch a state that should be
     *  visible at a glance.
     *  It is also the first half of the sentence 「被「只看喜爱」挡住了」, so there can only be
     *  this one copy */
    const STATE_NAME = { off: 'chip.off', only: 'chip.only', not: 'chip.not' };

    /** Sets a chip to the given state. **The state lives only on data-state**, which is what
     *  every CSS colour rule selects on; the aria-label changes with it, or a screen reader
     *  would forever announce the startup value */
    function setChipState(chip, state) {
      chip.dataset.state = state;
      chip.setAttribute('aria-label',
        chip.querySelector('.chip-label').textContent + ':' + t(STATE_NAME[state]));
    }

    /** The filter controls' current state. Read once per render pass — asking the DOM row by
     *  row across several hundred rows is money spent for nothing, and the search box
     *  repaints on every keystroke */
    function currentFilters() {
      const f = { search: document.getElementById('searchBox').value.trim().toLowerCase() };
      // The chip is itself where the state lives (data-state), and this only collects it into
      // an object.
      // **No second copy is kept in JS** — two copies eventually disagree, and disagreement
      // presents as the filter results and the controls' appearance telling different stories
      // with no way to tell which is real
      document.querySelectorAll('#filterChips .chip').forEach(function(chip) {
        f[chip.dataset.filter] = chip.dataset.state;
      });
      return f;
    }

    /**
     * Does this game answer to this search term? Matches **either** of its two names.
     *
     * `name` is whichever name the interface is currently showing, and `nameAlt` is the stored one
     * it is not showing — empty when there is no distinct second one. Matching only `name` misses a
     * third of the library either way round: in Chinese an English term finds nothing, and in
     * English a Chinese one finds nothing.
     *
     * **Both callers have to come through here.** One decides what the table draws, the other
     * whether to go to Steam at all; judged separately they drift, and the drift shows up as a row
     * plainly in the table while the code believes the library has nothing — which is the state
     * that offers to add a game already owned.
     */
    function nameMatches(g, needle) {
      const q = String(needle || '').toLowerCase();
      if (!q) return true;
      return g.name.toLowerCase().indexOf(q) !== -1
        || (g.nameAlt || '').toLowerCase().indexOf(q) !== -1;
    }

    /**
     * The filter hiding this row, or null when nothing hides it. It returns **the control
     * itself** rather than a boolean, so that what is in the way can be named and not merely
     * counted.
     */
    function hidingFilter(g, f) {
      // **With a search term, search is the only criterion and all five chips yield.**
      //
      // The chips answer 「平时默认给我看什么」 and search answers 「我现在要找这一个」. The
      // latter is naming something and should not be overruled by the former — and the row
      // carries the completion rate, the restricted badge and the no-achievements marker, so
      // a search result can be judged at a glance with no need for a filter to screen it out.
      //
      // This is not merely convenient: three chips start excluded, measured as hiding 171 of
      // 316 games. Without yielding, 「搜不到」 means 「被自己的筛选挡住了」 rather than 「库里
      // 没有」 more than half the time — and the "not in the library, so go and look on Steam"
      // logic below uses exactly that judgement as its switch, so getting it wrong suggests
      // **adding a game you already own all over again**
      if (f.search) {
        const box = document.getElementById('searchBox');
        return nameMatches(g, f.search) ? null : { el: box, label: t('ui.searchBox') };
      }
      // **Several chips intersect rather than union.** 「只看喜爱」 and 「只看家庭」 together =
      // favourited family games, which may well leave nothing — and that is correct: the five
      // describe five different attributes, and intersecting different attributes is what
      // filtering usually means (a union would require the user to know which attributes were
      // unioned, and there is nowhere on screen to say so).
      // An empty result is reported by the reading under the table, not patched up here
      for (let i = 0; i < FILTERS.length; i++) {
        const flt = FILTERS[i];
        const state = f[flt.key];
        if (state !== 'only' && state !== 'not') continue;
        // One attribute, two directions, one control: 「只看」 hides the ones without the
        // attribute and 「排除」 hides the ones with it
        if (state === 'only' ? !flt.has(g) : flt.has(g)) {
          return {
            el: document.querySelector('#filterChips [data-filter="' + flt.key + '"]'),
            label: t(STATE_NAME[state]) + t(flt.labelKey),
          };
        }
      }
      return null;
    }

    let allGames = [];
    let sortKey = 'rate';
    let sortDir = -1;
    let expandedAppid = null;
    /**
     * 'table' | 'gallery'. **This is 「怎么看」, not 「看什么」** — the filter conditions are
     * decided by the row of controls above, and both views share the same set of results. A
     * set of tabs would mix the two things together (in-progress/completed is a filter, while
     * favourites is both a filter and a different layout), which is why there are filter chips
     * plus this switch
     */
    let viewMode = 'table';
    /**
     * The row whose numbers are being edited. **Editing is a mode that is entered deliberately
     * and exits by itself**, not a permanent state of a locked row — a locked row permanently
     * showing two input fields means one mis-touch while scrolling changes a number, with no
     * warning at all. It is entered only by choosing 「编辑」 from the menu, and exits as soon
     * as focus leaves that row; the lock remains and the numbers revert to plain text.
     */
    let editingAppid = null;
    const missingAchCache = {};

    function fmtPct(rate) {
      if (rate === null || rate === undefined) return '';
      return (rate * 100).toFixed(1) + '%';
    }

    /**
     * A count for the readout, with a thousands separator. The unlocked-achievement total runs to
     * four and five digits, and 「3412」 has to be read digit by digit where 「3,412」 is read at a
     * glance. **All three counts go through it**, not only the long one — two numbers side by side
     * under one heading, separated by different rules, look like a bug rather than a rule.
     * The locale follows the interface for the same reason the timestamp does.
     */
    function fmtCount(n) {
      return typeof n === 'number' ? n.toLocaleString(LANG === 'en' ? 'en-GB' : 'zh-CN') : '–';
    }

    /**
     * Icons. **There is no longer any emoji on the page** — the reasoning is in the sprite
     * sheet comment at the top of body; in one sentence: emoji cannot be reached by CSS's
     * color.
     *
     * `filled` is for the heart and the star: one glyph, where the outline means "not
     * selected" and the fill means "selected".
     * Both states share one outline, so the shape does not jump when toggling.
     */
    function icon(name, filled) {
      return '<svg class="ic' + (filled ? ' filled' : '') + '"><use href="#i-' + name + '"/></svg>';
    }

    /* Status icons inside notices. These get spliced into #gen-bar's innerHTML in the middle
       of sentences — which is why .ic is inline-block rather than block, see that comment in
       the stylesheet.
       They are pulled out as constants because the same ⚠ appears a dozen times below and all
       of them have to be the same one */
    const GEN_WARN = icon('warn');
    const GEN_OK = icon('check');
    const GEN_QUEUE = icon('clock');
    const GEN_CANCEL = icon('stop', true);
    const GEN_SEARCH = icon('search');
    const GEN_BOOK = icon('book');

    /**
     * The progress bar's colour.
     *
     * It used to be three tiers of red/yellow/green, which reads like a traffic light — and
     * 「完成率 30%」 is not a warning, it is simply early. It is now a **progressive** four-tier
     * scale, and "complete" uses the accent blue rather than green: 100% in this tool is the
     * destination itself, not "safe". All the values are in the progress scale in :root.
     */
    function barColor(rate) {
      if (rate === null) return 'var(--prog-none)';
      if (rate >= 1) return 'var(--prog-done)';
      if (rate >= 0.75) return 'var(--prog-high)';
      if (rate >= 0.4) return 'var(--prog-mid)';
      return 'var(--prog-low)';
    }

    /**
     * One whole progress-bar cell. **This markup used to exist in three copies** (render's two
     * branches plus updateRateCell) with a comment beside it saying "change one and you have to
     * change two" — that comment was correct, but it recorded a removable hazard as a discipline
     * for people to remember. Merged into one, there is nothing to remember.
     *
     * A completed one additionally carries .done for its glow: 100% is this tool's destination
     * and should look like it arrived.
     */
    function barCell(rate) {
      // **null has to be passed through as-is and must not be folded to 0 at the call site.**
      // Drawing a width of 0 is fine, but 「还没算出完成率」 and 「完成率是 0%」 are two different
      // things: the former's text has to be empty (fmtPct returns '' for null) and the latter's
      // is "0.0%". Folding at the call site loses that distinction
      const pct = ((typeof rate === 'number' ? rate : 0) * 100).toFixed(1);
      return '<div class="bar-wrap"><div class="bar-track">'
        + '<div class="bar-fill' + (rate >= 1 ? ' done' : '') + '" style="width:' + pct + '%; background:' + barColor(rate) + '"></div>'
        + '</div><span class="rate-text">' + fmtPct(rate) + '</span></div>';
    }

    /**
     * Rewrites one row's progress cell in place. **Used instead of a full-page render() during
     * editing** — render rebuilds innerHTML and takes the focus with it, and focus is exactly
     * what has to be held while editing.
     */
    function updateRateCell(tr, rate) {
      const cell = tr.lastElementChild;
      if (!cell) return;
      cell.innerHTML = barCell(rate);
    }

    /**
     * The **guessed** address for the landscape header image. 97% of the library sits on
     * this old path.
     *
     * The rest miss — Steam moved newer games' store assets to a path carrying a content
     * hash, and that hash cannot be guessed (the reasoning is in fetchStoreHeaderImage in
     * lib/steam.js). So this function is **only the first attempt**, and a failure is
     * taken over by coverFailed asking the server for the real address.
     *
     * Guessing first and asking second is deliberate: when the guess is right not one
     * extra request is sent, and the store endpoint is heavily rate-limited, so asking for
     * all three hundred-odd games one by one is pure waste.
     */
    function thumbUrl(appid) {
      return 'https://cdn.akamai.steamstatic.com/steam/apps/' + appid + '/header.jpg';
    }

    /** Which address this row/card should try first: the real one if it has been asked for, otherwise the guess */
    function coverSrc(g) {
      return g.coverUrl || thumbUrl(g.appid);
    }

    /**
     * The header image failed to load — ask the server for the real address and swap it in.
     *
     * **Detach onerror first**: should the replacement also fail to load, without detaching
     * it this is an infinite loop.
     * Once obtained it is written back into allGames, so a repaint (triggered by
     * favouriting, locking or filtering) does not lose what this pass discovered and ask
     * again. The server records it too, so on the next page load this is never reached.
     *
     * Splicing appid straight into the onerror attribute raises no escaping issue: in the
     * library it is always digits only (addGame checks `^\d+$`, and anything synced in is
     * an appid from Steam).
     */
    window.coverFailed = function (img, appid) {
      img.onerror = null;
      rpc
        .withSuccessHandler(function (r) {
          if (!r || !r.url) { img.style.visibility = 'hidden'; return; }
          const g = allGames.find(function (x) { return String(x.appid) === String(appid); });
          if (g) g.coverUrl = r.url;
          img.src = r.url;
        })
        .withFailureHandler(function () { img.style.visibility = 'hidden'; })
        .resolveCover(appid);
    };

    /**
     * The portrait cover failed to load — fall back to landscape, and only ask if the
     * landscape one fails too.
     *
     * A missing portrait is normal (older games, some family-shared ones), and **it is not
     * worth asking the server about**: appdetails does not return library_600x900 at all,
     * so asking gets nothing. The landscape one can be asked for, so this only switches to
     * landscape and hands the next leg to coverFailed.
     */
    window.portraitFailed = function (img, appid) {
      const g = allGames.find(function (x) { return String(x.appid) === String(appid); });
      img.onerror = function () { window.coverFailed(img, appid); };
      img.src = (g && g.coverUrl) || thumbUrl(appid);
    };

    /**
     * The portrait cover. **Steam has this image itself** (the portrait tile in its
     * library), so the portrait cards use it rather than cropping the landscape header into
     * a portrait — a crop has the wrong composition and frequently cuts the subject off.
     *
     * Not every game has this image (older games, some family-shared ones), so the cards
     * keep a fallback to header.jpg, see the onerror in renderGallery.
     */
    function portraitUrl(appid) {
      return 'https://cdn.akamai.steamstatic.com/steam/apps/' + appid + '/library_600x900.jpg';
    }

    /* Every icon lives in the sprite sheet, and the heart has no reason to keep a separate
       path — a forwarder stays here so the two hearts do not slowly diverge */
    function heartSvg(filled) {
      return icon('heart', filled);
    }

    // ---- 🔔 Notifications -----------------------------------------------------
    //
    // Two kinds, both **transitions**, with timestamps stamped by updateGameStats in
    // lib/db.js at the one moment the old value is still visible. This only filters by
    // window and groups by kind — **do not try to recompute them from achieved/total**: a
    // game that dropped below 100% and one that was never complete look identical in their
    // current state.
    //
    // 「已读」 is stored in localStorage keyed by the raw timestamp. A day count cannot be
    // the key: day counts change every day, so a stored read marker no longer matches the
    // next day and the red dot rises again daily.
    const BELL_DAYS = 30;
    const BELL_SEEN_KEY = 'satBellSeen';
    const BELL_GROUPS = [
      ['perfect', 'bell.perfect'],
      ['added', 'bell.added'],
    ];

    function bellItems() {
      const out = [];
      allGames.forEach(function(g) {
        if (g.perfectLostDaysAgo !== null && g.perfectLostDaysAgo <= BELL_DAYS) {
          out.push({ kind: 'perfect', game: g, days: g.perfectLostDaysAgo,
                     key: g.appid + '|perfect|' + g.perfectLostAt });
        }
        if (g.achAddedDaysAgo !== null && g.achAddedDaysAgo <= BELL_DAYS) {
          out.push({ kind: 'added', game: g, days: g.achAddedDaysAgo,
                     key: g.appid + '|added|' + g.achAddedAt });
        }
      });
      return out.sort(function(a, b){ return a.days - b.days; });
    }

    function bellSeen() {
      // A corrupted store counts as unread. Being reminded again is a minor annoyance; swallowing a notification silently is genuinely losing something
      try { return new Set(JSON.parse(localStorage.getItem(BELL_SEEN_KEY) || '[]')); }
      catch (e) { return new Set(); }
    }

    function renderBell() {
      const items = bellItems();
      const seen = bellSeen();
      const unread = items.filter(function(i){ return !seen.has(i.key); });
      document.getElementById('bellDot').hidden = unread.length === 0;

      const panel = document.getElementById('bellPanel');
      if (!items.length) {
        panel.innerHTML = '<div class="bell-empty">' + escapeHtml(t('bell.empty', { days: BELL_DAYS })) + '</div>';
        return;
      }
      let html = '';
      BELL_GROUPS.forEach(function(pair) {
        const rows = items.filter(function(i){ return i.kind === pair[0]; });
        if (!rows.length) return;
        html += '<div class="bell-group">' + escapeHtml(t(pair[1])) + '</div>';
        html += rows.map(function(i) {
          return '<div class="bell-item">'
            + '<img src="' + thumbUrl(i.game.appid) + '" loading="lazy" onerror="this.style.visibility=\'hidden\'">'
            + '<span class="bell-name">' + escapeHtml(i.game.name) + '</span>'
            + '<span class="bell-when">' + escapeHtml(i.days === 0 ? t('bell.today') : t('bell.daysAgo', { n: i.days })) + '</span>'
            + '</div>';
        }).join('');
      });
      panel.innerHTML = html;
    }

    (function initBell() {
      const btn = document.getElementById('bellBtn');
      const panel = document.getElementById('bellPanel');
      const close = function() {
        panel.hidden = true;
        btn.setAttribute('aria-expanded', 'false');
      };

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const opening = panel.hidden;
        panel.hidden = !opening;
        btn.setAttribute('aria-expanded', String(opening));
        // Opening counts as read — the red dot answers "is there anything new", not "have you dealt with it"
        if (opening) {
          try {
            localStorage.setItem(BELL_SEEN_KEY,
              JSON.stringify(bellItems().map(function(i){ return i.key; })));
          } catch (e) { /* if it cannot be stored, it is reported again next time, which beats raising an error */ }
          document.getElementById('bellDot').hidden = true;
        }
      });

      // Clicking elsewhere closes it. **blur cannot be used** — an element inside the panel
      // taking focus also fires blur, so one click inside the panel would close it. It uses
      // btn.contains rather than e.target !== btn: what was clicked is very likely the
      // <span> glyph inside the button
      document.addEventListener('click', function(e) {
        if (!panel.hidden && !panel.contains(e.target) && !btn.contains(e.target)) close();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !panel.hidden) close();
      });
    })();

    /**
     * Back to top.
     *
     * **It appears only once the page has genuinely been scrolled** — a button permanently
     * hanging in a corner that does nothing when pressed is pure noise. The threshold is one
     * screen: any less and it would flicker in and out during a slight scroll.
     *
     * The scroll event is throttled with rAF: this page has several hundred rows, and
     * reading scrollY then writing a class on every frame while scrolling mixes layout and
     * paint together. **Separating reads from writes** is something this page has stepped on
     * repeatedly.
     */
    (function backToTop() {
      const btn = document.getElementById('toTop');
      let ticking = false;
      const sync = function() {
        ticking = false;
        btn.classList.toggle('on', window.scrollY > window.innerHeight);
      };
      window.addEventListener('scroll', function() {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(sync);
      }, { passive: true });
      sync();

      btn.addEventListener('click', function() {
        const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: still ? 'auto' : 'smooth' });
        // After returning to the top the next move is usually changing a filter or adding a
        // game, so focus goes to the search box — but **do not let the browser scroll again
        // for that focus**, which would fight the smooth scroll above
        document.getElementById('searchBox').focus({ preventScroll: true });
      });

      /**
       * The sync status bar (lib/rpc.js) shares this corner with this button, which steps up
       * a notch the moment it appears.
       *
       * That bar is created dynamically by rpc.js and shown and hidden through inline style,
       * so it can only be observed — and **both being visible at once is the normal case**
       * rather than an edge case: people keep scrolling the table while a sync runs, which is
       * exactly when this button is most wanted.
       * If it cannot be observed (the element does not exist yet) the default position is
       * kept, degrading to "occasionally covered" rather than an error.
       */
      const watchSyncBar = function() {
        const bar = document.querySelector('.rpc-bar');
        if (!bar) return false;
        const apply = function() {
          // Compute first, then pass, and wrap in Boolean() as usual. The value is already a
          // boolean, and the wrapper is there to make the html-smoke check **able to see it**
          // — a rule that can only be confirmed by human reasoning is no rule at all. What it
          // blocks is an undefined flipping the class on every poll
          const showing = getComputedStyle(bar).display !== 'none';
          btn.classList.toggle('clear-bar', Boolean(showing));
        };
        new MutationObserver(apply).observe(bar, { attributes: true, attributeFilter: ['style'] });
        apply();
        return true;
      };
      // rpc.js is a separate <script>, and the bar's creation is not guaranteed to happen before this
      if (!watchSyncBar()) window.addEventListener('load', watchSyncBar, { once: true });
    })();

    /**
     * Writes the topbar's actual height into --topbar-h for the table header's stickiness
     * (see `th { top: … }` in the CSS).
     *
     * **It cannot be hardcoded.** The readout strip inside the topbar is flex-wrap, and on a
     * narrow window the whole strip drops below the title, making the topbar taller; a
     * hardcoded value leaves the header either floating or half covered, and **only on a
     * narrow window**, which is precisely the case most easily missed in testing. A
     * ResizeObserver keeps the value following along.
     *
