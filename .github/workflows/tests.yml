# Run the whole suite on every PR and on every push to main.
#
# **The trigger is `pull_request`, not `pull_request_target`, and that was not an idle choice.**
# This repository is public, so anyone can open a PR from their own fork. `pull_request_target`
# runs the workflow definition from the **base branch** carrying a **writable** token, and if it
# then checks out the code from the PR side, a stranger's code runs with your write permissions —
# the most common way a public repository is broken into. The token `pull_request` receives is
# read-only for a fork PR and cannot reach secrets. This workflow needs to write nothing, so there
# is no reason to use the other one.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# Narrowed explicitly. Left unwritten, the default permissions depend on the repository settings,
# and those are something that gets changed elsewhere
permissions:
  contents: read

# Two pushes to the same branch in a row cancel the first if it has not finished — there is no
# point queueing for a commit that is already out of date
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # **windows-latest, not ubuntu.** The product runs only on Windows, and the
    # "what is generated is valid PowerShell" case in `selfupdate.test.js` carries
    # `skip: process.platform !== 'win32'`. On Linux it is silently skipped — and it is the one
    # check in that file that actually executes what was generated, while that script runs in a
    # process with no console, where a syntax error is seen by nobody.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # `node:sqlite` needs Node 24+, matching engines in package.json
          node-version: '24'

      # **There is no `npm install` here, and that absence is itself an assertion.**
      # The runtime has no dependencies today (see "Stack constraints" in CLAUDE.md), so an
      # *accidental* one fails here on the spot instead of quietly becoming a requirement.
      # **It is not a ban.** The blanket "never add a dependency" rule was lifted; a deliberate
      # dependency is allowed with an argument, and adding one means adding this step in the same
      # pull request — otherwise CI goes red without saying why.
      # The devDependencies of launcher/ are used only for packaging and the tests never touch them.
      - name: full test suite
        run: node --test --test-reporter=dot
